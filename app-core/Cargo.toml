#
# sce-app-core — the part of the specification workbench that has no screen.
#
# The works folder is SCE's (`sce-works`): the desktop app and its browser shell read and write
# it through that crate, and the authoring MCP through the `sce-work` command it builds, so there
# is ONE implementation of what a save is. What is here is what the workbench adds: the ways a
# person reaches a model (connections, kept in their own settings folder), the AI clients it runs
# for a request of the works, and the commands a screen asks about them.
#
# Nothing here links a GUI toolkit: this crate is a member of the root
# workspace and is built and tested by the lanes that already run there. The
# application itself lives in `app/`, a workspace of its own, for that reason.

[package]
name = "sce-app-core"
version.workspace = true
edition.workspace = true
# The works it links need 1.89 (`std::fs::File::lock`), and so does this.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The specification workbench without its screen: connections, AI clients and the commands a screen asks about them"

[lib]
name = "sce_app_core"

[dependencies]
sce-works = { path = "../sce-works" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A model server the person reaches over https (a tunnel, a server on another computer). rustls
# with the ring provider and the web's roots, as the mesh binding's wss client has it
# (backends/rust/mesh/Cargo.toml), so that a build needs no TLS library of the system's.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
serde_json = "1"
# The stand-ins a test holds a work against (`sce_works::testing`).
sce-works = { path = "../sce-works", features = ["testing"] }
# The certificates a test server is given, made when the test runs: nothing secret is kept in
# the tree, and none of them can run out.
rcgen = "0.13"

[lints]
workspace = true
