[package]
name = "sce-rust-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SCE W3C SCXML 1.0 conformance test harness (202 tests)"

[features]
default = ["script-engine-lua"]
# Forward script engine selection to runtime
script-engine-lua = ["sce-rust-runtime/script-engine-lua", "dep:sce-rust-lua"]
script-engine-quickjs = ["sce-rust-runtime/script-engine-quickjs"]

[dependencies]
sce-rust-runtime = { path = "../sce-rust-runtime", default-features = false }
sce-rust-lua = { path = "../sce-rust-lua", optional = true }
linkme = { workspace = true }
log = { workspace = true }
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1"

[dev-dependencies]
env_logger = "0.11"

[lints]
workspace = true
