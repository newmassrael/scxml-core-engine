# SCE Mesh compile verification — SOME/IP transport binding.
# Name-based references resolved against vsomeip_brake.json at build time
# (SCE_MESH.md §14). brake.scxml sends a single event `brake.activate`
# (FireForget → method), so the binding declares one event mapping.
version: "1.0"
topology:
  ecu1:
    transports:
      someip:
        config: vsomeip_brake.json
        application_name: brake_app
    machines:
      brake:
        source: brake.scxml
        bindings:
          "#motor":
            transport: someip
            service: motor_control
            protocol: udp
            events:
              "brake.activate":
                method: activate
      motor:
        source: motor.scxml
