# docs/adr/0085, section 3.2: the brake's `#motor` binding is the route of a
# causal group over local. Consumed by test_mesh_causal_injection.cpp: the
# peer reads through its router, which the test stands in for with `linkTo`.
version: "1.0"
topology:
  ecu1:
    machines:
      brake:
        source: brake.scxml
        bindings:
          "#motor":
            transport: local
            delivery: causal
            group: { name: pair, view: [ecu1/brake, ecu1/motor] }
      motor:
        source: motor.scxml
