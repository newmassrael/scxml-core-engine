# SCE Mesh §9.5 — local-transport bindings for the mesh-rpc round-trip
# fixture. Both machines declare each other as local targets so codegen
# emits TransportRouter classes for each, and the runtime test linkTo-s
# the two so reply envelopes route through the caller's InvokeCorrelation.
version: "1.0"
topology:
  ecu1:
    machines:
      brake_invoke:
        source: brake_invoke.scxml
        bindings:
          "#motor_invoke":
            transport: local
      motor_invoke:
        source: motor_invoke.scxml
        bindings:
          "#brake_invoke":
            transport: local
