# SCE Mesh §9.5 srcexpr target miss runtime verification.
#
# The fixture's srcexpr resolves to `#ghost_target`, intentionally
# absent from the bindings below. At runtime `performMeshInvoke`
# finds no matching binding and returns false, driving the §9.5
# L1340 / §10.7.1 error.execution raise path that the runtime test
# asserts.
#
# `#motor_srcexpr` is the binding the miss is measured against: §9.5
# makes a srcexpr's candidate set the machine's declared bindings, so
# this one is what the generated router carries and what
# `#ghost_target` fails to match. The binding reuses the passive
# motor_srcexpr.scxml fixture because it only needs to be a valid
# receiver. Until 2026-09-22 the document also carried an unreachable
# static-src invoke, because the router was built from static sites
# alone and this binding reached it no other way.
version: "1.0"
topology:
  ecu1:
    machines:
      srcexpr_miss:
        source: srcexpr_miss.scxml
        bindings:
          "#motor_srcexpr":
            transport: local
      motor_srcexpr:
        source: motor_srcexpr.scxml
