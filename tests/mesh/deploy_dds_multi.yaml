# SCE Mesh DDS multi-pattern compile & runtime verification.
#
# The orthogonal sibling of deploy_zenoh_multi.yaml and deploy_tcp_multi.yaml:
# the SCXML shape is held constant and only the transport changes, so a
# difference in behaviour is attributable to the transport rather than to the
# state machines.
#
# Both devices join the same DDS domain. The domain is the isolation unit —
# participants in different domains never discover each other — so this value
# is what keeps the fixture from meeting a developer's own deployment or a
# concurrently running test. It is deliberately not 0 (the DDS default) for
# that reason.
#
# Unlike zenoh and custom_tcp there are no endpoints to declare: DDS discovers
# peers itself, so neither side names an address and neither side is "the
# listener". The binding's `topic:` is the whole of the addressing, and the
# reply / notification topics are derived from it (SCE_MESH.md §mesh-8.2) so a
# request topic cannot be paired with an unrelated reply topic.
#
# `config:` carries the vendor settings through to the participant
# (SCE_MESH.md §mesh-14.4). It is given inline rather than as a file name —
# both forms are legal, Cyclone reads a leading '<' as "this IS the XML" —
# so the fixture does not depend on the ctest working directory. The
# discovery tag it sets is the second isolation dimension: `domain_id`
# already separates this fixture from another deployment on the host, and a
# tag separates it from anything that happens to share the domain. If the
# declared config failed to reach the participant, the two peers here would
# fall back to the untagged default together and this fixture would still
# pass — that direction is asserted at build time instead, by
# `sce-build/tests/mesh_dds_vendor_config.rs`. What this fixture adds is
# that a participant given a config still comes up and still carries every
# pattern.
version: "1.0"
topology:
  ecu_brake:
    transports:
      dds:
        domain_id: 71
        config: '<CycloneDDS><Domain id="any"><Discovery><Tag>sce_mesh_dds_multi</Tag></Discovery></Domain></CycloneDDS>'
        qos:
          # §mesh-8.2 overlay: policies SCE derives nowhere, so declaring
          # them adds behaviour rather than contradicting a derivation.
          # `partition` is the third isolation dimension this fixture
          # carries (domain 71, a discovery tag, and now a partition), and
          # unlike the other two a mismatch is loud — non-intersecting
          # partitions never match, so a dropped declaration shows up as
          # the fixture failing rather than as it quietly sharing a bus.
          partition: "sce_mesh_dds_multi"
          notify_lifespan_ms: 30000
          # Declared so the §16.7 raise path is emitted and compiled. The
          # lease is long relative to the fixture's runtime, so a healthy
          # run observes no violation — the raise is wired, not provoked.
          liveliness_lease_ms: 30000
    machines:
      brake_dds_multi:
        source: brake_dds_multi.scxml
        bindings:
          "#motor":
            transport: dds
            topic: "SceBrakeMotor"
  ecu_motor:
    transports:
      dds:
        domain_id: 71
        config: '<CycloneDDS><Domain id="any"><Discovery><Tag>sce_mesh_dds_multi</Tag></Discovery></Domain></CycloneDDS>'
        qos:
          # §mesh-8.2 overlay: policies SCE derives nowhere, so declaring
          # them adds behaviour rather than contradicting a derivation.
          # `partition` is the third isolation dimension this fixture
          # carries (domain 71, a discovery tag, and now a partition), and
          # unlike the other two a mismatch is loud — non-intersecting
          # partitions never match, so a dropped declaration shows up as
          # the fixture failing rather than as it quietly sharing a bus.
          partition: "sce_mesh_dds_multi"
          notify_lifespan_ms: 30000
          # Declared so the §16.7 raise path is emitted and compiled. The
          # lease is long relative to the fixture's runtime, so a healthy
          # run observes no violation — the raise is wired, not provoked.
          liveliness_lease_ms: 30000
    machines:
      motor:
        source: motor_dds_multi.scxml
        server:
          transport: dds
          topic: "SceBrakeMotor"
          events:
            # Server-initiated field notification (SCE_MESH.md §mesh-8.1).
            # On DDS this is a publish on the derived `_Event` topic, held
            # transient-local depth 1 so a subscriber that joins after the
            # publish still receives the current value.
            "field.notify.position": {}
