# SCE Mesh §10.10 OutboundBuffer runtime E2E — Zenoh publisher-first.
#
# Gap 5 Acceptance Fixture (iii): brake publishes BEFORE any subscriber
# declares on the matching keyexpr. Pre-§10.10 the `session.put` was
# silently lost (Zenoh has no retention by default — publisher-first
# samples never reach a later-declared subscriber). With §10.10 the
# generated router declares a `zenoh::Publisher` + `MatchingListener`
# at init(), observes `MatchingStatus::matching == false`, and the
# first route_send enqueues into the OutboundBuffer. When a subscriber
# later appears, the matching listener fires → markReady → FIFO drain
# → subscriber receives the previously-buffered envelope.
#
# The test opens a kernel-selected loopback port and writes the connection
# config into a private working directory before initialising the router.
# A CTest resource lock cannot protect a fixed port from compiler daemons.
version: "1.0"
topology:
  ecu_brake:
    transports:
      zenoh:
        mode: peer
        config: zenoh_publisher_first_session.json5
    machines:
      brake_zenoh_publisher_first:
        source: brake_zenoh_publisher_first.scxml
        outbound_buffer:
          max_pending_per_target: 8
        bindings:
          "#motor":
            transport: zenoh
            key: "sce/brake_pub_first/motor/cmd"
  ecu_motor:
    transports:
      zenoh:
        mode: peer
        listen: ["tcp/127.0.0.1:0"]
    machines:
      motor:
        source: motor_zenoh_publisher_first.scxml
