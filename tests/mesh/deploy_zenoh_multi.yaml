# SCE Mesh Session D+E: Zenoh multi-pattern compile verification.
# brake_zenoh_multi.scxml exercises FireForget/RpcRequest/EventSubscribe/
# FieldRead/FieldWrite; the generated send_zenoh member function must
# handle every PatternKind on a single Zenoh key expression (native
# correlation via session.get reply callbacks).
# Session E adds server-side registration for motor (declare_queryable +
# Query::reply for compute_force RPC).
version: "1.0"
topology:
  ecu1:
    transports:
      zenoh:
        mode: peer
    machines:
      brake_zenoh_multi:
        source: brake_zenoh_multi.scxml
        bindings:
          "#motor":
            transport: zenoh
            key: "sce/brake/motor"
      # Receiver entry: brake sends to #motor, event coverage looks up
      # machine "motor" (matching the SCXML name attribute).
      motor:
        source: motor_zenoh_multi.scxml
      # Server entry: codegen runs on motor_zenoh_multi.scxml and looks
      # up machine "motor_zenoh_multi" (matching the file stem).
      motor_zenoh_multi:
        source: motor_zenoh_multi.scxml
        bindings:
          "#motor":
            transport: zenoh
            key: "sce/motor/reply"
        # Session E: server-side Zenoh registration.
        server:
          transport: zenoh
          key: "sce/brake/motor"
