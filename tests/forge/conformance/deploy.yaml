# What the conformance run's storing forms hold (docs/adr/0077 §7).
#
# A codec document states the protocol's bound: a byte string, a list or a
# chain the protocol leaves unbounded has none, and one it bounds by a u32
# length has 2^32 - 1. A form that stores holds what its deployment gives it,
# its capacity, and C11 stores every field, so a field with no bound, or one
# whose bound no array of this run could hold, needs one. These are the
# capacities of the conformance run: the sizes these fixtures held before
# their documents moved to the protocol's bounds, so its storage is what it
# was, or more where the run states a case past that size. A frame inside a
# field's bound and past its capacity is refused with CapacityExceeded, which
# is this node's limit and not a malformed frame.
#
# This deployment exists for the run, so it holds every value the run states:
# each byte string and list of a `sources` or `refused` case of
# tests/forge/conformance/numerical_reference.json fits the capacity given
# here, as the C11 harness holds the case in the value it encodes, and the
# fold that writes the case refuses one that does not. The two-byte length of
# a zbuf and of a value slice is pinned by a case of 200 bytes, so each holds
# 256.
#
# A Rust tree takes no capacity (its profiles answer for each field), so only
# the C11 build reads this file.
codecs:
  codec_zenoh_ext_zbuf:
    capacity:
      value: 256
  codec_zenoh_init_body:
    capacity:
      cookie: 128
  codec_zenoh_open_body:
    capacity:
      cookie: 128
  codec_zenoh_hello:
    capacity:
      locators: 64
  codec_zenoh_err:
    capacity:
      payload: 256
      extensions: 4
  codec_zenoh_msg_put:
    capacity:
      payload: 256
      extensions: 8
  codec_zenoh_msg_del:
    capacity:
      extensions: 8
  codec_zenoh_query:
    capacity:
      parameters: 256
      extensions: 8
  codec_zenoh_wireexpr:
    capacity:
      suffix: 128
  codec_zenoh_response:
    capacity:
      suffix: 256
      extensions: 4
  codec_zenoh_decl_ext_keyexpr_inner:
    capacity:
      suffix: 128
  codec_zenoh_value_slice:
    capacity:
      data: 256
  codec_zenoh_value_zbuf:
    capacity:
      value: 32
      slices: 4
  codec_zenoh_ext_envelope:
    capacity:
      extensions: 8
  codec_zenoh_declare:
    capacity:
      extensions: 4
  codec_zenoh_interest:
    capacity:
      extensions: 4
  codec_zenoh_oam:
    capacity:
      extensions: 4
  codec_zenoh_query_value:
    capacity:
      exts: 4
  codec_zenoh_reply:
    capacity:
      extensions: 4
  codec_zenoh_request:
    capacity:
      extensions: 4
  codec_zenoh_response_final:
    capacity:
      extensions: 4
