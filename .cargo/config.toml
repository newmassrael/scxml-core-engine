#
# SCE workspace cargo configuration.
#
# Target declarations only. Build profiles + lints live in the
# workspace `Cargo.toml`; default targets remain the host triple
# (no `[build] target = ...` here).

# ── SCE Protocol-Synthesis RFC §5.J.2 (C3 Atomic B-γ1): MCU target ──
#
# `thumbv7em-none-eabihf` is the canonical Cortex-M4F target SCE
# emits Rust code for under `--no-std`. The target is registered
# here so consumers can drive `cargo build --target=thumbv7em-none-
# eabihf -p sce-rust-runtime --no-default-features` (the runtime
# without its `std` feature, docs/adr/0053) from any workspace
# directory without supplying linker hints.
#
# `linker` and `rustflags` are set per the Cortex-M4F convention
# (rust-lld + Tier-2-default rustflags). The target registration
# alone does not invoke a build; `scripts/gates/nostd-mcu.sh` and
# its workflow build the runtime and the probes for this target.
[target.thumbv7em-none-eabihf]
linker = "rust-lld"
rustflags = [
  # Cortex-M default ABI is hard-float; `-eabihf` triple already
  # implies VFPv4-D16 (single-precision FPU on Cortex-M4F).
  "-C", "link-arg=-Tlink.x",
]
