<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOOM + SCE State Machines</title>
    <style>
        :root {
            /* Joystick sizes */
            --move-joystick-size: 140px;
            --move-stick-size: 60px;
            --use-joystick-size: 70px;
            --use-stick-size: 45px;
            --fire-btn-size: 85px;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #1a1a1a;
            color: #fff;
            font-family: monospace;
            overflow: hidden;
        }
        .container {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Game Section - Fixed at top */
        #game-section {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #444;
        }
        #game-container {
            display: inline-block;
            position: relative;
            overflow: hidden;
            min-width: 320px;
            min-height: 200px;
            border: 2px solid #666;
            background: #000;
            aspect-ratio: 8 / 5;
            resize: horizontal;
            max-width: min(calc(100vw - 60px), 1600px);
        }
        #game-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            cursor: e-resize;
            background: linear-gradient(135deg, transparent 50%, #888 50%);
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Mobile Start Overlay */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease;
        }
        #start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .start-content {
            text-align: center;
        }
        .doom-logo {
            font-size: 48px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #880000;
            margin-bottom: 30px;
            letter-spacing: 8px;
        }
        #start-btn {
            padding: 20px 50px;
            font-size: 24px;
            font-family: monospace;
            background: #cc0000;
            color: #fff;
            border: 3px solid #ff0000;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }
        #start-btn:hover {
            background: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        #start-btn:active {
            transform: scale(0.95);
        }
        .start-hint {
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
        @media (max-width: 600px) {
            .doom-logo {
                font-size: 32px;
                letter-spacing: 4px;
            }
            #start-btn {
                padding: 15px 35px;
                font-size: 18px;
            }
        }

        /* Mobile Touch Controls - Modern FPS Style */
        #touch-controls {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 50;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
        }
        #touch-controls.visible {
            display: block;
        }
        #touch-controls > * {
            pointer-events: auto;
        }

        /* Left Zone - Movement Joystick */
        #left-zone {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 200px;
            height: 200px;
            background: transparent;
        }
        .joystick-container {
            position: fixed;
            left: 20px;
            bottom: 20px;
            width: var(--move-joystick-size);
            height: var(--move-joystick-size);
        }
        .joystick-base {
            position: absolute;
            width: var(--move-joystick-size);
            height: var(--move-joystick-size);
            background: radial-gradient(circle, rgba(60,60,60,0.4) 0%, rgba(40,40,40,0.4) 100%);
            border: 2px solid rgba(100,100,100,0.3);
            border-radius: 50%;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
        }
        .joystick-stick {
            position: absolute;
            width: var(--move-stick-size);
            height: var(--move-stick-size);
            background: radial-gradient(circle at 30% 30%, rgba(136,136,136,0.6), rgba(68,68,68,0.6));
            border: 2px solid rgba(102,102,102,0.5);
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .joystick-stick.active {
            background: radial-gradient(circle at 30% 30%, rgba(170,170,170,0.7), rgba(102,102,102,0.7));
            border-color: rgba(136,136,136,0.6);
        }

        /* Right Zone - Look/Aim (tap to fire) - covers right half of game area */
        #right-zone {
            position: fixed;
            background: transparent;
            /* Position set dynamically by JavaScript */
        }

        /* Action Buttons - Bottom Right */
        .action-buttons {
            position: fixed;
            right: 15px;
            bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .action-btn:active, .action-btn.pressed {
            transform: scale(0.9);
        }
        /* Use Joystick - aim control with tap to use */
        .use-joystick {
            position: relative;
            width: var(--use-joystick-size);
            height: var(--use-joystick-size);
        }
        .use-joystick-base {
            position: absolute;
            width: var(--use-joystick-size);
            height: var(--use-joystick-size);
            background: radial-gradient(circle, rgba(20,40,80,0.4) 0%, rgba(10,20,40,0.4) 100%);
            border: 2px solid rgba(100,150,255,0.3);
            border-radius: 50%;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
        }
        .use-joystick-stick {
            position: absolute;
            width: var(--use-stick-size);
            height: var(--use-stick-size);
            background: radial-gradient(circle at 30% 30%, rgba(68,136,255,0.6), rgba(0,68,170,0.6));
            border: 3px solid rgba(102,170,255,0.5);
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.8);
            font-family: monospace;
            font-size: 10px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0,102,255,0.5);
        }
        .use-joystick-stick.active {
            background: radial-gradient(circle at 30% 30%, rgba(100,160,255,0.8), rgba(50,100,200,0.8));
            border-color: rgba(150,190,255,0.7);
        }
        #fire-btn {
            width: var(--fire-btn-size);
            height: var(--fire-btn-size);
            background: radial-gradient(circle at 30% 30%, rgba(255,68,68,0.5), rgba(170,0,0,0.5));
            border-color: rgba(255,102,102,0.5);
            color: rgba(255,255,255,0.8);
            text-shadow: 0 0 8px rgba(255,0,0,0.5);
            font-size: 14px;
        }

        /* Weapon switch buttons - Bottom Center */
        .weapon-switch {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
        }
        .weapon-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: rgba(40,40,40,0.5);
            border: 2px solid rgba(85,85,85,0.5);
            color: rgba(170,170,170,0.8);
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
        }
        .weapon-btn:active {
            background: rgba(80,80,80,0.6);
            border-color: rgba(136,136,136,0.6);
            color: #fff;
        }

        /* Touch indicator for right zone */
        #aim-indicator {
            position: fixed;
            width: 50px;
            height: 50px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
        }
        #aim-indicator.visible {
            display: block;
        }

        /* Panel Section - Flexbox column to fill space */
        #panel-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 10px 20px 20px 20px;
        }

        /* Tab Section */
        .tab-container {
            flex-shrink: 0;
            margin-top: 10px;
        }
        .tab-buttons {
            display: flex;
            justify-content: flex-start;
            gap: 5px;
            margin-bottom: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 5px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: #333;
            border: 1px solid #555;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            color: #888;
            cursor: pointer;
            font-family: monospace;
            font-size: 14px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .tab-btn:hover { background: #444; }
        .tab-btn.active {
            background: #2a2a2a;
            color: #00ff00;
        }
        .tab-btn .state-indicator {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 6px;
            background: #444;
            border-radius: 3px;
            font-size: 10px;
            color: #0969da;
        }

        /* Enemy Section (between tabs and visualizer, only for enemy tab) */
        .enemy-section {
            display: none;
            flex-shrink: 0;
            padding: 10px;
            background: #252525;
            border: 1px solid #555;
            border-bottom: none;
        }
        .enemy-section.visible {
            display: block;
        }
        .enemy-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            max-height: 100px;
            overflow-y: auto;
        }
        .enemy-btn {
            padding: 5px 10px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 11px;
            color: #ff6600;
            font-family: monospace;
            cursor: pointer;
        }
        .enemy-btn:hover { background: #444; }
        .enemy-btn.selected {
            background: #2a2a2a;
            border-color: #00ff00;
            box-shadow: 0 0 5px rgba(0,255,0,0.3);
        }
        .enemy-state-text {
            margin-left: 5px;
            font-size: 10px;
        }
        .enemy-state-text.DORMANT { color: #8888ff; }
        .enemy-state-text.ALERT { color: #ffff00; }
        .enemy-state-text.CHASING { color: #ff9900; }
        .enemy-state-text.ATTACKING { color: #ff0000; }
        .enemy-state-text.PAIN { color: #ff00ff; }
        .enemy-state-text.DEAD { color: #666; text-decoration: line-through; }

        /* Secret Hint Section */
        .secret-section {
            display: none;
            flex-shrink: 0;
            padding: 10px;
            background: #252525;
            border: 1px solid #555;
            border-bottom: none;
        }
        .secret-section.visible {
            display: block;
        }
        .secret-info {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .secret-info .info-item {
            padding: 5px 10px;
            background: #333;
            border-radius: 4px;
            font-size: 12px;
        }
        .secret-info .hint-key {
            color: #ffcc00;
            font-weight: bold;
        }
        /* Destination mode selector */
        .dest-selector {
            margin-left: auto;
        }
        .dest-btn {
            padding: 4px 8px;
            margin-left: 5px;
            background: #444;
            border: 1px solid #666;
            border-radius: 4px;
            color: #aaa;
            cursor: pointer;
            font-size: 11px;
        }
        .dest-btn:hover {
            background: #555;
            color: #fff;
        }
        .dest-btn.active {
            background: #f39c12;
            border-color: #f39c12;
            color: #000;
            font-weight: bold;
        }
        /* Door info display */
        .door-info {
            margin-left: 10px;
            padding: 4px 10px;
            background: #2a2a2a;
            border: 1px solid #555;
            border-radius: 4px;
            color: #ffcc00;
            font-size: 12px;
        }
        .secret-state-text {
            font-weight: bold;
        }
        .secret-state-text.disabled { color: #666; }
        .secret-state-text.enabled { color: #00ff00; }
        .secret-state-text.calculating { color: #ffff00; }
        .secret-state-text.showing { color: #00ffff; }
        .secret-state-text.found { color: #ff00ff; }
        .secret-state-text.no_path { color: #ff6600; }

        /* Aim Assist Section */
        .aim-section {
            display: none;
            flex-shrink: 0;
            padding: 10px;
            background: #252525;
            border: 1px solid #555;
            border-bottom: none;
        }
        .aim-section.visible {
            display: flex;
        }
        .aim-state-text {
            font-weight: bold;
        }
        .aim-state-text.disabled { color: #666; }
        .aim-state-text.enabled { color: #00ff00; }

        /* Combo Section */
        .combo-section {
            display: none;
            flex-shrink: 0;
            padding: 3px 8px;
            background: #252525;
            border: 1px solid #555;
            border-bottom: none;
        }
        .combo-section.visible {
            display: block;
        }
        .combo-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 2px 6px;
            background: #1a1a1a;
            border-radius: 3px;
        }
        .combo-counter > div:first-child {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .combo-counter-value {
            font-size: 18px;
            font-weight: bold;
            color: #ff6600;
            text-shadow: 0 0 6px #ff3300;
        }
        .combo-counter-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }
        .combo-timer-bar {
            flex: 1;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        .combo-timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6600, #ff3300);
            width: 0%;
            transition: width 0.1s linear;
        }
        .aim-toggle-btn {
            padding: 10px 20px;
            background: #333;
            border: 2px solid #555;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-family: monospace;
            font-size: 14px;
            transition: all 0.2s;
        }
        .aim-toggle-btn:hover {
            background: #444;
            border-color: #666;
        }
        .aim-toggle-btn.enabled {
            background: #1a4a1a;
            border-color: #00ff00;
            color: #00ff00;
        }

        /* Target Buttons Section */
        .target-buttons-container {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #444;
            max-height: 150px;
            overflow-y: auto;
        }
        .target-group {
            display: none;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 8px;
            align-items: center;
        }
        .target-group.has-targets {
            display: flex;
        }
        .target-group .group-label {
            color: #f39c12;
            font-size: 11px;
            font-weight: bold;
            min-width: 60px;
        }
        .target-btn {
            padding: 4px 10px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #ccc;
            cursor: pointer;
            font-size: 11px;
            font-family: monospace;
        }
        .target-btn:hover {
            background: #444;
            border-color: #888;
        }
        .target-btn.active {
            background: #1a4a1a;
            border-color: #00ff00;
            color: #00ff00;
        }
        .target-btn.secret { border-left: 3px solid #ff00ff; }
        .target-btn.secret.discovered {
            border-left-color: #666;
            background: #2a2a2a;
            color: #666;
            text-decoration: line-through;
        }
        .target-btn.secret.discovered::after {
            content: ' ✓';
            color: #00ff00;
            text-decoration: none;
        }
        .target-btn.door { border-left: 3px solid #00aaff; }
        .target-btn.lift { border-left: 3px solid #ffaa00; }
        .target-btn.switch { border-left: 3px solid #ff6600; }
        .target-btn.teleporter { border-left: 3px solid #aa00ff; }
        .target-btn.exit { border-left: 3px solid #00ff00; }
        .target-btn.keydoor { border-left: 3px solid #ffff00; }
        .target-btn.enemy { border-left: 3px solid #ff0000; }
        .target-btn.enemy.dead {
            border-left-color: #666;
            background: #2a2a2a;
            color: #666;
            text-decoration: line-through;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .target-btn.enemy.dead::after {
            content: ' X';
            color: #ff0000;
            text-decoration: none;
        }
        .target-btn:disabled {
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Visualizer Section - Fill remaining space */
        #viz-section {
            flex: 1;
            min-height: 200px;
            border: 1px solid #555;
            border-radius: 0 0 8px 8px;
            overflow: hidden;
            background: #2a2a2a;
        }
        #visualizer {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Stats Section - Always at top, single line */
        #stats {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 36px;
            display: flex;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid #444;
            z-index: 100;
        }
        #stats-info {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 10px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            touch-action: pan-x;
        }
        #stats-info::-webkit-scrollbar { display: none; }
        #stats-info span { color: #888; font-size: 12px; flex-shrink: 0; }
        #stats-info strong { color: #00ff00; }
        #stats-buttons {
            flex-shrink: 0;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 8px;
            background: rgba(0, 0, 0, 0.9);
        }
        #menu-btn, #fullscreen-btn, #audio-btn {
            padding: 4px 10px;
            background: #444;
            border: 1px solid #666;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        #menu-btn:hover, #fullscreen-btn:hover, #audio-btn:hover { background: #555; }
        :fullscreen #fullscreen-btn { background: #006600; }
        #audio-btn.muted { background: #663333; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Game Section -->
        <div id="game-section">
            <div id="game-container">
                <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" width="640" height="400"></canvas>
                <!-- Mobile Start Overlay -->
                <div id="start-overlay">
                    <div class="start-content">
                        <div class="doom-logo">DOOM</div>
                        <button id="start-btn">TAP TO START</button>
                        <p class="start-hint">Audio requires user interaction on mobile</p>
                    </div>
                </div>
                <!-- Mobile Touch Controls - Modern FPS Style -->
                <div id="touch-controls">
                    <!-- Left Zone: Movement -->
                    <div id="left-zone">
                        <div class="joystick-container" id="joystick">
                            <div class="joystick-base"></div>
                            <div class="joystick-stick" id="joystick-stick"></div>
                        </div>
                    </div>

                    <!-- Right Zone: Look/Aim (drag to turn, tap to fire) -->
                    <div id="right-zone">
                        <div id="aim-indicator"></div>
                    </div>

                    <!-- Weapon Switch - Bottom Center -->
                    <div class="weapon-switch">
                        <button class="weapon-btn" data-key="1">1</button>
                        <button class="weapon-btn" data-key="2">2</button>
                        <button class="weapon-btn" data-key="3">3</button>
                        <button class="weapon-btn" data-key="4">4</button>
                        <button class="weapon-btn" data-key="5">5</button>
                        <button class="weapon-btn" data-key="6">6</button>
                        <button class="weapon-btn" data-key="7">7</button>
                    </div>

                    <!-- Action Buttons - Bottom Right -->
                    <div class="action-buttons">
                        <!-- Use Joystick - drag to aim, tap to use -->
                        <div class="use-joystick" id="use-joystick">
                            <div class="use-joystick-base"></div>
                            <div class="use-joystick-stick" id="use-stick">USE</div>
                        </div>
                        <button class="action-btn" id="fire-btn">FIRE</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panel Section - Scrollable -->
        <div id="panel-section">
            <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-btn active" data-machine="game" onclick="switchTab('game')">
                    Game <span class="state-indicator" id="ind-game">DEMOSCREEN</span>
                </button>
                <button class="tab-btn" data-machine="player" onclick="switchTab('player')">
                    Player <span class="state-indicator" id="ind-player">ALIVE</span>
                </button>
                <button class="tab-btn" data-machine="weapon" onclick="switchTab('weapon')">
                    Weapon <span class="state-indicator" id="ind-weapon">READY</span>
                </button>
                <button class="tab-btn" data-machine="enemy" onclick="switchTab('enemy')">
                    Enemy <span class="state-indicator" id="ind-enemy">0 remaining</span>
                </button>
                <button class="tab-btn" data-machine="secret" onclick="switchTab('secret')">
                    Secret <span class="state-indicator" id="ind-secret">disabled</span>
                </button>
                <button class="tab-btn" data-machine="aim" onclick="switchTab('aim')">

    <script>
        // Mobile Audio Unlock - Required for iOS/Android browsers
        (function() {
            const overlay = document.getElementById('start-overlay');
            const startBtn = document.getElementById('start-btn');
            const canvas = document.getElementById('canvas');
            let audioUnlocked = false;

            // Detect mobile/touch device
            function isMobileDevice() {
                return (
                    ('ontouchstart' in window) ||
                    (navigator.maxTouchPoints > 0) ||
                    /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
                );
            }

            // Desktop: Hide overlay immediately
            if (!isMobileDevice()) {
                overlay.classList.add('hidden');
                console.log('[SCE] Desktop detected - overlay hidden');
            } else {
                console.log('[SCE] Mobile detected - showing start overlay');
            }

            function unlockAudio() {
                if (audioUnlocked) return;

                // Create and play silent audio to unlock AudioContext
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);

                // Resume any suspended AudioContext (Emscripten SDL audio)
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                // Also try to resume SDL audio context if it exists
                if (typeof SDL !== 'undefined' && SDL.audioContext) {
                    SDL.audioContext.resume();
                }

                audioUnlocked = true;
                console.log('[SCE] Audio unlocked via user interaction');
            }

            function hideOverlay() {
                overlay.classList.add('hidden');
                canvas.focus();
                unlockAudio();
            }

            // Start button click/tap
            startBtn.addEventListener('click', hideOverlay);
            startBtn.addEventListener('touchend', function(e) {
                e.preventDefault();
                hideOverlay();
            });

            // Also allow clicking anywhere on overlay
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) hideOverlay();
            });
        })();

        // Mobile Touch Controls - Modern FPS Style
        (function() {
            const touchControls = document.getElementById('touch-controls');
            const leftZone = document.getElementById('left-zone');
            const rightZone = document.getElementById('right-zone');
            const joystick = document.getElementById('joystick');
            const stick = document.getElementById('joystick-stick');
            const aimIndicator = document.getElementById('aim-indicator');
            const useJoystick = document.getElementById('use-joystick');
            const useStick = document.getElementById('use-stick');
            const fireBtn = document.getElementById('fire-btn');

            // Detect mobile/touch device
            function isMobileDevice() {
                return (
                    ('ontouchstart' in window) ||
                    (navigator.maxTouchPoints > 0) ||
                    /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
                );
            }

            // Show controls only on mobile
            if (isMobileDevice()) {
                touchControls.classList.add('visible');
                console.log('[SCE] Mobile FPS touch controls enabled');
            }

            // Update touch control positions based on game container
            const gameContainer = document.getElementById('game-container');
            function updateControlPositions() {
                const rect = gameContainer.getBoundingClientRect();
                const rightZone = document.getElementById('right-zone');

                // Right zone (turning) - browser width, game height
                if (rightZone) {
                    rightZone.style.top = rect.top + 'px';
                    rightZone.style.left = (window.innerWidth * 0.5) + 'px';  // Right half of browser
                    rightZone.style.width = (window.innerWidth * 0.5) + 'px';
                    rightZone.style.height = (rect.height * 0.92) + 'px';  // Until game bottom (minus status bar)
                }
            }

            // Update on load, resize, and orientation change
            updateControlPositions();
            window.addEventListener('resize', updateControlPositions);
            window.addEventListener('orientationchange', () => {
                setTimeout(updateControlPositions, 100);
            });

            // Key mapping for DOOM
            const KEY_MAP = {
                // Movement
                UP:           { keyCode: 38, key: 'ArrowUp',    code: 'ArrowUp' },
                DOWN:         { keyCode: 40, key: 'ArrowDown',  code: 'ArrowDown' },
                // Turning (right zone)
                TURN_LEFT:    { keyCode: 37, key: 'ArrowLeft',  code: 'ArrowLeft' },
                TURN_RIGHT:   { keyCode: 39, key: 'ArrowRight', code: 'ArrowRight' },
                // Strafe (left joystick horizontal) - DOOM uses 'a' and 'd'
                STRAFE_LEFT:  { keyCode: 65, key: 'a',          code: 'KeyA' },
                STRAFE_RIGHT: { keyCode: 68, key: 'd',          code: 'KeyD' },
                // Actions
                CTRL:         { keyCode: 17, key: 'Control',    code: 'ControlLeft' },
                SHIFT:        { keyCode: 16, key: 'Shift',      code: 'ShiftLeft' },
                SPACE:        { keyCode: 32, key: ' ',          code: 'Space' },
                ENTER:        { keyCode: 13, key: 'Enter',      code: 'Enter' },
                ESCAPE:       { keyCode: 27, key: 'Escape',     code: 'Escape' },
                BACKSPACE:    { keyCode: 8,  key: 'Backspace',  code: 'Backspace' }
            };

            // Track currently pressed keys
            const pressedKeys = new Set();

            // Simulate key event - dispatch to document for Emscripten/SDL
            function simulateKey(keyInfo, type) {
                const event = new KeyboardEvent(type, {
                    key: keyInfo.key,
                    code: keyInfo.code,
                    keyCode: keyInfo.keyCode,
                    which: keyInfo.keyCode,
                    bubbles: true,
                    cancelable: true,
                    view: window
                });
                document.dispatchEvent(event);
            }

            function pressKey(keyName) {
                if (KEY_MAP[keyName] && !pressedKeys.has(keyName)) {
                    pressedKeys.add(keyName);
                    simulateKey(KEY_MAP[keyName], 'keydown');
                }
            }

            function releaseKey(keyName) {
                if (KEY_MAP[keyName] && pressedKeys.has(keyName)) {
                    pressedKeys.delete(keyName);
                    simulateKey(KEY_MAP[keyName], 'keyup');
                }
            }

            // ===== LEFT ZONE: Movement Joystick =====
            let joystickActive = false;
            let joystickTouchId = null;
            const joystickCenter = { x: 70, y: 70 };
            const maxDistance = 40;
            const deadzone = 12;
            let moveDirection = { up: false, down: false, strafeLeft: false, strafeRight: false };

            function updateMoveJoystick(touchX, touchY) {
                const rect = joystick.getBoundingClientRect();
                const centerX = rect.left + joystickCenter.x;
                const centerY = rect.top + joystickCenter.y;

                let deltaX = touchX - centerX;
                let deltaY = touchY - centerY;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

                if (distance > maxDistance) {
                    deltaX = (deltaX / distance) * maxDistance;
                    deltaY = (deltaY / distance) * maxDistance;
                }

                stick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

                const newDir = { up: false, down: false, strafeLeft: false, strafeRight: false };

                if (distance > deadzone) {
                    const normX = deltaX / maxDistance;
                    const normY = deltaY / maxDistance;
                    const threshold = 0.3;

                    // Y axis: forward/backward
                    if (normY < -threshold) newDir.up = true;
                    if (normY > threshold) newDir.down = true;
                    // X axis: strafe left/right
                    if (normX < -threshold) newDir.strafeLeft = true;
                    if (normX > threshold) newDir.strafeRight = true;
                }

                // Update keys only when changed
                if (newDir.up !== moveDirection.up) {
                    newDir.up ? pressKey('UP') : releaseKey('UP');
                }
                if (newDir.down !== moveDirection.down) {
                    newDir.down ? pressKey('DOWN') : releaseKey('DOWN');
                }
                if (newDir.strafeLeft !== moveDirection.strafeLeft) {
                    newDir.strafeLeft ? pressKey('STRAFE_LEFT') : releaseKey('STRAFE_LEFT');
                }
                if (newDir.strafeRight !== moveDirection.strafeRight) {
                    newDir.strafeRight ? pressKey('STRAFE_RIGHT') : releaseKey('STRAFE_RIGHT');
                }

                moveDirection = newDir;
            }

            // Sticky USE key: keep SHIFT pressed while left joystick is active
            let useKeySticky = false;

            function resetMoveJoystick() {
                stick.style.transform = 'translate(-50%, -50%)';
                stick.classList.remove('active');

                if (moveDirection.up) releaseKey('UP');
                if (moveDirection.down) releaseKey('DOWN');
                if (moveDirection.strafeLeft) releaseKey('STRAFE_LEFT');
                if (moveDirection.strafeRight) releaseKey('STRAFE_RIGHT');

                moveDirection = { up: false, down: false, strafeLeft: false, strafeRight: false };

                // Release sticky USE key when left joystick is released
                if (useKeySticky) {
                    releaseKey('SHIFT');
                    useKeySticky = false;
                }
            }

            // Left zone touch events (joystick)
            leftZone.addEventListener('touchstart', function(e) {
                e.preventDefault();
                const touch = e.changedTouches[0];
                joystickActive = true;
                joystickTouchId = touch.identifier;
                stick.classList.add('active');
                updateMoveJoystick(touch.clientX, touch.clientY);
            }, { passive: false });

            leftZone.addEventListener('touchmove', function(e) {
                e.preventDefault();
                if (!joystickActive) return;
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        updateMoveJoystick(touch.clientX, touch.clientY);
                        break;
                    }
                }
            }, { passive: false });

            leftZone.addEventListener('touchend', function(e) {
                e.preventDefault();
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        joystickActive = false;
                        joystickTouchId = null;
                        resetMoveJoystick();
                        break;
                    }
                }
            }, { passive: false });

            leftZone.addEventListener('touchcancel', function(e) {
                joystickActive = false;
                joystickTouchId = null;
                resetMoveJoystick();
            });

            // ===== RIGHT ZONE: Look/Aim (drag to turn, tap to fire) =====
            let rightTouchId = null;
            let rightTouchStart = { x: 0, y: 0, time: 0 };
            let lastTouchX = 0;
            let turnDirection = { left: false, right: false };
            const turnSensitivity = 3;  // pixels per turn event
            const tapThreshold = 200;   // ms for tap detection
            const tapMoveThreshold = 15; // pixels - max movement for tap

            // Helper function to reset right zone state
            function resetRightZone() {
                if (turnDirection.left) releaseKey('TURN_LEFT');
                if (turnDirection.right) releaseKey('TURN_RIGHT');
                turnDirection = { left: false, right: false };
                rightTouchId = null;
                aimIndicator.classList.remove('visible');
            }

            rightZone.addEventListener('touchstart', function(e) {
                e.preventDefault();
                const touch = e.changedTouches[0];
                rightTouchId = touch.identifier;
                rightTouchStart = { x: touch.clientX, y: touch.clientY, time: Date.now() };
                lastTouchX = touch.clientX;

                // Show aim indicator
                aimIndicator.style.left = touch.clientX + 'px';
                aimIndicator.style.top = touch.clientY + 'px';
                aimIndicator.classList.add('visible');
            }, { passive: false });

            rightZone.addEventListener('touchmove', function(e) {
                e.preventDefault();
                for (let touch of e.changedTouches) {
                    if (touch.identifier === rightTouchId) {
                        const deltaX = touch.clientX - lastTouchX;
                        lastTouchX = touch.clientX;

                        // Update aim indicator
                        aimIndicator.style.left = touch.clientX + 'px';
                        aimIndicator.style.top = touch.clientY + 'px';

                        // Turn based on horizontal drag
                        if (Math.abs(deltaX) > turnSensitivity) {
                            if (deltaX < 0) {
                                // Turning left
                                if (!turnDirection.left) {
                                    releaseKey('TURN_RIGHT');
                                    pressKey('TURN_LEFT');
                                    turnDirection = { left: true, right: false };
                                }
                            } else {
                                // Turning right
                                if (!turnDirection.right) {
                                    releaseKey('TURN_LEFT');
                                    pressKey('TURN_RIGHT');
                                    turnDirection = { left: false, right: true };
                                }
                            }
                        }
                        break;
                    }
                }
            }, { passive: false });

            rightZone.addEventListener('touchend', function(e) {
                e.preventDefault();
                const touch = Array.from(e.changedTouches).find(t => t.identifier === rightTouchId);
                if (!touch) {
                    resetRightZone();
                    return;
                }

                const elapsed = Date.now() - rightTouchStart.time;
                const movedX = Math.abs(touch.clientX - rightTouchStart.x);
                const movedY = Math.abs(touch.clientY - rightTouchStart.y);

                // Detect tap (short touch with minimal movement)
                if (elapsed < tapThreshold && movedX < tapMoveThreshold && movedY < tapMoveThreshold) {
                    // Fire on tap
                    pressKey('CTRL');
                    setTimeout(() => releaseKey('CTRL'), 50);
                }

                resetRightZone();
            }, { passive: false });

            rightZone.addEventListener('touchcancel', function(e) {
                resetRightZone();
            });

            // ===== FIRE BUTTON =====
            fireBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                pressKey('CTRL');
                pressKey('ENTER');
                this.classList.add('pressed');
            }, { passive: false });

            fireBtn.addEventListener('touchend', function(e) {
                e.preventDefault();
                e.stopPropagation();
                releaseKey('CTRL');
                releaseKey('ENTER');
                this.classList.remove('pressed');
            }, { passive: false });

            // ===== USE JOYSTICK (Aim + Use) =====
            let useJoystickActive = false;
            let useJoystickTouchId = null;
            let useJoystickStartX = 0;
            let useJoystickStartY = 0;
            let useJoystickStartTime = 0;
            const USE_TAP_THRESHOLD = 10;
            const USE_TAP_TIME = 300;
            const USE_JOYSTICK_MAX_MOVE = 12.5;  // (70 - 45) / 2

            // Helper function to reset use joystick state
            function resetUseJoystick() {
                useJoystickActive = false;
                useJoystickTouchId = null;
                useStick.style.transform = 'translate(-50%, -50%)';
                useStick.classList.remove('active');

                // If left joystick is still active, keep SHIFT pressed (sticky)
                if (joystickActive) {
                    useKeySticky = true;
                } else {
                    releaseKey('SHIFT');
                }

                releaseKey('TURN_LEFT');
                releaseKey('TURN_RIGHT');
            }

            useJoystick.addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (useJoystickActive) return;

                const touch = e.changedTouches[0];
                useJoystickTouchId = touch.identifier;
                useJoystickActive = true;
                useJoystickStartX = touch.clientX;
                useJoystickStartY = touch.clientY;
                useJoystickStartTime = Date.now();

                pressKey('SHIFT');
                useStick.classList.add('active');
            }, { passive: false });

            useJoystick.addEventListener('touchmove', function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (!useJoystickActive) return;

                const touch = Array.from(e.changedTouches).find(t => t.identifier === useJoystickTouchId);
                if (!touch) return;

                const deltaX = touch.clientX - useJoystickStartX;
                const clampedX = Math.max(-USE_JOYSTICK_MAX_MOVE, Math.min(USE_JOYSTICK_MAX_MOVE, deltaX));

                useStick.style.transform = `translate(calc(-50% + ${clampedX}px), -50%)`;

                // Reduced sensitivity: higher threshold = less sensitive turning
                const turnThreshold = 30;
                if (deltaX > turnThreshold) {
                    releaseKey('TURN_LEFT');
                    pressKey('TURN_RIGHT');
                } else if (deltaX < -turnThreshold) {
                    releaseKey('TURN_RIGHT');
                    pressKey('TURN_LEFT');
                } else {
                    releaseKey('TURN_LEFT');
                    releaseKey('TURN_RIGHT');
                }
            }, { passive: false });

            useJoystick.addEventListener('touchend', function(e) {
                e.preventDefault();
                e.stopPropagation();

                const touch = Array.from(e.changedTouches).find(t => t.identifier === useJoystickTouchId);
                if (!touch) {
                    resetUseJoystick();
                    return;
                }

                const deltaX = touch.clientX - useJoystickStartX;
                const deltaY = touch.clientY - useJoystickStartY;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                const duration = Date.now() - useJoystickStartTime;

                if (distance < USE_TAP_THRESHOLD && duration < USE_TAP_TIME) {
                    pressKey('SPACE');
                    pressKey('BACKSPACE');
                    setTimeout(() => {
                        releaseKey('SPACE');
                        releaseKey('BACKSPACE');
                    }, 100);
                }

                resetUseJoystick();
            }, { passive: false });

            useJoystick.addEventListener('touchcancel', function(e) {
                resetUseJoystick();
            }, { passive: false });

            document.querySelectorAll('.weapon-btn').forEach(btn => {
                const keyNum = btn.dataset.key;
                const keyInfo = {
                    keyCode: 48 + parseInt(keyNum),
                    key: keyNum,
                    code: 'Digit' + keyNum
                };

                btn.addEventListener('touchstart', function(e) {

                    e.stopPropagation();
                    simulateKey(keyInfo, 'keydown');
                }, { passive: false });

                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    simulateKey(keyInfo, 'keyup');
                }, { passive: false });
            });
        })();

        // Audio toggle function - robust mute via master GainNode
        let audioMuted = false;
        let masterGain = null;
        let cachedAudioCtx = null;

        // Hook into AudioContext to intercept audio and insert master gain node
        (function() {
            const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
            if (!OriginalAudioContext) return;

            // Store original connect method
            const originalConnect = AudioNode.prototype.connect;

            // Override connect to intercept connections to destination
            AudioNode.prototype.connect = function(destination, ...args) {
                // If connecting to destination and we have a master gain, route through it
                if (destination instanceof AudioDestinationNode && masterGain && this !== masterGain) {
                    return originalConnect.call(this, masterGain, ...args);
                }
                return originalConnect.call(this, destination, ...args);
            };

            // Hook AudioContext creation
            window.AudioContext = function(...args) {
                const ctx = new OriginalAudioContext(...args);
                cachedAudioCtx = ctx;

                // Create master gain node for volume control
                masterGain = ctx.createGain();
                masterGain.connect(ctx.destination);
                masterGain.gain.value = 1.0;

                return ctx;
            };
            window.AudioContext.prototype = OriginalAudioContext.prototype;

            if (window.webkitAudioContext) {
                window.webkitAudioContext = window.AudioContext;
            }
        })();

            if (masterGain) {
                if (audioMuted) {
                    masterGain.gain.setValueAtTime(1.0, cachedAudioCtx.currentTime);
                    audioMuted = false;
                    btn.textContent = 'Sound';
                    btn.classList.remove('muted');
                } else {
                    masterGain.gain.setValueAtTime(0, cachedAudioCtx.currentTime);
                    audioMuted = true;
                    btn.textContent = 'Muted';
                    btn.classList.add('muted');
                }
            } else if (cachedAudioCtx) {
                // Fallback: suspend/resume
                if (audioMuted) {
                    cachedAudioCtx.resume();
                    audioMuted = false;
                    btn.textContent = 'Sound';
                    btn.classList.remove('muted');
                } else {
                    cachedAudioCtx.suspend();
                    audioMuted = true;
                    btn.textContent = 'Muted';
                    btn.classList.add('muted');
                }
            }
        }

                    selectEnemy(slot);
                    return;  // selectEnemy handles visualizer loading
                }
            }

            // Load new SCXML in visualizer
            const iframe = document.getElementById('visualizer');
            iframe.src = 'visualizer/visualizer.html?embed&t=' + Date.now() + '#scxml=' + SCXML_DATA[machine];
            SCE.ready = false;
        }

        // State priority for sorting (lower = first, DEAD and DORMANT at end)
        const STATE_PRIORITY = {
            'ALERT': 1,
            'CHASING': 2,
            'ATTACKING': 3,
            'PAIN': 4,
            'DORMANT': 98,
            'DEAD': 99
        };

        // Sort enemy buttons in the list (debounced)
        let sortTimeout = null;
        function sortEnemyButtons() {
            if (sortTimeout) return;  // Already scheduled
            sortTimeout = setTimeout(() => {
                sortTimeout = null;
                const container = document.getElementById('enemy-list');
                const buttons = Array.from(container.querySelectorAll('.enemy-btn'));

                buttons.sort((a, b) => {
                    const stateA = SCE.enemies[a.dataset.slot]?.state || 'UNKNOWN';
                    const stateB = SCE.enemies[b.dataset.slot]?.state || 'UNKNOWN';
                    const priorityA = STATE_PRIORITY[stateA] || 50;
                    const priorityB = STATE_PRIORITY[stateB] || 50;
                    if (priorityA !== priorityB) return priorityA - priorityB;
                    const typeA = SCE.enemies[a.dataset.slot]?.type || '';
                    const typeB = SCE.enemies[b.dataset.slot]?.type || '';
                    return typeA.localeCompare(typeB);
                });

                buttons.forEach(btn => container.appendChild(btn));
            }, 500);  // Sort at most every 500ms
        }

            // Switch to enemy tab and highlight state
            SCE.currentTab = 'enemy';

        // Update enemy button and data
        function updateEnemySubtab(slot, type, state, instanceId, active) {
            const container = document.getElementById('enemy-list');
            let btn = document.querySelector(`.enemy-btn[data-slot="${slot}"]`);

            if (active) {
                // Create or update button
                if (!btn) {
                    btn = document.createElement('button');
                    btn.className = 'enemy-btn';
                    btn.dataset.slot = slot;
                    btn.onclick = () => selectEnemy(slot);
                    container.appendChild(btn);
                }
                btn.innerHTML = `${type} <span class="enemy-state-text ${state}">${state}</span>`;

                // Store enemy data
                SCE.enemies[slot] = { type, state, instanceId, active };

                // If this enemy is selected and visualizer ready, highlight state
                if (SCE.selectedEnemy === slot && SCE.ready) {
                    const iframe = document.getElementById('visualizer');
                    iframe.contentWindow.postMessage({
                        type: 'highlight-states',
                        stateIds: [state.toLowerCase()]
                    }, window.location.origin);
                }
            } else {
                // Remove button
                if (btn) {
                    btn.remove();
                }
                delete SCE.enemies[slot];

                // If this enemy was selected, clear selection
                if (SCE.selectedEnemy === slot) {
                    SCE.selectedEnemy = null;
                }

            // Sort buttons after update
            sortEnemyButtons();

            // Update stats
            const activeCount = Object.keys(SCE.enemies).length;

        // C++ callback: Called when any state machine state changes
        window.onSceStateChange = function(machine, state) {
            // Validate machine name
            if (!VALID_MACHINES.includes(machine)) {
                console.warn('[SCE] Invalid machine name:', machine);
                return;
            }

            // Validate state is a non-empty string
            if (typeof state !== 'string' || !state) {
                console.warn('[SCE] Invalid state for', machine, ':', state);
                return;
            }

            // Save last state
            SCE.lastState[machine] = state;

            // Update indicator
            const indicator = document.getElementById('ind-' + machine);
            if (indicator) indicator.textContent = state;

            // Update stats
            const statEl = document.getElementById('stat-' + machine);
            if (statEl) statEl.textContent = state;

            // Update visualizer if this is the current tab
            if (machine === SCE.currentTab && SCE.ready) {
                const iframe = document.getElementById('visualizer');
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({
                        type: 'highlight-states',
                        stateIds: [state.toLowerCase()]
                    }, window.location.origin);
                }
            }

            // Special handling for secret state changes
            if (machine === 'secret') {
                const stateEl = document.getElementById('secret-state');
                if (stateEl) {
                    stateEl.textContent = state;
                    stateEl.className = 'secret-state-text ' + state;
                }
            }

            // Special handling for aim state changes
            if (machine === 'aim') {
                const scxmlState = document.getElementById('aim-scxml-state');
                if (scxmlState) {
                    scxmlState.textContent = '(' + state + ')';
                }
            }

            // Auto-enable aim assist on mobile when game starts
            const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

            if (machine === 'game' && state.toUpperCase() === 'LEVEL') {
                if (!SCE.aimAssistEnabled && isMobile) {
                    setTimeout(() => {
                        if (!SCE.aimAssistEnabled && typeof Module !== 'undefined' && Module.ccall) {
                            Module.ccall('sce_aim_event_toggle', null, [], []);
                        }
                    }, 1000);
                }
            }
        };

        // C++ callback: Called when secret path is found

        window.onSceSecretPath = function(numArrows, remainingSecrets, isPartial) {
            SCE.secretArrows = [];
            SCE.secretRemaining = remainingSecrets;
            SCE.pathPartial = !!isPartial;
            const arrowsEl = document.getElementById('secret-arrows');
            const statsEl = document.getElementById('stat-secrets');
            const partialEl = document.getElementById('path-partial-warning');

            if (statsEl) statsEl.textContent = remainingSecrets + ' left';
            if (partialEl) {
                partialEl.style.display = isPartial ? 'inline' : 'none';
            }
            if (isPartial) {
                console.warn('[SCE:Secret] PARTIAL path with', numArrows, 'arrows - target UNREACHABLE');
            } else {
                console.debug('[SCE:Secret] Path found with', numArrows, 'arrows,', remainingSecrets, 'remaining');
            }
        };

        };

        // C++ callback: Called when target info updates
        // Parameters: typeName, name, index, total, triggerX, triggerY, sectorX, sectorY, sectorIdx, openMethod, isHidden, linkedSecret
        window.onSceTargetInfo = function(typeName, name, index, total, triggerX, triggerY, sectorX, sectorY, sectorIdx, openMethod, isHidden, linkedSecret) {
            // Update active button highlight
            // Normalize type name: "Key Door" -> "keydoor" to match button dataset
            const normalizedType = typeName.toLowerCase().replace(/ /g, '');
            document.querySelectorAll('.target-btn').forEach(btn => {
                const isActive = btn.dataset.type === normalizedType &&
                                 parseInt(btn.dataset.index) === index;
                btn.classList.toggle('active', isActive);
            });
            // Store coordinates for visualization
            SCE.currentTarget = {
                type: typeName,
                name: name,
                index: index,
                total: total,
                trigger: { x: triggerX, y: triggerY },
                sector: { x: sectorX, y: sectorY, index: sectorIdx },
                openMethod: openMethod || '',
                isHidden: !!isHidden,
                linkedSecret: linkedSecret
            };
            // Show/hide destination mode selector based on whether target has sector
            const destSelector = document.getElementById('dest-selector');
            if (destSelector) {
                const hasSector = (sectorIdx !== undefined && sectorIdx >= 0);
                destSelector.style.display = hasSector ? 'inline-block' : 'none';
            }
            // Update door info display
            const doorInfoEl = document.getElementById('door-info');
            if (doorInfoEl) {
                const isDoorType = (normalizedType === 'door' || normalizedType === 'keydoor' || normalizedType === 'lift');
                if (isDoorType && openMethod) {
                    let infoText = 'Open: ' + openMethod;
                    if (isHidden) {
                        infoText = '[Hidden] ' + infoText;
                        if (linkedSecret >= 0) {
                            infoText += ' → Secret ' + (linkedSecret + 1);
                        }
                    }
                    doorInfoEl.textContent = infoText;
                    doorInfoEl.style.display = 'block';
                } else {
                    doorInfoEl.style.display = 'none';
                }
            }
        };

        // Destination mode: 0 = trigger, 1 = sector
        let currentDestMode = 0;

        function setDestMode(mode) {
            if (!Module || !Module.ccall) {

            currentDestMode = mode;

        // Select specific target by type and index
        function selectTarget(type, index) {
            if (typeof Module === 'undefined' || !Module.ccall) return;
            Module.ccall('sce_select_target', null, ['number', 'number'], [type, index]);
        }

        // Target type configuration
        const TARGET_TYPES = [
            { id: 'secret', name: 'Secret', type: 0 },
            { id: 'door', name: 'Door', type: 1 },
            { id: 'lift', name: 'Lift', type: 2 },
            { id: 'switch', name: 'Switch', type: 3 },
            { id: 'teleporter', name: 'Teleport', type: 4 },
            { id: 'exit', name: 'Exit', type: 5 },
            { id: 'keydoor', name: 'KeyDoor', type: 6 },
            { id: 'enemy', name: 'Enemy', type: 7 }
        ];

        // Target count polling and dynamic button generation
        let targetCounts = { secret: 0, door: 0, lift: 0, switch_: 0, teleporter: 0, exit: 0, keydoor: 0, enemy: 0 };
        let lastCounts = { secret: -1, door: -1, lift: -1, switch_: -1, teleporter: -1, exit: -1, keydoor: -1, enemy: -1 };

        function updateTargetCounts() {
            if (typeof Module === 'undefined' || !Module.ccall) return;

            try {
                targetCounts.secret = Module.ccall('sce_get_target_count_secret', 'number', [], []);
                targetCounts.door = Module.ccall('sce_get_target_count_door', 'number', [], []);
                targetCounts.lift = Module.ccall('sce_get_target_count_lift', 'number', [], []);
                targetCounts.switch_ = Module.ccall('sce_get_target_count_switch', 'number', [], []);
                targetCounts.teleporter = Module.ccall('sce_get_target_count_teleporter', 'number', [], []);
                targetCounts.exit = Module.ccall('sce_get_target_count_exit', 'number', [], []);
                targetCounts.keydoor = Module.ccall('sce_get_target_count_keydoor', 'number', [], []);
                targetCounts.enemy = Module.ccall('sce_get_target_count_enemy', 'number', [], []);

                // Check if counts changed and regenerate buttons if needed
                const countsArray = [
                    targetCounts.secret, targetCounts.door, targetCounts.lift,
                    targetCounts.switch_, targetCounts.teleporter, targetCounts.exit, targetCounts.keydoor,
                    targetCounts.enemy
                ];
                const lastArray = [
                    lastCounts.secret, lastCounts.door, lastCounts.lift,
                    lastCounts.switch_, lastCounts.teleporter, lastCounts.exit, lastCounts.keydoor,
                    lastCounts.enemy
                ];

                let changed = false;
                for (let i = 0; i < countsArray.length; i++) {
                    if (countsArray[i] !== lastArray[i]) {
                        changed = true;
                        break;
                    }
                }

                if (changed) {
                    generateTargetButtons();
                    lastCounts = { ...targetCounts };
                } else {
                    // Update status without regenerating buttons
                    updateSecretDiscoveryStatus();
                    updateEnemyAliveStatus();
                }
            } catch (e) {
                console.error('Error getting target counts:', e);
            }
        }

        function updateSecretDiscoveryStatus() {
            const secretGroup = document.getElementById('group-secret');
            if (!secretGroup) return;

            const buttons = secretGroup.querySelectorAll('.target-btn.secret');
            buttons.forEach((btn, i) => {
                try {
                    const discovered = Module.ccall('sce_is_secret_discovered', 'number', ['number'], [i]);
                    if (discovered && !btn.classList.contains('discovered')) {
                        btn.classList.add('discovered');
                        btn.title = 'Secret ' + (i + 1) + ' (Found!)';
                    }
                } catch (e) {
                    // Ignore errors
                }
            });
        }

        function updateEnemyAliveStatus() {
            const enemyGroup = document.getElementById('group-enemy');
            if (!enemyGroup) return;

            const buttons = enemyGroup.querySelectorAll('.target-btn.enemy');
            buttons.forEach((btn, i) => {
                try {
                    const alive = Module.ccall('sce_is_enemy_alive', 'number', ['number'], [i]);
                    if (!alive && !btn.classList.contains('dead')) {
                        btn.classList.add('dead');
                        btn.title = 'Enemy ' + (i + 1) + ' (Dead)';
                        btn.disabled = true;
                    }
                } catch (e) {
                    // Ignore errors
                }
            });
        }

        function generateTargetButtons() {
            const countMap = {
                secret: targetCounts.secret,
                door: targetCounts.door,
                lift: targetCounts.lift,
                switch: targetCounts.switch_,
                teleporter: targetCounts.teleporter,
                exit: targetCounts.exit,
                keydoor: targetCounts.keydoor,
                enemy: targetCounts.enemy
            };

            TARGET_TYPES.forEach(cfg => {
                const group = document.getElementById('group-' + cfg.id);
                if (!group) return;

                const count = countMap[cfg.id] || 0;

                // Clear existing buttons (keep label)
                const label = group.querySelector('.group-label');
                group.innerHTML = '';
                if (label) group.appendChild(label);

                // Show/hide group based on count
                group.classList.toggle('has-targets', count > 0);

                // Generate individual buttons
                for (let i = 0; i < count; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'target-btn ' + cfg.id;
                    btn.dataset.type = cfg.id;
                    btn.dataset.index = i;
                    btn.textContent = (i + 1);
                    btn.title = cfg.name + ' ' + (i + 1);
                    btn.onclick = () => selectTarget(cfg.type, i);

                    // Check if secret is discovered
                    if (cfg.id === 'secret') {
                        try {
                            const discovered = Module.ccall('sce_is_secret_discovered', 'number', ['number'], [i]);
                            if (discovered) {
                                btn.classList.add('discovered');
                                btn.title += ' (Found!)';
                            }
                        } catch (e) {
                            console.error('Error checking secret discovery:', e);
                        }
                    }

                    // Check if enemy is dead
                    if (cfg.id === 'enemy') {
                        try {
                            const alive = Module.ccall('sce_is_enemy_alive', 'number', ['number'], [i]);
                            if (!alive) {
                                btn.classList.add('dead');
                                btn.title += ' (Dead)';
                            }
                        } catch (e) {
                            console.error('Error checking enemy status:', e);
                        }
                    }

                    group.appendChild(btn);
                }
            });
        }

        // Wait for visualizer ready
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'visualizer-ready') {
                SCE.ready = true;
                const iframe = document.getElementById('visualizer');

                // Highlight current state based on tab
                if (SCE.currentTab === 'enemy') {
                    // If enemy is selected, highlight its state
                    if (SCE.selectedEnemy !== null && SCE.enemies[SCE.selectedEnemy]) {
                        iframe.contentWindow.postMessage({
                            type: 'highlight-states',
                            stateIds: [SCE.enemies[SCE.selectedEnemy].state.toLowerCase()]
                        }, window.location.origin);
                    }
                } else {
                    // For game/player/weapon, highlight last known state
                    const lastState = SCE.lastState[SCE.currentTab];
                    if (lastState) {
                        iframe.contentWindow.postMessage({
                            type: 'highlight-states',
                            stateIds: [lastState.toLowerCase()]
                        }, window.location.origin);
                    }
                }
            }
        });

        // Emscripten Module
        var Module = {
            canvas: document.getElementById('canvas'),
            onRuntimeInitialized: function() {
                console.log('[SCE] WASM runtime initialized');
                // Start target count polling after a delay
                setTimeout(() => {
                    updateTargetCounts();
                    setInterval(updateTargetCounts, 2000);
                }, 3000);
            },
            print: function(text) {
                if (text.includes('[SCE:')) {
                    console.log('%c' + text, 'color: #00ff00; font-weight: bold;');
                } else {
                    console.log(text);
                }
            },
            printErr: function(text) { console.error(text); }
        };

    </script>
    <script async src="doom_sce.js"></script>
</body>
</html>
