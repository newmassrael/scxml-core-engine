\* The rule as it was before this model was checked against it: a host keeps what it held when an
\* entry puts it out. TLC finds the counterexample: two hosts that were given the same objects hold
\* different operations of a device taken off at a number below what one had admitted.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Devices = {d1}
    Hosts = {d1, h2}
    MaxSeq = 2
    MaxRemovals = 1
    Evict = FALSE
    Equivocate = FALSE
INVARIANTS
    Convergence
