\* A read ends and a reader catches up, with fairness for readers alone. TLC finds no violation.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Readers = {r1}
    DeferredReaders = {}
    R = 1
    Extra = 1
    MaxPub = 3
    Revalidate = TRUE
    HeadFirst = TRUE
    BindOldest = TRUE
INVARIANTS
    AnswerRefines
PROPERTIES
    ReadEnds
    CatchesUp
