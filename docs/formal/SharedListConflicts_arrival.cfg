\* The rule as it was before the independent review: a host refuses at the door an operation that
\* conflicts with what it holds, and takes nothing of the device from there. TLC finds the
\* counterexample: two hosts that were given the same operations, one a write and one that goes back
\* in time, in the two orders, are told different lists, and neither is the one the set says.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Devices = {d1}
    Hosts = {d1, h2}
    MaxSeq = 2
    MaxRemovals = 0
    Arrival = TRUE
INVARIANTS
    Convergence
