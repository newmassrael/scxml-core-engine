    WithState = TRUE
    Generation = TRUE
    Digest = TRUE
    ResetCursor = FALSE
    CatchUp = TRUE
    UnitRule = TRUE
    PageRule = TRUE
    OneUnit = TRUE
    OneWrite = TRUE
    FromChangelog = TRUE
    SkipUnchanged = TRUE
