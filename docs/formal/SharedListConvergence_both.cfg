\* Both at once, for two hosts and two numbers: a device that signs twice and is taken off. TLC finds no
\* violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Devices = {d1}
    Hosts = {d1, h2}
    MaxSeq = 2
    MaxRemovals = 1
    Evict = TRUE
    Equivocate = TRUE
INVARIANTS
    HeldValid
    Convergence
