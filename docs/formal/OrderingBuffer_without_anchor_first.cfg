\* A stream expected from the first envelope that arrives drops an earlier one that came after it,
\* and tells no one.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxNumber = 3
    GapTimeout = 1
    Durable = FALSE
    DropBehind = TRUE
    HoldAhead = TRUE
    Drain = TRUE
    OldestFirst = TRUE
    TimeoutGap = TRUE
    FirstArrival = TRUE
    WaitWhenDurable = TRUE
    AnchorFirst = FALSE
    AnchorDurable = TRUE
INVARIANTS
    Accounted
