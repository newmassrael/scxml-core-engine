\* On a durable stream no envelope is held for ever: what is missing is sent again. TLC finds no
\* violation.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxNumber = 3
    GapTimeout = 1
    Durable = TRUE
    DropBehind = TRUE
    HoldAhead = TRUE
    Drain = TRUE
    OldestFirst = TRUE
    TimeoutGap = TRUE
    FirstArrival = TRUE
    WaitWhenDurable = TRUE
    AnchorDurable = TRUE
PROPERTIES
    Refines
    Released
