\* A changelog kept in memory ahead of the write that keeps the state: after a crash the version a
\* client holds is written again with another value, and the server no longer has the rows the
\* client was given.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Clients = {1}
    Fair = 1
    NValues = 1
    NKeys = 1
    MaxVersion = 2
    MaxGen = 0
    MaxInc = 1
    Tombstones = 1
    QueueBound = 1
    Exchanges = 1
    MaxRepeat = 0
    MaxStop = 0
    MaxLose = 0
    Markers = TRUE
    FloorCheck = TRUE
    WithState = FALSE
    Generation = TRUE
    Digest = TRUE
    ResetCursor = TRUE
    CatchUp = TRUE
    UnitRule = TRUE
    PageRule = TRUE
    OneUnit = TRUE
    OneWrite = TRUE
    FromChangelog = TRUE
    SkipUnchanged = TRUE
    EndWithIncarnation = TRUE
INVARIANTS
    Exact
