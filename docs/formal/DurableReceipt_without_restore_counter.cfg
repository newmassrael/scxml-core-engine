\* A restored sender that numbers from the start again writes a number the receiver holds: the
\* new envelope is dropped as a repeat, and acknowledged.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxSeq = 2
    Window = 1
    SenderCrashes = 1
    ReceiverCrashes = 1
    HoldUntilDurable = TRUE
    KeepUntilAck = TRUE
    UnackedInCheckpoint = TRUE
    RestoreCounter = FALSE
    WindowBound = TRUE
    ByNumber = TRUE
    AnswerRepeat = TRUE
    AckDurable = TRUE
    MarkAtSeal = TRUE
    RestoreMarks = TRUE
INVARIANTS
    ReceiptKept
