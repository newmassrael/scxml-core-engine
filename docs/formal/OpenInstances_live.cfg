\* Every request ends, answered or of unknown outcome, when a message arrives once and what is enabled is
\* taken. A crash of the instance and an expiry are allowed. TLC finds no violation.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    NInst = 1
    NSess = 2
    MaxK = 2
    MaxInc = 3
    MaxJoin = 3
    MaxCliCrash = 1
    MaxSrvCrash = 0
    MaxExpire = 1
    MaxMembers = 1
    Dup = FALSE
    Resend = FALSE
    Handshake = TRUE
    Match = TRUE
    Fence = TRUE
    Records = TRUE
    Recheck = TRUE
    GcDurable = TRUE
    Evict = FALSE
    SameOffer = TRUE
INVARIANTS
    AtMostOnce
    Answered
    Undisturbed
    Bounded
PROPERTIES
    Refines
    Ends
