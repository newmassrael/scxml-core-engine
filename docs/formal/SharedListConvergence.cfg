\* The rule as the code applies it: a host drops what a later entry, or a conflict, puts out.
\* A device is taken off at a number below what a host had admitted, while three hosts are given the
\* entry and the operations in any order and again. TLC finds no violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Devices = {d1}
    Hosts = {d1, h2, h3}
    MaxSeq = 3
    MaxRemovals = 1
    Evict = TRUE
    Equivocate = FALSE
INVARIANTS
    HeldValid
    Convergence
