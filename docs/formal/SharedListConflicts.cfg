\* The rule the code has: a host holds every operation that holds under its log, the proof of a conflict
\* included, and is told what is below the lowest conflict. A device signs a second operation at a
\* number and a write whose time goes back, and is taken off, while two hosts are given the entries and
\* the operations in any order and again. TLC finds no violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Devices = {d1}
    Hosts = {d1, h2}
    MaxSeq = 3
    MaxRemovals = 1
    Arrival = FALSE
INVARIANTS
    HoldsWhatHolds
    Convergence
