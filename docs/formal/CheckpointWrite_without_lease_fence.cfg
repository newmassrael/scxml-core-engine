    NInst = 1
    NSess = 1
    MaxK = 1
    MaxInc = 1
    MaxJoin = 1
    MaxExpire = 0
    Dup = FALSE
    Resend = FALSE
    NProc = 2
    MaxInput = 1
    MaxOpen = 2
    MaxCrash = 0
    Term = 1
    LeaseFence = FALSE
    JournalInWrite = TRUE
    RecordInWrite = TRUE
    OutboxInWrite = TRUE
    ClockLags = TRUE
    Release = TRUE
INVARIANTS
    AtMostOnce
