\* Fair comes to hold every version at which the value changed: one value read in two pages, one
\* write, every marker dropped at once, two exchanges in flight, and the client losing its store
\* once. TLC finds no violation.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Clients = {1}
    Fair = 1
    NValues = 1
    NKeys = 2
    MaxVersion = 1
    MaxGen = 0
    MaxInc = 1
    Tombstones = 0
    QueueBound = 1
    Exchanges = 2
    MaxRepeat = 0
    MaxStop = 0
    MaxLose = 1
    Markers = TRUE
    FloorCheck = TRUE
    WithState = TRUE
    Generation = TRUE
    Digest = TRUE
    ResetCursor = TRUE
    CatchUp = TRUE
    UnitRule = TRUE
    PageRule = TRUE
    OneUnit = TRUE
    OneWrite = TRUE
    FromChangelog = TRUE
    SkipUnchanged = TRUE
    EndWithIncarnation = TRUE
PROPERTIES
    Refines
    Converges
