\* An envelope that leaves before its checkpoint is durable is taken in, and the sender that stops
\* never sent it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxSeq = 2
    Window = 1
    SenderCrashes = 1
    ReceiverCrashes = 1
    HoldUntilDurable = FALSE
    KeepUntilAck = TRUE
    UnackedInCheckpoint = TRUE
    RestoreCounter = TRUE
    WindowBound = TRUE
    ByNumber = TRUE
    AnswerRepeat = TRUE
    AckDurable = TRUE
    MarkAtSeal = TRUE
    RestoreMarks = TRUE
INVARIANTS
    NoPhantom
