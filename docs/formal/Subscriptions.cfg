\* Subscriptions: one client with two exchanges in flight, one value of two keys read in two pages,
\* two versions, one marker kept and markers dropped by their time at any moment. TLC finds no
\* violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Clients = {1}
    Fair = 1
    NValues = 1
    NKeys = 2
    MaxVersion = 2
    MaxGen = 0
    MaxInc = 1
    Tombstones = 1
    QueueBound = 1
    Exchanges = 2
    MaxRepeat = 0
    MaxStop = 0
    MaxLose = 0
    Markers = TRUE
    FloorCheck = TRUE
    WithState = TRUE
    Generation = TRUE
    Digest = TRUE
    ResetCursor = TRUE
    CatchUp = TRUE
    UnitRule = TRUE
    PageRule = TRUE
    OneUnit = TRUE
    OneWrite = TRUE
    FromChangelog = TRUE
    SkipUnchanged = TRUE
    EndWithIncarnation = TRUE
INVARIANTS
    Exact
    OneState
PROPERTIES
    Refines
    Monotone
    Silent
    Authorized
