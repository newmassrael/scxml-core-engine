\* A changelog started again in the same numbering reads a cursor of the old one as its own: the
\* client keeps a row the new changelog never had.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Clients = {1}
    Fair = 1
    NValues = 1
    NKeys = 2
    MaxVersion = 2
    MaxGen = 1
    MaxInc = 1
    Tombstones = 1
    QueueBound = 1
    Exchanges = 1
    MaxRepeat = 0
    MaxStop = 0
    MaxLose = 0
    Markers = TRUE
    FloorCheck = TRUE
    WithState = TRUE
    Generation = FALSE
    Digest = TRUE
    ResetCursor = TRUE
    CatchUp = TRUE
    UnitRule = TRUE
    PageRule = TRUE
    OneUnit = TRUE
    OneWrite = TRUE
    FromChangelog = TRUE
    SkipUnchanged = TRUE
    EndWithIncarnation = TRUE
INVARIANTS
    Exact
