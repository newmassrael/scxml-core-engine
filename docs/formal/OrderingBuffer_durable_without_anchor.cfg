\* A durable stream anchored at the first envelope that arrives drops the ones before it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxNumber = 3
    GapTimeout = 1
    Durable = TRUE
    DropBehind = TRUE
    HoldAhead = TRUE
    Drain = TRUE
    OldestFirst = TRUE
    TimeoutGap = TRUE
    FirstArrival = TRUE
    WaitWhenDurable = TRUE
    AnchorDurable = FALSE
INVARIANTS
    FromFirst
