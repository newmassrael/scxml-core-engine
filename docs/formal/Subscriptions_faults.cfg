\* Subscriptions under faults: one value of one key, two versions, the session started again once,
\* every marker dropped at once; the client ends its incarnation, stops and loses its store once
\* each, and the network delivers one answer twice. TLC finds no violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Clients = {1}
    Fair = 1
    NValues = 1
    NKeys = 1
    MaxVersion = 2
    MaxGen = 1
    MaxInc = 2
    Tombstones = 0
    QueueBound = 1
    Exchanges = 1
    MaxRepeat = 1
    MaxStop = 1
    MaxLose = 1
    Markers = TRUE
    FloorCheck = TRUE
    WithState = TRUE
    Generation = TRUE
    Digest = TRUE
    ResetCursor = TRUE
    CatchUp = TRUE
    UnitRule = TRUE
    PageRule = TRUE
    OneUnit = TRUE
    OneWrite = TRUE
    FromChangelog = TRUE
    SkipUnchanged = TRUE
    EndWithIncarnation = TRUE
INVARIANTS
    Exact
    OneState
PROPERTIES
    Refines
    Monotone
    Silent
    Authorized
