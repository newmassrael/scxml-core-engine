\* A durable stream: anchored at the first number, its gaps never time out, and its sender sends
\* again what was not released. TLC finds no violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxNumber = 3
    GapTimeout = 1
    Durable = TRUE
    DropBehind = TRUE
    HoldAhead = TRUE
    Drain = TRUE
    OldestFirst = TRUE
    TimeoutGap = TRUE
    FirstArrival = TRUE
    WaitWhenDurable = TRUE
    AnchorDurable = TRUE
INVARIANTS
    InOrder
    LostUnseen
    NoneTold
    FromFirst
PROPERTIES
    Refines
