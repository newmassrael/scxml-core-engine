\* A window of two: an envelope may be admitted past a gap, and a checkpoint releases two. TLC
\* finds no violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxSeq = 2
    Window = 2
    SenderCrashes = 1
    ReceiverCrashes = 1
    HoldUntilDurable = TRUE
    KeepUntilAck = TRUE
    UnackedInCheckpoint = TRUE
    RestoreCounter = TRUE
    WindowBound = TRUE
    ByNumber = TRUE
    AnswerRepeat = TRUE
    AckDurable = TRUE
    MarkAtSeal = TRUE
    RestoreMarks = TRUE
INVARIANTS
    NoPhantom
    Once
    ReceiptKept
    NoLoss
    Bounded
PROPERTIES
    Refines
