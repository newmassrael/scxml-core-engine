\* A deferred reader takes every log for one that has not filled. TLC finds a first read that is told of a loss with
\* nothing published since it began.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Readers = {r1}
    R = 1
    StampBits = 3
    MaxPub = 9
    EnforceBound = TRUE
    OpenMode = "deferred"
    LastSlot = "unwritten"
INVARIANTS
    FirstLagIsOvertaken
