\* A durable checkpoint that reports the mark of when it became durable acknowledges what it does
\* not hold.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxSeq = 2
    Window = 1
    SenderCrashes = 1
    ReceiverCrashes = 1
    HoldUntilDurable = TRUE
    KeepUntilAck = TRUE
    UnackedInCheckpoint = TRUE
    RestoreCounter = TRUE
    WindowBound = TRUE
    ByNumber = TRUE
    AnswerRepeat = TRUE
    AckDurable = TRUE
    MarkAtSeal = FALSE
    RestoreMarks = TRUE
INVARIANTS
    ReceiptKept
