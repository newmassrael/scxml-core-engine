\* The protocol of ADR 0113, whole: every reachable state, the network repeating, a crash of either side
\* and an expiry. TLC finds no violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    NInst = 1
    NSess = 2
    MaxK = 2
    MaxInc = 3
    MaxJoin = 2
    MaxCliCrash = 1
    MaxSrvCrash = 1
    MaxExpire = 1
    MaxMembers = 1
    Dup = TRUE
    Resend = TRUE
    Handshake = TRUE
    Match = TRUE
    Fence = TRUE
    Records = TRUE
    Recheck = TRUE
    GcDurable = TRUE
    Evict = FALSE
    SameOffer = TRUE
    SignInc = TRUE
    SignMark = TRUE
    SignOffer = TRUE
    SignFence = TRUE
    MaxForge = 1
INVARIANTS
    AtMostOnce
    Answered
    Undisturbed
    Bounded
PROPERTIES
    Refines
