\* A queue per subscription in place of the changelog: a client that subscribes and never reads
\* fills its queue, the full queue refuses the session's write, and what the session was asked is
\* never published.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Clients = {1, 2}
    Fair = 1
    NValues = 1
    NKeys = 1
    MaxVersion = 2
    MaxGen = 0
    MaxInc = 1
    Tombstones = 1
    QueueBound = 1
    Exchanges = 1
    MaxRepeat = 0
    MaxStop = 0
    MaxLose = 0
    Markers = TRUE
    FloorCheck = TRUE
    WithState = TRUE
    Generation = TRUE
    Digest = TRUE
    ResetCursor = TRUE
    CatchUp = TRUE
    UnitRule = TRUE
    PageRule = TRUE
    OneUnit = TRUE
    OneWrite = TRUE
    FromChangelog = FALSE
    SkipUnchanged = TRUE
    EndWithIncarnation = TRUE
PROPERTIES
    Converges
