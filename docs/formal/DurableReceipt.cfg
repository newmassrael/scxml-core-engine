\* Durable receipt, whole: two numbers, a window of one, each machine stops once, and the network
\* loses, repeats and reorders envelopes and acknowledgements. TLC finds no violation.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxSeq = 2
    Window = 1
    SenderCrashes = 1
    ReceiverCrashes = 1
    HoldUntilDurable = TRUE
    KeepUntilAck = TRUE
    UnackedInCheckpoint = TRUE
    RestoreCounter = TRUE
    WindowBound = TRUE
    ByNumber = TRUE
    AnswerRepeat = TRUE
    AckDurable = TRUE
    MarkAtSeal = TRUE
    RestoreMarks = TRUE
INVARIANTS
    NoPhantom
    Once
    ReceiptKept
    NoLoss
    Bounded
PROPERTIES
    Refines
