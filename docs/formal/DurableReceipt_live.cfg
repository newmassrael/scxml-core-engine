\* Every envelope released is kept and acknowledged in the end, and from every state the sender
\* can come to hold nothing the receiver keeps. TLC finds no violation.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxSeq = 1
    Window = 1
    SenderCrashes = 1
    ReceiverCrashes = 1
    HoldUntilDurable = TRUE
    KeepUntilAck = TRUE
    UnackedInCheckpoint = TRUE
    RestoreCounter = TRUE
    WindowBound = TRUE
    ByNumber = TRUE
    AnswerRepeat = TRUE
    AckDurable = TRUE
    MarkAtSeal = TRUE
    RestoreMarks = TRUE
PROPERTIES
    Refines
    Delivered
    Settled
