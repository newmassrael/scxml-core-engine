\* An acknowledgement of what was admitted since the last durable checkpoint lets the sender go of
\* what the receiver loses when it stops.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxSeq = 2
    Window = 1
    SenderCrashes = 1
    ReceiverCrashes = 1
    HoldUntilDurable = TRUE
    KeepUntilAck = TRUE
    UnackedInCheckpoint = TRUE
    RestoreCounter = TRUE
    WindowBound = TRUE
    ByNumber = TRUE
    AnswerRepeat = TRUE
    AckDurable = FALSE
    MarkAtSeal = TRUE
    RestoreMarks = TRUE
INVARIANTS
    ReceiptKept
