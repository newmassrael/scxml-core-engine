# SCE Mesh design-ledger workspace (Mnemosyne adoption, `mesh` namespace).
#
# Unlike docs/spec/scxml (which mirrors an *external* standard, the W3C SCXML
# Recommendation), this workspace mirrors SCE's *own* design document,
# SCE_MESH.md, tracked in this repo. There is therefore no external upstream to
# drift against (no [workspace.spec_source]) and no vendored snapshot: the SSOT
# is SCE_MESH.md itself, and sections are regenerated from it by
# tools/mnemosyne-adoption/sce_mesh_md_to_manifest.py and loaded via
# `import-sections`.
#
# The ledger exists so SCE code comments that cite the mesh design ("§16.7",
# "§9.6.2") resolve to a real section, which lets the set_equality_validator gate
# the mesh/parsing/common/... modules whose SCE-internal cites the scxml
# workspace cannot check. Citations take the form §mesh-<n>; the `mesh` namespace
# segment (before the first hyphen) is what section_namespace scoping keys on, so
# a file may carry both §scxml-<n> (W3C) and §mesh-<n> cites without collision.
#
# Rooted at the SCE repo root so cited/implemented code paths are canonical
# sce/... (R386 anchor resolve); Section.implementations forbids `..`
# traversal, so Path B binding needs the workspace root to be an ancestor of
# the documented code. Ledger artifacts stay under this directory via the
# explicit repo-relative paths below.
[workspace]
root = "../../.."

# Store is the sole SSOT (Mnemosyne R400 retired the markdown-doc render path).
[atomic]
sidecar_path = "docs/sce-ledger/mesh/.atomic/workspace.atomic.json"

[schema]
changelog_titles = ["Revision History"]
entry_id_prefix = "Rev "
anchor_convention = "section_number"
medium_name = "design_ledger"

# SCE's `(R<n>)` commit-subject labels are adoption-round counters, not
# Mnemosyne changelog rounds, so the commit↔ledger drift gate (Mnemosyne
# R293/R301) is advisory here rather than a hard reject (opt-out added in
# Mnemosyne R377/R378). The R377 path-scope already keeps a sibling workspace's
# `(R<n>)` labels from bleeding in; this declares intent for any future
# `(R<n>)` commit that does touch this subtree.
[commit_ledger]
severity = "warn"

# Code-citation defense (validate-code-refs). Paths are workspace-root relative;
# this workspace lives three levels down (docs/sce-ledger/mesh), so they reach
# back up to the SCE source tree. The mesh citations were migrated from bare
# §<n> to the §mesh-<n> form by
# tools/mnemosyne-adoption/migrate_citations.py --namespace mesh.
#
#   section_namespace = "mesh"   only §mesh-<n> tokens are checked; §scxml-<n>
#                                (W3C, checked by docs/spec/scxml), §W* (Wire
#                                RFC), and any still-bare §<n> are skipped by
#                                the token itself — which is what lets these
#                                MIXED modules (mesh/common/static cite both W3C
#                                and SCE-mesh) be gated here at all.
#   severity_missing = "reject"  hallucination gate: a §mesh-<n> with no ledger
#                                section fails the run. Strict from the start —
#                                the migrator only emits ledger-present ids.
#   severity_binding = "reject"  Path B (Section.bindings) is curated for every
#                                scanned tree, so an unbacked cite fails.
#
# `tests/w3c/dist` is in the scan set even though it is test code, because §16.8
# describes the conformance harness itself: those files are the artifact the
# section specifies, not a test of some other section's behaviour. Their cites
# are bound `references` rather than `implements` — the harness there is the S4
# seed (one test, hand-wired partitions), and the single-process-vs-distributed
# comparison that is the substance of §16.8.1 does not exist yet, so claiming
# coverage would overstate the tree. The rest of `tests/` stays out of `paths`;
# widening happens one directory at a time, each with its citation migration and
# bindings in the same commit (severity_binding is already reject, so a path
# added without bindings turns the ledger red).
#
# `tools/codegen/templates/mesh` is enrolled on a TWO-CHANNEL rule, because a
# template comment has two audiences: its own documentation, and the text it
# emits verbatim into every generated file.
#
#   `{# ... #}` Jinja comments  — NOT rendered. §mesh- form lives here, gets
#                                 scanned, and gets bound. Nothing reaches the
#                                 generated trees the scan set excludes.
#   `// ...` comments           — DO ship into generated code. Their cites stay
#                                 bare (`§14.4`), which section_namespace skips,
#                                 so they never enter the gate.
#
# So do NOT run `migrate_citations.py --namespace mesh --apply` over this tree:
# it claims bare `§<n>` for the mesh namespace and would rewrite the shipping
# `//` cites, putting §ids inside every generated file. That is the failure the
# migrator's own `--check-ledger` note describes (measured: Mnemosyne R840 then
# reported 7 sections as reachable only from an excluded tree). The `{# #}`
# cites here are hand-authored one at a time, alongside their binding.
#
# Precedent, not invention: docs/spec/synth already scans this same tree and
# cites §synth-5-O / §synth-6.2.6 from `{# #}` comments in this very template.
#
# Cost to know about: the generated files carry a template-hash, so editing any
# template requires the §6.2.6 regen sweep (scripts/regen_all_committed_trees.sh)
# — ~1.5k hash-only file changes — in a following chore commit.
#
# `sce-build/src/mesh` is the Rust deploy/topology/codegen tree — the build-time
# half of mesh, whose C++ runtime half the four `sce/` entries already cover.
# Note it is also scanned by docs/spec/synth, which lists `sce-build/src`;
# section_namespace keeps the two apart, so a file may carry §mesh- and §synth-
# cites at once and each ledger checks only its own.
#
# Binding kinds there follow the store convention rather than the tool's
# proposal (propose-implementations offers `implements` for everything):
# production functions are `implements`; serde/DTO types, capability tables,
# consts, `mod tests` symbols and file-level cites are `references`. Citations
# written in a doc comment resolve to no symbol at all — the resolver does not
# attribute them to the item they document — so those land as file-level
# `references` and their sections stay uncovered until the cite moves into the
# function body it describes.
#
# `sce-build/src/lib.rs` is enrolled as a single file, not a tree, because one
# mesh seam lives in it: `compile_mesh_transport`, the §7.2 build pipeline. The
# per-step analyses it sequences are already scanned under `sce-build/src/mesh`;
# what exists only here is the order between them, which is that section's
# substance. Same shape as `sce/include/common` and `sce/include/static` above —
# general trees enrolled because a mesh seam sits inside them, not because the
# mesh spec governs everything they hold.
#
# This file is where the migrator prohibition above stops being a convention and
# becomes load-bearing. It carries 107 bare `§<n>` cites and, unlike the mesh
# trees, most are not mesh at all: `§5.2` and `§5.E` are the SCE
# Protocol-Synthesis RFC, `§2.6`/`§2.7` are docs/session-fsm.md. section_namespace
# skips every bare token by the token itself, so they are inert to this gate —
# but `migrate_citations.py --namespace mesh --apply` claims bare `§<n>` for the
# mesh namespace and would mint `§mesh-5.2` over another document's text. Cites
# here are hand-authored one at a time alongside their binding, as in the
# template tree.
#
# Measured on enrollment, not assumed: the scan set moved from 84 files to 85,
# §7.2 closed, and no other axis moved (citation_unbound / symbol_mismatch /
# binding_unbacked stayed at 0 before and after).
#
# `sce-build/src/w3c_dist_manifest.rs` is enrolled on the same single-file rule:
# it is the §16.8.2 classification parser, and its own module header named that
# section before the file was scanned by anything. The label enum is `references`
# (a serde DTO, per the kind convention above) and the cross-field validator is
# `implements` — the closed four-value set is a structural claim, and what
# enforces it at build time is the function.
#
# Its bare `(§16.8.2)` mentions inside `format!` diagnostics are NOT citations:
# a `.rs` file has known comment syntax, so only comments are read. Those strings
# ship to the operator and stay bare deliberately.
[plugins.set_equality_validator]
paths = [
    "sce/include/mesh",
    "sce/src/mesh",
    "sce/include/common",
    "sce/include/static",
    "tests/w3c/dist",
    "sce-build/src/mesh",
    "sce-build/src/lib.rs",
    "sce-build/src/w3c_dist_manifest.rs",
    "tools/codegen/templates/mesh",
]
# Mnemosyne R783 scan coverage: every Rust source under [workspace] root must be
# either scanned by `paths` or declared here, so a configured-but-empty scan set
# cannot gate vacuously. `sce-build/src/mesh` in `paths` above is the one Rust
# tree this ledger scans, plus the single file `sce-build/src/lib.rs`; every
# other Rust source in the repo is declared out here.
#
# An entry here does not subtract from `paths` — the two lists are read
# independently, and a prefix may appear in both. `sce-build/` is declared out
# while `sce-build/src/mesh` is scanned, exactly as `tests/` is declared out
# while `tests/w3c/dist` is scanned. Measured, not assumed: adding those two
# `paths` entries moved the scan set from 58 files to 81, with both prefixes
# still listed below.
scan_exclusions = [
    # WASM entry point crate, split out of `sce-build/src/wasm.rs` when the
    # browser build needed its own cdylib. Measured: it carries exactly one
    # citation, §synth-5-O, and none in this workspace's namespace — so
    # excluding it swallows no section from this gate.
    "sce-build-wasm/",
    "backends/",
    "sce-build/",
    "tests/",
]
severity_missing = "reject"
# Path B curated: every §mesh-<n> cite is bound to a ratified
# Section.implementations (file, symbol), so binding-class drift now fails.
severity_binding = "reject"
# Coverage is enforced as of the round that closed the last normative
# section. Every one of the 106 sections is now either covered by an
# `implements` binding or carries an explicit `coverage_expectation`
# (`informational` for prose and design rationale, `out_of_scope_here` for
# a feature this consumer defers) with a stored reason. Promotion is what
# makes the classification load-bearing: while this was `warn`, a new
# section could land uncovered and unclassified without failing anything,
# and the counter drifting up would be the only signal. Adding a section
# to SCE_MESH.md now fails the ledger until it is either implemented and
# bound or classified with a reason.
severity_coverage = "reject"
# Verify axis: a Normative + Dedicated section with zero `verifies` bindings is
# a VerificationMissing gap that fails CI. Sections are classified through
# verification_expectation — `by_construction` for properties the build refuses
# to violate (a rejected deploy.yaml, an absent field, a closed enum, a fixed
# stage order), `dedicated` for the ones a test artifact witnesses. Per-section
# counts come from report-coverage, not from a tally here.
severity_verification = "reject"
comment_only = true
section_namespace = "mesh"

# The catalog is what makes the verify axis mean something. A `verifies` binding
# on its own is an unchecked claim that a test covers a section; the catalog is
# the independent artifact it is checked against, so a binding to a section the
# test does not itself declare fails the linkage gate.
#
# SSOT is the test's own header marker, read by
# tools/mnemosyne-adoption/gen_mesh_verifies_catalog.py:
#
#     // SCE-VERIFIES: mesh-10.5 mesh-10.6
#
# The scxml sibling reads W3C's `resources/<id>/metadata.txt specnum`, a
# declaration this tree does not author. Mesh tests have no external metadata,
# so the declaration lives with the test, moves with it, and is reviewed in the
# same diff that changes what the test covers. The marker writes `mesh-10.5`
# and NOT `§mesh-10.5` on purpose: a `§` token is a citation and would demand
# its own paired binding, but this line declares intent, not implementation.
#
# Granularity is the FILE, and bindings match it. A mesh test file is one
# scenario driven end to end, so the file is the unit that witnesses something;
# per-symbol declarations would claim a precision the tests are not organised
# around. Same rule the scxml generator set: binding granularity <= SSOT
# granularity.
#
# `sha256` is the tamper/drift pin. Re-pin on every legitimate regen — the
# generator prints the new hash, and `--check` fails when the committed catalog
# is stale.
[verifies_catalog]
path = "docs/sce-ledger/mesh/.atomic/verifies-catalog.json"
severity = "reject"
sha256 = "f46f3cb5cd65ba98a4677bb17be933c94a9824fc28a45ca49371541c196ab14a"

# Path B symbol-binding resolver (Mnemosyne R382). lang_for_file maps C++
# extensions (.h/.cpp/.cc/...) to the `cpp` key; the in-process
# tree-sitter-cpp backend resolves (file, line) to the enclosing symbol.
# The symbol axis is opt-in per Section.implementations entry that records
# a `symbol`; the mesh ledger has now curated those sets, so symbol-level
# drift is enforced under severity_binding = reject above.
[plugins.symbol_resolver.cpp]
transport = "in-process"
backend = "tree-sitter-cpp"

# Rust half of the same axis, for the `sce-build/src/mesh` deploy/topology/
# codegen tree. Without it every cite in that tree would resolve to no symbol
# and the bindings would degrade to file-level, which is weaker than what the
# C++ side already enforces.
[plugins.symbol_resolver.rust]
transport = "in-process"
backend = "tree-sitter-rust"

# Tool pin (Mnemosyne R826/R832). Cargo pins library dependencies through
# Cargo.lock and pins nothing about a binary invoked by name, so a gate runs
# with whatever tool happens to resolve. This declares which Mnemosyne revision
# is allowed to act on this workspace; a binary carrying a different stamp
# refuses instead of silently validating — or writing — under other judgement.
#
# The value must track .github/workflows/spec-citations.yml MNEMOSYNE_REV, which
# stays the SSOT for procurement (CI installs it; pre-push Stage 8 reads it and
# asserts --version). This is the enforcement half: the workflow says which
# revision to fetch, this says which one may touch the store.
#
# R832 resolves a pinned build at ${MN_ROOT:-$HOME/.local/mn}/<pin>/bin/, and a
# mismatched binary execs into it rather than merely refusing. Set
# MN_ROOT=$HOME/.local/share/mnemosyne-rev to match the revision-keyed install
# layout this repo documents in tools/mnemosyne-adoption/README.md; the pin
# string is that directory's name. Procurement is not automatic — an absent
# pinned build is refused with the install line, never fetched.
#
# Order matters when bumping: install the new revision and confirm --version
# FIRST, then move MNEMOSYNE_REV and this pin together. A pin naming a revision
# no local build carries stops every gate, and `[tool]` itself post-dates
# R826, so a pre-R826 binary dies in config parsing without naming a revision.
[tool]
pin = "ecee1fe0"
