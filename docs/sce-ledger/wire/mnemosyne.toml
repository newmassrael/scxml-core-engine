# Wire RFC design-ledger workspace (Mnemosyne adoption, `wire` namespace).
#
# Like docs/sce-ledger/mesh, this mirrors an *internal* SCE design document —
# the Wire RFC (docs/sce-ledger/wire/rfc-sce-diagnostic-wire-unification.md), whose §3
# milestone roadmap defines the commit-series waves W0..W5 (and the half-wave
# W4.5). There is no external upstream (no [workspace.spec_source]) and no
# vendored snapshot: the SSOT is the RFC, and the wave sections are regenerated
# from it by tools/mnemosyne-adoption/sce_wire_rfc_to_manifest.py and loaded via
# `import-sections`.
#
# The ledger exists so code comments citing the diagnostic-wire waves ("RFC §W4",
# "§W5 D5") resolve to a real section, letting the set_equality_validator gate
# the parsing/runtime modules that carry them. Citations take the form §wire-W<n>;
# the `wire` namespace segment (before the first hyphen) is what section_namespace
# scoping keys on, so a parsing file may carry §scxml-<n> (W3C), §wire-W<n>, and
# §mesh-<n> cites at once without collision.
#
# Rooted at the SCE repo root so cited/implemented code paths are
# repo-relative (`sce/...`), not `../../../sce/...`: Section.implementations
# forbids `..` traversal, so Path B binding needs the workspace root to be an
# ancestor of the documented code. Ledger artifacts stay here via the
# explicit repo-relative paths below ([workspace] root + R386 anchor resolve).
[workspace]
root = "../../.."

# Store is the sole SSOT (Mnemosyne R400 retired the markdown-doc render path).
[atomic]
sidecar_path = "docs/sce-ledger/wire/.atomic/workspace.atomic.json"

[schema]
changelog_titles = ["Revision History"]
entry_id_prefix = "Rev "
anchor_convention = "section_number"
medium_name = "design_ledger"

# SCE's `(R<n>)` commit-subject labels are adoption-round counters, not Mnemosyne
# changelog rounds, so the commit↔ledger drift gate (Mnemosyne R293/R301) is
# advisory here rather than a hard reject (opt-out added in Mnemosyne R377/R378).
[commit_ledger]
severity = "warn"

# Code-citation defense (validate-code-refs). Paths are workspace-root relative;
# this workspace lives three levels down (docs/sce-ledger/wire). The §W<n>
# citations were migrated to the §wire-W<n> form by
# tools/mnemosyne-adoption/migrate_citations.py --namespace wire.
#
#   section_namespace = "wire"   only §wire-W<n> tokens are checked; §scxml-<n>
#                                (W3C) and §mesh-<n> in the same files are skipped
#                                by the token itself, so these MIXED parsing /
#                                runtime modules can be gated here for their wire
#                                cites while scxml gates their W3C cites.
#   severity_missing = "reject"  hallucination gate: a §wire-W<n> with no ledger
#                                section fails the run (the migrator only emits
#                                ledger-present ids).
#   severity_binding = "warn"    Path B (Section.implementations) is a later
#                                round; advisory so unbacked cites pass.
[plugins.set_equality_validator]
paths = [
    "sce/include/parsing",
    "sce/src/parsing",
    "sce/src/runtime",
    # Rust code generator: its §wire-W<n> cites were outside every ledger's
    # scan set until R783 coverage surfaced them. Gated here, bound below.
    "sce-build/src",
    "sce-build/tests",
]
# Mnemosyne R783 scan coverage: every Rust source under [workspace] root must be
# either scanned by `paths` or declared here, so a configured-but-empty scan set
# cannot gate vacuously.
#
# Measured, not assumed: no §wire- section is cited ONLY inside an excluded tree,
# which is the axis Mnemosyne R840 rejects on. The excluded C++ test tree does
# cite §wire-W1/W2/W3/W4.5 — but every one of those sections is also cited in a
# scanned file (5/4/5/4 files respectively), so excluding the test copies removes
# no section from the gate. The 54 hand-authored cites in the Rust codegen are a
# different case: they were the only copies, which is why sce-build/src and
# sce-build/tests are in `paths` above rather than here.
scan_exclusions = [
    "backends/",
    "sce-build/examples/",
    "tests/",
]
severity_missing = "reject"
# Path B curated: every §wire-W<n> cite is bound to a Section.implementations
# (file, symbol) the maintainer ratified, so binding-class drift (a cite in an
# unregistered file or a non-registered symbol) now fails the build.
severity_binding = "reject"
# Coverage (Active section with zero implementations) stays advisory: this is
# a spec/RFC ledger where meta/contract sections (e.g. §wire-W0, the commit-
# series contract) legitimately have no code citation. Enforcing coverage here
# would demand a per-section non-code carve-out; the split keeps it honest.
severity_coverage = "warn"
comment_only = true
section_namespace = "wire"

# Path B symbol-binding resolver (Mnemosyne R382). lang_for_file maps C++
# extensions (.h/.cpp/.cc/...) to the `cpp` key; the in-process
# tree-sitter-cpp backend resolves (file, line) to the enclosing symbol.
# The symbol axis is opt-in per Section.implementations entry that records
# a `symbol`; the wire ledger has now curated those sets, so symbol-level
# drift is enforced under severity_binding = reject above.
[plugins.symbol_resolver.cpp]
transport = "in-process"
backend = "tree-sitter-cpp"

# Rust resolver for the sce-build crate (.rs), added with the sce-build paths
# above. Without it a .rs cite can only bind file-wide, which is a weaker claim
# than this ledger makes for C++: severity_binding = reject is meant to catch a
# cite that drifts to another symbol, and a file-level binding cannot see that.
[plugins.symbol_resolver.rust]
transport = "in-process"
backend = "tree-sitter-rust"

# Tool pin (Mnemosyne R826/R832). Cargo pins library dependencies through
# Cargo.lock and pins nothing about a binary invoked by name, so a gate runs
# with whatever tool happens to resolve. This declares which Mnemosyne revision
# is allowed to act on this workspace; a binary carrying a different stamp
# refuses instead of silently validating — or writing — under other judgement.
#
# The value must track .github/workflows/spec-citations.yml MNEMOSYNE_REV, which
# stays the SSOT for procurement (CI installs it; pre-push Stage 8 reads it and
# asserts --version). This is the enforcement half: the workflow says which
# revision to fetch, this says which one may touch the store.
#
# R832 resolves a pinned build at ${MN_ROOT:-$HOME/.local/mn}/<pin>/bin/, and a
# mismatched binary execs into it rather than merely refusing. Set
# MN_ROOT=$HOME/.local/share/mnemosyne-rev to match the revision-keyed install
# layout this repo documents in tools/mnemosyne-adoption/README.md; the pin
# string is that directory's name. Procurement is not automatic — an absent
# pinned build is refused with the install line, never fetched.
#
# Order matters when bumping: install the new revision and confirm --version
# FIRST, then move MNEMOSYNE_REV and this pin together. A pin naming a revision
# no local build carries stops every gate, and `[tool]` itself post-dates
# R826, so a pre-R826 binary dies in config parsing without naming a revision.
[tool]
pin = "646218fa"
