# Protocol-synthesis RFC design-ledger workspace (Mnemosyne adoption, `synth`
# namespace).
#
# Like docs/sce-ledger/mesh and docs/sce-ledger/wire, this workspace mirrors an
# SCE-internal design document tracked in this repo: the RFC "SCE Forge
# Extensions for Wire Protocol Synthesis" at
# docs/spec/synth/rfc-sce-protocol-synthesis.md — the forge wire-protocol
# synthesis spec, co-located with the forge implementation it defines. The
# codec algorithm is written in-line as `<sce:*>` forge DSL, so the spec and
# its generated code evolve together in one commit; the SSOT therefore lives
# with SCE, and downstream consumers vendor it from here. There is no external
# upstream (no [workspace.spec_source]) and no vendored snapshot: the SSOT is
# the tracked RFC itself, and the ledger's sections are regenerated from it by
# tools/mnemosyne-adoption/synth_rfc_to_manifest.py via `import-sections`.
# Plain markdown in-tree, so git itself is the tamper-evidence layer.
#
# The ledger exists so SCE code comments citing the RFC ("RFC §5.B",
# "§6.2.6", "§5.J.2") resolve to a real section in the §synth-<id> form,
# letting the set_equality_validator gate the enrolled modules. Section ids
# follow the §-citation extractor's token rule (a dot survives only between
# digits): 5.B -> synth-5-B, 5.J.2 -> synth-5-J-2, 6.2.6 -> synth-6.2.6 —
# the same lettered-label hyphenation the scxml ledger uses (G.7 -> scxml-G-7).
#
# Rooted at the SCE repo root so cited/implemented code paths are canonical
# (R386 anchor resolve); Section.implementations forbids `..` traversal, so
# Path B binding needs the workspace root to be an ancestor of the documented
# code. Ledger artifacts stay here via the repo-relative paths below.
[workspace]
root = "../../.."

# Store is the sole SSOT (Mnemosyne R400 retired the markdown-doc render path);
# the tracked RFC markdown above is the regen input and human-readable mirror,
# not a parsed workspace doc.
[atomic]
sidecar_path = "docs/spec/synth/.atomic/workspace.atomic.json"

[schema]
changelog_titles = ["Revision History"]
entry_id_prefix = "Rev "
anchor_convention = "section_number"
medium_name = "design_ledger"

# SCE's `(R<n>)` commit-subject labels are adoption-round counters, not
# Mnemosyne changelog rounds, so the commit↔ledger drift gate (Mnemosyne
# R293/R301) is advisory here rather than a hard reject (opt-out added in
# Mnemosyne R377/R378), matching the other three workspaces.
[commit_ledger]
severity = "warn"

# Code-citation defense (validate-code-refs). Paths are workspace-root
# relative; this workspace lives three levels down (docs/spec/synth). The
# free-text "RFC §5.B" cites were migrated to the §synth-<id> form by
# tools/mnemosyne-adoption/migrate_citations.py --namespace synth.
#
#   section_namespace = "synth"  only §synth-<id> tokens are checked; §scxml-,
#                                §mesh-, §wire- and still-bare §<n> cites in
#                                the same files are skipped by the token
#                                itself, so MIXED modules can be gated here
#                                for their RFC cites while the other ledgers
#                                gate theirs.
#   severity_missing = "reject"  hallucination gate: a §synth-<id> with no
#                                ledger section fails the run (the migrator
#                                only emits ledger-present ids).
#   severity_binding = "warn"    Path B (Section.implementations binding) is a
#                                later curation round; advisory so unbacked
#                                cites pass — the scxml R3 rollout pattern.
#
# Enrolled paths are the authored cite-bearing surfaces. Committed GENERATED
# trees (tests/forge/expected, backends/rust/tests/src/generated) are deliberately
# NOT enrolled: their cites are emitted by the enrolled templates, so gating
# the templates gates them, and the §6.2.6 drift gate keeps the trees in
# lockstep with the templates.
[plugins.set_equality_validator]
paths = [
    "tools/codegen/templates",
    "sce-build/src",
    "sce-build/tests",
    # Generator identity is resolved at build time, so `build.rs` is part of
    # the authored cite-bearing surface even though it sits beside `src/`
    # rather than inside it.
    "sce-build/build.rs",
    "backends/rust/runtime/src",
    "backends/c/forge-runtime",
    # Source subdirs only: the parent holds a gitignored `build/` whose artifacts
    # the citation gate reads whole (Mnemosyne R856 line). No citation lives in
    # CMakeLists.txt / build.gradle.kts / pyproject.toml — verified, 0 each.
    "backends/cpp/forge-runtime/include",
    "backends/cpp/forge-runtime/tests",
    # Source packages only, same reason one level deeper: `conformance/` holds a
    # gitignored `generated/` tree of 126 Go files carrying 182 §synth- cites, so
    # the totals moved with whether the reader had run conformance/generate.sh.
    # A `.go` file has a known comment syntax, so the Mnemosyne R856 read-whole
    # line never named it — the R860 read-set sweep did. Only duplicated cites
    # left the set: §synth-5-A 44 -> 42 citing files, 5-B 233 -> 143, 5-J-5
    # 25 -> 23, and go.mod / conformance/doc.go / conformance/generate.sh carry
    # 0 citations each.
    "backends/go/forge-runtime/codec",
    "backends/go/forge-runtime/filter",
    "backends/go/forge-runtime/forge",
    "backends/go/forge-runtime/interpolation",
    "backends/go/forge-runtime/lookup",
    "backends/go/forge-runtime/observer",
    "backends/go/forge-runtime/round_trip",
    "backends/go/forge-runtime/timer",
    "backends/kotlin/forge-runtime/src",
    "backends/python/forge-runtime/sce_forge_runtime",
    "backends/python/forge-runtime/tests",
    "backends/rust/forge-runtime",
    "backends/c/runtime/include",
    "tests/forge/resources",
    # Hand-authored: fixtures.schema.json documents each manifest field against
    # the RFC section it derives from, so its §synth- cites are authored prose,
    # not codegen output, and belong under the hallucination gate.
    "tests/forge/conformance",
    "scripts",
    "schemas",
]
# Mnemosyne R783 scan coverage: every Rust source under [workspace] root must be
# either scanned by `paths` or declared here, so a configured-but-empty scan set
# cannot gate vacuously.
#
# An entry declares coverage intent; it does NOT subtract from what the gate
# reads (Mnemosyne R860). So a prefix must name a tree `paths` does not cover,
# or it claims two contradictory things about the same file: `tests/` used to sit
# here while `paths` scanned tests/forge/resources, and 165 files were both
# scanned and declared out.
#
# Measured: the excluded trees hold 1015 files carrying §synth- cites, and every
# one is codegen OUTPUT — backends/rust/tests/src/generated/**,
# backends/rust/probes/** ("SCE-GENERATED — DO NOT EDIT"),
# tests/forge/expected/** (golden references regenerated from source SCXML) and
# backends/go/forge-runtime/conformance/generated/**. Their cite text is authored
# in tools/codegen/templates, which `paths` scans, so the citations are gated at
# their source and re-gating the output would check the same string twice. No
# hand-authored §synth- citation lives in an excluded tree.
scan_exclusions = [
    "backends/go/forge-runtime/conformance/",
    "backends/rust/link-runtime/",
    "backends/rust/lua/",
    "backends/rust/portable-bytes/",
    "backends/rust/probes/",
    "backends/rust/runtime/tests/",
    "backends/rust/tests/",
    "sce-build/examples/",
    "tests/forge/expected/",
]
severity_missing = "reject"
# Path B curated: all 2590 §synth- citations are bound to a
# Section.implementations (file, symbol), so a cite that drifts to another
# symbol now fails the build. Kinds do NOT follow the tool's proposal, which
# offers `implements` for everything: an exempt section may only take
# `references` (R423 rejects implements on one), and on a normative section a
# test tree, `mod tests` or a fixture is `references` — only a production
# symbol implements. Ambiguity resolves to `references`, the direction that
# cannot manufacture coverage.
severity_binding = "reject"
# Coverage is enforced. The 29 exempt sections carry their reason in the store;
# the per-section carve-out replaced the blanket downgrade this comment used to
# describe. Appendices A and B were reclassified during the binding round: the
# fixtures that realise them cite the body sections they exemplify, never the
# appendix, so the appendix has no artifact of its own.
severity_coverage = "reject"
comment_only = true
section_namespace = "synth"

# Path B symbol-binding resolvers (Mnemosyne R382), for the later curation
# round: tree-sitter backends resolve (file, line) to the enclosing symbol for
# the C++ and Rust enrolled surfaces. The symbol axis is opt-in per
# Section.implementations entry that records a `symbol`.
[plugins.symbol_resolver.cpp]
transport = "in-process"
backend = "tree-sitter-cpp"

[plugins.symbol_resolver.rust]
transport = "in-process"
backend = "tree-sitter-rust"

# Tool pin (Mnemosyne R826/R832). Cargo pins library dependencies through
# Cargo.lock and pins nothing about a binary invoked by name, so a gate runs
# with whatever tool happens to resolve. This declares which Mnemosyne revision
# is allowed to act on this workspace; a binary carrying a different stamp
# refuses instead of silently validating — or writing — under other judgement.
#
# The value must track .github/workflows/spec-citations.yml MNEMOSYNE_REV, which
# stays the SSOT for procurement (CI installs it; pre-push Stage 8 reads it and
# asserts --version). This is the enforcement half: the workflow says which
# revision to fetch, this says which one may touch the store.
#
# R832 resolves a pinned build at ${MN_ROOT:-$HOME/.local/mn}/<pin>/bin/, and a
# mismatched binary execs into it rather than merely refusing. Set
# MN_ROOT=$HOME/.local/share/mnemosyne-rev to match the revision-keyed install
# layout this repo documents in tools/mnemosyne-adoption/README.md; the pin
# string is that directory's name. Procurement is not automatic — an absent
# pinned build is refused with the install line, never fetched.
#
# Order matters when bumping: install the new revision and confirm --version
# FIRST, then move MNEMOSYNE_REV and this pin together. A pin naming a revision
# no local build carries stops every gate, and `[tool]` itself post-dates
# R826, so a pre-R826 binary dies in config parsing without naming a revision.
[tool]
pin = "3e2cb146"
