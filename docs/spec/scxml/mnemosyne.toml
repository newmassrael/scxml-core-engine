# W3C SCXML Recommendation spec-mirror workspace (Mnemosyne adoption).
#
# One workspace per external namespace (SCHEMA_GUIDE "External-spec mirror"):
# this tree mirrors https://www.w3.org/TR/scxml/ so SCE code citations stay
# honest against the spec graph. Sibling workspaces (IRP catalog, SCE design
# ledger) live under their own mnemosyne.toml trees.
#
# Sections are generated from the vendored snapshot by the A1 converter
# (tools/mnemosyne-adoption/scxml_toc_to_manifest.py) and loaded via
# `import-sections`. The atomic store (.atomic/workspace.atomic.json) is the
# sole SSOT (Mnemosyne R400 retired the markdown-doc render path); humans read
# the committed EPUB (.atomic/epub/, pinned under [workspace.spec_source]).
#
# [plugins.set_equality_validator] (code-citation defense over SCE source) is
# wired at the bottom of this file. It is rolled out one source directory at a
# time (R3): a directory's "W3C SCXML <n>.<m>" prose citations are migrated to
# the §scxml-<n>.<m> form (tools/mnemosyne-adoption/migrate_citations.py) and
# then added to `paths` below, so validate-code-refs checks each migrated
# citation against this ledger's section set.

# Rooted at the SCE repo root so cited/implemented code paths are canonical
# sce/... (R386 anchor resolve); Section.implementations forbids `..`
# traversal, so Path B binding needs the workspace root to be an ancestor of
# the documented code. Ledger artifacts stay here via the repo-relative paths.
[workspace]
root = "../../.."

# Drift provenance (B2 validate-spec-drift). url/revision/fetched_sha256 mirror
# tools/mnemosyne-adoption/spec-snapshot/PROVENANCE.json (the B1 drift source).
[workspace.spec_source]
url = "https://www.w3.org/TR/scxml/"
revision = "REC-scxml-20150901"
fetched_sha256 = "25da59a4a475e9751ad855b639c933b2d465911bb7eed7d33ffd600196e2a209"
fetched_at = "2026-05-30"
# EPUB-as-content-SSOT pin (Mnemosyne R405). The committed EPUB is the human-
# readable rendering of the spec revision and the provenance anchor for every
# normative_excerpt cache: validate-content-drift re-hashes this file against
# epub_sha256 and re-hashes each stored excerpt against its text_sha256, so a
# tampered excerpt or a swapped EPUB fails offline. Produced from the snapshot
# by tools/mnemosyne-adoption/scxml_toc_to_manifest.py -> medium-forge
# (--text-scope heading) -> import-epub-excerpts.
epub_path = "docs/spec/scxml/.atomic/epub/scxml-REC-20150901.epub"
epub_sha256 = "e1c03dd821e08de897d19715a003df195561c73564e2b8e877d827cbb6a07461"

# Offline content-drift gate (validate-content-drift). reject = a stored excerpt
# whose text no longer hashes to its text_sha256, or an EPUB whose bytes no
# longer match epub_sha256, fails the run.
[content_drift]
severity = "reject"

# Store lives directly under this workspace root (no nested docs/ level).
[atomic]
sidecar_path = "docs/spec/scxml/.atomic/workspace.atomic.json"

[schema]
changelog_titles = ["Revision History"]
entry_id_prefix = "Rev "
anchor_convention = "section_number"
medium_name = "spec_mirror"

# SCE's `(R<n>)` commit-subject labels are adoption-round counters, not
# Mnemosyne changelog rounds. This workspace's history carries one such commit
# ("… (R2)"), so the commit↔ledger drift gate (Mnemosyne R293/R301) is advisory
# here rather than a hard reject (opt-out added in Mnemosyne R377/R378): the
# drift line still prints, it just stops gating the exit code.
[commit_ledger]
severity = "warn"

# Code-citation defense (validate-code-refs). Paths are workspace-root relative,
# so they reach back up to the SCE source tree (this workspace lives three
# levels down at docs/spec/scxml/). R3 expands `paths` one directory at a time
# as its citations are migrated to the §scxml-<id> form.
#
#   severity_missing = "reject"  the hallucination gate: a §scxml-<id> citation
#                                with no matching ledger section fails the run.
#                                This is R3's real value, strict from the start
#                                because the migrator only emits ledger-present
#                                ids (tools/mnemosyne-adoption/migrate_citations).
#   severity_binding = "warn"    Path B (Spec <-> Code bidirectional binding via
#                                Section.implementations) is a later round; keep
#                                it advisory so unbacked citations do not fail.
#   comment_only     = true      only citations inside comments are scanned;
#                                string-literal text is ignored.
# `section_namespace = "scxml"` (below) makes this gate check only §scxml-<id>
# tokens and skip every foreign one (§mesh-<n>, `§wire-W<n>`, still-bare §<n>) by
# the token itself, so a module that mixes W3C and SCE-internal cites can be
# gated here for its W3C cites while its mesh/wire cites are gated by the
# docs/sce-ledger/{mesh,wire} workspaces. That is why the mixed modules (common,
# static, model, mesh) are now listed alongside the citation-clean ones.
[plugins.set_equality_validator]
paths = [
    "sce/include/events",
    "sce/src/events",
    "sce/include/actions",
    "sce/src/actions",
    "sce/include/core",
    "sce/include/runtime",
    "sce/src/runtime",
    "sce/include/scripting",
    "sce/src/scripting",
    "sce/include/states",
    "sce/src/states",
    "sce/include/wrappers",
    "sce/src/model",
    "sce/include/parsing",
    "sce/src/parsing",
    "sce/include/common",
    "sce/src/common",
    "sce/include/static",
    "sce/include/model",
    "sce/include/mesh",
    "sce/include/SCXMLTypes.h",
    # Rust code generator (sce-build crate). Its W3C SCXML cites were
    # migrated from prose to §scxml- form by migrate_citations.py and
    # bound under Section.implementations, so the same hallucination /
    # binding gates that cover the C++ engine now cover the Rust codegen.
    "sce-build/src",
    # no_std Rust runtime. Its 236 prose "W3C SCXML <n>" cites were migrated to
    # §scxml- form and bound below, so the same hallucination / binding gates
    # that cover the C++ engine and the Rust codegen now cover the runtime.
    "backends/rust/runtime/src",
    # C11 runtime. Its §scxml- cites sat outside every scan set until Mnemosyne
    # R855 mapped `.c` to the cpp resolver — before that the symbol axis was
    # silently skipped for every `.c` file, so enrolling this tree would have
    # claimed symbol-level enforcement it could not deliver. `backends/c/tests`
    # stays out, matching how `backends/rust/runtime/tests` is declared out.
    "backends/c/runtime",
    # Go, Kotlin and Python runtimes. Enrolled at the R1142 pin for the reason
    # spelled out below `scan_exclusions`: the axis now reports that it had no
    # instrument for these languages instead of publishing a zero, so listing
    # them buys file-level binding enforcement without claiming symbol-level
    # coverage nobody can deliver. Each path names the SOURCE directory — the
    # tree roots carry build output (`build/` classes and jars, `__pycache__`)
    # that has no citations and does not belong in a read set.
    "backends/go/runtime",
    "backends/kotlin/runtime/src",
    "backends/python/runtime/sce_runtime",
]
# Mnemosyne R783 scan coverage: every Rust source under [workspace] root must be
# either scanned by `paths` or declared here, so a configured-but-empty scan set
# cannot gate vacuously.
#
# The trees below are generated output and test trees. They DO carry
# hand-authored §scxml- cites — 62 of them across 36 files when this was last
# measured — and an earlier version of this comment claimed the opposite. What
# excluding them costs is precise: the existence axis still reads every one of
# those cites (it scans the whole tree), so a §id naming no section still
# fails; what is given up is the BINDING axis, which would check that each cite
# sits on the symbol the ledger says implements the clause.
#
# The Go, Kotlin and Python runtimes were also outside `paths` until Mnemosyne
# R1142. Enrolling them before that would have been a false claim: a language
# with no resolver published a symbol_mismatch count of zero, which reads as
# "checked and clean". R1142 makes the axis say it had no instrument, and R1144
# refuses a run whose recorded symbol no resolver covers, so enrolment now buys
# real file-level binding enforcement while naming the symbol-level gap out
# loud — `no resolver configured [go, python]`, `extension maps to no language
# [kt]`. What remains is upstream: tree-sitter plugins for those languages, and
# `.kt` reaching the extension table at all.
#
# `paths` also drives the citation-FORM gate, so a tree enters this ledger
# only once its prose cites are migrated — which is why the no_std runtime moved
# from this list into `paths` above rather than staying declared out.
scan_exclusions = [
    # WASM entry point crate, split out of `sce-build/src/wasm.rs` when the
    # browser build needed its own cdylib. Measured: it carries exactly one
    # citation, §synth-5-O, and none in this workspace's namespace — so
    # excluding it swallows no section from this gate.
    "sce-build-wasm/",
    # Build-time generator-identity resolution. Measured: it carries exactly
    # one citation, §synth-6.2.6, and none in this workspace's namespace —
    # so excluding it swallows no section from this gate.
    "sce-build/build.rs",
    "backends/rust/forge-runtime/",
    "backends/rust/link-runtime/",
    "backends/rust/lua/",
    "backends/rust/portable-bytes/",
    "backends/rust/probes/",
    "backends/rust/runtime/tests/",
    "backends/rust/tests/",
    "sce-build/examples/",
    "sce-build/tests/",
    "tests/",
]
severity_missing = "reject"
# Path B curated: every §scxml-<id> cite is bound to a ratified
# Section.implementations (file, symbol), so binding-class drift now fails.
severity_binding = "reject"
# Coverage is now enforced: every section this mirror still classifies as
# normative carries at least one `implements` binding, and the sections that
# legitimately have no code behind them were reclassified informational or
# out_of_scope_here instead of being carved out here. Regressing means either a
# new normative section arrived without an implementation cite, or an existing
# one lost its binding — both are real gaps, so they fail rather than warn. Live
# counts are the SSOT of `mnemosyne-cli report-coverage`; do not duplicate
# tallies in this comment — hardcoded ones drift (they did: a stale 49/196 vs
# the actual 48/197).
severity_coverage = "reject"
# Verify axis (R413): a Normative + Dedicated section with zero `verifies`
# bindings is a VerificationMissing gap that fails CI. Sections are
# classified via verification_expectation (by_construction = structural-invariant
# sections such as the Appendix-D procedures + §scxml-3.11 legal state
# configuration; dedicated = bound to a tests/w3c/aot_tests/Test<NNN>.h artifact)
# and coverage_expectation (R422 3-state: out_of_scope_here and informational are
# exempt from the coverage axiom). Per-section counts are read from
# report-coverage, not asserted here.
severity_verification = "reject"
# R423 MisclassifiedCoverage: an exempt (out_of_scope_here/informational) section
# that carries an implements/verifies binding is a classification error — the
# binding asserts code, so the section is not exempt. Rejects the scxml-3.11 /
# scxml-6.4.4 shape mechanically (the gate that was missing when those slipped).
severity_classification = "reject"
# R425 BlanketVerifies: one (file, symbol) carrying `verifies` on >1 section.
# A conformance test verifies one section; N>1 is the blanket-binding smell that
# produced the 67% mis-binding episode this ledger corrected. warn is the
# regression fence — after the specnum rebuild each test targets exactly one
# section, so this reports 0; a future re-introduction trips it.
severity_blanket = "warn"
comment_only = true

# This workspace owns the `scxml-` namespace (W3C SCXML spec mirror). A citation's
# namespace is the segment of its §id before the first hyphen, so §scxml-6.2 is
# ours while §W4 (Wire RFC), §16.7 (SCE Mesh), and any other §<id> belong to a
# different ledger. section_namespace makes the validator check only scxml- cites
# and skip every foreign one by the token itself — no reliance on the word that
# happens to precede the sigil. This is what lets MIXED modules (parsing etc.,
# which cite both §scxml- and §W*/§<n>) be gated here: their W3C cites are
# verified, their mesh/wire cites wait for the docs/sce-ledger/{mesh,wire}
# workspaces that will own the `mesh`/`wire` namespaces. (Mnemosyne R376.)
section_namespace = "scxml"

# Path B symbol-binding resolver (Mnemosyne R382). lang_for_file maps C++
# extensions (.h/.cpp/.cc/...) to the `cpp` key; the in-process
# tree-sitter-cpp backend resolves (file, line) to the enclosing symbol.
# The symbol axis is opt-in per Section.implementations entry that records
# a `symbol`; the scxml ledger has now curated those sets, so symbol-level
# drift is enforced under severity_binding = reject above.
[plugins.symbol_resolver.cpp]
transport = "in-process"
backend = "tree-sitter-cpp"

# Rust resolver for the sce-build crate (.rs). lang_for_file maps .rs to
# the `rust` key; the in-process tree-sitter-rust backend resolves
# (file, line) to the enclosing symbol, exactly as the cpp backend does
# for the C++ engine. Symbol-level binding drift on the Rust codegen is
# enforced under severity_binding = reject above.
[plugins.symbol_resolver.rust]
transport = "in-process"
backend = "tree-sitter-rust"

# R426 verifies-catalog linkage (SCE field-report P2). The authoritative
# correctness gate for the verify axis: every `verifies` binding must match the
# section the test's own W3C metadata.txt `specnum` declares it targets. The
# catalog JSON is consumer-generated (Mnemosyne takes only the neutral
# `verifies-catalog/v1` contract, never the metadata.txt parser) by
# tools/mnemosyne-adoption/gen_verifies_catalog.py; a CI drift guard keeps it in
# lockstep with the test metadata. reject because a binding that contradicts the
# test's declared target is a wrong claim, not an intermediate state. Also powers
# the R427 confirmed-rule catalog-live branch: a catalog-validated binding counts
# as confirmed without a model semantic_review (deterministic > model).
[verifies_catalog]
path = "docs/spec/scxml/.atomic/verifies-catalog.json"
severity = "reject"
# R428 sha256 pin (epub_sha256 symmetry). The catalog is the authority input of
# the R427 catalog-live confirmed rule, so it gets the same tamper/drift guard as
# every other gate input: every load re-hashes the file and fails loudly on
# mismatch. Re-pin on every legitimate regen — gen_verifies_catalog.py prints the
# new hash (catalog<->metadata guarded by its --check, catalog<->pin guarded here).
sha256 = "fd88796df0afd01c9febb650e8dd1a9ee62479ae797c7adc24ffc4f1d68c66c1"

# Tool pin (Mnemosyne R826/R832). Cargo pins library dependencies through
# Cargo.lock and pins nothing about a binary invoked by name, so a gate runs
# with whatever tool happens to resolve. This declares which Mnemosyne revision
# is allowed to act on this workspace; a binary carrying a different stamp
# refuses instead of silently validating — or writing — under other judgement.
#
# The value must track .github/workflows/spec-citations.yml MNEMOSYNE_REV, which
# stays the SSOT for procurement (CI installs it; pre-push Stage 8 reads it and
# asserts --version). This is the enforcement half: the workflow says which
# revision to fetch, this says which one may touch the store.
#
# R832 resolves a pinned build at ${MN_ROOT:-$HOME/.local/mn}/<pin>/bin/, and a
# mismatched binary execs into it rather than merely refusing. Set
# MN_ROOT=$HOME/.local/share/mnemosyne-rev to match the revision-keyed install
# layout this repo documents in tools/mnemosyne-adoption/README.md; the pin
# string is that directory's name. Procurement is not automatic — an absent
# pinned build is refused with the install line, never fetched.
#
# Order matters when bumping: install the new revision and confirm --version
# FIRST, then move MNEMOSYNE_REV and this pin together. A pin naming a revision
# no local build carries stops every gate, and `[tool]` itself post-dates
# R826, so a pre-R826 binary dies in config parsing without naming a revision.
[tool]
pin = "89432e86"
