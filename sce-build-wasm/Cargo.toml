#
# sce-build-wasm — browser bindings for the SCXML code generator
#
# A `cdylib` wrapper around `sce-build`, existing so the browser target
# has a build command instead of a procedure. The bindings used to live
# behind a `wasm` feature on `sce-build` itself, which `cargo check`
# accepted and `wasm-pack` refused: an rlib cannot link to
# wasm32-unknown-unknown, so the committed `web/visualizer/wasm/`
# artifact could not be rebuilt from the tree at all. Splitting the
# cdylib out makes the browser artifact reproducible without taxing the
# native consumers that take `sce-build` as a build-dependency.
#
# Build:
#   wasm-pack build sce-build-wasm --target web --out-name sce_build \
#       --out-dir ../web/visualizer/wasm

[package]
name = "sce-build-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "WebAssembly bindings for the SCE SCXML code generator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false` drops the `xsd` feature: libxml2 is a native
# C library whose build script cannot cross-compile to wasm32. The parser
# reports the resulting `NotValidated(FeatureDisabled)` rather than
# claiming a validation that did not run.
sce-build = { path = "../sce-build", default-features = false }
wasm-bindgen = "0.2"
serde_json = "1"
roxmltree = "0.20"
