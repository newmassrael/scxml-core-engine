#
# sce-build — SCXML code generator for sce-rust-runtime
#
# Build-time helper: parses SCXML files and generates Rust code
# implementing `sce_rust_runtime::StatePolicy`. Drop into build.rs
# to eliminate the Python codegen dependency.

[package]
name = "sce-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SCXML code generator for sce-rust-runtime (build.rs helper)"

[dependencies]
# XML parsing — read-only DOM, zero-copy, fast
roxmltree = "0.20"
# libxml2 FFI for XSD schema validation. Used at the parser entry point
# to validate the sce: extension namespace against schemas/sce-forge.xsd
# before any structural parsing runs. Build dependency: libxml2-dev
# (Debian/Ubuntu) / libxml2 (macOS Homebrew) / libxml2 (Windows vcpkg).
#
# Optional, and ON by default via the `xsd` feature, because libxml2 is a
# native C library that cannot cross-compile to wasm32 — its build script
# panics looking for a target sysroot through pkg-config. The browser
# bindings in `sce-build-wasm` therefore take this crate with
# `default-features = false`. That does not silently drop validation:
# `xsd_validator::validate_or_skip` returns `NotValidated(FeatureDisabled)` and
# the parser reports it.
libxml = { version = "0.3", optional = true }
# Jinja2-compatible template engine (renders existing .jinja2 templates)
minijinja = { version = "2", features = ["builtins"] }
# Serialization for template context
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML parsing for deploy.yaml (SCE Mesh topology configuration).
# serde_yaml_ng is the actively-maintained successor to the deprecated serde_yaml.
serde_yaml_ng = "0.9"
# ECMAScript→Lua regex transformations
regex = "1"
# Derive macros for std::error::Error — structured error hierarchy
thiserror = "2"
# Python Jinja2 compatibility (dict.items(), str.strip(), etc.)
minijinja-contrib = { version = "2", features = ["pycompat"] }
# SHA-256 for spec §6.2.6 generated-source drift detection. See
# `forge::drift` — computes `source-hash` over input SCXML + deploy.yaml
# and `template-hash` over the codegen template tree + Cargo.lock.
sha2 = { workspace = true }
# CLI argument parsing (for sce-codegen binary)
clap = { version = "4", features = ["derive"], optional = true }

[features]
# `xsd` is on by default so every native build validates at the parser entry
# point; a build that opts out says so at runtime rather than reporting the same
# success as a validating one.
default = ["xsd"]
xsd = ["libxml"]
cli = ["clap"]

# JSON Schema derivation for the conformance manifest. Dev-only so release
# builds and downstream consumers don't pick up the extra dependency — the
# schema is a CI drift guard, not runtime data. The `drift_guard` test in
# `conformance.rs` generates the schema from the types and fails if the
# checked-in `tests/forge/conformance/fixtures.schema.json` diverges.
[dev-dependencies]
schemars = "0.8"
# Full JSON Schema validator. Drives the AST export drift guard's
# round-trip assertions through the same code path a real consumer
# would use — catches issues that serde_json::Value structural
# inspection misses (e.g. const mismatch, type narrowing on an
# optional field, ref resolution failure). Dev-only — production
# emit paths never validate, only produce.
jsonschema = { version = "0.18", default-features = false }
syn = { version = "2", features = ["parsing", "full"] }
# Lua 5.4 — the very interpreter the Rust and Go backends emit for. Those
# backends embed a Lua table constructor inside a host string literal, so
# an author value crosses two literal boundaries and a host-only escape
# yields source that compiles and Lua that does not parse. The
# `author_literal_boundaries` gate hands the emitted table to this parser
# instead of re-implementing one, so the check cannot drift from the
# grammar it is asserting about. Dev-only: codegen never links Lua.
mlua = { workspace = true }
# Sandboxed directories for XInclude expansion tests. Lets each
# `#[test]` build a transient file tree without touching the crate's
# own files (avoids race conditions under `cargo test -- --test-threads`).
tempfile = "3"

[lib]
# `rlib` only for native builds. Native consumers (workspace runtime
# crates, downstream `build.rs` users like backends/rust/forge-runtime)
# link as a regular Rust library, so producing a `cdylib` here in
# the default configuration only invites cargo issue #6313 output-
# path collisions when the same package gets compiled twice (once
# as a dependency, once for its own tests). WASM builds that need
# the `cdylib` form (the `wasm` feature gates `wasm-bindgen`) must
# pass `--crate-type cdylib` on the `cargo build` invocation
# directly — there is no in-tree consumer of the cdylib today, so
# unconditionally producing it was dead artifact.
crate-type = ["rlib"]

[[bin]]
name = "sce-codegen"
path = "src/bin/sce_codegen.rs"
required-features = ["cli"]

# End-to-end CLI contract test. Depends on the sce-codegen binary being
# built, which requires the `cli` feature. Declaring the dependency
# explicitly here ensures `cargo test` (with --features cli) builds
# both the test and the binary; running tests without the feature
# silently skips this target rather than dangling with a missing
# CARGO_BIN_EXE_sce-codegen env var.
[[test]]
name = "error_format_json"
path = "tests/error_format_json.rs"
required-features = ["cli"]

# End-to-end CLI contract test for the mesh pipeline (--deploy). Shares
# the binary target of `error_format_json` and the same `cli` feature
# gate so mesh codegen errors get the same NDJSON wire-format coverage
# the forge / CLI tests already enforce. Listed separately so `cargo
# test mesh_error` can run only the mesh integration path.
[[test]]
name = "mesh_error_format_json"
path = "tests/mesh_error_format_json.rs"
required-features = ["cli"]

# End-to-end CLI contract test for `sce-codegen orchestrate --deploy`
# (C13 orchestrator wiring → CLI surface). Same `cli` feature gate as
# the other binary-driven tests so the test target depends on the
# `CARGO_BIN_EXE_sce-codegen` env var being populated.
[[test]]
name = "cli_orchestrate_deploy"
path = "tests/cli_orchestrate_deploy.rs"
required-features = ["cli"]

# Structural smoke validator for all four codegen backends. Depends on
# the `sce-codegen` binary, hence the `cli` gate shared with the other
# end-to-end tests. See `tests/codegen_smoke.rs` for the rationale
# (template brace-imbalance regression guard, not behavioural coverage).
[[test]]
name = "codegen_smoke"
path = "tests/codegen_smoke.rs"
required-features = ["cli"]

# Per-backend Enum codegen smoke gate.
# Generates each positive Enum fixture on all 6 backends and feeds the
# output to a per-backend syntax checker (g++, syn::parse_file, gofmt,
# kotlinc, py_compile, clang). Same `cli`-feature gate as
# `codegen_smoke` since it shells out to the `sce-codegen` binary.
[[test]]
name = "forge_codegen_enum_smoke"
path = "tests/forge_codegen_enum_smoke.rs"
required-features = ["cli"]

# Per-backend EventSchema codegen
# smoke gate. Generates each standalone EventSchema fixture on all 6
# backends (cross-doc enum-import fixtures are exercised by the
# integration-test layer) and feeds the output to the same per-backend
# syntax checkers as `forge_codegen_enum_smoke`. Cli-feature gate
# mirrors that test since the harness shells out to `sce-codegen`.
[[test]]
name = "forge_codegen_event_schema_smoke"
path = "tests/forge_codegen_event_schema_smoke.rs"
required-features = ["cli"]

# Cross-backend gate for a
# `bytes`-field EventSchema transition guard: 6-backend byte-equality
# form assertions plus a real C++ compile+run (match/non-match) and a
# C11 freestanding compile of the bounded-buffer + memcmp lowering.
# Cli-feature gate mirrors the other codegen smoke tests since the
# harness shells out to `sce-codegen`.
[[test]]
name = "event_schema_bytes_guard"
path = "tests/event_schema_bytes_guard.rs"
required-features = ["cli"]

# `sce:req` / `sce:unresolved`
# annotation comment emission across all six codegen backends. Pair
# with `codegen_smoke` (compile gate on annotated output) so both
# emission shape and toolchain acceptance stay covered.
[[test]]
name = "sce_annotation_emission"
path = "tests/sce_annotation_emission.rs"
required-features = ["cli"]

# Integration test for spec §6.2.6 generated-source drift detection
# (B9 atomic 2026-05-14). Depends on `sce-codegen verify` subcommand,
# hence the shared `cli` feature gate. Round-trips header inject +
# verify CLI; drift simulation by tampering the input SCXML.
[[test]]
name = "b9_drift_detection"
path = "tests/b9_drift_detection.rs"
required-features = ["cli"]

# SCE Protocol-Synthesis RFC §5.O — per-backend SCE-MAP marker
# presence assertion. Drives `sce-codegen generate -l <backend>`
# against a minimal SCXML fixture and asserts the rendered output
# carries the spec marker (`#![doc] + //` for Rust, comment-form for
# the others at module scope) so a template edit that drops the
# macro import surfaces immediately rather than silently regressing.
[[test]]
name = "sourcemap_module_markers"
path = "tests/sourcemap_module_markers.rs"
required-features = ["cli"]

# SCE Protocol-Synthesis RFC §5.O — per-function SCE-MAP marker
# presence. Extends the module-level coverage to the per-
# function emission contract and the forge per-kind body axis.
[[test]]
name = "sourcemap_function_markers"
path = "tests/sourcemap_function_markers.rs"
required-features = ["cli"]

# SCE Protocol-Synthesis RFC §5.O — dual-emit preservation
# guard (OQ-W16 (b)). Confirms BOTH `#[doc = "SCE-MAP: ..."]` and `// SCE-MAP: ...`
# forms reach the generated Rust source across the std + no_std
# template paths. A template edit that drops one form regresses here
# rather than silently breaking the line-comment fallback that exists
# for future rustdoc strip scenarios.
[[test]]
name = "no_std_doc_preservation"
path = "tests/no_std_doc_preservation.rs"
required-features = ["cli"]

# SCE Protocol-Synthesis RFC §5.O — full sourcemap + symbol mangling
# + addr2sce contract test. Asserts (i) sourcemap JSON shape, (ii)
# byte-identity across backends, (iii) source_hash byte-equal to drift
# header, (iv) symbol-mangling round-trip, (v) each new diagnostic
# fires on its synthetic offender, (vi) addr2sce resolves a known
# symbol → SCXML coordinates.
[[test]]
name = "sourcemap_addr2sce"
path = "tests/sourcemap_addr2sce.rs"
required-features = ["cli"]

# CLI meta + workspace-root resolution regression. Pins --version
# output, --help freshness (no stale "M2+" c11 line), and the four-
# layer workspace-root resolution chain that DriftContext relies on
# for §6.2.6 template-hash embedding. Surfaced from a vendored-binary
# zero-hash regression that the legacy
# walk-up-from-cwd resolver triggered silently.
[[test]]
name = "cli_meta_and_workspace_root"
path = "tests/cli_meta_and_workspace_root.rs"
required-features = ["cli"]



# Forge AST export wire-format drift guard. Reads the checked-in
# `apis/forge-ast.v1.schema.json` and round-trips every emittable
# kind through `forge::ast_export::write_envelope`, validating each
# fixture's output against the schema with the `jsonschema` crate.
# Also drives `sce-codegen orchestrate --emit-ast-dir` end-to-end,
# which is why this target needs the `cli` feature (the binary
# itself is feature-gated). Any rename / removal of a `ForgeKind`
# variant, drop of an envelope field, or shape regression that
# breaks roundtrip surfaces here before consumers (sce-db-gen,
# sce-eventstore-adapter, etc.) hit it.
[[test]]
name = "forge_ast_export"
path = "tests/forge_ast_export.rs"
required-features = ["cli"]

[lints]
workspace = true
