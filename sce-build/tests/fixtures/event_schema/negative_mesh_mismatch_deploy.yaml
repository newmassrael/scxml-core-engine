# deploy.yaml. Sender machine `alpha` imports schema; receiver
# `beta` does not. Mesh validator must emit
# `mesh/event-schema-mismatch` with reason=SenderOnly when the
# cross-machine `<send target="#beta" event="job.completed">` is
# walked.
version: "1.0"
topology:
  ecu1:
    machines:
      alpha:
        source: negative_mesh_sender_only.scxml
      beta:
        source: negative_mesh_receiver_schemaless.scxml
