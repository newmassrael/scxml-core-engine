[package]
name = "sce-rust-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SCXML Core Engine — Rust runtime (policy trait, Engine<P>, helpers, IScriptEngine)"

[features]
# Default: Lua 5.4 via sce-rust-lua (matches C++ SCE_SCRIPT_ENGINE=lua default)
default = ["script-engine-lua", "http-send"]

# Script engine selection — mutually exclusive, exactly one active
# Matches C++ ScriptEngineProvider compile-time selection
script-engine-lua = []
script-engine-quickjs = []
no-script = []

# HTTP send callback wiring (W3C SCXML C.2 BasicHTTPEventProcessor)
http-send = []

# Deterministic fake-clock scheduler for tests (swaps PullScheduler impl)
test-clock = []

# Watching-zenoh RFC §5.J.2: bare-metal MCU profile of the runtime.
# Selecting `no_std` declares `#![no_std]` at the crate root and
# pulls in `heapless` for fixed-capacity collections (§5.J.2 line
# 1989: zero `alloc` dependency). Mutually exclusive with
# `script-engine-lua`, `script-engine-quickjs`, and `http-send` —
# Lua/QuickJS and tokio/reqwest are all std-coupled, so the
# combinations would never link. The exclusivity is enforced at
# compile time via `compile_error!` in `lib.rs` so a misconfigured
# Cargo.toml fails loudly before consumers debug linker output.
#
# C3 Atomic B-β lands the feature flag, cfg-gates http/scripting,
# and the codegen-side rejection diagnostics. Atomic B-γ ports
# `engine.rs` and `helpers/` to `core::` + `heapless`; until B-γ
# lands `cargo build --no-default-features --features=no_std` is
# expected to fail with std-import errors in those modules. The
# Cargo feature ladder is in place so downstream consumers can pin
# the wire shape today and migrate incrementally.
no_std = ["dep:heapless"]

[dependencies]
log = { workspace = true }
# `thiserror` is consumed only inside `pub mod scripting` (gated to
# `cfg(not(feature = "no_std"))`). `default-features = false` drops the
# crate's `std` feature so a `--features=no_std --target=thumbv7em-none-eabihf`
# build does not pull `thiserror`'s `extern crate std` into the dependency
# tree — bare-metal MCU targets have no `std` to resolve. Declared directly
# (not via `workspace.dependencies`) because the workspace dep declares
# the crate without an inline `default-features` toggle and a local
# `default-features = false` override on a workspace dep is silently
# ignored by Cargo (`workspace = true` requires the workspace declaration
# to opt out of defaults). The version string mirrors workspace policy.
thiserror = { version = "2.0", default-features = false }
# Fixed-capacity collections for the `no_std` feature variant.
# Optional + gated by `no_std` so std builds never link it.
heapless = { workspace = true, optional = true }
# Portable 64-bit atomics for MCU targets without native u64 atomic
# instructions (Cortex-M4 `thumbv7em-none-eabihf`). On host targets this
# crate re-exports the native `core::sync::atomic` types (zero overhead);
# on MCU targets it falls back to lock-based emulation. Standard
# embedded-Rust pattern — used by `embassy`, `defmt`, etc.
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }

[dev-dependencies]
# Env-based log output during tests
env_logger = "0.11"

[lints]
workspace = true
