[package]
name = "sce-forge-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Header-only-equivalent algorithm and HAL library for SCE Forge generated code (filter, interpolation, timer, observer kinds). See SCE_FORGE.md Section 2.1."
build = "build.rs"

[lib]
name = "sce_forge_runtime"
path = "src/lib.rs"

[features]
# The crate's baseline contract is pure `no_std + no alloc`: only the
# allocator-free algorithm modules (filter, interpolation, lookup, observer,
# timer) are compiled by default. This keeps the default target audience —
# embedded ECUs without a heap — honest.
default = []
# Compile the procedure module (ProcedurePolicy, ProcedureServiceRequest,
# ProcedureRunResult, run_procedure). Requires a heap allocator because
# procedures carry owned strings, byte payloads, and a BTreeMap of donedata.
# Consumers running on std or no_std+alloc targets opt in explicitly.
alloc = []

# Cross-language numerical conformance harness. build.rs invokes
# sce_build::compile_forge_with_imports() at build time to generate
# Rust fixtures into OUT_DIR from the SCXML sources in tests/forge/resources.
# The test binary then includes those OUT_DIR files and runs them against
# tests/forge/conformance/numerical_reference.json. Single source of truth =
# the SCXML sources themselves; no committed Rust goldens are consumed.
[build-dependencies]
sce-build = { path = "../../sce-build" }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "numerical_conformance"
path = "tests/numerical_conformance.rs"
# The conformance harness compiles every fixture in the catalog, including
# procedure kind fixtures that transitively require the procedure module.
# Without the `alloc` feature those fixtures cannot compile, so the test
# target is gated — run with `cargo test -p sce-forge-runtime --features alloc`
# (or `--all-features`) to exercise the full oracle.
required-features = ["alloc"]

[lints]
workspace = true
