# What this repository needs from a build machine, and what "verified"
# means for it. Machine names live in `~/.claude/remote-build/hosts.toml`,
# never here — see the remote-build skill, rule 11.
#
# The verify set is a decision, not something to detect: this tree carries
# cargo, cmake and gradle side by side, so any auto-detection picks one of
# three and calls it the answer. Named here: the Rust workspace and the C++
# ctest suite, which are the two heaviest lanes.
#
# ⚠ THIS COMMENT USED TO CLAIM `go` WAS ABSENT FROM THE BUILD MACHINE, and
# that the Go, Python and Kotlin lanes therefore had to stay local. Measured
# 2026-08-24 across all three registered hosts: every one carries go 1.22,
# openjdk 21, python3 3.12 and pytest. The claim had been false for long
# enough that nobody knew when it stopped being true — which is the trouble
# with a comment that states a fact about ANOTHER machine. A statement like
# that goes stale in silence, reads exactly like a true one, and sent every
# Go/Python/Kotlin gate to this host for no reason.
#
# So the rule this file follows now: state what THIS repository needs, in
# `needs`, where bx checks it against the machine and excludes a host that
# cannot answer. Do not describe the machines in prose.

# `.git` and the four submodule worktrees travel too. Sending only
# `git ls-files` output would deliver empty submodule directories, and the
# C++ configure dies on `third_party/quickjs does not contain a
# CMakeLists.txt` — a transfer failure that reads as a build failure.
send    = "tracked+submodules"

# `target` is a symlink into ~/.buildcache and would arrive broken.
# `build` and `embed` are generated locally and are rebuilt there anyway.
exclude = ["/target", "/build", "/embed"]

# THE COMMANDS OF THIS REPOSITORY WHOSE POINT IS TO CHANGE THIS TREE.
#
# bx sends anything it does not recognise, and that is the right default —
# almost everything it is handed is a build or a suite. Its built-in
# vocabulary knows the TOOLS that write whoever runs them (git, `cargo fmt`,
# `cargo fix`, the mnemosyne mutate API) but it cannot know a repository's
# own scripts. Undeclared, they are sent, they change the far side's throwaway
# copy, and they exit 0: THE FAILURE IS SILENT AND WEARS A GREEN EXIT CODE.
# Mnemosyne lost a formatting run to exactly this shape.
#
# Matched as substrings against the flattened command line, so the prefix
# `scripts/regen_` covers all 147 per-stem scripts and the aggregate at once —
# a list of names would go stale the next time a fixture is added.
#
# What is deliberately NOT here, and why, because an absence in a list like
# this is otherwise indistinguishable from an oversight:
#
#   * `scripts/gate mutation-rounds` — it drives `scripts/mutate`, but a ROUND
#     is edit → build → run → restore, and what it produces is a verdict, not
#     a changed tree. Running it on the far side answers the same question.
#   * `./gradlew … test` — it does write, releasing the `generated-at` pin on
#     the committed Kotlin trees. That is an unwanted side effect rather than
#     the point, so sending it is BETTER: the local tree stays clean.
#   * `scripts/gates/w3c-python.sh` — it regenerates Python modules that are
#     gitignored. Nothing local reads them except a local pytest run, and the
#     gate runs its own.
writes = ["scripts/regen_", "scripts/mutate"]

# `node` is not optional: every BasicHTTP fixture in the Rust workspace
# posts to localhost:8080, and without the echo server they route to their
# `<transition event="*"/>` fail branch — 25 failures that say nothing about
# the backend. The gates start it for the same reason.
#
# `mnemosyne-cli` is listed for a reason worth stating: without it the
# citation gate cannot run, and its "cannot run" is spelled as a plain
# failure — so `gate_registry_contract` reports "the staged gate rejected a
# real citation" on a machine that simply lacks the binary. Measured: two
# tests red for that reason and no other. Listing it here keeps such a
# machine out of the candidate set instead of turning it into a red that
# looks like a code defect.
#
# `git` is listed because `bx` runs it on the far side to PROVE the two trees
# are equal (`git rev-parse HEAD` + `git status --porcelain`) before it starts
# any work. Without it that probe returns nothing and the run dies with "the
# remote tree is at <nothing>" — a sentence about tree state, on a machine
# whose real problem is a missing binary. The same misattribution this
# repository's own gates were fixed for: a tool that cannot run must say so
# instead of blaming what it was pointed at. Invisible on a machine that
# happens to have git, which is why it went undeclared.
# `go`, `java`, `python3` and `wasm-pack` joined on 2026-08-24, when the
# gates stopped being a local-only set. `scripts/gate w3c-go`,
# `w3c-python`, `w3c-kotlin`, `forge-go`, `forge-python` and
# `visualizer-wasm` each name their toolchain and fail loudly without it, so
# a host that lacks one produces a red that reads like a code defect — the
# same misattribution `mnemosyne-cli` is listed for above. Listing them keeps
# such a host out of the candidate set instead.
#
# `gradle` is deliberately NOT here: the Kotlin lanes run `./gradlew`, which
# fetches its own distribution, so the machine needs a JDK and nothing more.
#
# ⚠ ONE LINE. bx reads this key with a single `sed` that anchors on `[` and
# `]` in the same line, unlike `writes`/`packages` which are read across
# lines — so a wrapped list parses as EMPTY and every host becomes eligible
# for everything. Measured 2026-08-24, thirty seconds after wrapping it:
# `--explain-declaration` printed `decl needs` with nothing after it.
needs = ["cargo", "cmake", "ninja", "g++", "node", "git", "mnemosyne-cli", "go", "java", "python3", "wasm-pack"]

# The C++ tree is the constraint: a debug build of this repository has
# measured 4.2 GB of debug info in its executables alone.
min_ram_gb  = 16
min_free_gb = 60

[commands]
# `--features cli` is not optional here: `cargo test --workspace` silently
# skips every cli-gated target, so a workspace run without it reports green
# on the CLI surface it never compiled.
#
# `-DCMAKE_BUILD_TYPE=RelWithDebInfo` is not a preference either: three gates
# read the cache and refuse a tree configured any other way, because a
# differently configured binary is not the one CI judges. A remote tree
# configured without it produces a build the local gates then reject.
#
# The generator is built first because CMake *configure* looks for it —
# `cmake/SCEFindCodegen.cmake` fails the configure outright when it is
# absent, so the obvious order (configure, then build everything) does not
# reach a single compile on a cold tree.
build  = "cargo build --bin sce-codegen --features cli -p sce-build && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build && cargo test --workspace --features cli --no-run"

# The echo server is started here rather than assumed: a bare workspace run
# reports failures that look like backend defects and are not.
#
# The order is not cosmetic. The C++ suite brings up its OWN listener on
# 8080, so a server started before ctest makes that bind fail; the Rust
# workspace has no such fixture and needs one already listening. So: ctest
# with the port free, then the server, then cargo. Both statuses are OR'd so
# a red ctest cannot be hidden by a green cargo run.
verify = "ctest --test-dir build --output-on-failure; c=$?; node tests/w3c/standalone_http_server.js 8080 /test & srv=$!; sleep 1; cargo test --workspace --features cli --no-fail-fast; r=$?; kill $srv 2>/dev/null; exit $(( c | r ))"

# A hint for the run-time parallelism calculation, not a limit. Rust test
# processes here are small; the C++ link steps are what peak.
peak_gb_per_task = 4
