name: Mutation Rounds

# Does a mutation case still turn its suite red?
#
# `mutation-cases` (tree-hygiene.yml) asks the half that costs nothing: does
# every case still find an unambiguous anchor. It says in its own header that
# it answers no more than that — it does not build and does not run a test, so
# it reports "applies" and never "CAUGHT". Two ways a case stops being evidence
# need a build, and this is where they get one:
#
#   * the mutated tree no longer COMPILES, so the round is INCONCLUSIVE and the
#     case proves nothing while reading as present; and
#   * the suite no longer turns red, so the mutation SURVIVES and the clause it
#     defends is defended by nothing.
#
# ## Why here and not in the push hook
#
# It was in the hook first, and the number is why it moved. Measured on the
# first push whose change set reached its casefiles: 877s, eight rounds,
# against 4s on a push that reached none. A push whose length swings by a
# quarter of an hour on what the author happened to edit is one that gets
# bypassed, and a gate somebody turns off protects nothing. `ci_only` in
# `gate_registry.py` records the trade: a red arrives one round later, and the
# push stays a length somebody keeps paying.
#
# ## No `paths:` filter
#
# Same arrangement as tree-hygiene.yml, same reason in a different alphabet.
# What decides whether a round is owed is the union of every
# `mutation_targets` declaration inside `sce-build/tests/mutations/*.cases` —
# today that spans `sce/`, `sce-build/`, `backends/`, generator templates, a
# CMakeLists, two workflows and two gate scripts. A filter restating that union
# would be a second copy of a declaration the casefiles already carry, stale
# the first time a case names a new file. So the workflow starts on every push
# and the gate narrows inside itself.
#
# That narrowing is what keeps this affordable: the job below asks for the
# selection before it installs anything, and most pushes select nothing and
# stop there.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # A dispatch can name the casefiles to run, because otherwise the only way
  # to exercise a given round in CI is to wait for a push that happens to
  # touch its declared target — and waiting is what let the ctest path sit
  # unrun for 34 commits with two defects in it. `SCE_MUTATION_ROUNDS` is the
  # gate's own channel for a named subset, so this hands the dispatch to the
  # gate rather than adding a second way to select.
  #
  # Empty means what a dispatch has always meant here: no range resolves, so
  # the corpus runs whole.
  workflow_dispatch:
    inputs:
      casefiles:
        description: >-
          Casefiles to run, comma-separated (or `all`). Empty runs the corpus.
        required: false
        default: ''

# A dispatch gets a group of its own; pushes keep sharing one, so a newer push
# still cancels the round an older one started.
#
# Measured 2026-08-17, within minutes of the dispatch input being added: asking
# for a round over one casefile CANCELLED the push run for the same ref
# (32034288611), because both landed in `<workflow>-refs/heads/main`. The
# verdict CI reports on is the push's, so a dispatch was silently voiding it —
# the opposite of what asking for an extra round is for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: true

# ## One job per casefile, and why the lane is shaped that way
#
# A round is a rebuild and a test run per case, and the corpus is 247 cases
# across 39 casefiles. Run one after another in a single job, the arithmetic
# is what decides whether this lane ever answers: measured from the run of
# 2026-08-17T20:24Z, six selected casefiles took 5,826s — 280s, 623s, 309s,
# 1,875s, 412s and 2,327s — for 1h37m of wall clock, and a push that selects
# widely takes longer still (4h30m on 2026-08-17T15:40Z).
#
# Pushes to this repository arrive closer together than that. The concurrency
# group above cancels an in-progress run when a newer push starts, which is
# right — the verdict that matters is the newest commit's — but it means a
# lane slower than the push interval never reaches one at all. Measured
# 2026-08-18: the three most recent COMPLETED runs were `cancelled`,
# `cancelled` and `cancelled`, at 1h41m, 1h21m and 3h31m of work discarded,
# and a fourth push cancelled the third. Three consecutive commits went
# without a mutation verdict, and nothing said so, because a cancelled lane is
# not a red one.
#
# So the casefiles run as a matrix rather than a loop. Wall clock becomes the
# slowest single casefile instead of their sum — 39m rather than 1h37m on the
# measured run — which is inside the interval the lane has to answer within.
#
# What it costs, said plainly rather than left to be discovered: a setup per
# casefile instead of per push, and for a ctest casefile that setup includes
# the CMake configure-and-build. Two ctest casefiles in one selection now pay
# for two trees where they used to share one. The per-case rebuilds, which are
# the bulk of the time either way, are unchanged. The cache below is keyed so
# the second and later runs restore rather than rebuild, and the trade the
# whole change makes is a lane that answers for one that did not.
#
# `fail-fast: false`, for the reason the gate itself runs every round before
# reporting: a lane that stops at the first failing casefile has not measured
# the rest, and the author would fix one and rediscover the next on the
# following push.
jobs:
  select:
    name: Which casefiles does this change reach
    runs-on: ubuntu-latest

    outputs:
      count: ${{ steps.select.outputs.count }}
      # One entry per selected casefile, carrying the runner column the gate
      # already computes, so the rounds below decide whether they need a CMake
      # tree from the same answer this job printed rather than re-deriving it.
      # Re-deriving it in a second place is precisely the defect this lane
      # spent 34 commits on.
      matrix: ${{ steps.select.outputs.matrix }}

    steps:
    # `fetch-depth: 0` because the change set is a range: the gate is handed
    # the paths this push actually changed, and a shallow clone cannot name
    # the commit to diff against.
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    # The range, written to the file the gate reads. `SCE_GATE_CHANGED_FILE`
    # is the same channel `scripts/gate --changed-from` fills from the push
    # hook, so CI and a developer's machine hand the gate the same kind of
    # answer.
    #
    # A push event carries `before`, a pull_request carries its base. Neither
    # is present for `workflow_dispatch`, and there the honest range is the
    # whole corpus — which is what the gate does when handed no file, and the
    # reason that mode exists.
    - name: Resolve the change set
      id: changed
      run: |
        set -euo pipefail
        base=""
        case "${{ github.event_name }}" in
          push)         base='${{ github.event.before }}' ;;
          pull_request) base='${{ github.event.pull_request.base.sha }}' ;;
        esac
        # A new branch's `before` is all-zeroes, and a force-push can name a
        # commit this clone does not have. Both mean "no range resolved", and
        # the gate answers that by running the corpus rather than nothing.
        if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
           && git cat-file -e "$base^{commit}" 2>/dev/null; then
          git diff --name-only "$base" "${{ github.sha }}" > changed.txt
          echo "changed=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          echo "file=changed.txt" >> "$GITHUB_OUTPUT"
        else
          echo "no resolvable range — the gate will run the whole corpus"
          echo "changed=-1" >> "$GITHUB_OUTPUT"
          echo "file=" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    # Before anything is installed or built: which casefiles does this change
    # reach, and do any of them select through ctest? A push that reaches none
    # ends here, which is most of them.
    - name: Which casefiles does this change reach
      id: select
      env:
        SCE_GATE_CHANGED_FILE: ${{ steps.changed.outputs.file }}
        # The dispatch's subset, read by the gate ahead of any change set. In
        # the step's `env:` rather than its body: a `${{ }}` inside the body is
        # a string bash never expands, and the test that executes this step
        # would then be running something other than what CI runs.
        SCE_MUTATION_ROUNDS: ${{ inputs.casefiles }}
      run: |
        set -euo pipefail
        # Through the runner, like the run step below: one spelling for the
        # selection and for the rounds means the probe cannot answer for a
        # different set than the one that executes.
        #
        # That includes the runner column. It used to be re-derived here, once
        # per selected casefile, as `scripts/mutate --declares "$f" | grep -q`
        # — and under `set -o pipefail` a pipeline reports its LAST failing
        # member: `grep -q` leaves at the first match, the writer takes
        # SIGPIPE, and the status is 141. So this step answered "no CMake tree
        # needed" on every push that needed one (20/20 measured, not a race),
        # skipped the configure step below, and the rounds refused for the
        # want of a tree this step had just declined to build. Five casefiles
        # — ai_loop_history_cpp, c11_datamodel_reader and the three parallel_*
        # — went 34 commits without one CI round because of it.
        #
        # The gate already computes the runner in order to refuse, so it says
        # it: each line is `casefile<TAB>runner`.
        #
        # RUNNER_TEMP rather than the workspace, so this step writes nothing
        # into the tree. That is what lets a test execute this script against
        # a real checkout instead of asserting over a copy of it —
        # `mutation_rounds_selection.rs` does exactly that, which is the only
        # shape of test the defect above could not have survived.
        selected="${RUNNER_TEMP:?}/selected.txt"
        SCE_MUTATION_ROUNDS_DRY_RUN=1 scripts/gate mutation-rounds > "$selected"
        cat "$selected"
        echo "count=$(grep -c . "$selected" || true)" >> "$GITHUB_OUTPUT"
        # The same two columns, as the matrix the rounds job expands. Built
        # here rather than in a second scan of the corpus, so a casefile can
        # only be run by a job the selection above actually named.
        #
        # `include:` takes an array of objects and gives one job per entry,
        # which is why the runner travels with the casefile instead of being
        # a lane-wide yes/no: a cargo casefile in a selection that also holds
        # a ctest one would otherwise pay for a CMake tree it never opens.
        matrix="$(awk -F'\t' '
          BEGIN { printf "{\"include\":[" }
          NF >= 2 { printf "%s{\"casefile\":\"%s\",\"runner\":\"%s\"}", sep, $1, $2; sep = "," }
          END { printf "]}\n" }
        ' "$selected")"
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        echo "matrix: $matrix"

    - name: Nothing to run
      if: steps.select.outputs.count == '0'
      run: echo "No declared mutation target changed; mutation-cases checked every anchor."

  rounds:
    name: "round: ${{ matrix.casefile }}"
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest

    # Declared rather than inherited. GitHub's default is 360 minutes and the
    # longest casefile measured 4h16m — `mutation_rounds_selection`, whose 21
    # cases the matrix above cannot split because they live in ONE file. That
    # is 76% of a ceiling nobody wrote down, and a job that crosses it is
    # `cancelled`, which this workflow's own header records as the failure mode
    # that let three consecutive commits go without a verdict: a cancelled lane
    # is not a red one.
    #
    # 330 makes the margin explicit and puts the failure 30 minutes before the
    # platform's, so it arrives as this lane's timeout with this lane's name on
    # it. It is not headroom — `mutation_corpus_fits_its_lane` is what keeps
    # the largest casefile from growing into it, and the fix when it does is to
    # split that file by concern so the matrix can carry the halves apart.
    timeout-minutes: 330

    strategy:
      # Every casefile is measured, not just the ones before the first
      # failure. The gate makes the same choice inside a job, and for the same
      # reason: a lane that stops early has not measured the rest.
      fail-fast: false
      # The whole matrix from the selection, in the shape the runner documents
      # for a generated one: an object carrying `include`, one entry per job.
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    # Only what this casefile actually needs. A cargo round wants no CMake,
    # and the runner column travelled here from the selection so a cargo
    # casefile in a mixed selection does not pay for a tree it never opens.
    - name: Install Dependencies
      if: matrix.runner == 'ctest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake g++ meson ninja-build lld ccache \
          pkg-config libxml2-dev libspdlog-dev libfmt-dev libboost-dev

    - name: Install libxml2 for sce-build
      if: matrix.runner != 'ctest'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libxml2-dev

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-mutation-rounds-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-mutation-rounds-

    # The build type is in the key, not only in the recipe. A cache entry is
    # restored by prefix, and the run that first reached this path left a
    # `CMakeCache.txt` recording `CMAKE_BUILD_TYPE=Debug` — the build type the
    # step used to name. Restoring that into a job that now configures
    # RelWithDebInfo does not reconfigure it: `sce_main_build_dir` refuses a
    # tree whose recorded build type is not the one the gates judge, so the
    # lane would go red on a cache rather than on anything in the tree.
    - name: Cache CMake Build
      if: matrix.runner == 'ctest'
      uses: actions/cache@v5
      with:
        path: |
          build/CMakeCache.txt
          build/CMakeFiles
          build/_deps
        key: ${{ runner.os }}-cmake-mutation-rounds-relwithdebinfo-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-mutation-rounds-relwithdebinfo-

    # A ctest round selects from a configured tree; without one the gate
    # refuses (exit 3) rather than reporting green over what it cannot run.
    # This is the step that makes sure it never has to.
    #
    # Delegated for the same reason the selection above is: this step used to
    # spell the recipe out — `cmake -S . -B build -G Ninja
    # -DCMAKE_BUILD_TYPE=Debug` — and it was wrong twice over. It configured
    # without building `sce-codegen`, which no runner can do (the configure
    # resolves the generator and stops with a FATAL_ERROR), and it named a
    # build type the gates refuse, so the half-hour it spent would have
    # produced a tree the rounds then declined to judge. Both survived because
    # nothing ran them: this path was first reached on 2026-08-17, 34 commits
    # after the ctest casefiles were written.
    #
    # `scripts/prepare_ctest_tree.sh` is the one recipe, and the gate's refusal
    # names it too, so a developer configuring by hand gets the tree CI gets.
    - name: Configure and build the CMake tree
      if: matrix.runner == 'ctest'
      run: scripts/prepare_ctest_tree.sh

    # Delegated rather than restated: the per-round verdict and the floors all
    # live in the gate, so this lane and a developer running
    # `scripts/gate mutation-rounds` by hand judge a casefile by one set of
    # rules.
    #
    # The casefile comes from the matrix and nowhere else. `SCE_MUTATION_ROUNDS`
    # is the gate's own channel for a named subset, so the job runs exactly the
    # casefile the selection named — there is no change set in this job to
    # re-derive one from, and that is deliberate: two derivations are how this
    # lane came to answer for a different set than it had selected.
    - name: Run the round
      env:
        SCE_MUTATION_ROUNDS: ${{ matrix.casefile }}
      run: scripts/gate mutation-rounds
