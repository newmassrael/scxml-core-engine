name: Mutation Rounds

# Does a mutation case still turn its suite red?
#
# `mutation-cases` (tree-hygiene.yml) asks the half that costs nothing: does
# every case still find an unambiguous anchor. It says in its own header that
# it answers no more than that — it does not build and does not run a test, so
# it reports "applies" and never "CAUGHT". Two ways a case stops being evidence
# need a build, and this is where they get one:
#
#   * the mutated tree no longer COMPILES, so the round is INCONCLUSIVE and the
#     case proves nothing while reading as present; and
#   * the suite no longer turns red, so the mutation SURVIVES and the clause it
#     defends is defended by nothing.
#
# ## Why here and not in the push hook
#
# It was in the hook first, and the number is why it moved. Measured on the
# first push whose change set reached its casefiles: 877s, eight rounds,
# against 4s on a push that reached none. A push whose length swings by a
# quarter of an hour on what the author happened to edit is one that gets
# bypassed, and a gate somebody turns off protects nothing. `ci_only` in
# `gate_registry.py` records the trade: a red arrives one round later, and the
# push stays a length somebody keeps paying.
#
# ## No `paths:` filter
#
# Same arrangement as tree-hygiene.yml, same reason in a different alphabet.
# What decides whether a round is owed is the union of every
# `mutation_targets` declaration inside `sce-build/tests/mutations/*.cases` —
# today that spans `sce/`, `sce-build/`, `backends/`, generator templates, a
# CMakeLists, two workflows and two gate scripts. A filter restating that union
# would be a second copy of a declaration the casefiles already carry, stale
# the first time a case names a new file. So the workflow starts on every push
# and the gate narrows inside itself.
#
# That narrowing is what keeps this affordable: the job below asks for the
# selection before it installs anything, and most pushes select nothing and
# stop there.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # ## Why a clock, and not only a change set
  #
  # Everything above selects by CHANGE: the union of `mutation_targets` the
  # push touched. That is the right economics for a push and the wrong answer
  # for the corpus, because it means a casefile whose targets go quiet is
  # never run again — and a round that never runs is not a green one, it is
  # an absent verdict that reads as green.
  #
  # Measured 2026-08-24, aggregating this workflow's last 40 runs job by job:
  # of 84 casefiles only 48 had reached a `success` in that window, 16 had not
  # been selected once, and NINE carried a `failure` with no later success —
  # one of them (`host_processor_dispatch_c11`) a real defect that had been
  # sitting unrepaired since 2026-08-23 behind three `cancelled` runs. Nothing
  # was broken; nobody was asked.
  #
  # `mutation-cases` does sweep the whole corpus on every push, and it is not
  # a substitute: it runs `scripts/mutate --check`, which asks only whether
  # each case still finds its anchor. Measured the same day, it answered
  # "8/8 case(s) still apply" for a casefile whose mutations did not compile.
  # Anchors are cheap and say nothing about whether a mutation is still
  # evidence.
  #
  # Weekly rather than nightly because the corpus is the expensive answer and
  # the debt it catches accrues in weeks, not hours; Sunday 03:17 UTC to sit
  # away from the weekday push traffic this lane shares runners with. The
  # minute is deliberate — GitHub schedules cluster on the hour.
  schedule:
    - cron: '17 3 * * 0'
  # A dispatch can name the casefiles to run, because otherwise the only way
  # to exercise a given round in CI is to wait for a push that happens to
  # touch its declared target — and waiting is what let the ctest path sit
  # unrun for 34 commits with two defects in it. `SCE_MUTATION_ROUNDS` is the
  # gate's own channel for a named subset, so this hands the dispatch to the
  # gate rather than adding a second way to select.
  #
  # Empty means the whole corpus — and it is routed there BY NAME below, not
  # left to fall through. This comment used to say "no range resolves, so the
  # corpus runs whole", and that was measured false on 2026-08-24: an empty
  # input reaches the gate as an empty `SCE_MUTATION_ROUNDS`, which is not a
  # request for the corpus but the absence of one, and the gate answers it by
  # deriving a range from the tracking ref — `0 of 84` at the tip of `main`.
  # The promise in the input's own description was therefore a lie for as long
  # as it had been written down, and a dispatch asking for everything quietly
  # measured nothing.
  workflow_dispatch:
    inputs:
      casefiles:
        description: >-
          Casefiles to run, comma-separated (or `all`). Empty runs the corpus.
        required: false
        default: ''

# Every push and every dispatch gets a group of its own; a pull request keeps
# sharing one per ref.
#
# `cancel-in-progress` is the right setting for a lane whose answer is about a
# BRANCH — a newer commit really does supersede an older one's build — and the
# wrong one for a lane whose answer is about a COMMIT. This lane's is:
# selection is by change set, so a round judges the casefiles that ONE push's
# targets selected, and nothing re-selects them afterwards unless a later push
# happens to touch the same declared targets. A cancellation here is therefore
# a verdict LOST, not deferred.
#
# Measured across this workflow's 40 runs from 2026-08-24T01:06 to
# 08-25T02:13: 25 never reached `success`, and 24 of those ended `cancelled` —
# the dominant way this lane failed to answer, ahead of the job timeout
# `mutation_corpus_fits_its_lane` guards against. The habit that grew around
# it — commit now, push later, if you need the verdict — is the shape of a
# defect being worked around rather than repaid.
#
# A pull request keeps the shared group deliberately: there a force-push
# destroys the very commit the run was judging, so superseding is correct.
#
# The dispatch key is the same property, repaid earlier for the same reason.
# Measured 2026-08-17, within minutes of the dispatch input being added:
# asking for a round over one casefile CANCELLED the push run for the same ref
# (32034288611), because both landed in `<workflow>-refs/heads/main`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || (github.event_name == 'workflow_dispatch' && github.run_id || github.event_name) }}
  cancel-in-progress: true

# ## One job per casefile, and why the lane is shaped that way
#
# A round is a rebuild and a test run per case, and the corpus is 247 cases
# across 39 casefiles. Run one after another in a single job, the arithmetic
# is what decides whether this lane ever answers: measured from the run of
# 2026-08-17T20:24Z, six selected casefiles took 5,826s — 280s, 623s, 309s,
# 1,875s, 412s and 2,327s — for 1h37m of wall clock, and a push that selects
# widely takes longer still (4h30m on 2026-08-17T15:40Z).
#
# Pushes to this repository arrive closer together than that, and the
# concurrency group above used to cancel an in-progress run when a newer push
# started. Measured 2026-08-18: the three most recent COMPLETED runs were
# `cancelled`, `cancelled` and `cancelled`, at 1h41m, 1h21m and 3h31m of work
# discarded, and a fourth push cancelled the third. Three consecutive commits
# went without a mutation verdict, and nothing said so, because a cancelled
# lane is not a red one. Keying a push run on `github.sha` is what ended that;
# the matrix below is what keeps a single run's wall clock inside the interval
# anyway, which is the half of the problem a concurrency key cannot touch.
#
# So the casefiles run as a matrix rather than a loop. Wall clock becomes the
# slowest single casefile instead of their sum — 39m rather than 1h37m on the
# measured run — which is inside the interval the lane has to answer within.
#
# What it costs, said plainly rather than left to be discovered: a setup per
# casefile instead of per push, and for a ctest casefile that setup includes
# the CMake configure-and-build. Two ctest casefiles in one selection now pay
# for two trees where they used to share one. The per-case rebuilds, which are
# the bulk of the time either way, are unchanged. The cache below is keyed so
# the second and later runs restore rather than rebuild, and the trade the
# whole change makes is a lane that answers for one that did not.
#
# `fail-fast: false`, for the reason the gate itself runs every round before
# reporting: a lane that stops at the first failing casefile has not measured
# the rest, and the author would fix one and rediscover the next on the
# following push.
jobs:
  select:
    name: Which casefiles does this change reach
    runs-on: ubuntu-latest

    outputs:
      count: ${{ steps.select.outputs.count }}
      # One entry per selected casefile, carrying the runner column the gate
      # already computes, so the rounds below decide whether they need a CMake
      # tree from the same answer this job printed rather than re-deriving it.
      # Re-deriving it in a second place is precisely the defect this lane
      # spent 34 commits on.
      matrix: ${{ steps.select.outputs.matrix }}

    steps:
    # `fetch-depth: 0` because the change set is a range: the gate is handed
    # the paths this push actually changed, and a shallow clone cannot name
    # the commit to diff against.
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    # The range, written to the file the gate reads. `SCE_GATE_CHANGED_FILE`
    # is the same channel `scripts/gate --changed-from` fills from the push
    # hook, so CI and a developer's machine hand the gate the same kind of
    # answer.
    #
    # A push event carries `before`, a pull_request carries its base. Neither
    # is present for `workflow_dispatch`, and there the honest range is the
    # whole corpus — which is what the gate does when handed no file, and the
    # reason that mode exists.
    - name: Resolve the change set
      id: changed
      run: |
        set -euo pipefail
        base=""
        case "${{ github.event_name }}" in
          push)         base='${{ github.event.before }}' ;;
          pull_request) base='${{ github.event.pull_request.base.sha }}' ;;
        esac
        # A new branch's `before` is all-zeroes, and a force-push can name a
        # commit this clone does not have. Both mean "no range resolved", and
        # the gate answers that by running the corpus rather than nothing.
        if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
           && git cat-file -e "$base^{commit}" 2>/dev/null; then
          git diff --name-only "$base" "${{ github.sha }}" > changed.txt
          echo "changed=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          echo "file=changed.txt" >> "$GITHUB_OUTPUT"
        else
          echo "no resolvable range — the gate will run the whole corpus"
          echo "changed=-1" >> "$GITHUB_OUTPUT"
          echo "file=" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    # Before anything is installed or built: which casefiles does this change
    # reach, and do any of them select through ctest? A push that reaches none
    # ends here, which is most of them.
    - name: Which casefiles does this change reach
      id: select
      env:
        SCE_GATE_CHANGED_FILE: ${{ steps.changed.outputs.file }}
        # The dispatch's subset, read by the gate ahead of any change set. In
        # the step's `env:` rather than its body: a `${{ }}` inside the body is
        # a string bash never expands, and the test that executes this step
        # would then be running something other than what CI runs.
        #
        # ⚠ The two events that mean "everything" say `all` EXPLICITLY, and the
        # reason is that the obvious shortcut is wrong. Neither `schedule` nor
        # `workflow_dispatch` is `push`, so the step above leaves `base` empty
        # and reports "no resolvable range" — from which it looks as though the
        # gate would fall through to the whole corpus on its own. It does not:
        # handed no change file, the gate derives a range from the tracking ref
        # instead, and at the tip of `main` that range is empty. Measured on
        # this repository, BOTH of those paths select `0 of 84 casefile(s)`. A
        # weekly lane that ran nothing and passed is precisely the absent
        # verdict the schedule exists to end, and a dispatch that ran nothing
        # broke the promise its own input description makes.
        #
        # Reading the expression: a push or a pull request gets `''` and is
        # selected by change set, as before. Otherwise a named subset wins, and
        # an empty one becomes `all`. `inputs` is null on a scheduled run, and
        # that is safe either way — `true && null` is falsy, so it falls to
        # `'all'` exactly as an empty string does.
        #
        # One line, deliberately: `step_env` in `mutation_rounds_selection.rs`
        # reads this mapping by splitting on the first `": "`, so a folded
        # scalar would hand the test `>-` and it would be asserting about
        # nothing.
        SCE_MUTATION_ROUNDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (inputs.casefiles != '' && inputs.casefiles || 'all') || '' }}
      run: |
        set -euo pipefail
        # Through the runner, like the run step below: one spelling for the
        # selection and for the rounds means the probe cannot answer for a
        # different set than the one that executes.
        #
        # That includes the runner column. It used to be re-derived here, once
        # per selected casefile, as `scripts/mutate --declares "$f" | grep -q`
        # — and under `set -o pipefail` a pipeline reports its LAST failing
        # member: `grep -q` leaves at the first match, the writer takes
        # SIGPIPE, and the status is 141. So this step answered "no CMake tree
        # needed" on every push that needed one (20/20 measured, not a race),
        # skipped the configure step below, and the rounds refused for the
        # want of a tree this step had just declined to build. Five casefiles
        # — ai_loop_history_cpp, c11_datamodel_reader and the three parallel_*
        # — went 34 commits without one CI round because of it.
        #
        # The gate already computes the runner in order to refuse, so it says
        # it: each line is `casefile<TAB>runner`.
        #
        # RUNNER_TEMP rather than the workspace, so this step writes nothing
        # into the tree. That is what lets a test execute this script against
        # a real checkout instead of asserting over a copy of it —
        # `mutation_rounds_selection.rs` does exactly that, which is the only
        # shape of test the defect above could not have survived.
        selected="${RUNNER_TEMP:?}/selected.txt"
        SCE_MUTATION_ROUNDS_DRY_RUN=1 scripts/gate mutation-rounds > "$selected"
        cat "$selected"
        echo "count=$(grep -c . "$selected" || true)" >> "$GITHUB_OUTPUT"
        # The same three columns, as the matrix the rounds job expands. Built
        # here rather than in a second scan of the corpus, so a casefile can
        # only be run by a job the selection above actually named.
        #
        # `include:` takes an array of objects and gives one job per entry,
        # which is why the runner travels with the casefile instead of being
        # a lane-wide yes/no: a cargo casefile in a selection that also holds
        # a ctest one would otherwise pay for a CMake tree it never opens.
        #
        # The third column is how many JOBS the casefile is worth, and it is
        # what stops a round ending with no verdict at all. A casefile used to
        # be one job, and a round is a rebuild and a test run PER CASE: on
        # dispatch 32803356117, EIGHT of twenty-four rounds ran to the
        # 330-minute ceiling below and were `cancelled` — 44 hours that said
        # nothing about any case. So a large casefile becomes several jobs,
        # each running `--shard I/N` over its own contiguous slice. The
        # arithmetic that picks N is `mutation_rounds_cases_per_job` in
        # `scripts/gates/mutation-rounds.sh`, in one place; this expands what
        # it printed and derives nothing of its own.
        matrix="$(awk -F'\t' '
          BEGIN { printf "{\"include\":[" }
          NF >= 3 {
            for (shard = 1; shard <= $3; shard++) {
              printf "%s{\"casefile\":\"%s\",\"runner\":\"%s\",\"shard\":\"%d/%d\"}", \
                sep, $1, $2, shard, $3
              sep = ","
            }
          }
          END { printf "]}\n" }
        ' "$selected")"
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        echo "matrix: $matrix"

    - name: Nothing to run
      if: steps.select.outputs.count == '0'
      run: echo "No declared mutation target changed; mutation-cases checked every anchor."

  rounds:
    name: "round: ${{ matrix.casefile }} ${{ matrix.shard }}"
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest

    # Declared rather than inherited. GitHub's default is 360 minutes, and a
    # job that crosses it is `cancelled` — which this workflow's own header
    # records as the failure mode that let three consecutive commits go without
    # a verdict: a cancelled lane is not a red one.
    #
    # 330 makes the margin explicit and puts the failure 30 minutes before the
    # platform's, so it arrives as this lane's timeout with this lane's name on
    # it. It is not headroom, and it is not what keeps rounds inside it: the
    # shard column in the matrix above is. Measured on dispatch 32803356117
    # with one job per CASEFILE, EIGHT of twenty-four rounds ran to this
    # ceiling and were cancelled, the largest holding 16 ctest cases. Sharded,
    # the same casefile is six jobs of three, and the arithmetic tying the
    # slice size to this number is checked by `mutation_corpus_fits_its_lane`
    # — which reads this value out of this file rather than restating it.
    #
    # ⚠ The remedy when rounds start reaching this again is to lower the
    # cases-per-job in `scripts/gates/mutation-rounds.sh`, not to raise this:
    # a bigger number here only moves the cancellation later and takes the
    # 30-minute margin with it.
    timeout-minutes: 330

    strategy:
      # Every casefile is measured, not just the ones before the first
      # failure. The gate makes the same choice inside a job, and for the same
      # reason: a lane that stops early has not measured the rest.
      fail-fast: false
      # The whole matrix from the selection, in the shape the runner documents
      # for a generated one: an object carrying `include`, one entry per job.
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
    # `fetch-depth: 0` because a case is only judged where its precondition
    # holds. `the_rewriter_is_retired_not_merely_second`'s pin case makes a
    # ledger row name a commit the repository does not carry, and the arm it
    # aims at classifies a SHALLOW clone rather than reading "cannot resolve"
    # as "not there" — so on a depth-1 checkout that arm steps aside and the
    # mutation reports SURVIVED. Measured 2026-08-29: 13/14 caught, and the
    # one that did not was this. The casefile's own comment says the case
    # "runs where clones are full"; this is what makes that true of the job
    # that judges it, rather than only of a developer's tree.
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    # Only what this casefile actually needs. A cargo round wants no CMake,
    # and the runner column travelled here from the selection so a cargo
    # casefile in a mixed selection does not pay for a tree it never opens.
    - name: Install Dependencies
      if: matrix.runner == 'ctest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake g++ meson ninja-build lld ccache \
          pkg-config libxml2-dev libspdlog-dev libfmt-dev libboost-dev

    - name: Install libxml2 for sce-build
      if: matrix.runner != 'ctest'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libxml2-dev

    # A round whose oracle is a Go suite compiles it with `go test -c`, so the
    # toolchain has to be here and has to be the one `w3c-tests.yml` pins —
    # a round judging a backend on a different Go than the lane that gates it
    # would be answering about a build nobody ships.
    #
    # Installed under the runner condition rather than always, because these
    # jobs are one per casefile and most of them are cargo rounds that would
    # pay for a toolchain they never call.
    - name: Setup Go
      if: matrix.runner == 'go'
      uses: actions/setup-go@v7
      with:
        go-version: '1.22'
        cache-dependency-path: |
          backends/go/runtime/go.sum
          backends/go/lua/go.sum
          backends/go/tests/go.sum

    # The same for a pytest round, and here the install is load-bearing in a
    # way the Go one is not: `lupa` is the Lua binding the Python runtime's
    # script engine is, and `pytest` is the runner itself. Without them the
    # round's baseline fails to collect and reports a red tree — which is the
    # exact shape this job already paid for once with the rev-pinned validator
    # below, a true sentence about a missing tool phrased as a defect.
    - name: Setup Python
      if: matrix.runner == 'pytest'
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install the Python runtime's dependencies
      if: matrix.runner == 'pytest'
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install lupa pytest

    # The same repair `rust-workspace-tests.yml` already carries, and for the
    # same two tests. `gate_registry_contract` is the ORACLE of three casefiles
    # in this corpus, and it drives the staged citation stage as a subprocess;
    # that stage refuses — exit 3, "the gate could not run, its own tooling is
    # missing" — without the rev-pinned binary. This job never installed it, so
    # every round on that oracle stopped at `baseline is not green (2 failing)`
    # before mutating anything.
    #
    # Measured 2026-08-25: the first whole-corpus sweep reported that for
    # `ci_lane_gate_selection` and `ledger_citations_gate`, while the same
    # binary passed 21/21 locally and `cargo test --workspace` passed on a
    # runner — because THAT lane installs this and this one did not. Reproduced
    # by running the built binary with `HOME` pointed at an empty directory:
    # `the_commit_stage_rejects_a_fabricated_citation_in_staged_content` and
    # `the_staged_stage_scope_is_not_bounded_by_path_or_extension` fail, and
    # nothing else does.
    #
    # A red baseline is not a mutation verdict, so this cost two casefiles
    # their rounds and said nothing about either one's cases.
    - name: Cache mnemosyne-cli (rev-pinned)
      uses: actions/cache@v5
      with:
        path: ~/.local/share/mnemosyne-rev
        key: mnemosyne-rev-${{ hashFiles('.github/workflows/spec-citations.yml') }}

    - name: Install the rev-pinned mnemosyne-cli
      run: scripts/install_mnemosyne_cli.sh

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-mutation-rounds-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-mutation-rounds-

    # The build type is in the key, not only in the recipe. A cache entry is
    # restored by prefix, and the run that first reached this path left a
    # `CMakeCache.txt` recording `CMAKE_BUILD_TYPE=Debug` — the build type the
    # step used to name. Restoring that into a job that now configures
    # RelWithDebInfo does not reconfigure it: `sce_main_build_dir` refuses a
    # tree whose recorded build type is not the one the gates judge, so the
    # lane would go red on a cache rather than on anything in the tree.
    - name: Cache CMake Build
      if: matrix.runner == 'ctest'
      uses: actions/cache@v5
      with:
        path: |
          build/CMakeCache.txt
          build/CMakeFiles
          build/_deps
        key: ${{ runner.os }}-cmake-mutation-rounds-relwithdebinfo-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-mutation-rounds-relwithdebinfo-

    # A ctest round selects from a configured tree; without one the gate
    # refuses (exit 3) rather than reporting green over what it cannot run.
    # This is the step that makes sure it never has to.
    #
    # Delegated for the same reason the selection above is: this step used to
    # spell the recipe out — `cmake -S . -B build -G Ninja
    # -DCMAKE_BUILD_TYPE=Debug` — and it was wrong twice over. It configured
    # without building `sce-codegen`, which no runner can do (the configure
    # resolves the generator and stops with a FATAL_ERROR), and it named a
    # build type the gates refuse, so the half-hour it spent would have
    # produced a tree the rounds then declined to judge. Both survived because
    # nothing ran them: this path was first reached on 2026-08-17, 34 commits
    # after the ctest casefiles were written.
    #
    # `scripts/prepare_ctest_tree.sh` is the one recipe, and the gate's refusal
    # names it too, so a developer configuring by hand gets the tree CI gets.
    - name: Configure and build the CMake tree
      if: matrix.runner == 'ctest'
      run: scripts/prepare_ctest_tree.sh

    # Delegated rather than restated: the per-round verdict and the floors all
    # live in the gate, so this lane and a developer running
    # `scripts/gate mutation-rounds` by hand judge a casefile by one set of
    # rules.
    #
    # The casefile comes from the matrix and nowhere else. `SCE_MUTATION_ROUNDS`
    # is the gate's own channel for a named subset, so the job runs exactly the
    # casefile the selection named — there is no change set in this job to
    # re-derive one from, and that is deliberate: two derivations are how this
    # lane came to answer for a different set than it had selected.
    - name: Run the round
      env:
        SCE_MUTATION_ROUNDS: ${{ matrix.casefile }}
        # Which slice of it. The gate passes this to `scripts/mutate --shard`
        # and derives nothing: the matrix says which job this is, and a gate
        # that computed its own index would answer for a different slice than
        # the one it was scheduled as.
        SCE_MUTATION_SHARD: ${{ matrix.shard }}
      run: scripts/gate mutation-rounds
