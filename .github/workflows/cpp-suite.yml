name: C++ Test Suite

# The half of the main tree's ctest partition that had no reader.
#
# Measured 2026-08-12 by running `scripts/gate --all` with a logging shim in
# place of `ctest`: 28 gates passed and the only runs against the main build
# were `w3c-c11`'s. 159 of 382 registered cases — every `mesh_*` case, all 19
# zenoh ones, and twenty-four C++ unit suites — were executed by nothing. Not
# by a gate and not by CI, because no workflow configured the main tree at all:
# the C++ conformance job built the single `w3c_test_cli` target.
#
# ⚠ This block used to say: "No `paths:` filter, for the reason `w3c-tests.yml`
# has none: a filter is a statement about a runner paid by the minute, and the
# pre-push hook is where this suite's real trigger set lives." That argument was
# about an ALLOW-list, and it still holds against one. What it did not survive
# is a measurement nobody had taken.
#
# Re-measured 2026-08-29, and the re-measurement moved two of the three
# numbers the first version carried — which is precisely why this block says
# to re-derive rather than to trust it. Over the last 20 runs of this
# workflow: **15 cancelled, 5 success**, the successes taking 34m28s /
# 40m03s / 44m48s / 51m00s / 91m39s. With `cancel-in-progress: true` and no
# filter, any push inside that window kills the run: `dc90d6f5`, `7c0c1a1b`
# and `5414c56b` — three consecutive commits of one working session —
# produced ZERO verdicts here, and the fourth (`49e1c537`) reported only
# because the session stopped pushing. A lane whose verdict depends on when a
# person stops typing is not measuring the tree, and a lane cancelled three
# times in four reads exactly like a lane that passes — which is the failure
# this repository's gates exist to refuse.
#
# What this lane OWNS is the non-c11 half of the ctest partition: **184 of
# 435** registered cases on the build machine. Both figures are machine-
# dependent (the mesh transports are most of the difference, and
# `scripts/gates/cpp-suite.sh` carries the floor and the reason), so the
# instruction is the command, not the number. `ctest -N` reports its own
# total, so no filter is needed — and none should be used, because a filter
# is what destroys the payload a re-derivation exists to read:
#
#   ctest --test-dir build -N -LE c11    # tail: "Total Tests: 184" here
#   ctest --test-dir build -N            # tail: "Total Tests: 435" here
#
# AND THE LANE HAS NOW REPORTED THOSE CASES FROM CI, which is the half the
# 2026-08-12 incident was missing: the gate existed and the workflow was
# cancelled before it could speak. Run 33226052648, job 99029926480, on
# `2ea4b4906a`, 01:18:34Z -> 02:09:25Z:
#
#   [cpp-suite] registered non-c11 tests: 184 (of 435)
#   100% tests passed, 0 tests failed out of 177
#   [cpp-suite] 7 disabled test(s) not run
#
# 177 executed + 7 disabled = 184 registered, so the partition assertion and
# the run account for every case. The set is the one the incident named: 114
# `mesh_*` cases including all 19 zenoh ones are in that log. Re-derive with
#
#   gh api repos/<owner>/<repo>/actions/jobs/<job id>/logs \
#     | grep -E 'registered non-c11|tests passed|disabled test'
#
# ⚠ `gh run view <id> --log` fails outside a git repository; the job-log API
# above does not care where it is run from.
#
# ⚠ The first version of this block reused "159 of 382" — the figures from
# the 2026-08-12 incident recorded at the top of this file — as though they
# were this lane's size. They are not: 159 is how many cases were then run by
# NO gate at all. A number lifted from a neighbouring measurement reads
# exactly like a measured one, which is why every figure above now names the
# command that produces it.
#
# Re-derive the run ratio the same way — and split it on the fix, because a
# window that straddles the change reports neither population:
#
#   gh run list --workflow=cpp-suite.yml --limit 40 \
#     --json conclusion,status,createdAt --jq '
#       [.[] | select(.createdAt < "2026-08-29T00:53:21Z")][:20]
#       | group_by(.conclusion) | map({(.[0].conclusion): length}) | add'
#
# Two changes, and they answer different halves:
#
# 1. `paths-ignore`, NOT `paths`. A deny-list says "these paths cannot affect
#    this suite"; an allow-list says "only these run it". The deny-list fails
#    SAFE — a directory nobody classified still triggers the lane — while an
#    allow-list fails SILENT, which is the shape the old comment was right to
#    refuse. Only three entries, each of which cannot reach a C++ target.
# 2. `cancel-in-progress: false`. The filter alone does not fix this: two CODE
#    pushes inside 40 minutes still starve it. Superseding a run is the right
#    default for a lane that finishes in two minutes and the wrong one for a
#    lane that needs ninety. The cost accepted here is overlapping runs, and it
#    is accepted deliberately: a verdict that arrives late is worth more than a
#    verdict that never arrives.
#
# HOW TO CONFIRM IT NOW ANSWERS. Two readings, because one is not enough:
#   - the ratio above should move off 15/20 as runs accumulate, and
#   - a docs-only push must create NO new run for this workflow at all —
#     `gh run list --workflow=cpp-suite.yml --limit 3 --json headSha` should not
#     name a commit whose diff touches only ignored paths.
#
# BOTH READINGS TAKEN 2026-08-29, the second by making the push rather than by
# waiting for one to happen.
#
# Reading 1 — cut the history at the fix (`74f83197b7`, 00:53:21Z) rather than
# taking a rolling 20, and the two populations separate cleanly:
#
#   the 20 runs immediately BEFORE   15 cancelled, 5 success
#   every run SINCE                   0 cancelled, 1 success, 2 still alive
#
# ⚠ Take the rolling window instead and it reads 13 cancelled / 5 success / 2
# in flight, which is neither number: it mixes 17 pre-fix runs with the 3 that
# came after. That reading was written into this block once before being
# split. A ratio over a window that straddles the change measures the change
# and the history at once, and reports neither.
#
# Three runs is a thin sample, so the sample is not the argument. The argument
# is a superseding push that no longer kills anything. Run 33226052648
# (`2ea4b4906a`) started 01:18:34Z; the push of `1a1f1169f8` created run
# 33228007089 at 02:04:07Z; 33226052648 went on to report SUCCESS at 02:09:25Z,
# five minutes and eighteen seconds after the push that `cancel-in-progress:
# true` would have killed it with. It happened again at once: 33228007089 was
# still in_progress when 33228600893 queued at 02:18:01Z. Two overlaps, zero
# cancellations, against 15 in 20 before.
#
# Reading 2 — `650157a91c` is a docs-only commit, pushed alone. It started FOUR
# workflows (Tree Hygiene, W3C SCXML Compliance Tests, Mutation Rounds,
# BasicHTTP Endpoint SSOT) against SIXTEEN for the code push before it, and this
# workflow is not among the four. The deny-list does what it claims and no more:
# three of those four declare no filter, so a docs-only push still reaches every
# lane that never excluded docs.
#
#   FULL=$(git rev-parse <commit>)   # 40 characters, and this matters
#   gh run list --commit "$FULL" --json workflowName,status
#
# ⚠ `--commit` takes a FULL sha and answers a SHORT one with an empty list and
# exit 0. This confirmation was first read as "the push started nothing at all"
# — including the unfiltered lanes, which cannot be true — because the query
# carried a 10-character sha. A silent zero from a blind instrument is
# indistinguishable from a real absence, which is why this block names its
# commands and not its conclusions.
#
# ⚠⚠ WHAT THIS DID NOT FIX, measured in the same reading. Three lanes are long
# enough to be starved and only this one was repaired. Over the last 300 runs:
#
#   lane                          cancelled   median successful run
#   C++ Test Suite                   13/20    50.9 min   <- repaired here
#   W3C SCXML Compliance Tests       13/21    29.1 min   <- still starved
#   Rust Workspace Tests              8/15    30.2 min   <- still starved
#   Mutation Rounds                   0/21    32.7 min   <- sha-keyed group
#
# ⚠⚠ THAT TABLE IS A GLOBAL-WINDOW READING AND IS KEPT ONLY AS THE RECORD OF
# WHAT WAS BELIEVED ON 2026-08-29. `gh run list --limit 300` spans all lanes at
# once, so it is dominated by whichever ran most recently and under-samples the
# rest; `ci_supersession_policy` names that instrument and refuses it. Re-taken
# 2026-09-02 over each lane's OWN last 25 runs, three of the four figures move
# by more than half: 79.1, 70.0, 41.6 and 49.8 min. Read the live numbers from
# `LANES` in `sce-build/tests/ci_supersession_policy.rs`, never from here.
#
# The docs-only push above cancelled the W3C run on `174b25a24c` while proving
# this lane's filter. Mutation Rounds was the shape of the answer for both: its
# concurrency group was keyed on the sha, so a later push superseded nothing --
# at the price of a backlog of unstarted runs, which is why it no longer is. It
# now reaches back over the commits a replaced round skipped instead.
#
# Measured 2026-09-02 over this lane's own last 25 runs: a 79.1 min median
# success against a 17.6 min median gap between pushes to `main`, the slowest
# lane in the directory, so `false` is what saves the run in flight.
#
# ⚠ Its 12 cancellations in that window are NOT the evidence for the setting.
# `false` still cancels a run that is entirely PENDING, so a lane goes on
# reporting cancellations long after it is repaired: this one's five newest
# killed no job at all. The discriminator is per-job, `gh run view <id> --json
# jobs`, and it is `startedAt` before `completedAt` that means work was lost.

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# ⚠ BACK TO `false` BY OWNER DECISION, 2026-10-01, reversing the flip to `true`
# of 2026-09-15. What the owner asked for is what `false` does on a group shared
# by every push: the run in flight is never cancelled, and at most ONE run waits
# behind it -- a newer push replaces the waiting one. When the run in flight
# ends, only the newest commit runs, and the commits between get no run of
# their own. The prose above argues for exactly this and still holds.
#
# The flip of 2026-09-15 answered a shared hosted pool that executed nothing for
# 165 minutes with 36 runs waiting and the oldest at 8.4 hours: it cancelled work
# in flight to free the slot for the newest commit. Measured 2026-10-01, 123 runs
# were active across the account's repositories and 55 of them were Mutation
# Rounds, whose group was keyed on `github.sha` so that every push queued beside
# the last. A group shared per ref bounds a lane to one running and one waiting
# run, which is the bound the queue was missing.
#
# The cost is stated rather than hidden: a run in flight goes on finishing a
# commit that is already stale, and holds a runner while it does.
# `ci_supersession_policy.rs` requires `false` everywhere, so a revert to `true`
# is red rather than invisible.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The suite in four shards, one job each, and a last job that holds them
  # together. Run whole, its build outgrew one hosted job: the default target
  # took 75 minutes cold on 12321e8233 (job 126014197137, 2026-11-03), and from
  # 2026-11-21 no run finished -- job 138540727626 (fac3d022cf) restored a
  # 415 MB compiler cache, began building at 15:24 and was cancelled at its
  # 140-minute ceiling at 17:26 with nothing in its log in between. Each job
  # runs the cpp-suite gate with `SCE_CTEST_SHARD`, which builds only what the
  # tests of its shard run (scripts/lib/ctest_shards.py says how the tests are
  # read from ctest and spread by ninja's graph) and runs those tests;
  # `hook_ci_parity` holds the matrix and the variable to one count, and
  # `cpp-suite-verdict` holds the shards of a run to one plan and every test of
  # it to a shard that ran it. The build machines run the gate whole. The
  # ceiling is the whole suite's until a sharded run is measured.
  #
  # WHERE THE TIME GOES is in every job's log whatever its end: the build's
  # progress once a minute, the slowest steps and targets after it (or, for a
  # job cancelled inside it, in the step after), the compiler cache's answers
  # in the step after the gate, and the build and configure logs and ninja's
  # step log in the job's artifact.
  cpp-suite:
    name: C++ ctest Suite (engine + mesh, shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    # actions: write deletes the lane's older plans (keep-one-cache); packages:
    # write pulls the gate's image, and pushes it when this run built it
    # (.github/actions/gate-image).
    permissions:
      contents: read
      actions: write
      packages: write
    timeout-minutes: 140
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    # `tests/CMakeLists.txt` registers its transport suites behind
    # `find_package(vsomeip3|zenohcxx|CycloneDDS QUIET)`, so a machine without
    # them registers a smaller suite than this job's name claims — 130 non-c11
    # cases against a floor of 140, and the gate refuses rather than report
    # green over the remainder. The gate runs in the host image (`container`
    # of its registry entry), which holds the three SDKs at the versions
    # scripts/install_mesh_transports.sh names, beside the compilers, CMake and
    # Ninja, the libraries the tree links and clang-format 19, which
    # `sce-codegen` formats the generated C++ with
    # (docs/SCE_CODEGEN_DETERMINISM.md §9). Nothing is installed on this
    # runner.
    - name: Setup Problem Matchers
      run: |
        echo "::add-matcher::.github/problem-matchers/gcc.json"
        echo "::add-matcher::.github/problem-matchers/cmake.json"

    # The pinned release, which the runner hands the image read-only: the
    # image carries no Rust of its own (`gate_in_container` in scripts/gate).
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # Rust, and the C and C++ of every CMake tree the job configures, compile
    # through the shared compile cache (.github/actions/compile-cache): a unit
    # another shard or lane compiled alike is answered from it.
    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache
      with:
        cmake: true

    # No emscripten here: this job builds the native tree, and nothing it
    # configures or runs reads emsdk.

    # The configure's cache records the compilers it found, which are the
    # image's, so its key names the image's build context: a configure of one
    # image is never restored into a run of another.
    - name: Cache CMake Build
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          build/CMakeCache.txt
          build/CMakeFiles
          build/_deps
        key: ${{ runner.os }}-cmake-host-image-${{ hashFiles('tools/ci-images/host/**') }}-${{ github.repository }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-host-image-${{ hashFiles('tools/ci-images/host/**') }}-${{ github.repository }}-

    # The answers of the generator's configure-time plans
    # (cmake/SCECodegenPlan.cmake). After a checkout every restored answer is
    # older than the documents and is asked again; what the restore brings is
    # the list of the plans the last run asked, which the configure asks in one
    # parallel batch at its start instead of one by one.
    #
    # Restored and saved as two steps for the reason the transport SDKs are:
    # the save in a post step waits on a job that succeeds, so the restore had
    # found nothing on every run since 2026-11-21. The configure fills the
    # directory before the build starts, so a run that ends at its ceiling still
    # leaves the next one the list.
    - name: Restore the generator's configure-time plans
      id: plans
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: build/sce-codegen-plans
        key: ${{ runner.os }}-sce-codegen-plans-cpp-suite-${{ hashFiles('sce-build/src/**', 'tools/codegen/templates/**', 'cmake/**', '**/CMakeLists.txt', 'resources/**', 'integration_resources/**', 'tests/mesh/**') }}
        restore-keys: |
          ${{ runner.os }}-sce-codegen-plans-cpp-suite-

    - name: Sign in to the gate images' registry
      uses: ./.github/actions/gate-image

    # Configure, build and run are one gate, so the check has one spelling for
    # this lane and for the pre-push hook. The gate asserts that its half and
    # the C11 arm's half add up to every registered case, so a case that
    # belongs to neither fails here rather than going unrun in silence. The
    # runner inside the image builds `sce-codegen` first, through its
    # `codegen-build` gate.
    - name: Run the C++ ctest suite
      env:
        SCE_CTEST_SHARD: ${{ matrix.shard }}/4
      run: |
        ulimit -c unlimited
        scripts/gate cpp-suite

    # The gate reports the build's time when the build ends; a job cancelled
    # inside the build never gets there, and ninja's step log still holds every
    # step that finished.
    - name: Report where a cancelled build's time went
      if: cancelled()
      run: python3 scripts/lib/build_time_report.py build

    # The plan and what this shard ran (`cpp-suite-verdict` reads them), and the
    # logs a reading of the job's time needs.
    - name: Upload this shard's plan and logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cpp-suite-shard-${{ matrix.shard }}
        path: |
          build/ctest-shard/
          build/sce_gate_build.cpp-suite.log
          build/sce_gate_configure.log
          build/.ninja_log
          build/Testing/Temporary/LastTest.log
        retention-days: 30
        if-no-files-found: warn
        include-hidden-files: true

    - name: Save the generator's configure-time plans
      id: plans-save
      if: always() && steps.plans.outputs.cache-hit != 'true' && steps.plans.outputs.cache-primary-key != ''
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: build/sce-codegen-plans
        key: ${{ steps.plans.outputs.cache-primary-key }}

    - name: Keep only this lane's newest plans
      if: always() && steps.plans-save.outcome == 'success'
      uses: ./.github/actions/keep-one-cache
      with:
        prefix: ${{ runner.os }}-sce-codegen-plans-cpp-suite-
        keep: ${{ steps.plans.outputs.cache-primary-key }}

    # The cases that failed, from the run the gate made in the image; the gate
    # itself names each failure and the command that reproduces it.
    - name: Show the failed cases
      if: failure()
      run: cat build/Testing/Temporary/LastTestsFailed.log || echo "no failure log"

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # The verdict of the lane: every shard planned the suite alike and ran every
  # test of its part. A job of its own because a matrix answers per shard, and
  # the claim "the suite passed" is about the four together -- a test that fell
  # between two plans would leave every shard green.
  cpp-suite-verdict:
    name: C++ ctest Suite (engine + mesh)
    needs: cpp-suite
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Download the shards' plans and reports
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: cpp-suite-shard-*
        path: shards

    - name: Hold the shards to one plan and the whole suite
      env:
        SHARDS_RESULT: ${{ needs.cpp-suite.result }}
      run: |
        status=0
        python3 scripts/lib/ctest_shards.py verify shards || status=1
        if [[ "$SHARDS_RESULT" != success ]]; then
          echo "::error title=cpp-suite::a shard job ended $SHARDS_RESULT"
          status=1
        fi
        exit "$status"

  # The WebAssembly half of the suite above: the emscripten tree's every case
  # run under Node, the engine compiled the way the published visualizer is.
  # Jobs of their own rather than steps after the native suite: the two trees
  # share no build, and either one red must not stop the other from reporting.
  # SCE_REQUIRE_TOOLS turns the gate's "emsdk missing, skipping" into a failure
  # here, where the gate's image holds emsdk.
  #
  # In six shards, one job each, and a last job that holds them together, as
  # the native suite is. Run whole, the tree built cold in 3328s before a case
  # ran (run 41956988917, 2026-11-05) and the job ran 4745s before it failed
  # (job 137573089028), with no compiler cache to warm it. Each job runs the
  # cpp-suite-wasm gate with `SCE_CPP_SUITE_WASM_SHARD`, which builds only what
  # the tests of its shard run (scripts/lib/ctest_shards.py) and runs those
  # tests; `hook_ci_parity` holds the matrix and the variable to one count, and
  # `cpp-suite-wasm-verdict` holds the shards of a run to one plan and every
  # test of it to a shard that ran it. Six, because the cold build is about six
  # times the ten minutes a shard is sized to, less what every shard compiles
  # alike (the engine and its libraries), which the first sharded run's plan
  # and build-time report measure; re-size from them. The build machines run
  # the gate whole.
  cpp-suite-wasm:
    name: C++ ctest Suite (WASM, under Node, shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-24.04
    # packages: write pulls the gate's image, and pushes it when this run built
    # it (.github/actions/gate-image).
    permissions:
      contents: read
      packages: write
    # The whole suite's allowance until a sharded run is measured.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    - name: Setup Problem Matchers
      run: |
        echo "::add-matcher::.github/problem-matchers/gcc.json"
        echo "::add-matcher::.github/problem-matchers/cmake.json"

    # The pinned release, which the runner hands the image read-only: the
    # image carries no Rust of its own (`gate_in_container` in scripts/gate).
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # Rust, and what emcc compiles, through the shared compile cache
    # (.github/actions/compile-cache says how emcc reaches it).
    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache
      with:
        emscripten: true

    # The gate runs in the host image (`container` of its registry entry),
    # which holds emsdk at the release scripts/install_emsdk.sh pins (the
    # registry's self-test holds the two to one), CMake and Ninja (a shard
    # reads what its tests need built from ninja's graph), and clang-format 19,
    # which `sce-codegen` formats the C++ it generates with
    # (docs/SCE_CODEGEN_DETERMINISM.md §9). The gate finds the SDK itself
    # (`sce_gate_activate_emsdk` in scripts/gates/lib.sh), and the runner inside
    # the image builds `sce-codegen` first, through its `codegen-build` gate.
    - name: Sign in to the gate images' registry
      uses: ./.github/actions/gate-image

    - name: Run the C++ ctest suite under Node
      env:
        SCE_REQUIRE_TOOLS: 1
        SCE_CPP_SUITE_WASM_SHARD: ${{ matrix.shard }}/6
      run: scripts/gate cpp-suite-wasm

    # The plan and what this shard ran (`cpp-suite-wasm-verdict` reads them),
    # and the gate's two logs: the build's, which names every failed edge, and
    # the run's.
    - name: Upload this shard's plan and logs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: cpp-suite-wasm-shard-${{ matrix.shard }}
        path: |
          build_wasm/ctest-shard/
          build_wasm/cpp_suite_wasm_build.log
          build_wasm/cpp_suite_wasm_ctest.log
          build_wasm/.ninja_log
        retention-days: 30
        if-no-files-found: warn
        include-hidden-files: true

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # The verdict of the WebAssembly lane, for the reason `cpp-suite-verdict`
  # gives: a matrix answers per shard, and "the suite passed" is a claim about
  # the six together.
  cpp-suite-wasm-verdict:
    name: C++ ctest Suite (WASM, under Node)
    needs: cpp-suite-wasm
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Download the shards' plans and reports
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: cpp-suite-wasm-shard-*
        path: shards

    - name: Hold the shards to one plan and the whole suite
      env:
        SHARDS_RESULT: ${{ needs.cpp-suite-wasm.result }}
      run: |
        status=0
        python3 scripts/lib/ctest_shards.py verify shards || status=1
        if [[ "$SHARDS_RESULT" != success ]]; then
          echo "::error title=cpp-suite-wasm::a shard job ended $SHARDS_RESULT"
          status=1
        fi
        exit "$status"
