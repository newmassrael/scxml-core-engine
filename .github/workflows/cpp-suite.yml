name: C++ Test Suite

# The half of the main tree's ctest partition that had no reader.
#
# Measured 2026-08-12 by running `scripts/gate --all` with a logging shim in
# place of `ctest`: 28 gates passed and the only runs against the main build
# were `w3c-c11`'s. 159 of 382 registered cases — every `mesh_*` case, all 19
# zenoh ones, and twenty-four C++ unit suites — were executed by nothing. Not
# by a gate and not by CI, because no workflow configured the main tree at all:
# the C++ conformance job builds the single `w3c_test_cli` target.
#
# ⚠ This block used to say: "No `paths:` filter, for the reason `w3c-tests.yml`
# has none: a filter is a statement about a runner paid by the minute, and the
# pre-push hook is where this suite's real trigger set lives." That argument was
# about an ALLOW-list, and it still holds against one. What it did not survive
# is a measurement nobody had taken.
#
# Re-measured 2026-08-29, and the re-measurement moved two of the three
# numbers the first version carried — which is precisely why this block says
# to re-derive rather than to trust it. Over the last 20 runs of this
# workflow: **15 cancelled, 5 success**, the successes taking 34m28s /
# 40m03s / 44m48s / 51m00s / 91m39s. With `cancel-in-progress: true` and no
# filter, any push inside that window kills the run: `dc90d6f5`, `7c0c1a1b`
# and `5414c56b` — three consecutive commits of one working session —
# produced ZERO verdicts here, and the fourth (`49e1c537`) reported only
# because the session stopped pushing. A lane whose verdict depends on when a
# person stops typing is not measuring the tree, and a lane cancelled three
# times in four reads exactly like a lane that passes — which is the failure
# this repository's gates exist to refuse.
#
# What this lane OWNS is the non-c11 half of the ctest partition: **184 of
# 435** registered cases on the build machine. Both figures are machine-
# dependent (the mesh transports are most of the difference, and
# `scripts/gates/cpp-suite.sh` carries the floor and the reason), so the
# instruction is the command, not the number. `ctest -N` reports its own
# total, so no filter is needed — and none should be used, because a filter
# is what destroys the payload a re-derivation exists to read:
#
#   ctest --test-dir build -N -LE c11    # tail: "Total Tests: 184" here
#   ctest --test-dir build -N            # tail: "Total Tests: 435" here
#
# AND THE LANE HAS NOW REPORTED THOSE CASES FROM CI, which is the half the
# 2026-08-12 incident was missing: the gate existed and the workflow was
# cancelled before it could speak. Run 33226052648, job 99029926480, on
# `2ea4b4906a`, 01:18:34Z -> 02:09:25Z:
#
#   [cpp-suite] registered non-c11 tests: 184 (of 435)
#   100% tests passed, 0 tests failed out of 177
#   [cpp-suite] 7 disabled test(s) not run
#
# 177 executed + 7 disabled = 184 registered, so the partition assertion and
# the run account for every case. The set is the one the incident named: 114
# `mesh_*` cases including all 19 zenoh ones are in that log. Re-derive with
#
#   gh api repos/<owner>/<repo>/actions/jobs/<job id>/logs \
#     | grep -E 'registered non-c11|tests passed|disabled test'
#
# ⚠ `gh run view <id> --log` fails outside a git repository; the job-log API
# above does not care where it is run from.
#
# ⚠ The first version of this block reused "159 of 382" — the figures from
# the 2026-08-12 incident recorded at the top of this file — as though they
# were this lane's size. They are not: 159 is how many cases were then run by
# NO gate at all. A number lifted from a neighbouring measurement reads
# exactly like a measured one, which is why every figure above now names the
# command that produces it.
#
# Re-derive the run ratio the same way — and split it on the fix, because a
# window that straddles the change reports neither population:
#
#   gh run list --workflow=cpp-suite.yml --limit 40 \
#     --json conclusion,status,createdAt --jq '
#       [.[] | select(.createdAt < "2026-08-29T00:53:21Z")][:20]
#       | group_by(.conclusion) | map({(.[0].conclusion): length}) | add'
#
# Two changes, and they answer different halves:
#
# 1. `paths-ignore`, NOT `paths`. A deny-list says "these paths cannot affect
#    this suite"; an allow-list says "only these run it". The deny-list fails
#    SAFE — a directory nobody classified still triggers the lane — while an
#    allow-list fails SILENT, which is the shape the old comment was right to
#    refuse. Only three entries, each of which cannot reach a C++ target.
# 2. `cancel-in-progress: false`. The filter alone does not fix this: two CODE
#    pushes inside 40 minutes still starve it. Superseding a run is the right
#    default for a lane that finishes in two minutes and the wrong one for a
#    lane that needs ninety. The cost accepted here is overlapping runs, and it
#    is accepted deliberately: a verdict that arrives late is worth more than a
#    verdict that never arrives.
#
# HOW TO CONFIRM IT NOW ANSWERS. Two readings, because one is not enough:
#   - the ratio above should move off 15/20 as runs accumulate, and
#   - a docs-only push must create NO new run for this workflow at all —
#     `gh run list --workflow=cpp-suite.yml --limit 3 --json headSha` should not
#     name a commit whose diff touches only ignored paths.
#
# BOTH READINGS TAKEN 2026-08-29, the second by making the push rather than by
# waiting for one to happen.
#
# Reading 1 — cut the history at the fix (`74f83197b7`, 00:53:21Z) rather than
# taking a rolling 20, and the two populations separate cleanly:
#
#   the 20 runs immediately BEFORE   15 cancelled, 5 success
#   every run SINCE                   0 cancelled, 1 success, 2 still alive
#
# ⚠ Take the rolling window instead and it reads 13 cancelled / 5 success / 2
# in flight, which is neither number: it mixes 17 pre-fix runs with the 3 that
# came after. That reading was written into this block once before being
# split. A ratio over a window that straddles the change measures the change
# and the history at once, and reports neither.
#
# Three runs is a thin sample, so the sample is not the argument. The argument
# is a superseding push that no longer kills anything. Run 33226052648
# (`2ea4b4906a`) started 01:18:34Z; the push of `1a1f1169f8` created run
# 33228007089 at 02:04:07Z; 33226052648 went on to report SUCCESS at 02:09:25Z,
# five minutes and eighteen seconds after the push that `cancel-in-progress:
# true` would have killed it with. It happened again at once: 33228007089 was
# still in_progress when 33228600893 queued at 02:18:01Z. Two overlaps, zero
# cancellations, against 15 in 20 before.
#
# Reading 2 — `650157a91c` is a docs-only commit, pushed alone. It started FOUR
# workflows (Tree Hygiene, W3C SCXML Compliance Tests, Mutation Rounds,
# BasicHTTP Endpoint SSOT) against SIXTEEN for the code push before it, and this
# workflow is not among the four. The deny-list does what it claims and no more:
# three of those four declare no filter, so a docs-only push still reaches every
# lane that never excluded docs.
#
#   FULL=$(git rev-parse <commit>)   # 40 characters, and this matters
#   gh run list --commit "$FULL" --json workflowName,status
#
# ⚠ `--commit` takes a FULL sha and answers a SHORT one with an empty list and
# exit 0. This confirmation was first read as "the push started nothing at all"
# — including the unfiltered lanes, which cannot be true — because the query
# carried a 10-character sha. A silent zero from a blind instrument is
# indistinguishable from a real absence, which is why this block names its
# commands and not its conclusions.
#
# ⚠⚠ WHAT THIS DID NOT FIX, measured in the same reading. Three lanes are long
# enough to be starved and only this one was repaired. Over the last 300 runs:
#
#   lane                          cancelled   median successful run
#   C++ Test Suite                   13/20    50.9 min   <- repaired here
#   W3C SCXML Compliance Tests       13/21    29.1 min   <- still starved
#   Rust Workspace Tests              8/15    30.2 min   <- still starved
#   Mutation Rounds                   0/21    32.7 min   <- sha-keyed group
#
# The docs-only push above cancelled the W3C run on `174b25a24c` while proving
# this lane's filter. Mutation Rounds is the shape of the answer for both: its
# concurrency group is keyed on the sha, so a later push supersedes nothing.
# Re-derive with `gh run list --limit 300 --json
# workflowName,conclusion,createdAt,updatedAt` and group by lane.

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpp-suite:
    name: C++ ctest Suite (engine + mesh)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          g++ \
          meson \
          ninja-build \
          lld \
          ccache \
          pkg-config \
          libxml2-dev \
          libspdlog-dev \
          libfmt-dev \
          libboost-dev \
          libboost-system-dev \
          libboost-thread-dev \
          libboost-filesystem-dev

    # `tests/CMakeLists.txt` registers its transport suites behind
    # `find_package(vsomeip3|zenohcxx|CycloneDDS QUIET)`, so a runner without
    # them registers a smaller suite than this job's name claims — 130 non-c11
    # cases against a floor of 140. The gate refused rather than report green
    # over the remainder, which made this lane red on every push while
    # claiming nothing about the tree. The versions live in the script, one
    # place, checked against upstream tags.
    # A prefix of its own rather than /usr/local: the runner image keeps its
    # preinstalled toolchains there (the Android SDK alone is gigabytes), and
    # a cache of that is neither restorable nor honest about what it holds.
    # `CMAKE_PREFIX_PATH` and `LD_LIBRARY_PATH` below are what make a private
    # prefix visible to `find_package` and to the tests that then link it.
    - name: Cache mesh transport SDKs
      id: transports
      uses: actions/cache@v5
      with:
        path: ~/.local/sce-mesh-transports
        key: mesh-transports-${{ runner.os }}-${{ hashFiles('scripts/install_mesh_transports.sh') }}

    - name: Build and install the mesh transport SDKs
      if: steps.transports.outputs.cache-hit != 'true'
      run: scripts/install_mesh_transports.sh "$HOME/.local/sce-mesh-transports"

    - name: Put the transport prefix on the CMake and loader paths
      run: |
        echo "CMAKE_PREFIX_PATH=$HOME/.local/sce-mesh-transports" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$HOME/.local/sce-mesh-transports/lib" >> "$GITHUB_ENV"

    - name: Setup Problem Matchers
      run: |
        echo "::add-matcher::.github/problem-matchers/gcc.json"
        echo "::add-matcher::.github/problem-matchers/cmake.json"

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('sce-build/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-codegen-

    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only builds
        # the debug profile, so a release binary the cache still holds is not a
        # product of this commit.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    - name: Setup Emscripten (emsdk)
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest

    - name: Cache CMake Build
      uses: actions/cache@v5
      with:
        path: |
          build/CMakeCache.txt
          build/CMakeFiles
          build/_deps
        key: ${{ runner.os }}-cmake-${{ github.repository }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-${{ github.repository }}-

    - name: Setup ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-cpp-suite-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-cpp-suite-

    # Configure, build and run are one gate, so the check has one spelling for
    # this lane and for the pre-push hook. The gate asserts that its half and
    # the C11 arm's half add up to every registered case, so a case that
    # belongs to neither fails here rather than going unrun in silence.
    - name: Run the C++ ctest suite
      run: |
        ulimit -c unlimited
        scripts/gate cpp-suite

    - name: Debug Environment
      if: failure()
      run: |
        set -o pipefail
        echo "=== Registered cases ==="
        ctest --test-dir build -N -LE c11 | tail -5
        echo "=== Last failures ==="
        cat build/Testing/Temporary/LastTestsFailed.log || echo "no failure log"
