name: Tree Hygiene

# The workflow that must never carry a `paths:` filter.
#
# `roadmap_marker_gate` enumerates every tracked file in the repository
# (`git ls-files`, 17 extensions plus CMakeLists.txt) and rejects roadmap
# markers, internal chain codenames, and references to gitignored working
# documents. Its input set is the whole tree, so any path filter on the
# workflow running it is narrower than what it judges: a change outside
# the filter never starts CI, while the gate still holds that change to
# its rule. The gate looks enforced and is not.
#
# That is measured, not hypothetical. On 2026-08-04 a reference to a
# gitignored doc directory landed in `tools/git-hooks/gate_registry.py`.
# rust-workspace-tests.yml runs the gate as part of `cargo test
# --workspace`, but its `paths:` filter does not list `tools/git-hooks/**`,
# so no workflow started and the violation reached main green. A local
# `cargo test` was what eventually caught it.
#
# Splitting the gate out is what makes the trigger match the scan set.
# The job names its test targets rather than sweeping the workspace, so
# firing on every push costs a cached build and sub-second tests instead
# of the 20-minute sweep rust-workspace-tests.yml carries.
#
# `workflow_trigger_coverage` pins both halves of the arrangement: that
# this file declares no path filter, and that every gate whose input set
# outgrows a filter is run by a workflow which declares none.
# `hook_ci_parity` pins the neighbouring property — that a hook stage
# claiming to mirror a workflow does not run a weaker command than the
# workflow it mirrors. Both read all of `.github/workflows/`, which makes
# them gates of the kind described above, so they run here beside the
# gate they protect.
#
# `codegen_binary_resolution` enumerates every tracked file too: it holds
# that no harness names a cargo build profile when reaching for the
# sce-codegen binary. A profile flip that moved only some of the ~100
# sites is what took every forge conformance job down, and the sites it
# judges are spread across five languages with no common path prefix.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Measured 2026-09-02 over this lane's own last 25 runs: 20.5 min median from
# run creation to verdict, against a 17.6 min median gap between pushes to
# `main`, so it can no longer finish between two of them. It was 9.9 when this
# block still read `true`, and the ten minutes it gained are QUEUE and not
# work -- the job's own compute is still ~11 min -- but a run waiting for a
# runner is exactly the run the next push takes away.
#
# 11 of those 25 ended `cancelled`, and every one had ALREADY STARTED, 68s to
# 1264s in. Ten are consecutive, `b59ed99b10` through `9a16e970cf`, and one of
# the ten is the commit that repaired a red THIS job raised at `55620099a7`:
# the lane stopped answering at the moment its answer mattered most.
#
# `false` rather than a per-commit key, for the reason `w3c-tests.yml` gives:
# a newly queued run still cancels a PENDING one, so `false` saves the run IN
# FLIGHT and the LATEST commit and defers the ones between. That is the right
# trade for a lane whose answer is about a BRANCH -- this one re-asks
# `git ls-files` against whatever the tree now holds, so nothing is lost by
# answering for the newest commit. `mutation-rounds.yml` keys on `github.sha`
# because its answer is about a COMMIT and nothing re-selects it.
#
# Held by `sce-build/tests/ci_supersession_policy.rs` -- which runs IN THIS
# JOB. Its row is what decides this literal, and that circle is why the drift
# lasted four days: while the lane is superseded, the check that would move
# the row is the thing being superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hygiene:
    name: tree-wide gates
    runs-on: ubuntu-latest

    steps:
    # No `submodules: recursive`: the gate skips third_party/ and vendor/,
    # and neither target compiles against a submodule. Checking them out
    # would only slow a job that fires on every push.
    #
    # `fetch-depth: 0` because `lowering_decision_ledger` runs here and a
    # RETIRED measurement pins its number to the commit that still holds the
    # subject — `git cat-file -t` and `git ls-tree` cannot see that commit in
    # the default shallow clone. The check does not fail in a shallow
    # checkout; it CLASSIFIES it and skips the pin arm, which means the arm
    # is only real where history is. This is that lane, it fires on every
    # push, and the ledger asserts this very line so the arm cannot go
    # everywhere-unverifiable by someone deleting it.
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # libxml2 backs sce-build's default `xsd` feature; without it the
    # crate fails at link time before any test runs.
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libxml2-dev

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-tree-hygiene-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-tree-hygiene-

    # `gate_registry_contract` drives the *staged* citation stage as a
    # subprocess, and that stage refuses — exit 3, "the gate could not run,
    # its own tooling is missing" — without the rev-pinned binary. This job
    # never had it, so two of its tests failed on every push and said nothing
    # about the tree each time. The revision is read from
    # `spec-citations.yml`, the one place it lives.
    - name: Cache mnemosyne-cli (rev-pinned)
      uses: actions/cache@v5
      with:
        path: ~/.local/share/mnemosyne-rev
        key: mnemosyne-rev-${{ hashFiles('.github/workflows/spec-citations.yml') }}

    - name: Install the rev-pinned mnemosyne-cli
      run: scripts/install_mnemosyne_cli.sh

    # `git ls-files` is the gate's enumeration source, so it needs a real
    # repository rather than an exported tree. actions/checkout gives one.
    #
    # Delegates to the gate runner rather than restating the target
    # list. The list lived in two files and had to be edited in both;
    # `hook_ci_parity` compared them, which caught a divergence but only
    # after one had already been written. One spelling cannot diverge.
    #
    # `SCE_REQUIRE_TOOLS` because two of these targets reach for tooling that
    # is not on `PATH` and degrade to a printed note without it. A note on a
    # runner is invisible: the suite returns `ok` and the lane is green while
    # the check it is named for never ran. The variable is this repository's
    # word for "this lane claims its checks ran", and the job installs the
    # binary directly above, so the claim is one it can keep.
    - name: Tree-wide hygiene gates
      env:
        SCE_REQUIRE_TOOLS: "1"
      run: scripts/gate tree-hygiene

    # Same arrangement, different alphabet. `sce-build/tests/mutations/*.cases`
    # is the one source here that nothing compiles: each case is a literal
    # anchor into a file that goes on changing, and a moved or duplicated
    # anchor turns the case into evidence it no longer produces. What the
    # gate reads is the union of every `mutation_targets` declaration inside
    # those files, so no `paths:` filter tracks it without being a second
    # copy of a declaration the casefiles already carry — which is what this
    # workflow's missing filter is for.
    #
    # Seconds, not a mutation round: it applies each case and restores it
    # without building or running anything. The full round stays a
    # deliberate `scripts/mutate <casefile>`.
    - name: Mutation casefiles still apply
      run: scripts/gate mutation-cases
