name: License SSOT Verify

# Drift guard for sce/sce_licenses.cmake — the SSOT shared by
# find_package install rules and scripts/package_embed.sh. Catches a
# vendored third_party dep added without its LICENSE entered into the
# SSOT (silent LGPL §1 / MIT §1 compliance violation), an upstream
# upgrade that moves an embedded SPDX/copyright notice out of the
# registered grep target, and SSOT entries pointing at files renamed
# or deleted on disk.
#
# Orthogonal to embed-vendor-smoke.yml: licenses cover *both*
# distribution channels (find_package install + embed/), and most
# license-relevant changes (a new third_party/<dep>/) do not match the
# embed-vendor trigger paths. A separate workflow keeps the trigger
# surface and the failure signal clean. Sub-second runtime, no
# toolchain prerequisites beyond bash + grep + find + sed.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sce/sce_licenses.cmake'
      - 'scripts/verify_licenses.sh'
      - 'third_party/**'
      - '.github/workflows/license-verify.yml'
      # The visualizer's own third-party libraries. They are NOT under
      # third_party/ and never were, which is how d3 (ISC) and elkjs
      # (EPL-2.0) came to ship while LICENSE-THIRD-PARTY.md said every
      # dependency was MIT.
      - 'web/visualizer/vendor/**'
      - 'web/visualizer/*.html'
      - 'LICENSE-THIRD-PARTY.md'
      - 'scripts/gates/web-vendor-licenses.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'sce/sce_licenses.cmake'
      - 'scripts/verify_licenses.sh'
      - 'third_party/**'
      - '.github/workflows/license-verify.yml'
      - 'web/visualizer/vendor/**'
      - 'web/visualizer/*.html'
      - 'LICENSE-THIRD-PARTY.md'
      - 'scripts/gates/web-vendor-licenses.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-licenses:
    name: Verify license SSOT
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Verify license SSOT
      # 4 invariants: SSOT-stale, LICENSE-orphan, notice-drift,
      # dep-uncovered. See scripts/verify_licenses.sh header for
      # the contract each invariant pins.
      run: scripts/gate license-ssot

    - name: Verify web vendor licenses
      # The same verdict for the browser visualizer, which the gate above
      # does not reach: it reads third_party/, and the visualizer's
      # libraries are under web/visualizer/vendor/. Also refuses a
      # <script src="https://..."> in the page, which ships a third
      # party's code to every viewer while leaving the vendor directory
      # empty — how elkjs (EPL-2.0) shipped unregistered.
      #
      # Runs even when the step above fails, because the two judge
      # different trees and a reader owed both answers should not have to
      # push twice to get them.
      if: '!cancelled()'
      run: scripts/gate web-vendor-licenses
