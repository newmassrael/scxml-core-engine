name: Spec Citations (Mnemosyne adoption)

# Citation gate for the Mnemosyne design/spec ledgers. Each workspace owns one
# namespace and checks only its own §<ns>-<id> cites (section_namespace scoping):
#
#   docs/spec/scxml     §scxml-<n>   W3C SCXML Recommendation mirror
#   docs/sce-ledger/mesh §mesh-<n>   SCE_MESH.md design ledger
#   docs/sce-ledger/wire §wire-W<n>  Wire RFC design ledger
#   docs/spec/synth     §synth-<id>  protocol-synthesis RFC mirror (revision-
#                                    pinned snapshot of the watching-zenoh RFC)
#   docs/sce-ledger/bytesguard §bytesguard-<n>  EventSchema bytes-guard RFC
#
# `validate-code-refs` fails (severity_missing = "reject") on any §<ns>-<id>
# citation with no matching ledger section — the hallucination gate. The
# commit↔ledger drift surface and the Path-B binding axis are advisory
# ([commit_ledger]/severity_binding = "warn") and do not gate the exit code.
# `validate-workspace` additionally checks the committed GENERATED.md ↔ atomic
# store round-trip, so a hand-edited ledger view cannot drift silently.
#
# mnemosyne-cli is an external Rust binary (separate repo, intentionally not
# vendored), so it is installed at a pinned revision via `cargo install --git
# --rev --locked` and cached by that rev — the consumer CI pattern from
# Mnemosyne's SCHEMA_GUIDE. Bump MNEMOSYNE_REV deliberately, re-validating
# every workspace locally against the new rev before committing the change.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sce/**'
      - 'sce-build/**'
      - 'backends/rust/runtime/**'
      - 'backends/*/forge-runtime/**'
      - 'backends/c/runtime/**'
      - 'tools/codegen/templates/**'
      - 'tests/forge/resources/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'docs/spec/**'
      - 'docs/sce-ledger/**'
      - 'examples/**'
      - 'web/**'
      - '.github/workflows/spec-citations.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sce/**'
      - 'sce-build/**'
      - 'backends/rust/runtime/**'
      - 'backends/*/forge-runtime/**'
      - 'backends/c/runtime/**'
      - 'tools/codegen/templates/**'
      - 'tests/forge/resources/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'docs/spec/**'
      - 'docs/sce-ledger/**'
      - 'examples/**'
      - 'web/**'
      - '.github/workflows/spec-citations.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin to a Mnemosyne commit, never a branch; --locked builds against its
  # committed Cargo.lock for a reproducible binary. aa66c61 (R428) adds the
  # [verifies_catalog].sha256 pin (epub_sha256 symmetry): every catalog load
  # re-hashes the file and fails loudly on mismatch, guarding the authority input
  # of the R427 catalog-live confirmed rule. R425-R427 are the verify-axis
  # validity rung from SCE's field report: R425 BlanketVerifies detector
  # (severity_blanket) + unconfirmed_verifies surface, R426 the verifies-catalog
  # linkage check ([verifies_catalog] + validate-verifies-linkage), R427 the
  # catalog-live confirmed branch. R423 MisclassifiedCoverage; R421/R422 3-state
  # coverage_expectation; R416-R420 the confirmation subsystem.
  # Earlier on this line: R400 retired the markdown-doc render path (store is the
  # sole SSOT, no GENERATED.md round-trip), R402-R405 added the offline
  # content-drift gate (NormativeExcerpt.text_sha256 + committed-EPUB file pin),
  # R407 projects each section body from the pinned EPUB, R413 added the verify
  # axis. Stores have since migrated to schema v23; the aa66c61 pin shipped a
  # v11 CLI that rejects them with "store=23 expected <= 11", so 5807bd5c
  # replaced it. R835 is this pin: it fixes the R783 scan-coverage precheck,
  # which resolved [plugins.set_equality_validator].paths against each
  # workspace's own directory instead of [workspace] root and so rejected all
  # five workspaces here with "configured scan paths resolve to nothing". The
  # intermediate 25d30d16 carries that defect — do not pin between 5807bd5c and
  # 5c266cd. R840 then added the exclusion-integrity axis, and R854/R855 are this
  # pin: R840's axis had been Rust-only, so a citation living only in an excluded
  # NON-Rust tree was invisible to it (a silent miss, the dangerous direction) and
  # a scanned C++ citation could not clear a false report. Measured A/B on this
  # tree: excluding the C++ parsing tree reports `wire-W2` + `wire-W4.5` at this
  # pin and reported nothing at 2b2dae4c. R855 also maps `.c` and prints a
  # per-language symbol-reach line each run. Bumped after re-running
  # validate-workspace / -code-refs / -verifies-linkage / -content-drift on every
  # enrolled workspace with the pin enforced.
  MNEMOSYNE_REV: 5bbf4d17b8e84b064295e1dd878d0ed6b23e7e7d

jobs:
  citations:
    name: Validate spec citations (per workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cached mnemosyne-cli (pinned rev)
        id: cli-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/mnemosyne-cli
          key: mnemosyne-cli-${{ env.MNEMOSYNE_REV }}

      - name: Install mnemosyne-cli (pinned revision)
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/newmassrael/mnemosyne \
            --rev "${MNEMOSYNE_REV}" --locked mnemosyne-cli

      - name: Validate citations + excerpt content drift (per workspace)
        run: |
          set -euo pipefail
          for ws in docs/spec/scxml docs/sce-ledger/mesh docs/sce-ledger/wire docs/spec/synth docs/sce-ledger/bytesguard; do
            echo "::group::${ws}"
            ( cd "${ws}" \
                && mnemosyne-cli validate-workspace \
                && mnemosyne-cli validate-code-refs \
                && mnemosyne-cli validate-verifies-linkage \
                && mnemosyne-cli validate-content-drift )
            echo "::endgroup::"
          done

      # validate-code-refs only gates §scxml- cites; a free-text
      # "W3C SCXML <n>" section reference would bypass it entirely. This
      # gate forbids that prose form in the enrolled comment dirs (read
      # from the toml so it tracks coverage automatically), forcing every
      # section cite through the §scxml- channel the validator inspects.
      - name: Forbid free-text W3C SCXML section cites (force §scxml- form)
        run: |
          python3 tools/mnemosyne-adoption/migrate_citations.py --check \
            --from-toml docs/spec/scxml/mnemosyne.toml

      # Same form gate for the protocol-synthesis RFC: a claimable free-text
      # cite ("RFC §5.B" with a lettered label, or a numeric one under the
      # watching-zenoh document marker) must be in §synth- form so
      # validate-code-refs gates it; skipped sightings (sibling-namespace
      # numbers, other documents' ids) legitimately stay prose.
      - name: Forbid claimable free-text synth RFC cites (force §synth- form)
        run: |
          python3 tools/mnemosyne-adoption/migrate_citations.py --check --namespace synth \
            --from-toml docs/spec/synth/mnemosyne.toml

      - name: Forbid claimable free-text bytes-guard RFC cites
        run: |
          python3 tools/mnemosyne-adoption/migrate_citations.py --check --namespace bytesguard \
            --from-toml docs/sce-ledger/bytesguard/mnemosyne.toml

      # Ledger-existence gate for the trees deliberately kept in prose. The form
      # gates above only cover dirs enrolled in a ledger's `paths`, so the
      # codegen templates and the backend/test trees could cite a section number
      # that does not exist. Templates are the propagation source — one
      # fabricated number reached 168 sites through generated copies — so this
      # checks that every section-shaped citation resolves, without demanding
      # §-form in text that ships verbatim inside generated code.
      - name: Forbid citations naming sections absent from the ledger
        run: |
          set -euo pipefail
          for tree in tools/codegen/templates tests backends examples web; do
            echo "::group::${tree}"
            python3 tools/mnemosyne-adoption/migrate_citations.py "${tree}" --check-ledger
            echo "::endgroup::"
          done
