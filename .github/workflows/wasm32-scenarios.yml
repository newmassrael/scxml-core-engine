name: Rust engine on wasm32

# The Rust engine, built as the module a browser loads and run under Node and in
# headless Chrome on the scenarios every backend replays.
#
# No other lane can say whether the engine starts on this target. A
# `wasm32-unknown-unknown` module is handed no clock, no threads and no files by
# its target, and the failures that follow compile: the engine once read the
# wall clock at its first `initialize()`, which builds for the target and traps
# when the module runs. Every native build and every native test passed while no
# machine could start in a browser, and nothing in the repository could have said
# so.
#
# The check is `scripts/gate wasm32-scenarios`; this file only provides what that
# gate needs and does not hold on a push: the target's standard library, Node,
# and a `wasm-bindgen` command-line tool at exactly the version `Cargo.lock`
# holds for the library (the glue and the module are only compatible at one).
# Chrome is the pinned Chrome for Testing `scripts/install_chrome.sh` names, the
# browser the build machines replay in when they judge an update to main, so the
# two judge the module in one browser and not in the image's of the month.
#
# The triggers are what the module is made of: the engine, the forge runtime it
# checks integers with, the replay crate, and the machines it replays, which its
# build script generates from the tree `rust-static-datamodel` (docs/adr/0097):
# the generator, its templates and standard library, the tree's manifest and
# the fixtures, the scenario files among them.

on:
  push:
    branches: [ main ]
    paths:
      - 'backends/rust/runtime/**'
      - 'backends/rust/forge-runtime/**'
      - 'backends/rust/scenarios/**'
      - 'backends/rust/portable-bytes/**'
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'stdlib/**'
      - 'tools/codegen/templates/**'
      - 'tools/codegen/trees/rust-static-datamodel.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/install_chrome.sh'
      - 'scripts/install_wasm_bindgen.sh'
      - 'scripts/gates/wasm32-scenarios.sh'
      - '.github/workflows/wasm32-scenarios.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backends/rust/runtime/**'
      - 'backends/rust/forge-runtime/**'
      - 'backends/rust/scenarios/**'
      - 'backends/rust/portable-bytes/**'
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'stdlib/**'
      - 'tools/codegen/templates/**'
      - 'tools/codegen/trees/rust-static-datamodel.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/install_chrome.sh'
      - 'scripts/install_wasm_bindgen.sh'
      - 'scripts/gates/wasm32-scenarios.sh'
      - '.github/workflows/wasm32-scenarios.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate's two parts, one job each (`SCE_WASM32_SCENARIOS_SHARD`): 1/2 lints
  # the replay crate for the target, 2/2 builds the module and replays every
  # scenario in it under Node and in Chrome. Whole, the job took 11 minutes (job
  # 139040902859, 2026-11-25), 253 s of it clippy and 250 s the build, each
  # compiling the generator crate its own way, before 69 s of replay; the parts
  # share nothing, so each is a job of about five and six minutes. The tools only
  # the replay needs are installed in its part alone.
  wasm32-scenarios:
    name: Scenarios replayed in the wasm32 module (part ${{ matrix.shard }} of 2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The account's 20 hosted jobs are shared; one job per shard at once.
      max-parallel: 2
      matrix:
        shard: [1, 2]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # The replay crate's build script links sce-build, the generator of the
    # machines it replays, whose default `xsd` feature binds libxml2 through
    # pkg-config on the host the build script runs on.
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-dev pkg-config

    # The release rust-toolchain.toml pins, which lists the wasm32 target
    # and clippy.
    - name: Install Rust Toolchain (with the wasm32 standard library)
      uses: ./.github/actions/install-rust

    - name: Setup Node
      if: matrix.shard == 2
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: '22'

    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache

    # The version is read from the lock and not written here, so the tool follows
    # the library when `Cargo.lock` moves. The gate refuses a tool at any other
    # version, which is why this step cannot be left to whatever is installed.
    - name: Read the wasm-bindgen version Cargo.lock holds
      if: matrix.shard == 2
      id: bindgen
      run: |
        version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache wasm-bindgen
      if: matrix.shard == 2
      id: bindgen-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cargo/bin/wasm-bindgen
        key: ${{ runner.os }}-wasm-bindgen-${{ steps.bindgen.outputs.version }}

    - name: Install wasm-bindgen at that version
      if: matrix.shard == 2 && steps.bindgen-cache.outputs.cache-hit != 'true'
      run: cargo install wasm-bindgen-cli --version "${{ steps.bindgen.outputs.version }}" --locked

    # The pinned browser, installed where the gate looks for it
    # (~/.local/share/chrome-for-testing/<version>/). The hosted image carries
    # the libraries it links against.
    - name: Cache the pinned Chrome for Testing
      if: matrix.shard == 2
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.local/share/chrome-for-testing
        key: ${{ runner.os }}-chrome-for-testing-${{ hashFiles('scripts/install_chrome.sh') }}

    - name: Install the pinned Chrome for Testing
      if: matrix.shard == 2
      run: scripts/install_chrome.sh

    - name: Lint the module's crate, or build the module and replay every scenario in it
      env:
        SCE_WASM32_SCENARIOS_SHARD: ${{ matrix.shard }}/2
      run: scripts/gate wasm32-scenarios

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats
