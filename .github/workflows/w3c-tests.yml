name: W3C SCXML Compliance Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      log-level:
        description: 'Log level for test execution'
        required: false
        default: 'error'
        type: choice
        options:
          - trace
          - debug
          - info
          - warn
          - error
          - off

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # C++ (Interpreter + AOT) — 404 tests
  # ============================================================
  test-cpp:
    name: C++ W3C Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          g++ \
          meson \
          ninja-build \
          lld \
          ccache \
          pkg-config \
          libxml2-dev \
          libspdlog-dev \
          libfmt-dev \
          libboost-dev

    - name: Setup Problem Matchers
      run: |
        echo "::add-matcher::.github/problem-matchers/gcc.json"
        echo "::add-matcher::.github/problem-matchers/cmake.json"

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('sce-build/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-codegen-

    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only
        # builds the debug profile, so a release binary the cache still
        # holds is not a product of this commit. The locator knows which
        # path that is; naming it here would put a build-layout detail
        # back into every workflow.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    - name: Setup Emscripten (emsdk)
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest
        cd ..

    - name: Cache CMake Build
      uses: actions/cache@v5
      with:
        path: |
          build/CMakeCache.txt
          build/CMakeFiles
          build/_deps
        key: ${{ runner.os }}-cmake-${{ github.repository }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-${{ github.repository }}-

    - name: Setup ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Verify lld Installation
      run: |
        echo "=== Checking lld installation ==="
        which ld.lld || echo "Warning: ld.lld not found in PATH"
        ld.lld --version || echo "Warning: ld.lld version check failed"

    # Configure, build and run are one gate, so the check has one spelling for
    # this lane and for the pre-push hook. The gate writes the JUnit report and
    # the run log where the publish and upload steps below expect them.
    #
    # The `specific-tests` dispatch input was dropped when this moved: running
    # a subset produces a green check for a suite that did not run, which is
    # the failure this lane already shipped — 233 of 234 cases failing under a
    # green check for three weeks. A subset is a debugging move and belongs at
    # a developer's own `./w3c_test_cli 531`, not in the channel that reports
    # conformance.
    - name: Run W3C SCXML Test Suite
      run: |
        ulimit -c unlimited
        SPDLOG_LEVEL="${{ inputs.log-level || 'debug' }}" \
        SCE_W3C_REPORT_DIR=build/tests \
          scripts/gate w3c-cpp

    - name: Debug Environment
      if: failure()
      run: |
        echo "=== Build Directory ==="
        ls -lh build/tests/w3c_test_cli || echo "no test binary — the build failed"
        echo ""
        echo "=== Library Dependencies ==="
        ldd build/tests/w3c_test_cli || echo "ldd failed or static binary"
        echo ""
        echo "=== Resources ==="
        # Not `ls ... | head ... || echo`: `||` tests the pipeline, whose
        # status is head's, so the missing-directory message could never be
        # printed. Nor is pipefail the fix here — head exits at ten lines and
        # SIGPIPEs ls, which pipefail would then read as a failure. The
        # directory check is what this line actually wanted.
        if [ -d resources ]; then
          head -n 10 <(ls -la resources)
        else
          echo "ERROR: resources directory not found"
        fi

    - name: Analyze Crash (if occurred)
      if: always()
      run: |
        cd build/tests
        echo "=== Crash Analysis ==="
        if [ -f core ]; then
          echo "Core dump found!"
          gdb -batch -ex "bt" -ex "quit" ./w3c_test_cli core 2>&1 || echo "GDB not available"
        else
          echo "No core dump found"
        fi
        echo ""
        echo "=== Test Output Summary ==="
        if [ -f w3c_test_output.log ]; then
          echo "Log file size: $(wc -l < w3c_test_output.log) lines"
          echo "First 20 lines:"
          head -n 20 w3c_test_output.log
          echo ""
          echo "Last 30 lines:"
          tail -n 30 w3c_test_output.log
        else
          echo "No output log found"
        fi
        echo ""
        echo "=== XML Results Check ==="
        if [ -f w3c_test_results.xml ]; then
          echo "XML file found in current directory"
          head -n 20 w3c_test_results.xml
        else
          echo "XML file NOT found - test execution likely failed early"
        fi

    - name: Upload Test Output Log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: w3c-test-output-log
        path: build/tests/w3c_test_output.log
        retention-days: 30
        if-no-files-found: warn

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: always()
      with:
        report_paths: 'build/tests/w3c_test_results.xml'
        detailed_summary: true
        include_passed: true
        fail_on_failure: false
        check_name: 'W3C SCXML Test Results (C++)'
        summary: '[View Detailed HTML Report](https://newmassrael.github.io/scxml-core-engine/test-results/test-results.html)'
        annotate_only: false

    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: w3c-test-results-cpp
        path: build/tests/w3c_test_results.xml
        retention-days: 30

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: build-logs
        path: |
          build/CMakeFiles/*.log
          build/Testing/Temporary/
        retention-days: 7

    - name: Generate Test Summary
      if: always()
      run: |
        cd build/tests
        echo "## W3C SCXML Test Results (C++)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "[View Detailed HTML Report](https://newmassrael.github.io/scxml-core-engine/test-results/test-results.html)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f w3c_test_results.xml ]; then
          total=$(grep -oP 'tests="\K[0-9]+' w3c_test_results.xml | head -1)
          failures=$(grep -oP 'failures="\K[0-9]+' w3c_test_results.xml | head -1)
          errors=$(grep -oP 'errors="\K[0-9]+' w3c_test_results.xml | head -1)
          passed=$((total - failures - errors))
          pass_rate=$(awk "BEGIN {printf \"%.1f\", ($passed / $total) * 100}")

          # Count tests by engine type (using classname)
          interpreter_total=$(grep -oP 'classname="W3C_Interpreter"' w3c_test_results.xml | wc -l)
          aot_total=$(grep -oP 'classname="W3C_AOT"' w3c_test_results.xml | wc -l)

          # Count passed tests by engine type (no failure tags)
          interpreter_passed=$(grep 'classname="W3C_Interpreter"' w3c_test_results.xml | grep -v '<failure' | wc -l)
          aot_passed=$(grep 'classname="W3C_AOT"' w3c_test_results.xml | grep -v '<failure' | wc -l)

          interpreter_failed=$((interpreter_total - interpreter_passed))
          aot_failed=$((aot_total - aot_passed))

          # Display engine-specific statistics
          echo "| Engine | Total | Passed | Failed |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Interpreter | $interpreter_total | $interpreter_passed | $interpreter_failed |" >> $GITHUB_STEP_SUMMARY
          if [ $aot_total -gt 0 ]; then
            echo "| AOT | $aot_total | $aot_passed | $aot_failed |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Total** | **$total** | **$passed** | **$((failures + errors))** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Pass Rate:** ${pass_rate}%" >> $GITHUB_STEP_SUMMARY
        else
          echo "Test results file not found" >> $GITHUB_STEP_SUMMARY
        fi

  # ============================================================
  # Rust AOT — 202 tests
  # ============================================================
  test-rust:
    name: Rust W3C Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only
        # builds the debug profile, so a release binary the cache still
        # holds is not a product of this commit. The locator knows which
        # path that is; naming it here would put a build-layout detail
        # back into every workflow.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    - name: Generate Rust W3C Tests
      run: ./target/debug/sce-codegen generate-w3c -l rust

    - name: Start W3C HTTP Test Server
      run: |
        node tests/w3c/standalone_http_server.js 8080 /test &
        echo $! > /tmp/http_server.pid
        sleep 1
        echo "W3C HTTP test server started (PID: $(cat /tmp/http_server.pid))"

    - name: Run W3C Tests
      run: |
        set -o pipefail
        echo "=== Rust W3C SCXML Conformance Tests ==="
        cargo test --release --no-fail-fast -p sce-rust-tests 2>&1 | tee rust_test_output.log

    - name: Stop W3C HTTP Test Server
      if: always()
      run: |
        if [ -f /tmp/http_server.pid ]; then
          kill $(cat /tmp/http_server.pid) 2>/dev/null || true
          rm -f /tmp/http_server.pid
        fi

    - name: Upload Test Log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: w3c-test-output-rust
        path: rust_test_output.log
        retention-days: 30

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## W3C SCXML Test Results (Rust)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f rust_test_output.log ]; then
          # Cargo runs each test binary separately, so sum all "test result:" lines
          passed=$(grep "^test result:" rust_test_output.log | grep -oP '\d+ passed' | grep -oP '\d+' | paste -sd+ | bc)
          failed=$(grep "^test result:" rust_test_output.log | grep -oP '\d+ failed' | grep -oP '\d+' | paste -sd+ | bc)
          total=$((passed + failed))
          if [ "$total" -gt 0 ] 2>/dev/null; then
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | ${failed:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Total | $total |" >> $GITHUB_STEP_SUMMARY
            echo "{\"passed\":$passed,\"failed\":${failed:-0},\"total\":$total}" > rust_results.json
          else
            echo "Could not parse test results" >> $GITHUB_STEP_SUMMARY
          fi
        fi

    - name: Upload Results JSON
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: backend-results-rust
        path: rust_results.json
        retention-days: 7
        if-no-files-found: ignore

  # ============================================================
  # Kotlin/JVM (Rhino + QuickJS) — 202 tests per engine
  # ============================================================
  test-kotlin:
    name: Kotlin W3C Tests
    runs-on: ubuntu-latest
    # The junit reporter below creates a check run, which needs `checks: write`.
    # Without it the step fails with "Resource not accessible by integration"
    # and the Kotlin results have no check of their own — the sibling C++ job
    # declared this and this one did not, so only one of the two reporters
    # could publish.
    permissions:
      checks: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo (codegen)
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('sce-build/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-codegen-

    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only
        # builds the debug profile, so a release binary the cache still
        # holds is not a product of this commit. The locator knows which
        # path that is; naming it here would put a build-layout detail
        # back into every workflow.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Gradle
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # Generation and the suite are one gate — the same one the pre-push hook
    # runs. The floor on cases, the failures/errors read from the JUnit XML
    # rather than from Gradle's exit status, and the check that the run left
    # the committed tree unchanged all live there, so this lane and a
    # developer's machine judge the Kotlin surface by the same rules.
    - name: Run W3C Tests (Rhino + QuickJS engines)
      run: |
        set -o pipefail
        echo "=== Kotlin W3C SCXML Conformance Tests (Rhino + QuickJS) ==="
        scripts/gate w3c-kotlin 2>&1 | tee kotlin_test_output.log

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: w3c-test-results-kotlin
        path: backends/kotlin/tests/build/reports/tests/test/
        retention-days: 30

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6
      if: always()
      with:
        report_paths: 'backends/kotlin/tests/build/test-results/test/*.xml'
        detailed_summary: true
        include_passed: true
        fail_on_failure: false
        check_name: 'W3C SCXML Test Results (Kotlin)'

    - name: Generate Test Summary
      if: always()
      run: |
        # The report directory holds the LAST engine the gate ran, so this
        # summary is that engine's numbers rather than both. The verdict for
        # every engine is the gate's, which fails on any of them; this line is
        # a summary and says which run it is summarising.
        echo "## W3C SCXML Test Results (Kotlin/JVM - last engine run)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        REPORT_DIR="backends/kotlin/tests/build/test-results/test"
        if [ -d "$REPORT_DIR" ]; then
          total=$(grep -roh 'tests="[0-9]*"' "$REPORT_DIR"/*.xml | grep -oP '\d+' | paste -sd+ | bc)
          failures=$(grep -roh 'failures="[0-9]*"' "$REPORT_DIR"/*.xml | grep -oP '\d+' | paste -sd+ | bc)
          errors=$(grep -roh 'errors="[0-9]*"' "$REPORT_DIR"/*.xml | grep -oP '\d+' | paste -sd+ | bc)
          passed=$((total - failures - errors))
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $((failures + errors)) |" >> $GITHUB_STEP_SUMMARY
          echo "| Total | $total |" >> $GITHUB_STEP_SUMMARY
          echo "{\"passed\":$passed,\"failed\":$((failures + errors)),\"total\":$total}" > kotlin_results.json
        else
          echo "Test report directory not found" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Results JSON
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: backend-results-kotlin
        path: kotlin_results.json
        retention-days: 7
        if-no-files-found: ignore

  # ============================================================
  # Python Bindings (pybind11 → C++ Interpreter) — 202 tests
  # Distinct from the AOT family member (`test-python`); this job
  # exercises the runtime-interpreter channel via pybind11 wrappers.
  # ============================================================
  test-python-bindings:
    name: Python Bindings (pybind) W3C Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          g++ \
          ninja-build \
          pkg-config \
          libxml2-dev \
          libspdlog-dev \
          libfmt-dev \
          libboost-dev \
          python3-dev

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo (codegen)
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('sce-build/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-codegen-

    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only
        # builds the debug profile, so a release binary the cache still
        # holds is not a product of this commit. The locator knows which
        # path that is; naming it here would put a build-layout detail
        # back into every workflow.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    - name: Cache CMake Build
      uses: actions/cache@v5
      with:
        path: |
          build_python/CMakeCache.txt
          build_python/CMakeFiles
          build_python/_deps
        key: ${{ runner.os }}-cmake-python-${{ hashFiles('**/CMakeLists.txt', 'backends/python/bindings/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-python-

    # Build and suite are one gate — the same one the pre-push hook runs.
    # SCE_REQUIRE_TOOLS turns the gate's "python3-dev missing, skipping" into
    # a failure here: this job installs the package, so a skip would mean the
    # install stopped working and the lane reported green anyway.
    - name: Run W3C Tests
      env:
        SCE_REQUIRE_TOOLS: 1
      run: |
        set -o pipefail
        scripts/gate w3c-python-bindings 2>&1 | tee python_bindings_test_output.log

    - name: Upload Test Log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: w3c-test-output-python-bindings
        path: python_bindings_test_output.log
        retention-days: 30

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## W3C SCXML Test Results (Python Bindings)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f python_bindings_test_output.log ]; then
          # Parse Python test runner output
          pass_line=$(grep "PASS:" python_bindings_test_output.log | tail -1)
          fail_line=$(grep "FAIL:" python_bindings_test_output.log | tail -1)
          if [ -n "$pass_line" ]; then
            passed=$(echo "$pass_line" | grep -oP '\d+(?=/)')
            total=$(echo "$pass_line" | grep -oP '(?<=/)\d+')
            failed=$(grep "FAIL:" python_bindings_test_output.log | tail -1 | grep -oP '\d+(?=/)' || echo "0")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | ${failed:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Total | $total |" >> $GITHUB_STEP_SUMMARY
            echo "{\"passed\":$passed,\"failed\":${failed:-0},\"total\":$total}" > python_bindings_results.json
          else
            echo "Could not parse test results" >> $GITHUB_STEP_SUMMARY
          fi
        fi

    - name: Upload Results JSON
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: backend-results-python-bindings
        path: python_bindings_results.json
        retention-days: 7
        if-no-files-found: ignore

  # ============================================================
  # Python AOT (sce-codegen → *_sm.py + lupa runtime) — 202 tests
  # Mirrors test-rust / test-kotlin / test-go: same codegen pipeline,
  # same family-member AOT lane. The `test-python-bindings` job above
  # is the special-case channel (pybind11 → C++ Interpreter).
  # ============================================================
  test-python:
    name: Python W3C Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo (codegen)
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('sce-build/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-codegen-

    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only
        # builds the debug profile, so a release binary the cache still
        # holds is not a product of this commit. The locator knows which
        # path that is; naming it here would put a build-layout detail
        # back into every workflow.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install Python Runtime
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install lupa pytest

    # Generation and the suite are one gate — the same one the pre-push hook
    # runs. The runtime is reached through PYTHONPATH there rather than
    # `pip install -e`, because a gate must not mutate the environment it runs
    # in; the import resolves to the same working-tree package either way.
    - name: Run W3C Tests
      run: |
        set -o pipefail
        scripts/gate w3c-python 2>&1 | tee python_test_output.log

    - name: Upload Test Log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: w3c-test-output-python
        path: python_test_output.log
        retention-days: 30

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## W3C SCXML Test Results (Python)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f python_test_output.log ]; then
          # pytest's `-v` output: one `PASSED` / `FAILED` per test.
          passed=$(grep -c " PASSED" python_test_output.log || true)
          failed=$(grep -c " FAILED" python_test_output.log || true)
          total=$((passed + failed))
          if [ "$total" -gt 0 ] 2>/dev/null; then
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | ${failed:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Total | $total |" >> $GITHUB_STEP_SUMMARY
            echo "{\"passed\":$passed,\"failed\":${failed:-0},\"total\":$total}" > python_results.json
          else
            echo "Could not parse test results" >> $GITHUB_STEP_SUMMARY
          fi
        fi

    - name: Upload Results JSON
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: backend-results-python
        path: python_results.json
        retention-days: 7
        if-no-files-found: ignore

  # ============================================================
  # Go AOT — 202 tests
  # ============================================================
  test-go:
    name: Go W3C Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo (codegen)
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('sce-build/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-codegen-

    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only
        # builds the debug profile, so a release binary the cache still
        # holds is not a product of this commit. The locator knows which
        # path that is; naming it here would put a build-layout detail
        # back into every workflow.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.22'
        cache-dependency-path: |
          backends/go/runtime/go.sum
          backends/go/lua/go.sum
          backends/go/tests/go.sum

    # Generation, the fixture server and the suite are one gate — the same
    # one the pre-push hook runs. The server used to be started and stopped
    # by two steps of this job; the gate owns its lifetime now, which is what
    # lets it be run by hand without remembering either half.
    - name: Run W3C Tests
      run: |
        set -o pipefail
        scripts/gate w3c-go 2>&1 | tee backends/go/go_test_output.log

    - name: Upload Test Log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: w3c-test-output-go
        path: go_test_output.log
        retention-days: 30

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## W3C SCXML Test Results (Go)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f go_test_output.log ]; then
          passed=$(grep -c "^--- PASS:" go_test_output.log || true)
          failed=$(grep -c "^--- FAIL:" go_test_output.log || true)
          total=$((passed + failed))
          if [ "$total" -gt 0 ] 2>/dev/null; then
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | ${failed:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Total | $total |" >> $GITHUB_STEP_SUMMARY
            echo "{\"passed\":$passed,\"failed\":${failed:-0},\"total\":$total}" > go_results.json
          else
            echo "Could not parse test results" >> $GITHUB_STEP_SUMMARY
          fi
        fi

    - name: Upload Results JSON
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: backend-results-go
        path: go_results.json
        retention-days: 7
        if-no-files-found: ignore

  # ============================================================
  # C11 (MCU backend) — 218 ctest cases
  #   204 W3C + 11 integration + 3 unit (+2 HTTP fixtures)
  #
  # This backend had no CI job at all: `w3c-tests.yml` covered
  # cpp/rust/kotlin/python/go, and the only workflow that ran ctest was
  # forge-conformance.yml. The pre-push hook does not run the W3C ctest
  # suite either — deliberately, and its comment says so — so the entire
  # C11 surface was verified by whoever happened to run `ctest` locally.
  # "C11 W3C 204/204" was a local measurement that no push re-confirmed,
  # while `watching-zenoh` ships C11 on an MCU.
  #
  # The lane is cheap. Measured on a clean tree: configure 4.5s, codegen
  # for 271 translation units plus 215 executables 9s, the 218 tests 4s.
  # The expensive step is `sce-codegen`, which the cargo cache shared with
  # the other jobs already pays for.
  # ============================================================
  test-c11:
    name: C11 W3C Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          ccache \
          pkg-config \
          libxml2-dev \
          libspdlog-dev \
          libfmt-dev \
          libboost-dev

    - name: Setup Problem Matchers
      run: |
        echo "::add-matcher::.github/problem-matchers/gcc.json"
        echo "::add-matcher::.github/problem-matchers/cmake.json"

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo (codegen)
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('sce-build/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-codegen-

    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only
        # builds the debug profile, so a release binary the cache still
        # holds is not a product of this commit. The locator knows which
        # path that is; naming it here would put a build-layout detail
        # back into every workflow.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    - name: Setup ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-c11-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-c11-

    # Configure, build and run are one gate — the same one the pre-push hook
    # runs. The floor on registered tests and the executed-vs-registered
    # comparison live there now, so this lane and a developer's machine judge
    # the C11 surface by the same rules.
    - name: Run C11 ctest Suite
      run: |
        set -o pipefail
        scripts/gate w3c-c11 2>&1 | tee c11_ctest.log

    - name: Upload Test Log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: w3c-test-output-c11
        path: c11_ctest.log
        retention-days: 30

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## W3C SCXML Test Results (C11)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f c11_ctest.log ]; then
          total=$(grep -oE 'out of [0-9]+' c11_ctest.log | tail -1 | grep -oE '[0-9]+')
          failed=$(grep -oE '[0-9]+ tests failed' c11_ctest.log | tail -1 | grep -oE '[0-9]+')
          total=${total:-0}
          failed=${failed:-0}
          passed=$((total - failed))
          if [ "$total" -gt 0 ] 2>/dev/null; then
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $failed |" >> $GITHUB_STEP_SUMMARY
            echo "| Total | $total |" >> $GITHUB_STEP_SUMMARY
            echo "{\"passed\":$passed,\"failed\":$failed,\"total\":$total}" > c11_results.json
          else
            echo "Could not parse ctest results" >> $GITHUB_STEP_SUMMARY
          fi
        fi

    - name: Upload Results JSON
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: backend-results-c11
        path: c11_results.json
        retention-days: 7
        if-no-files-found: ignore

  # ============================================================
  # Unified HTML Report + GitHub Pages Deploy
  # ============================================================
  report:
    name: Unified Report
    runs-on: ubuntu-latest
    needs: [test-cpp, test-rust, test-kotlin, test-python-bindings, test-python, test-go, test-c11]
    if: always()
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Download All Artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts/

    - name: Merge Backend Results
      run: |
        # Combine Rust/Kotlin/Python (AOT + bindings)/Go JSON results into
        # one file. `python` is the AOT family-member channel
        # (sce-codegen → *_sm.py + lupa runtime); `python-bindings` is the
        # special pybind11 → C++ Interpreter channel.
        echo '{' > backend_results.json
        first=true
        for backend in rust kotlin python python-bindings go c11; do
          # Result files use the same key the artifact uses (e.g.
          # python_bindings_results.json). The artifact directory
          # follows the same hyphen convention.
          file_key=$(echo "$backend" | tr '-' '_')
          json_file="artifacts/backend-results-${backend}/${file_key}_results.json"
          if [ -f "$json_file" ]; then
            if [ "$first" = true ]; then first=false; else echo ',' >> backend_results.json; fi
            echo "\"${backend}\": $(cat "$json_file")" >> backend_results.json
            echo "Found $backend results: $(cat "$json_file")"
          else
            echo "No results for $backend"
          fi
        done
        echo '}' >> backend_results.json
        echo "=== Merged backend results ==="
        cat backend_results.json

    - name: Generate Unified HTML Report
      run: |
        CPP_XML="artifacts/w3c-test-results-cpp/w3c_test_results.xml"
        if [ -f "$CPP_XML" ]; then
          python3 tests/w3c/scripts/xml_to_html.py \
            "$CPP_XML" \
            test-results.html \
            --backend-results backend_results.json
          echo "Unified HTML report generated"
        else
          echo "C++ XML results not found - cannot generate report"
        fi

    - name: Prepare GitHub Pages
      run: |
        mkdir -p gh-pages
        if [ -f test-results.html ]; then
          cp test-results.html gh-pages/test-results.html
        fi
        CPP_XML="artifacts/w3c-test-results-cpp/w3c_test_results.xml"
        if [ -f "$CPP_XML" ]; then
          cp "$CPP_XML" gh-pages/w3c_test_results.xml
        fi

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
        destination_dir: test-results
        keep_files: true
