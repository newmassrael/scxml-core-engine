name: W3C SCXML Compliance Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      log-level:
        description: 'Log level for test execution'
        required: false
        default: 'error'
        type: choice
        options:
          - trace
          - debug
          - info
          - warn
          - error
          - off

# This lane is not superseded by the push that follows it.
#
# Measured 2026-09-02 over this lane's own last 25 runs: a 70.0 min median
# success against a 17.6 min median gap between pushes to `main`, so it cannot
# finish between two of them — and it declares no `paths:` filter, so every
# push reaches it. 14 of those 25 runs ended `cancelled`, over 9 successes.
#
# ⚠⚠ `false` is set here and this is still the second-worst answer rate in the
# directory: a longest consecutive silence of 12 pushes over 317 minutes, and
# its eight newest cancellations killed no started work at all — every one was
# cancelled while still entirely PENDING. `false` protects the run in flight,
# and under a saturated runner pool no run reaches flight to be protected.
# The setting is right and it is not sufficient; the shortfall is runners.
# `cpp-suite.yml` recorded THIS lane's ratio in prose on the same day it
# repaired its own and left this one alone; prose is the reason it survived
# that day, and `ci_supersession_policy` is why prose is no longer what holds
# these two numbers.
#
# `false` rather than a per-commit key, deliberately: a newly queued run still
# cancels a PENDING one, so `false` saves the run IN FLIGHT and the LATEST
# commit and defers the ones between. That is the right trade for a lane whose
# answer is about a BRANCH — this one re-asks the whole conformance corpus
# against whatever the tree now holds. `mutation-rounds.yml` answers about a
# COMMIT instead -- selection is by change set, and nothing re-selects it -- so
# it starts its range at the last commit that reached a verdict.
#
# Held by `sce-build/tests/ci_supersession_policy.rs`, which classifies EVERY
# workflow in this directory and reds one nobody classified; the derivation and
# the command that re-takes the measurement live there.
#
# ⚠ BACK TO `false` BY OWNER DECISION, 2026-10-01, reversing the flip to `true`
# of 2026-09-15: the run in flight is kept and one waiting run holds the newest
# commit. See `cpp-suite.yml` for the reasoning and the cost;
# `ci_supersession_policy.rs` requires `false` everywhere.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # C++ (Interpreter + AOT) — 404 tests, in six shards
  # ============================================================
  # One program per W3C test number (tests/w3c/W3CPrograms.cmake), each
  # registered as the ctest `w3c_cpp_<number>` under the label `w3c_cpp`
  # with the interactive suite. The one program that held every fixture was
  # 41 of this job's 47 minutes to build and 51 seconds to run (job
  # 138891691638), so the label runs as six jobs: each plans the whole label
  # from the configured tree (scripts/lib/ctest_shards.py), builds the
  # programs of its own part and runs them, and the job below holds the parts
  # to one plan and their joined JUnit reports to every fixture of the
  # registry on both engines. Six, from that build: about seven of its
  # minutes are the runner core and the engine, which every shard builds,
  # and the rest spreads, so a shard builds for about ten minutes. A red
  # fixture is reproduced by building and running its one program.
  # `hook_ci_parity` holds the matrix and the variable to one count, and
  # the build machines run the gate whole.
  test-cpp-shard:
    name: C++ W3C Tests (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-24.04
    # packages: write pulls the gate's image, and pushes it when this run built
    # it (.github/actions/gate-image).
    permissions:
      contents: read
      packages: write
    # An allowance until a sharded run is read: a sixth of the build that
    # took 41 minutes in one job, the shared core and engine on top of it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    - name: Setup Problem Matchers
      run: |
        echo "::add-matcher::.github/problem-matchers/gcc.json"
        echo "::add-matcher::.github/problem-matchers/cmake.json"

    # The pinned release, which the runner hands the image read-only: the
    # image carries no Rust of its own (`gate_in_container` in scripts/gate).
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # Rust, and the C and C++ of every CMake tree the job configures, compile
    # through the shared compile cache (.github/actions/compile-cache): a unit
    # another shard or lane compiled alike is answered from it.
    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache
      with:
        cmake: true

    # The configure's cache records the compilers it found, which are the
    # image's, so its key names the image's build context: a configure of one
    # image is never restored into a run of another.
    - name: Cache CMake Build
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          build/CMakeCache.txt
          build/CMakeFiles
          build/_deps
        key: ${{ runner.os }}-cmake-host-image-${{ hashFiles('tools/ci-images/host/**') }}-${{ github.repository }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-host-image-${{ hashFiles('tools/ci-images/host/**') }}-${{ github.repository }}-

    # The answers of the generator's configure-time plans
    # (cmake/SCECodegenPlan.cmake). After a checkout every restored answer is
    # older than the documents and is asked again; what the restore brings is
    # the list of the plans the last run asked, which the configure asks in one
    # parallel batch at its start instead of one by one.
    - name: Cache the generator's configure-time plans
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: build/sce-codegen-plans
        key: ${{ runner.os }}-sce-codegen-plans-w3c-cpp-${{ hashFiles('sce-build/src/**', 'tools/codegen/templates/**', 'cmake/**', '**/CMakeLists.txt', 'resources/**', 'integration_resources/**', 'tests/mesh/**') }}
        restore-keys: |
          ${{ runner.os }}-sce-codegen-plans-w3c-cpp-

    # The gate runs in the host image (`container` of its registry entry),
    # which holds the compilers and lld, CMake and Ninja, the libraries the
    # tree links and clang-format 19, which `sce-codegen` formats the W3C AOT
    # headers with (docs/SCE_CODEGEN_DETERMINISM.md §9). The runner inside the
    # image builds `sce-codegen` first, through its `codegen-build` gate.
    - name: Sign in to the gate images' registry
      uses: ./.github/actions/gate-image

    # Configure, build and run are one gate, so the check has one spelling for
    # this lane and for the pre-push hook. The gate writes this shard's joined
    # JUnit report and its ctest log where the upload below expects them.
    #
    # The `specific-tests` dispatch input was dropped when this moved: running
    # a subset produces a green check for a suite that did not run, which is
    # the failure this lane already shipped — 233 of 234 cases failing under a
    # green check for three weeks. A subset is a debugging move and belongs at
    # a developer's own `ctest -R '^w3c_cpp_531$'`, not in the channel that
    # reports conformance; the shards are no subset, since the job below holds
    # them to the whole registry.
    - name: Run W3C SCXML Test Suite
      env:
        SCE_W3C_CPP_SHARD: ${{ matrix.shard }}/6
      run: |
        SPDLOG_LEVEL="${{ inputs.log-level || 'debug' }}" \
        SCE_W3C_REPORT_DIR=build/tests \
          scripts/gate w3c-cpp

    # The plan and what this shard ran (`test-cpp` reads them), its joined
    # report and ctest log, and the logs the runner keeps of a failed fixture.
    - name: Upload this shard's plan, report and log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: w3c-cpp-shard-${{ matrix.shard }}
        path: |
          build/ctest-shard-w3c-cpp/
          build/tests/w3c_test_results.xml
          build/tests/w3c_test_output.log
          build/tests/w3c_runs/*/w3c_failed_test_logs/
        retention-days: 30
        if-no-files-found: warn

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: build-logs-w3c-cpp-shard-${{ matrix.shard }}
        path: |
          build/CMakeFiles/*.log
          build/Testing/Temporary/
        retention-days: 7

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # The verdict of the C++ lane: every shard planned the label alike and ran
  # every test of its part (`ctest_shards.py verify`), and the shards' joined
  # reports list every fixture of the registry once on each engine
  # (tests/w3c/scripts/w3c_reports.py `join`). It keeps the job's id and
  # name, so the report below and the lane's readers find it where the
  # unsharded job was, and it publishes the check, the results and the
  # summary the unsharded job did, from the joined report.
  test-cpp:
    name: C++ W3C Tests
    needs: test-cpp-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      pull-requests: write
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Download the shards' plans, reports and logs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: w3c-cpp-shard-*
        path: shards

    - name: Hold the shards to one plan and the registry
      env:
        SHARDS_RESULT: ${{ needs.test-cpp-shard.result }}
      run: |
        status=0
        python3 scripts/lib/ctest_shards.py verify shards || status=1
        mkdir -p build/tests
        mapfile -t reports < <(find shards -name w3c_test_results.xml)
        python3 tests/w3c/scripts/w3c_reports.py join \
          --registry tests/w3c/conformance/fixtures.json \
          --out build/tests/w3c_test_results.xml "${reports[@]}" || status=1
        if [[ "$SHARDS_RESULT" != success ]]; then
          echo "::error title=C++ W3C Tests::a shard job ended $SHARDS_RESULT"
          status=1
        fi
        exit "$status"

    # The shards' ctest logs, one after another, under the name the unsharded
    # job's log had.
    - name: Join the shards' logs
      if: always()
      run: |
        mkdir -p build/tests
        : > build/tests/w3c_test_output.log
        for log in shards/w3c-cpp-shard-*/tests/w3c_test_output.log; do
          [ -f "$log" ] || continue
          echo "===== $log" >> build/tests/w3c_test_output.log
          cat "$log" >> build/tests/w3c_test_output.log
        done

    - name: Upload Test Output Log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: w3c-test-output-log
        path: build/tests/w3c_test_output.log
        retention-days: 30
        if-no-files-found: warn

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
      if: always()
      with:
        report_paths: 'build/tests/w3c_test_results.xml'
        detailed_summary: true
        include_passed: true
        fail_on_failure: false
        check_name: 'W3C SCXML Test Results (C++)'
        summary: '[View Detailed HTML Report](https://newmassrael.github.io/scxml-core-engine/test-results/test-results.html)'
        annotate_only: false

    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: w3c-test-results-cpp
        path: build/tests/w3c_test_results.xml
        retention-days: 30

    - name: Generate Test Summary
      if: always()
      run: |
        cd build/tests
        echo "## W3C SCXML Test Results (C++)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "[View Detailed HTML Report](https://newmassrael.github.io/scxml-core-engine/test-results/test-results.html)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f w3c_test_results.xml ]; then
          total=$(grep -oP 'tests="\K[0-9]+' w3c_test_results.xml | head -1)
          failures=$(grep -oP 'failures="\K[0-9]+' w3c_test_results.xml | head -1)
          errors=$(grep -oP 'errors="\K[0-9]+' w3c_test_results.xml | head -1)
          skipped=$(grep -oP 'skipped="\K[0-9]+' w3c_test_results.xml | head -1)
          skipped=${skipped:-0}
          # A skipped case was not run: neither a pass nor a failure, and
          # the pass rate is over the cases that ran
          passed=$((total - failures - errors - skipped))
          ran=$((total - skipped))
          pass_rate=$(awk "BEGIN {printf \"%.1f\", ($ran > 0) ? ($passed / $ran) * 100 : 0}")

          # Count each engine's cases by the result each testcase carries.
          # The runner writes one testcase a line with classname before
          # result (W3CTestRunner.cpp), so one grep counts it: no pipeline
          # to swallow a read failure; `|| true` covers only "no match",
          # where grep -c still prints 0.
          engine_count() {
            grep -c "classname=\"$1\".*$2" w3c_test_results.xml || true
          }
          interpreter_total=$(engine_count W3C_Interpreter 'result="')
          interpreter_passed=$(engine_count W3C_Interpreter 'result="PASS"')
          interpreter_skipped=$(engine_count W3C_Interpreter 'result="SKIPPED"')
          aot_total=$(engine_count W3C_AOT 'result="')
          aot_passed=$(engine_count W3C_AOT 'result="PASS"')
          aot_skipped=$(engine_count W3C_AOT 'result="SKIPPED"')

          interpreter_failed=$((interpreter_total - interpreter_passed - interpreter_skipped))
          aot_failed=$((aot_total - aot_passed - aot_skipped))

          # Display engine-specific statistics
          echo "| Engine | Total | Passed | Failed | Skipped |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|--------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Interpreter | $interpreter_total | $interpreter_passed | $interpreter_failed | $interpreter_skipped |" >> $GITHUB_STEP_SUMMARY
          if [ $aot_total -gt 0 ]; then
            echo "| AOT | $aot_total | $aot_passed | $aot_failed | $aot_skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Total** | **$total** | **$passed** | **$((failures + errors))** | **$skipped** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Pass Rate:** ${pass_rate}%" >> $GITHUB_STEP_SUMMARY
        else
          echo "Test results file not found" >> $GITHUB_STEP_SUMMARY
        fi

  # ============================================================
  # C++ under Node (emscripten) — the 404 tests and the interactive
  # suite, in the threaded tree and in the one without threads
  # ============================================================
  # One gate, `w3c-wasm`, builds the C++ W3C programs and the interactive
  # suite in an emscripten tree and runs them (scripts/gates/lib.sh, the two
  # emscripten trees): the threaded engine the native build runs, and the
  # host-driven one the browser visualizer runs. Jobs of their own beside the
  # native ones, as `cpp-suite-wasm` is beside the native suite, because the
  # two builds fail for different reasons and one red must not hide the
  # other. Each tree spent about 22 minutes building the one program that
  # held every fixture, one tree after the other (job 138891691350), so each
  # tree is its own set of jobs and its label runs in four shards, planned
  # and held as the native lane's are. Four, from that build: the programs
  # are a link each where they were one, and the cost of an emscripten link
  # is not yet read, so this stands until a sharded run is. SCE_REQUIRE_TOOLS
  # turns the gate's "emsdk missing, skipping" into a failure here, where the
  # gate's image holds emsdk.
  test-cpp-wasm-shard:
    name: C++ W3C Tests (WASM, ${{ matrix.tree }} engine, shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    # packages: write pulls the gate's image, and pushes it when this run built
    # it (.github/actions/gate-image).
    permissions:
      contents: read
      packages: write
    # An allowance until a sharded run is read: a quarter of one tree's build,
    # which took 22 minutes as one program, with a link per program on top.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        tree: [threaded, host-driven]
        shard: [1, 2, 3, 4]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    - name: Setup Problem Matchers
      run: |
        echo "::add-matcher::.github/problem-matchers/gcc.json"
        echo "::add-matcher::.github/problem-matchers/cmake.json"

    # The pinned release, which the runner hands the image read-only: the
    # image carries no Rust of its own (`gate_in_container` in scripts/gate).
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # Rust, and what emcc compiles, through the shared compile cache
    # (.github/actions/compile-cache says how emcc reaches it).
    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache
      with:
        emscripten: true

    # The gate runs in the host image (`container` of its registry entry),
    # which holds emsdk at the release scripts/install_emsdk.sh pins (the
    # registry's self-test holds the two to one), CMake and Ninja, and
    # clang-format 19, which `sce-codegen` formats the W3C AOT headers with
    # (docs/SCE_CODEGEN_DETERMINISM.md §9). The gate finds the SDK itself
    # (`sce_gate_activate_emsdk` in scripts/gates/lib.sh), and the runner
    # inside the image builds `sce-codegen` first, through its
    # `codegen-build` gate.
    - name: Sign in to the gate images' registry
      uses: ./.github/actions/gate-image

    - name: Run W3C SCXML Test Suite (WASM, under Node, one tree's shard)
      env:
        SCE_REQUIRE_TOOLS: 1
        SCE_W3C_WASM_TREE: ${{ matrix.tree }}
        SCE_W3C_WASM_SHARD: ${{ matrix.shard }}/4
      run: scripts/gate w3c-wasm

    # The plan and what this shard ran (`test-cpp-wasm` reads them), its
    # joined report and ctest log, and the logs the runner keeps of a failed
    # fixture. Only the tree this job ran exists.
    - name: Upload this shard's plan, report and log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: w3c-wasm-${{ matrix.tree }}-shard-${{ matrix.shard }}
        path: |
          build_wasm/ctest-shard-w3c-wasm/
          build_wasm/tests/w3c_test_results.xml
          build_wasm/tests/w3c_test_output.log
          build_wasm/tests/w3c_runs/*/w3c_failed_test_logs/
          build_wasm_web/ctest-shard-w3c-wasm/
          build_wasm_web/tests/w3c_test_results.xml
          build_wasm_web/tests/w3c_test_output.log
          build_wasm_web/tests/w3c_runs/*/w3c_failed_test_logs/
        retention-days: 30
        if-no-files-found: warn

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # The verdict of the WASM lane, for each tree: its shards planned the label
  # alike and ran every test of their parts (`ctest_shards.py verify`), and
  # their joined reports list every fixture of the registry once on each
  # engine. It keeps the job's id and name, so the lane's readers find it
  # where the unsharded job was.
  test-cpp-wasm:
    name: C++ W3C Tests (WASM, under Node)
    needs: test-cpp-wasm-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Download the threaded tree's shards
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: w3c-wasm-threaded-shard-*
        path: shards/threaded

    - name: Download the host-driven tree's shards
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: w3c-wasm-host-driven-shard-*
        path: shards/host-driven

    - name: Hold each tree's shards to one plan and the registry
      env:
        SHARDS_RESULT: ${{ needs.test-cpp-wasm-shard.result }}
      run: |
        status=0
        for tree in threaded host-driven; do
          python3 scripts/lib/ctest_shards.py verify "shards/$tree" || status=1
          mapfile -t reports < <(find "shards/$tree" -name w3c_test_results.xml)
          python3 tests/w3c/scripts/w3c_reports.py join \
            --registry tests/w3c/conformance/fixtures.json \
            --out "shards/w3c_wasm_results_$tree.xml" "${reports[@]}" || status=1
        done
        if [[ "$SHARDS_RESULT" != success ]]; then
          echo "::error title=C++ W3C Tests (WASM)::a shard job ended $SHARDS_RESULT"
          status=1
        fi
        exit "$status"

    - name: Upload WASM Test Output
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: w3c-test-output-wasm
        path: shards/
        retention-days: 30
        if-no-files-found: ignore

  # ============================================================
  # Rust AOT — 202 tests
  # ============================================================
  # The Rust arm in four shards, one job each, and a last job, `test-rust`,
  # that holds them together, as `test-c11` does for the C11 arm. Run whole,
  # the job took 1605 s (job 138891691369, 4c71fb062c): 7 minutes building the
  # target `w3c` with the crate's dependencies and library, 15 building every
  # other target of sce-rust-tests under the release profile's thin LTO and one
  # codegen unit, and about ten seconds of tests. Each job runs the w3c-rust
  # gate with `SCE_W3C_RUST_SHARD`, which builds and runs only its part of the
  # crate's targets (scripts/lib/workspace_shards.py); `hook_ci_parity` holds
  # the matrix and the variable to one count and the parts to every target.
  # Four, because what every job pays whatever its share (the dependencies,
  # the build script's trees and the library) is most of the 7 minutes, which
  # leaves the 15 minutes of targets about four to a job, near the ten minutes
  # a job is sized to; a fifth would save under a minute against another
  # build of the library. No generator step: the crate's build script is the
  # generator of its trees, and the gate starts no `sce-codegen`. The ceiling
  # is the whole arm's until a sharded run is measured.
  test-rust-shard:
    name: Rust W3C Tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    # packages: write pulls the gate's image, and pushes it when this run built
    # it (.github/actions/gate-image).
    permissions:
      contents: read
      packages: write
    timeout-minutes: 65
    strategy:
      fail-fast: false
      # The account's 20 hosted jobs are shared; one job per shard at once.
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # The pinned release, which the runner hands the image read-only: the
    # image carries no Rust of its own (`gate_in_container` in scripts/gate).
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache

    # The gate runs in the host image (`container` of its registry entry),
    # as every gate on Linux does (ADR 0145).
    - name: Sign in to the gate images' registry
      uses: ./.github/actions/gate-image

    # Generation, the fixture server and the suite are one gate, the shape
    # `test-go` has, so a developer runs this job's check by name with the
    # same command. The gate is `ci_only` in the registry: no push selects
    # it, and this lane is where its verdict is reached. The gate waits for the
    # server's own ready line, exports the port the harness reads, and stops it
    # on exit. The shard holding the target `w3c` also holds the run to a
    # floor: every W3C test file the generator wrote has to report a pass.
    - name: Run W3C Tests
      env:
        SCE_W3C_RUST_SHARD: ${{ matrix.shard }}/4
      run: |
        set -o pipefail
        scripts/gate w3c-rust 2>&1 | tee rust_test_output.log

    # The gate wrote its plan under `target/` inside the image, which is the
    # image's own build directory on this runner (`gate_in_container` in
    # scripts/gate); it is copied to where the upload below reads it.
    - name: Copy this shard's plan out of the image's build directory
      if: always()
      run: |
        plan="$HOME/.cache/sce-gate-containers/w3c-rust/target/w3c-rust-shard"
        mkdir -p target
        if [ -d "$plan" ]; then
          cp -R "$plan" target/
        fi

    # The plan and what this shard ran (`test-rust` reads them), and the log
    # its summary is read from.
    - name: Upload this shard's plan and log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: w3c-rust-shard-${{ matrix.shard }}
        path: |
          rust_test_output.log
          target/w3c-rust-shard/
        retention-days: 30
        if-no-files-found: warn

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # The verdict of the Rust arm: every shard planned the suite alike and ran
  # every unit of its part, for the reason `cpp-suite-verdict` gives. It keeps
  # the job's id and name, so the report below and the arm's readers find it
  # where the unsharded job was, and it writes the arm's summary and results
  # from the four shards' logs together.
  test-rust:
    name: Rust W3C Tests
    needs: test-rust-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Download the shards' plans and logs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: w3c-rust-shard-*
        path: shards

    - name: Hold the shards to one plan and the whole suite
      env:
        SHARDS_RESULT: ${{ needs.test-rust-shard.result }}
      run: |
        status=0
        python3 scripts/lib/ctest_shards.py verify shards || status=1
        if [[ "$SHARDS_RESULT" != success ]]; then
          echo "::error title=w3c-rust::a shard job ended $SHARDS_RESULT"
          status=1
        fi
        exit "$status"

    # The shards' logs, one after another, under the name the unsharded job's
    # log had.
    - name: Join the shards' logs
      if: always()
      run: |
        : > rust_test_output.log
        for log in shards/w3c-rust-shard-*/rust_test_output.log; do
          [ -f "$log" ] || continue
          echo "===== $log" >> rust_test_output.log
          cat "$log" >> rust_test_output.log
        done

    - name: Upload Test Log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: w3c-test-output-rust
        path: rust_test_output.log
        retention-days: 30

    # Summed over the shards: each shard's log holds cargo's own count of
    # what each of its test binaries ran.
    - name: Generate Test Summary
      if: always()
      run: |
        echo "## W3C SCXML Test Results (Rust)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f rust_test_output.log ]; then
          # Cargo runs each test binary separately, so sum all "test result:" lines
          passed=$(grep "^test result:" rust_test_output.log | grep -oP '\d+ passed' | grep -oP '\d+' | paste -sd+ | bc)
          failed=$(grep "^test result:" rust_test_output.log | grep -oP '\d+ failed' | grep -oP '\d+' | paste -sd+ | bc)
          total=$((passed + failed))
          if [ "$total" -gt 0 ] 2>/dev/null; then
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | ${failed:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Total | $total |" >> $GITHUB_STEP_SUMMARY
            echo "{\"passed\":$passed,\"failed\":${failed:-0},\"total\":$total}" > rust_results.json
          else
            echo "Could not parse test results" >> $GITHUB_STEP_SUMMARY
          fi
        fi

    - name: Upload Results JSON
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: backend-results-rust
        path: rust_results.json
        retention-days: 7
        if-no-files-found: ignore

  # ============================================================
  # Kotlin/JVM (Rhino + QuickJS) — 202 tests per engine
  # ============================================================
  test-kotlin:
    name: Kotlin W3C Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The junit reporter below creates a check run, which needs `checks: write`.
    # Without it the step fails with "Resource not accessible by integration"
    # and the Kotlin results have no check of their own — the sibling C++ job
    # declared this and this one did not, so only one of the two reporters
    # could publish.
    # packages: write pulls the gate's image, and pushes it when this run built
    # it (.github/actions/gate-image).
    permissions:
      checks: write
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        # `sce-kotlin-quickjs` compiles `third_party/quickjs/quickjs.c` into a
        # JNI library, so this lane needs the submodule its siblings declare.
        # Without it CMake configured against a source file that was not
        # there — "No SOURCES given to target: sce_quickjs_jni" — and the
        # suite failed before running a case, on Rhino as well as QuickJS.
        submodules: recursive

    # The pinned release, which the runner hands the image read-only: the
    # image carries no Rust of its own (`gate_in_container` in scripts/gate).
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache

    # Gradle's caches as the gate in the image keeps them: its home is the
    # image's own cache directory on this runner (`gate_in_container` in
    # scripts/gate), so `~/.gradle` inside is this path outside. The key names
    # the image, whose JDK the caches were filled by.
    - name: Cache Gradle
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/sce-gate-containers/w3c-kotlin/home/.gradle/caches
          ~/.cache/sce-gate-containers/w3c-kotlin/home/.gradle/wrapper
        key: ${{ runner.os }}-gradle-w3c-host-image-${{ hashFiles('tools/ci-images/host/**') }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-w3c-host-image-${{ hashFiles('tools/ci-images/host/**') }}-

    # The gate runs in the host image (`container` of its registry entry),
    # which holds the JDK the suites run on. The runner inside the image builds
    # `sce-codegen` first, through its `codegen-build` gate.
    - name: Sign in to the gate images' registry
      uses: ./.github/actions/gate-image


    # Generation and the suite are one gate — the same one the pre-push hook
    # runs. The floor on cases, the failures/errors read from the JUnit XML
    # rather than from Gradle's exit status, and the check that the run left
    # the committed tree unchanged all live there, so this lane and a
    # developer's machine judge the Kotlin surface by the same rules.
    # ⚠ Named for the gate's roster rather than for two engines. This step said
    # "Rhino + QuickJS" from before `KOTLIN_ENGINE_PAIRS` grew `lua:ecmascript`
    # and `lua:lua`, so a reader looking for where the Lua pairs run would have
    # concluded they did not. The pairs live in `scripts/gates/w3c-kotlin.sh`
    # and are held by `the_kotlin_gate_runs_every_engine_it_claims`, so naming
    # them again here would be a second copy to go stale.
    - name: Run W3C Tests (every engine/language pair the gate declares)
      run: |
        set -o pipefail
        echo "=== Kotlin W3C SCXML Conformance Tests (every declared pair) ==="
        scripts/gate w3c-kotlin 2>&1 | tee kotlin_test_output.log

    - name: Upload Test Results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: w3c-test-results-kotlin
        # Both suites a row runs: the W3C machines and the integration machines.
        path: |
          backends/kotlin/w3c/build/reports/tests/test/
          backends/kotlin/tests/build/reports/tests/test/
        retention-days: 30

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
      if: always()
      with:
        report_paths: 'backends/kotlin/{w3c,tests}/build/test-results/test/*.xml'
        detailed_summary: true
        include_passed: true
        fail_on_failure: false
        check_name: 'W3C SCXML Test Results (Kotlin)'

    - name: Generate Test Summary
      if: always()
      run: |
        # The report directory holds the LAST engine the gate ran, so this
        # summary is that engine's numbers rather than both. The verdict for
        # every engine is the gate's, which fails on any of them; this line is
        # a summary and says which run it is summarising.
        echo "## W3C SCXML Test Results (Kotlin/JVM - last engine run)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Both suites a row runs write their own result directory.
        REPORT_DIRS="backends/kotlin/w3c/build/test-results/test backends/kotlin/tests/build/test-results/test"
        if [ -d backends/kotlin/w3c/build/test-results/test ] && [ -d backends/kotlin/tests/build/test-results/test ]; then
          total=$(for d in $REPORT_DIRS; do grep -roh 'tests="[0-9]*"' "$d"/*.xml; done | grep -oP '\d+' | paste -sd+ | bc)
          failures=$(for d in $REPORT_DIRS; do grep -roh 'failures="[0-9]*"' "$d"/*.xml; done | grep -oP '\d+' | paste -sd+ | bc)
          errors=$(for d in $REPORT_DIRS; do grep -roh 'errors="[0-9]*"' "$d"/*.xml; done | grep -oP '\d+' | paste -sd+ | bc)
          passed=$((total - failures - errors))
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $((failures + errors)) |" >> $GITHUB_STEP_SUMMARY
          echo "| Total | $total |" >> $GITHUB_STEP_SUMMARY
          echo "{\"passed\":$passed,\"failed\":$((failures + errors)),\"total\":$total}" > kotlin_results.json
        else
          echo "Test report directory not found" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Results JSON
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: backend-results-kotlin
        path: kotlin_results.json
        retention-days: 7
        if-no-files-found: ignore

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # ============================================================
  # Python Bindings (pybind11 → C++ Interpreter) — 202 tests
  # Distinct from the AOT family member (`test-python`); this job
  # exercises the runtime-interpreter channel via pybind11 wrappers.
  # ============================================================
  test-python-bindings:
    name: Python Bindings (pybind) W3C Tests
    runs-on: ubuntu-24.04
    # packages: write pulls the gate's image, and pushes it when this run built
    # it (.github/actions/gate-image).
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    # The pinned release, which the runner hands the image read-only: the
    # image carries no Rust of its own (`gate_in_container` in scripts/gate).
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache

    # The configure's cache records the compilers and the Python it found,
    # which are the image's, so its key names the image's build context.
    - name: Cache CMake Build
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          build_python/CMakeCache.txt
          build_python/CMakeFiles
          build_python/_deps
        key: ${{ runner.os }}-cmake-python-host-image-${{ hashFiles('tools/ci-images/host/**') }}-${{ hashFiles('**/CMakeLists.txt', 'backends/python/bindings/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-python-host-image-${{ hashFiles('tools/ci-images/host/**') }}-

    # The gate runs in the host image (`container` of its registry entry),
    # which holds the compilers, CMake and Ninja, the libraries the tree links
    # and python3-dev. The runner inside the image builds `sce-codegen`, which
    # the tree's configure resolves, through the `codegen-build` gate.
    - name: Sign in to the gate images' registry
      uses: ./.github/actions/gate-image

    # Build and suite are one gate — the same one the pre-push hook runs.
    # SCE_REQUIRE_TOOLS turns the gate's "python3-dev missing, skipping" into
    # a failure here: the image installs the package, so a skip would mean the
    # install stopped working and the lane reported green anyway.
    - name: Run W3C Tests
      env:
        SCE_REQUIRE_TOOLS: 1
      run: |
        set -o pipefail
        scripts/gate w3c-python-bindings 2>&1 | tee python_bindings_test_output.log

    - name: Upload Test Log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: w3c-test-output-python-bindings
        path: python_bindings_test_output.log
        retention-days: 30

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## W3C SCXML Test Results (Python Bindings)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f python_bindings_test_output.log ]; then
          # Parse Python test runner output
          pass_line=$(grep "PASS:" python_bindings_test_output.log | tail -1)
          fail_line=$(grep "FAIL:" python_bindings_test_output.log | tail -1)
          if [ -n "$pass_line" ]; then
            passed=$(echo "$pass_line" | grep -oP '\d+(?=/)')
            total=$(echo "$pass_line" | grep -oP '(?<=/)\d+')
            failed=$(grep "FAIL:" python_bindings_test_output.log | tail -1 | grep -oP '\d+(?=/)' || echo "0")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | ${failed:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Total | $total |" >> $GITHUB_STEP_SUMMARY
            echo "{\"passed\":$passed,\"failed\":${failed:-0},\"total\":$total}" > python_bindings_results.json
          else
            echo "Could not parse test results" >> $GITHUB_STEP_SUMMARY
          fi
        fi

    - name: Upload Results JSON
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: backend-results-python-bindings
        path: python_bindings_results.json
        retention-days: 7
        if-no-files-found: ignore

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # ============================================================
  # Python AOT (sce-codegen → *_sm.py + lupa runtime) — 202 tests
  # Mirrors test-rust / test-kotlin / test-go: same codegen pipeline,
  # same family-member AOT lane. The `test-python-bindings` job above
  # is the special-case channel (pybind11 → C++ Interpreter).
  # ============================================================
  test-python:
    name: Python W3C Tests
    runs-on: ubuntu-24.04
    # packages: write pulls the gate's image, and pushes it when this run built
    # it (.github/actions/gate-image).
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # The pinned release, which the runner hands the image read-only: the
    # image carries no Rust of its own (`gate_in_container` in scripts/gate).
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache

    # The gate runs in the host image (`container` of its registry entry),
    # which holds the pinned Python with lupa and pytest, the runtime's
    # imports. The runner inside the image builds `sce-codegen` first,
    # through its `codegen-build` gate.
    - name: Sign in to the gate images' registry
      uses: ./.github/actions/gate-image

    # Generation and the suite are one gate — the same one the pre-push hook
    # runs. The runtime is reached through PYTHONPATH there rather than
    # `pip install -e`, because a gate must not mutate the environment it runs
    # in; the import resolves to the same working-tree package either way.
    - name: Run W3C Tests
      run: |
        set -o pipefail
        scripts/gate w3c-python 2>&1 | tee python_test_output.log

    - name: Upload Test Log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: w3c-test-output-python
        path: python_test_output.log
        retention-days: 30

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## W3C SCXML Test Results (Python)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f python_test_output.log ]; then
          # pytest's `-v` output: one `PASSED` / `FAILED` per test.
          passed=$(grep -c " PASSED" python_test_output.log || true)
          failed=$(grep -c " FAILED" python_test_output.log || true)
          total=$((passed + failed))
          if [ "$total" -gt 0 ] 2>/dev/null; then
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | ${failed:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Total | $total |" >> $GITHUB_STEP_SUMMARY
            echo "{\"passed\":$passed,\"failed\":${failed:-0},\"total\":$total}" > python_results.json
          else
            echo "Could not parse test results" >> $GITHUB_STEP_SUMMARY
          fi
        fi

    - name: Upload Results JSON
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: backend-results-python
        path: python_results.json
        retention-days: 7
        if-no-files-found: ignore

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # ============================================================
  # Go AOT — 202 tests
  # ============================================================
  test-go:
    name: Go W3C Tests
    runs-on: ubuntu-24.04
    # packages: write pulls the gate's image, and pushes it when this run built
    # it (.github/actions/gate-image).
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # The pinned release, which the runner hands the image read-only: the
    # image carries no Rust of its own (`gate_in_container` in scripts/gate).
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache

    # The gate runs in the host image (`container` of its registry entry),
    # which holds Go at the release bx.toml's `[platform.linux.tools.go]`
    # reads, the `go` line of backends/go/forge-runtime/go.mod. The runner
    # inside the image builds `sce-codegen` first, through its
    # `codegen-build` gate.
    - name: Sign in to the gate images' registry
      uses: ./.github/actions/gate-image

    # Generation, the fixture server and the suite are one gate — the same
    # one the pre-push hook runs. The server used to be started and stopped
    # by two steps of this job; the gate owns its lifetime now, which is what
    # lets it be run by hand without remembering either half.
    - name: Run W3C Tests
      run: |
        set -o pipefail
        scripts/gate w3c-go 2>&1 | tee go_test_output.log

    - name: Upload Test Log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: w3c-test-output-go
        path: go_test_output.log
        retention-days: 30

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## W3C SCXML Test Results (Go)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f go_test_output.log ]; then
          passed=$(grep -c "^--- PASS:" go_test_output.log || true)
          failed=$(grep -c "^--- FAIL:" go_test_output.log || true)
          total=$((passed + failed))
          if [ "$total" -gt 0 ] 2>/dev/null; then
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | ${failed:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Total | $total |" >> $GITHUB_STEP_SUMMARY
            echo "{\"passed\":$passed,\"failed\":${failed:-0},\"total\":$total}" > go_results.json
          else
            echo "Could not parse test results" >> $GITHUB_STEP_SUMMARY
          fi
        fi

    - name: Upload Results JSON
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: backend-results-go
        path: go_results.json
        retention-days: 7
        if-no-files-found: ignore

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # ============================================================
  # C11 (MCU backend) — 218 ctest cases
  #   204 W3C + 11 integration + 3 unit (+2 HTTP fixtures)
  #
  # This backend had no CI job at all: `w3c-tests.yml` covered
  # cpp/rust/kotlin/python/go, and the only workflow that ran ctest was
  # forge-conformance.yml. The pre-push hook does not run the W3C ctest
  # suite either — deliberately, and its comment says so — so the entire
  # C11 surface was verified by whoever happened to run `ctest` locally.
  # "C11 W3C 204/204" was a local measurement that no push re-confirmed,
  # while a downstream MCU consumer ships C11.
  #
  # The lane was cheap once: configure 4.5s, codegen for 271 translation
  # units plus 215 executables 9s, the 218 tests 4s, on a clean local tree.
  # On a hosted runner it no longer is. Run whole, the gate spent 13 of the
  # job's 24 minutes building `sce_c11_tests` and 43 seconds running 371
  # tests (job 138891691071, 4c71fb062c), so the suite runs as three shards,
  # one job each, and a last job, `test-c11`, holds them together, as
  # cpp-suite.yml does for the native suite. Each job runs the w3c-c11 gate
  # with `SCE_W3C_C11_SHARD`, which builds only what the tests of its shard
  # run (scripts/lib/ctest_shards.py) and runs those tests; `hook_ci_parity`
  # holds the matrix and the variable to one count. Three, because what every
  # job pays whatever its share (the checkout, the generator's build and the
  # configure, about nine minutes of that job) leaves about four minutes of
  # build to each, and a fourth shard would save one minute against another
  # nine of setup. The build machines run the gate whole.
  # ============================================================
  test-c11-shard:
    name: C11 W3C Tests (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    # packages: write pulls the gate's image, and pushes it when this run built
    # it (.github/actions/gate-image).
    permissions:
      contents: read
      packages: write
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    - name: Setup Problem Matchers
      run: |
        echo "::add-matcher::.github/problem-matchers/gcc.json"
        echo "::add-matcher::.github/problem-matchers/cmake.json"

    # The pinned release, which the runner hands the image read-only: the
    # image carries no Rust of its own (`gate_in_container` in scripts/gate).
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # Rust, and the C and C++ of every CMake tree the job configures, compile
    # through the shared compile cache (.github/actions/compile-cache): a unit
    # another shard or lane compiled alike is answered from it.
    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache
      with:
        cmake: true

    # The gate runs in the host image (`container` of its registry entry),
    # which holds the compilers, CMake and Ninja, the libraries the tree links
    # and clang-format 19: this lane builds only C targets, but the configure
    # that registers them also declares the C++ integration fixtures, each from
    # `sce-codegen --plan generate`, which formats C++ as the real run does
    # and refuses without clang-format pinned to major 19
    # (docs/SCE_CODEGEN_DETERMINISM.md §9). The runner inside the image builds
    # `sce-codegen` first, through its `codegen-build` gate.
    - name: Sign in to the gate images' registry
      uses: ./.github/actions/gate-image

    # Configure, build and run are one gate, the same one the pre-push hook
    # runs. The floor on registered tests and the executed-vs-registered
    # comparison live there, so this lane and a developer's machine judge
    # the C11 surface by the same rules.
    - name: Run C11 ctest Suite
      env:
        SCE_W3C_C11_SHARD: ${{ matrix.shard }}/3
      run: |
        set -o pipefail
        scripts/gate w3c-c11 2>&1 | tee c11_ctest.log

    # The plan and what this shard ran (`test-c11` reads them), and the log
    # its summary is read from.
    - name: Upload this shard's plan and log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: w3c-c11-shard-${{ matrix.shard }}
        path: |
          c11_ctest.log
          build/ctest-shard-c11/
        retention-days: 30
        if-no-files-found: warn

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # The verdict of the C11 lane: every shard planned the suite alike and ran
  # every test of its part, for the reason `cpp-suite-verdict` gives. It keeps
  # the job's id and name, so the report below and the lane's readers find it
  # where the unsharded job was, and it writes the lane's summary and results
  # from the three shards' logs together.
  test-c11:
    name: C11 W3C Tests
    needs: test-c11-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Download the shards' plans and logs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: w3c-c11-shard-*
        path: shards

    - name: Hold the shards to one plan and the whole suite
      env:
        SHARDS_RESULT: ${{ needs.test-c11-shard.result }}
      run: |
        status=0
        python3 scripts/lib/ctest_shards.py verify shards || status=1
        if [[ "$SHARDS_RESULT" != success ]]; then
          echo "::error title=w3c-c11::a shard job ended $SHARDS_RESULT"
          status=1
        fi
        exit "$status"

    # The shards' logs, one after another, under the name the unsharded job's
    # log had.
    - name: Join the shards' logs
      if: always()
      run: |
        : > c11_ctest.log
        for log in shards/w3c-c11-shard-*/c11_ctest.log; do
          [ -f "$log" ] || continue
          echo "===== $log" >> c11_ctest.log
          cat "$log" >> c11_ctest.log
        done

    - name: Upload Test Log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: w3c-test-output-c11
        path: c11_ctest.log
        retention-days: 30

    # Summed over the shards: each shard's log ends with ctest's own count of
    # what it ran and what failed.
    - name: Generate Test Summary
      if: always()
      run: |
        echo "## W3C SCXML Test Results (C11)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        total=0
        failed=0
        shards=0
        for log in shards/w3c-c11-shard-*/c11_ctest.log; do
          [ -f "$log" ] || continue
          ran=$(grep -oE 'out of [0-9]+' "$log" | tail -1 | grep -oE '[0-9]+' || true)
          lost=$(grep -oE '[0-9]+ tests failed' "$log" | tail -1 | grep -oE '[0-9]+' || true)
          [ -n "$ran" ] || continue
          shards=$((shards + 1))
          total=$((total + ran))
          failed=$((failed + ${lost:-0}))
        done
        passed=$((total - failed))
        if [ "$total" -gt 0 ]; then
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | $failed |" >> $GITHUB_STEP_SUMMARY
          echo "| Total | $total |" >> $GITHUB_STEP_SUMMARY
          echo "| Shards read | $shards |" >> $GITHUB_STEP_SUMMARY
          echo "{\"passed\":$passed,\"failed\":$failed,\"total\":$total}" > c11_results.json
        else
          echo "Could not parse ctest results" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Results JSON
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: backend-results-c11
        path: c11_results.json
        retention-days: 7
        if-no-files-found: ignore

  # ============================================================
  # Unified HTML Report + GitHub Pages Deploy
  # ============================================================
  report:
    name: Unified Report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [test-cpp, test-rust, test-kotlin, test-python-bindings, test-python, test-go, test-c11]
    if: always()
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Download All Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: artifacts/

    - name: Merge Backend Results
      run: |
        # Combine Rust/Kotlin/Python (AOT + bindings)/Go JSON results into
        # one file. `python` is the AOT family-member channel
        # (sce-codegen → *_sm.py + lupa runtime); `python-bindings` is the
        # special pybind11 → C++ Interpreter channel.
        echo '{' > backend_results.json
        first=true
        for backend in rust kotlin python python-bindings go c11; do
          # Result files use the same key the artifact uses (e.g.
          # python_bindings_results.json). The artifact directory
          # follows the same hyphen convention.
          file_key=$(echo "$backend" | tr '-' '_')
          json_file="artifacts/backend-results-${backend}/${file_key}_results.json"
          if [ -f "$json_file" ]; then
            if [ "$first" = true ]; then first=false; else echo ',' >> backend_results.json; fi
            echo "\"${backend}\": $(cat "$json_file")" >> backend_results.json
            echo "Found $backend results: $(cat "$json_file")"
          else
            echo "No results for $backend"
          fi
        done
        echo '}' >> backend_results.json
        echo "=== Merged backend results ==="
        cat backend_results.json

    - name: Generate Unified HTML Report
      run: |
        CPP_XML="artifacts/w3c-test-results-cpp/w3c_test_results.xml"
        if [ -f "$CPP_XML" ]; then
          python3 tests/w3c/scripts/xml_to_html.py \
            "$CPP_XML" \
            test-results.html \
            --backend-results backend_results.json
          echo "Unified HTML report generated"
        else
          echo "C++ XML results not found - cannot generate report"
        fi

    - name: Prepare GitHub Pages
      run: |
        mkdir -p gh-pages
        if [ -f test-results.html ]; then
          cp test-results.html gh-pages/test-results.html
        fi
        CPP_XML="artifacts/w3c-test-results-cpp/w3c_test_results.xml"
        if [ -f "$CPP_XML" ]; then
          cp "$CPP_XML" gh-pages/w3c_test_results.xml
        fi

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
        destination_dir: test-results
        keep_files: true
