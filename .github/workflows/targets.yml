name: Targets (logical interface + standalone library)

# A binding is split into a logical interface that every target shares and a profile that only one
# platform needs. The standalone target builds a C++ library from the interface alone, and this lane
# holds two things: the interface carries nothing of a platform, and the library fails the same
# cases `verify` fails.
#
# The second needs the product's generator and a compiler. A case that cannot run skips, and a skip
# reads as a pass, so the generator is built one step up and the gate refuses to run without it.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'tools/targets/**'
      - 'tools/authoring/**'
      - '.github/workflows/targets.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      - 'tools/ci-images/host/**'
      - '.github/actions/gate-image/**'
      - 'scripts/gates/targets.sh'
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'tools/codegen/templates/**'
      - 'schemas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/targets/**'
      - 'tools/authoring/**'
      - '.github/workflows/targets.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      - 'tools/ci-images/host/**'
      - '.github/actions/gate-image/**'
      - 'scripts/gates/targets.sh'
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'tools/codegen/templates/**'
      - 'schemas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  targets:
    name: Interface is platform-free, library judges as verify does
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    # `packages: write` for the image a run on main builds and pushes
    # (.github/actions/gate-image says why the permission cannot follow the
    # event); `contents: read` is what checkout needs.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The gate runs in the host image (tools/ci-images/host), with what this
      # job used to install: libxml2 for the generator's XSD validator, g++ for
      # the library it builds, clang-format-19, which `sce-codegen` formats the
      # library's C++ with (docs/SCE_CODEGEN_DETERMINISM.md section 9), and a
      # Python environment holding PyYAML, jsonschema and `lupa`, which
      # `verify` runs a statechart through. The gate builds the generator
      # there first (`codegen-build`), and refuses to run without it.
      - uses: ./.github/actions/install-rust
      - name: Compile through the shared compile cache
        id: compile-cache
        uses: ./.github/actions/compile-cache
      # The registry's credentials, so the runner pulls the gate's image by the
      # digest of its build context and a run on main pushes one it built
      # (.github/actions/gate-image).
      - name: Pull the gate's image
        uses: ./.github/actions/gate-image
      - name: Targets gate
        run: scripts/gate targets

      # What the compile cache answered of this job, and what it could not
      # (.github/actions/compile-cache).
      - name: Report what the compile cache answered
        if: always() && steps.compile-cache.outcome == 'success'
        run: sccache --show-stats
