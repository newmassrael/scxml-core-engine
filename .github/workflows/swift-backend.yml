name: Swift backend (runtime, forge runtime, generated machines)

# The lane that compiles and runs the Swift backend.
#
# Until this workflow existed nothing a hosted runner ran touched a line of Swift. The
# other backends are reached through their W3C and Forge lanes, and Swift has neither yet
# (`a_backend_holds_what_the_other_backends_hold` records both as not built). The backend
# grew past two hundred committed generated machines and three SwiftPM packages on local
# runs alone, so a break in a Swift template, in the runtime, or in the checked arithmetic
# the generated code calls reached `main` unjudged and was read only by whoever next ran
# the packages by hand.
#
# What it runs is `scripts/gate swift-backend`, the gate the pre-push hook runs too:
# `scripts/test_swift_backend.sh` regenerates the machines from the templates and runs the
# four packages (`backends/swift/runtime`, `forge-runtime`, `host-features`, `tests`), and the gate reads
# the verdict from the output as well as the exit status, so a package whose tests were not
# discovered is red and not a silent pass. Whether the COMMITTED machines are what the
# generator writes is `regen-reproduces`' question and is kept there.
#
# ⚠ THE TOOLCHAIN IS PINNED, and the pin lives in `bx.toml` (`[tools.swift]`) and nowhere
# else: the release, and the digest of its tarball for each Ubuntu release. The build
# machines install it with `provision`, this lane with `scripts/install_swift_toolchain.sh`,
# and the gate reads it through `scripts/lib/swift_pin.sh`, so a bump is one edit and a
# lane cannot verify the packages on a compiler the build machines do not have. Until
# 2026-10-28 the version and digest were copied into this file as well, and the gate held
# the two copies equal; that check is gone because the second copy is.
#
# The runner is `ubuntu-24.04` and not `ubuntu-latest`: the pin carries a digest for each
# Ubuntu release it supports, and a runner image that moved to a release with none would
# fail by name instead of downloading a tarball nothing checks.
#
# The `paths:` filter is what `tools/git-hooks/gate_registry.py` reads to decide whether a
# push runs the gate. It names what the packages read (the Swift tree and the shared
# scenarios), what writes the machines they compile (the generator and its templates),
# the gate's own files, and `bx.toml`, which holds the toolchain pin.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backends/swift/**'
      - 'sce-build/src/**'
      - 'sce-build/Cargo.toml'
      - 'sce-build/tests/fixtures/static_datamodel/**'
      - 'sce-build/tests/fixtures/swift_statecharts/**'
      - 'sce-build/tests/fixtures/swift_ecmascript/**'
      - 'resources/**'
      - 'tools/codegen/templates/**'
      - 'stdlib/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/test_swift_backend.sh'
      - 'scripts/regen_swift_statecharts.sh'
      - 'scripts/regen_static_datamodel_swift.sh'
      - 'scripts/regen_swift_ecmascript.sh'
      - 'scripts/lib/sce_codegen.sh'
      - 'scripts/lib/swift_pin.sh'
      - 'scripts/install_swift_toolchain.sh'
      - 'scripts/gates/swift-backend.sh'
      - 'scripts/gates/lib.sh'
      - 'bx.toml'
      - '.github/workflows/swift-backend.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Not cancelled by the push that follows it; the newest push runs after it. Owner decision,
# 2026-10-01, for every lane: see `cpp-suite.yml` for the reasoning and the cost.
#
# ⚠ What holds this setting is `sce-build/tests/ci_supersession_policy.rs`, which
# classifies EVERY workflow in this directory and reds one nobody classified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  swift-backend:
    name: Swift packages build and pass, machines replay the shared scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo (codegen)
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('sce-build/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-codegen-

    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only builds
        # the debug profile, so a release binary the cache still holds is not
        # a product of this commit.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    # What swift.org lists for the toolchain on Ubuntu 24.04, as `bx.toml` lists it
    # for the build machines. Without them the tarball unpacks and `swift --version`
    # answers, and a compile or a link dies later.
    - name: Install the packages the Swift toolchain links against
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils libc6-dev libcurl4-openssl-dev libedit2 \
          libncurses-dev libpython3-dev libsqlite3-0 libxml2-dev libz3-dev \
          pkg-config tzdata unzip zlib1g-dev

    # The release and the tarball's digest are `bx.toml`'s `[tools.swift]` and nothing in
    # this file, so the key moves with the pin and the build machines and this lane cannot
    # disagree about the compiler.
    - name: Read the Swift pin
      id: swift-pin
      run: |
        SCE_REPO_ROOT="$PWD"
        source scripts/lib/swift_pin.sh
        echo "version=$(sce_swift_pin_version)" >> "$GITHUB_OUTPUT"
        echo "digest=$(sce_swift_pin_digest 24.04)" >> "$GITHUB_OUTPUT"

    # The toolchain lives where the build machines keep it, under
    # `~/.local/share/swift/<version>/`, which is where the gate looks.
    - name: Cache the Swift toolchain
      uses: actions/cache@v5
      with:
        path: ~/.local/share/swift/${{ steps.swift-pin.outputs.version }}
        key: swift-toolchain-ubuntu24.04-${{ steps.swift-pin.outputs.version }}-${{ steps.swift-pin.outputs.digest }}

    # Checked against the pinned digest, and a no-op on a toolchain the cache restored.
    # The runner image carries a Swift of its own on PATH, and the gate takes this one
    # and not that one.
    - name: Install the pinned Swift toolchain
      run: scripts/install_swift_toolchain.sh

    - name: Run the Swift backend gate
      run: scripts/gate swift-backend
