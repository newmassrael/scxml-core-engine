name: Swift backend (runtime, forge runtime, generated machines)

# The lane that compiles and runs the Swift backend.
#
# Until this workflow existed nothing a hosted runner ran touched a line of Swift. The
# other backends are reached through their W3C and Forge lanes, and Swift has neither yet
# (`a_backend_holds_what_the_other_backends_hold` records both as not built). The backend
# grew past two hundred committed generated machines and three SwiftPM packages on local
# runs alone, so a break in a Swift template, in the runtime, or in the checked arithmetic
# the generated code calls reached `main` unjudged and was read only by whoever next ran
# the packages by hand.
#
# What it runs is `scripts/gate swift-backend`, the gate the pre-push hook runs too:
# `scripts/test_swift_backend.sh` regenerates the machines from the templates and runs the
# packages (`backends/swift/runtime`, `forge-runtime`, `host-features`, `tests`, and
# `feature-conformance`, the machine for every build of `tests/product_line/` held to each
# build's own, docs/adr/0057 §10), and the gate reads
# the verdict from the output as well as the exit status, so a package whose tests were not
# discovered is red and not a silent pass. On the same toolchain it runs the Swift programs of
# `sce-build`'s two equivalence tests, which hold the transition table a machine carries to the
# export and the transition function to its producer, and reads both verdicts by name, so a
# test that skipped or matched nothing is red too. Whether the COMMITTED machines are what the
# generator writes is `regen-reproduces`' question and is kept there.
#
# ⚠ THE GATES RUN IN THE SWIFT IMAGE (ADR 0145): `tools/ci-images/swift/Containerfile` holds
# the pinned Swift toolchain and the packages it links against, and `scripts/gate` pulls the
# image its digest names and runs each gate inside it, here as on a build machine or a
# workstation. No step of this file installs a package or a toolchain. The release is still
# `bx.toml`'s (`[platform.linux.tools.swift]`), read through `scripts/lib/swift_pin.sh`: the
# gate refuses a `swift` that is not that release, so the image and the pin cannot disagree
# without a red that names both.
#
# The runner is `ubuntu-24.04` and not `ubuntu-latest`: the image is what the gates run on,
# and a pinned runner keeps the Docker that starts it from moving under the lane.
#
# The `paths:` filter is what `tools/git-hooks/gate_registry.py` reads to decide whether a
# push runs the gate. It names what the packages read (the Swift tree and the shared
# scenarios), what writes the machines they compile (the generator and its templates),
# the two equivalence tests the gate runs in Swift, the gate's own files, `bx.toml`,
# which holds the toolchain pin, and the image the gates run in.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backends/swift/**'
      - 'sce-build/src/**'
      - 'sce-build/build.rs'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'sce-build/Cargo.toml'
      # The two equivalence tests the gate runs in Swift (`transition-outputs` in
      # `scripts/test_swift_backend.sh`), and the helpers they compile with.
      - 'sce-build/tests/the_emitted_transition_table_equals_the_export.rs'
      - 'sce-build/tests/the_emitted_transition_function_equals_the_producer.rs'
      - 'sce-build/tests/common/**'
      - 'sce-build/tests/fixtures/static_datamodel/**'
      # The test profile's templates and the documents they name, which
      # `tools/codegen/trees/swift-static-datamodel.toml` generates into the machines' target.
      - 'sce-build/tests/fixtures/test_profile/**'
      # The corpus's orders_suite and nested_suite, generated into the same target and
      # replayed from their traces under `test_profile/runs/` by
      # `ACorpusSuiteReplaysToItsExpectedLogsTests.swift`.
      - 'sce-build/tests/fixtures/ttcn3_export/**'
      # The union kind's fixtures the template over a union names, generated into the same
      # target: its union, the tag's enum and its cases' records.
      - 'sce-build/tests/fixtures/union/**'
      - 'sce-build/tests/fixtures/swift_statecharts/**'
      - 'sce-build/tests/fixtures/swift_ecmascript/**'
      - 'resources/**'
      - 'tools/codegen/templates/**'
      - 'stdlib/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/test_swift_backend.sh'
      - 'scripts/materialize.sh'
      - 'tools/codegen/trees/**'
      - 'scripts/regen_swift_feature_conformance.sh'
      - 'tests/product_line/**'
      - 'integration_resources/**'
      - 'scripts/regen_swift_w3c.sh'
      - 'tests/w3c/conformance/fixtures.json'
      - 'scripts/lib/sce_codegen.sh'
      - 'scripts/lib/swift_pin.sh'
      - 'scripts/gates/swift-backend.sh'
      - 'scripts/gates/w3c-swift.sh'
      - 'scripts/gates/ecma262-lowered-swift.sh'
      - 'scripts/gates/forge-swift.sh'
      - 'tests/forge/**'
      # The scenarios of the standard host features and the table of a model's
      # outcome classes, which the Swift lane's host-feature tests replay and run
      # (`HostFeaturesTests.swift`, the reference harness's among them).
      - 'tests/host_features/**'
      # The recorded input trace's wire schema, whose status the test profile runtime's
      # `TraceTests.swift` holds the runtime's to, read at run time; the traces it replays are
      # under `sce-build/tests/fixtures/test_profile/**` above.
      - 'schemas/sce-test-trace.v1.schema.json'
      # The recorded runs of the lane, which the W3C suite's
      # `ARunIsABehaviourOfItsModelTests.swift` holds its traced runs of the W3C documents
      # with a model to, read at run time (docs/adr/0115, D4 and D8).
      - 'docs/formal/traces/**'
      - 'scripts/regen_swift_ecma262_lowered.sh'
      - 'tools/generate_lowered_ecma262_fixture.py'
      - 'tests/ecmascript/**'
      - 'scripts/gates/lib.sh'
      - 'bx.toml'
      # The image every gate of this lane runs in, and the action that signs
      # the job in to the registry it is pulled from.
      - 'tools/ci-images/swift/**'
      - '.github/actions/gate-image/**'
      - '.github/workflows/swift-backend.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Not cancelled by the push that follows it; the newest push runs after it. Owner decision,
# 2026-10-01, for every lane: see `cpp-suite.yml` for the reasoning and the cost.
#
# ⚠ What holds this setting is `sce-build/tests/ci_supersession_policy.rs`, which
# classifies EVERY workflow in this directory and reds one nobody classified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The packages in three shards, one job each, and the three gates that write and run machines
  # of their own in a fourth job. Whole, the job took 1842 s (job 138967193099, 57602a3bb8,
  # 2026-11-25): the generator build and the toolchain about six minutes, the swift-backend gate
  # 1209 s, and the W3C, ECMA-262 and Forge gates about five minutes after it. Each shard runs
  # the swift-backend gate with `SCE_SWIFT_BACKEND_SHARD`, which runs one line of the gate's
  # parts (scripts/gates/swift-backend.sh says how they were cut) and holds that part's
  # verdicts; `hook_ci_parity` holds the parts to the script's default list, each package once,
  # and the matrix to their count. The parts are fixed lists, so there is no plan to hold the
  # shards to after they run. Each job pulls the image and builds the generator in it before its
  # part.
  swift-backend:
    name: Swift packages build and pass, machines replay the shared scenarios (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    # `packages: write` lets the image action push an image this push built
    # (.github/actions/gate-image); `contents: read` is what checkout needs.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    # The pinned release, mounted read-only into the image (`gate_in_container`
    # in scripts/gate): the image carries no Rust of its own.
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # The image's cargo keeps a home of its own, whose registry download the
    # step after restores.
    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache
      with:
        registry: false

    - name: Cache the image's cargo registry download
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/sce-gate-containers/swift-backend/cargo/registry/index
          ~/.cache/sce-gate-containers/swift-backend/cargo/registry/cache
          ~/.cache/sce-gate-containers/swift-backend/cargo/git/db
        key: swift-image-cargo-registry-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

    - name: Sign in to the registry the gate images are pulled from
      uses: ./.github/actions/gate-image

    # In the swift image, with the generator built there first through the
    # gate's `codegen-build` dependency.
    - name: Run the Swift backend gate
      env:
        SCE_SWIFT_BACKEND_SHARD: ${{ matrix.shard }}/3
      run: scripts/gate swift-backend

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # The gates that write machines of their own into `backends/swift/tests` and run them, in a job
  # beside the packages': each needs the image and the generator built in it, which are the same
  # steps, and none of them is a part of the swift-backend gate.
  swift-machines:
    name: Swift W3C, ECMA-262 lowered-artifact and Forge conformance gates
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache
      with:
        registry: false

    # One cargo home per gate in the image (`gate_in_container`), so one per gate here.
    - name: Cache the image's cargo registry download
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/sce-gate-containers/w3c-swift/cargo/registry/index
          ~/.cache/sce-gate-containers/w3c-swift/cargo/registry/cache
          ~/.cache/sce-gate-containers/w3c-swift/cargo/git/db
          ~/.cache/sce-gate-containers/ecma262-lowered-swift/cargo/registry/index
          ~/.cache/sce-gate-containers/ecma262-lowered-swift/cargo/registry/cache
          ~/.cache/sce-gate-containers/ecma262-lowered-swift/cargo/git/db
          ~/.cache/sce-gate-containers/forge-swift/cargo/registry/index
          ~/.cache/sce-gate-containers/forge-swift/cargo/registry/cache
          ~/.cache/sce-gate-containers/forge-swift/cargo/git/db
        key: swift-image-cargo-registry-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

    - name: Sign in to the registry the gate images are pulled from
      uses: ./.github/actions/gate-image

    # The W3C suite, written by `generate-w3c -l swift` and run against the engine.
    - name: Run the Swift W3C gate
      run: scripts/gate w3c-swift

    # One machine that asks every case of the shared ECMA-262 table, generated with the
    # build-time lowering, compiled and run.
    - name: Run the Swift ECMA-262 lowered-artifact gate
      run: scripts/gate ecma262-lowered-swift

    # The forge runtime's tests and every generated unit held to the numerical oracle.
    - name: Run the Swift Forge conformance gate
      run: scripts/gate forge-swift

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats
