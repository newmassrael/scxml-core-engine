name: Rust Workspace Tests

# CI mirror of pre-push Stage 4 (`cargo test --workspace`).
#
# Until this workflow existed, no GitHub workflow ran the sce-build unit
# suite at all: drift-verify.yml runs two named integration targets
# (b9_drift_detection, sourcemap_addr2sce) and w3c-tests.yml runs
# `-p sce-rust-tests`. drift-verify.yml's own header claimed the full
# sweep was "covered by w3c-tests.yml", which was not true — so roughly
# 1300 unit tests were enforced only by a local hook, and anything they
# would have caught reached main whenever the hook was bypassed.
#
# That gap is what let the WASM template registry ship broken: the
# browser generator rendered from a hand-maintained template list that
# omitted `_macros/`, and no CI job ever rendered from that list.
# `template_registry::tests` now does, and this workflow is what makes
# those tests binding.
#
# Scope is `--features cli`, matching the `workspace-tests` gate. The
# paragraph that used to sit here said the opposite — "the default
# feature set", with the cli-gated targets deliberately left to
# drift-verify.yml — and stayed after the flag was added, so the file
# described a smaller run than it performed. What the flag fixes is a
# silent omission: cargo excludes a target whose `required-features` are
# unmet without building it and without reporting a skip, so sce-build's
# 15 cli-gated targets were absent from a job calling itself
# "--workspace".
#
# One prerequisite the hook gets from its own build stage: `sce-codegen`
# must exist. Four targets shell out to it through
# `CARGO_BIN_EXE_sce-codegen` without declaring the feature themselves —
# codegen_invocation_determinism, event_schema_cross_state_guard,
# rust_derive_ssot and sourcemap_ownership_walker — so a bare
# `cargo test --workspace` runs them and they die on `NotFound`. The
# first revision of this file did exactly that, and passed locally only
# because a stale `target/debug/sce-codegen` happened to be on disk.
#
# b9_drift_detection and error_format_json now run in both lanes.
# drift-verify.yml still runs them with `--test-threads=1` because its
# real-tree verify steps invoke the binary directly; here they run in the
# parallel sweep.
#
# Both sides run the default test profile. The hook used `--release`
# until 2026-08-04, so the debug assertions this suite relies on for
# overflow detection were compiled out exactly where a developer would
# have seen the failure first, and the optimised artifacts it produced
# were shared with nothing else on an unoptimised development tree.
# `hook_ci_parity` fails if either side moves off the profile again.

on:
  push:
    branches: [ main ]
    paths:
      - 'sce-build/**'
      - 'sce-build-wasm/**'
      - 'backends/rust/**'
      - 'tools/codegen/templates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-workspace-tests.yml'
      # Inputs the suite reads without compiling: the acceptance doc, the
      # wire schemas and the API headers are `include_str!`-ed by tests
      # here. The `workspace-tests` gate has always declared them in its
      # `extra`, and this filter did not, which was harmless only while the
      # gate also ran at push time. It is now `ci_only`, so this list is the
      # only thing that starts the suite —
      # `ci-only-coverage` in tools/git-hooks/gate_registry.py refuses the
      # two lists disagreeing.
      - 'docs/SCE_ACCEPTED_SUBSET.md'
      - 'schemas/**'
      - 'apis/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'sce-build/**'
      - 'sce-build-wasm/**'
      - 'backends/rust/**'
      - 'tools/codegen/templates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-workspace-tests.yml'
      # Inputs the suite reads without compiling: the acceptance doc, the
      # wire schemas and the API headers are `include_str!`-ed by tests
      # here. The `workspace-tests` gate has always declared them in its
      # `extra`, and this filter did not, which was harmless only while the
      # gate also ran at push time. It is now `ci_only`, so this list is the
      # only thing that starts the suite —
      # `ci-only-coverage` in tools/git-hooks/gate_registry.py refuses the
      # two lists disagreeing.
      - 'docs/SCE_ACCEPTED_SUBSET.md'
      - 'schemas/**'
      - 'apis/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test --workspace --features cli
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        # `mutation_round_survives_a_moved_baseline` reads a PINNED pre-repair
        # harness out of git (`git show <rev>:scripts/mutate`), so this lane
        # needs history. Under the default shallow fetch that read fails and
        # the control reports that it measured nothing.
        fetch-depth: 0
        submodules: recursive

    # libxml2 backs the default `xsd` feature; without it the workspace
    # build fails at link time rather than running the suite.
    #
    # clang is installed explicitly rather than relied on from the runner
    # image, because `SCE_REQUIRE_TOOLS` below turns its absence from a
    # skip into a failure. The typestate axis it gates
    # (`sample_h_typestate_is_inert_in_c_and_only_warn_unused_survives`)
    # needs Clang's `consumable` / `callable_when` attribute family, which
    # GCC does not implement — with GCC alone the check cannot run at all.
    #
    # gcc-arm-none-eabi is installed for the same reason. It provides
    # `arm-none-eabi-gcc`, the cross-compiler
    # `statechart_native_lowering_c11_compiles_freestanding` uses to prove
    # the emitted C11 builds for a freestanding target — the one profile
    # where a hosted libc cannot paper over a missing declaration. The
    # runner image does not carry it, so before this line the check was
    # the single `SCE_REQUIRE_TOOLS` casualty in the lane.
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libxml2-dev clang gcc-arm-none-eabi

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-workspace-tests-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-workspace-tests-

    # Mirrors the hook's build stage. Debug profile so the binary lands
    # where `CARGO_BIN_EXE_sce-codegen` resolves for the test step below.
    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only
        # builds the debug profile, so a release binary the cache still
        # holds is not a product of this commit. The locator knows which
        # path that is; naming it here would put a build-layout detail
        # back into every workflow.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    # `gate_registry_contract` drives the *staged* citation stage as a
    # subprocess, and that stage refuses — exit 3, "the gate could not run,
    # its own tooling is missing" — without the rev-pinned binary. This job
    # never had it, so the workspace suite failed on every push for the two
    # tests that need it, while saying nothing about the tree. The revision
    # is read from `spec-citations.yml`, the one place it lives.
    - name: Cache mnemosyne-cli (rev-pinned)
      uses: actions/cache@v5
      with:
        path: ~/.local/share/mnemosyne-rev
        key: mnemosyne-rev-${{ hashFiles('.github/workflows/spec-citations.yml') }}

    - name: Install the rev-pinned mnemosyne-cli
      run: scripts/install_mnemosyne_cli.sh

    # Delegates to the gate runner rather than restating the command, so
    # the suite has one spelling for both callers. The gate also starts the
    # W3C BasicHTTP fixture server on :8080 that test_201 and the 5xx series
    # post to — which is why this job no longer starts one of its own; two
    # would collide on the port.
    #
    # `SCE_REQUIRE_TOOLS` promotes "tool not found, skipping" into a hard
    # failure. Without it a runner image that loses a toolchain keeps
    # reporting green while the checks that need it quietly stop running —
    # a skip is an unrun check, not a passing one, and this lane is where
    # that difference is invisible from the outside.
    #
    # `SCE_GATE_NO_FAIL_FAST` is the reporting choice this lane wants and a
    # developer does not: every failure in one run, because nobody iterates
    # on a runner.
    - name: cargo test --workspace --features cli
      env:
        SCE_REQUIRE_TOOLS: "1"
        SCE_GATE_NO_FAIL_FAST: "1"
      run: scripts/gate workspace-tests
