name: Rust Workspace Tests

# CI mirror of pre-push Stage 4 (`cargo test --workspace`).
#
# Until this workflow existed, no GitHub workflow ran the sce-build unit
# suite at all: drift-verify.yml runs two named integration targets
# (b9_drift_detection, sourcemap_addr2sce) and w3c-tests.yml runs
# `-p sce-rust-tests`. drift-verify.yml's own header claimed the full
# sweep was "covered by w3c-tests.yml", which was not true — so roughly
# 1300 unit tests were enforced only by a local hook, and anything they
# would have caught reached main whenever the hook was bypassed.
#
# That gap is what let the WASM template registry ship broken: the
# browser generator rendered from a hand-maintained template list that
# omitted `_macros/`, and no CI job ever rendered from that list.
# `template_registry::tests` now does, and this workflow is what makes
# those tests binding.
#
# Scope is the default feature set, matching pre-push Stage 4, with one
# prerequisite the hook gets from its own Stage 1: `sce-codegen` must
# already be built. Four test targets shell out to that binary through
# `CARGO_BIN_EXE_sce-codegen` without declaring `required-features =
# ["cli"]` — codegen_invocation_determinism,
# event_schema_cross_state_guard, rust_derive_ssot and
# sourcemap_ownership_walker — so a bare `cargo test --workspace` runs
# them and they die on `NotFound`. The first revision of this file did
# exactly that, and passed locally only because a stale
# `target/debug/sce-codegen` happened to be on disk.
#
# The genuinely cli-gated targets (b9_drift_detection,
# error_format_json) declare the feature and stay skipped here; they are
# drift-verify.yml's lane, which runs them with `--test-threads=1`
# because the real-tree verify steps invoke the binary directly.
# Enabling `sce-build/cli` here instead would pull them into a parallel
# sweep and change how an existing gate runs, so this job mirrors the
# hook rather than widening it. Measured, for whoever revisits this:
# `--features sce-build/cli` runs 3383 tests to this configuration's
# 3240 and passed once with default parallelism. One green run is not
# evidence that the serialisation those lanes ask for is unnecessary,
# and an intermittent red here would cost more than the 143 tests
# drift-verify.yml already runs on every relevant push.
#
# Both sides run the default test profile. The hook used `--release`
# until 2026-08-04, so the debug assertions this suite relies on for
# overflow detection were compiled out exactly where a developer would
# have seen the failure first, and the optimised artifacts it produced
# were shared with nothing else on an unoptimised development tree.
# `hook_ci_parity` fails if either side moves off the profile again.

on:
  push:
    branches: [ main ]
    paths:
      - 'sce-build/**'
      - 'sce-build-wasm/**'
      - 'backends/rust/**'
      - 'tools/codegen/templates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-workspace-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sce-build/**'
      - 'sce-build-wasm/**'
      - 'backends/rust/**'
      - 'tools/codegen/templates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-workspace-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test --workspace --features cli
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    # libxml2 backs the default `xsd` feature; without it the workspace
    # build fails at link time rather than running the suite.
    #
    # clang is installed explicitly rather than relied on from the runner
    # image, because `SCE_REQUIRE_TOOLS` below turns its absence from a
    # skip into a failure. The typestate axis it gates
    # (`sample_h_typestate_is_inert_in_c_and_only_warn_unused_survives`)
    # needs Clang's `consumable` / `callable_when` attribute family, which
    # GCC does not implement — with GCC alone the check cannot run at all.
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libxml2-dev clang

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-workspace-tests-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-workspace-tests-

    # The W3C BasicHTTP suites (test_201, 5xx series) send to
    # http://localhost:8080/test and fail as a block without it. Same
    # server w3c-tests.yml and pre-push Stage 4 start; failing here
    # rather than proceeding keeps a dozen red tests from reading as a
    # code regression.
    - name: Start W3C HTTP Test Server
      run: |
        node tests/w3c/standalone_http_server.js 8080 /test &
        echo $! > /tmp/http_server.pid
        sleep 1
        kill -0 "$(cat /tmp/http_server.pid)" \
          || { echo "W3C HTTP test server failed to start"; exit 1; }
        echo "W3C HTTP test server started (PID: $(cat /tmp/http_server.pid))"

    # Mirrors pre-push Stage 1. Debug profile so the binary lands where
    # `CARGO_BIN_EXE_sce-codegen` resolves for the test step below.
    - name: Build sce-codegen
      run: cargo build --bin sce-codegen --features cli -p sce-build

    # `SCE_REQUIRE_TOOLS` promotes "tool not found, skipping" into a hard
    # failure. Without it a runner image that loses a toolchain keeps
    # reporting green while the checks that need it quietly stop running —
    # a skip is an unrun check, not a passing one, and this lane is where
    # that difference is invisible from the outside.
    #
    # `--features cli` is what makes the step's name true. Targets declaring
    # `required-features = ["cli"]` in sce-build/Cargo.toml are silently
    # omitted without it: cargo does not report them as skipped, it never
    # builds them, so the lane was running a strictly smaller set than the
    # one a developer runs locally while calling itself "--workspace".
    # That is the same failure mode SCE_REQUIRE_TOOLS exists to prevent,
    # one level up.
    - name: cargo test --workspace --features cli
      env:
        SCE_REQUIRE_TOOLS: "1"
      run: cargo test --workspace --features cli --no-fail-fast
