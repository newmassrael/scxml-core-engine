name: Drift Verify (B9 §6.2.6)

# CI gate for spec §6.2.6 generated-source drift detection. Re-runs the
# drift integration suites on every push/PR so a template-only edit
# that changes a generated file but leaves the tracked output unchanged
# (or vice versa) fails before merge.
#
# Trigger surface: anything that contributes to the source-hash /
# template-hash inputs (sce-build sources, templates, tracked generated
# trees, lockfile) or the workflow itself. Sub-2-minute runtime
# expected — only the b9_drift_detection + sourcemap_addr2sce
# integration suites run, not the full workspace test sweep
# (covered by rust-workspace-tests.yml). This note used to name
# w3c-tests.yml, which runs `-p sce-rust-tests` and never swept the
# workspace; the claim outlived any job that made it true.
#
# Real-tree invariants exercised by this gate:
#   - verify_passes_on_real_committed_{rust,kotlin}_w3c_tree (efdd2591)
#   - verify_passes_on_real_committed_{rust,kotlin,go}_donedata_tree (1a8c7b3f)
#   - verify_passes_on_real_committed_forge_default_round_trip_go_tree
#     (52e6d6f5)
#
# The template-hash is computed over the whole template
# tree plus Cargo.lock, so an edit to any backend's templates can
# invalidate every other backend's stored hash even if its emit is
# byte-identical (the chain pattern c2dfe502/1a5efb07/dc228ab4/64f93cf4
# left stale and 3b8941c3/7a4ee07f/d6b2cb03/47fb7767/cb53dd3c swept).
# Drift contexts and their input roots:
#   - W3C trees           → resources/<N>/
#   - donedata trees      → integration_resources/donedata_local_invoke/
#   - forge round-trip    → tests/forge/resources/
# The new top-level integration_resources/ dir sits outside resources/
# because compute_source_hash recurses through its input_root — nesting
# integration under resources/ would fold the integration fixture into
# the W3C source-hash domain. Distinct drift contexts = distinct
# top-level dirs.

on:
  push:
    branches: [ main ]
    paths:
      - 'sce-build/**'
      - 'tools/codegen/templates/**'
      - 'backends/rust/tests/src/generated/**'
      - 'backends/rust/tests/src/integration/donedata_local_invoke/**'
      - 'backends/kotlin/tests/src/main/kotlin/com/sce/generated/**'
      - 'backends/kotlin/tests/src/main/kotlin/com/sce/integration/**'
      - 'backends/kotlin/tests/src/test/kotlin/com/sce/w3c/**'
      - 'backends/go/tests/integration/donedata_local_invoke/**'
      - 'backends/go/forge-runtime/round_trip/generated/**'
      - 'tests/forge/resources/**'
      - 'resources/**'
      - 'integration_resources/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/drift-verify.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sce-build/**'
      - 'tools/codegen/templates/**'
      - 'backends/rust/tests/src/generated/**'
      - 'backends/rust/tests/src/integration/donedata_local_invoke/**'
      - 'backends/kotlin/tests/src/main/kotlin/com/sce/generated/**'
      - 'backends/kotlin/tests/src/main/kotlin/com/sce/integration/**'
      - 'backends/kotlin/tests/src/test/kotlin/com/sce/w3c/**'
      - 'backends/go/tests/integration/donedata_local_invoke/**'
      - 'backends/go/forge-runtime/round_trip/generated/**'
      - 'tests/forge/resources/**'
      - 'resources/**'
      - 'integration_resources/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/drift-verify.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-verify:
    name: B9 §6.2.6 drift detection suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-drift-verify-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-drift-verify-

    # B9 integration suite — synthetic input/template fixtures cover the
    # verify subcommand's clean-pass / drifted-source / drifted-template /
    # cwd-independence / empty-input invariants. The same target also
    # runs the real-tree invariants:
    #   - verify_passes_on_real_committed_{rust,kotlin}_w3c_tree (efdd2591)
    #   - verify_passes_on_real_committed_{rust,kotlin,go}_donedata_tree
    #     (1a8c7b3f)
    #   - verify_passes_on_real_committed_forge_default_round_trip_go_tree
    #     (52e6d6f5)
    # which catch the cross-backend template-hash invalidation pattern
    # committed-tree fresh-regen on CI otherwise hides. A regression in
    # apply_drift_headers_to_output, compute_source_hash, or the
    # per-backend codegen path fails this step before any unit-level
    # masking can hide it.
    - name: Verify B9 drift detection integration suite
      run: cargo test -p sce-build --features cli --test b9_drift_detection -- --test-threads=1

    # §5.O Atomic 1 sidecar — sourcemap JSON emission + addr2sce
    # subcommand round-trip. Catches drift in the sourcemap surface
    # alongside the header hashes (same SCE traceability boundary).
    - name: Verify §5.O sourcemap integration suite
      run: cargo test -p sce-build --features cli --test sourcemap_addr2sce
