name: sce-forge codec no_std no-alloc build

# Borrowed zero-copy codec round verify-before-ship gate. Proves that
# SCE-generated codecs compile under `no_std` WITHOUT the `alloc` feature
# — the heap-free MCU tier the codec generator reaches by emitting
# borrowed `&'a [u8]` / `&'a str` scalar views and `heapless::Vec<T, N>`
# bounded inline list storage, gating every alloc `Vec` / `String` /
# `VecSink` / `encode_to_vec` site behind `#[cfg(feature = "alloc")]`.
# This is the SCE-side mirror of a downstream codec
# crate build that motivated the round by failing `--no-default-features`.
#
# Covers both tiers: scalar codecs (Tail / LengthRef byte views) AND
# list-bearing codecs (repeat / tlv-chain), the latter now heap-free via
# `heapless::Vec` (the Rust mirror of the C11 `T elems[MAX]; len` shape).
# Single-codec embed needs no list storage and is already no-alloc.
#
# The same build compiles the generated algorithms over a record that holds
# bounded text (sce:std/text), whose string field is the fixed-capacity
# `SceString<N>` of sce-portable-bytes.
#
# Trigger: changes to the codec generator/template, the committed codec
# goldens the gate compiles, what the text algorithms are generated from (the
# generator, its templates, the standard library and the tree
# `rust-static-datamodel`, which the gate materializes, docs/adr/0097), the
# forge runtime, the portable bytes crate, the gate script itself, or the cargo
# lockfile.

on:
  push:
    branches: [ main ]
    paths:
      - 'backends/*/forge-runtime/**'
      - 'backends/rust/portable-bytes/**'
      - 'Cargo.toml'
      - '.cargo/**'
      - 'tools/codegen/templates/forge/rust/codec.rs.jinja2'
      - 'tools/codegen/templates/_macros/forge_rust_flag_accessors.jinja2'
      - 'tools/codegen/templates/_macros/forge_rust_codec_decode_body.jinja2'
      - 'tools/codegen/templates/_macros/forge_rust_storage.jinja2'
      - 'sce-build/src/forge/generator.rs'
      - 'sce-build/src/forge/generator/**'
      - 'tests/forge/expected/codec_*.rs'
      - 'tests/forge/expected/views/*.rs'
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'stdlib/**'
      - 'tools/codegen/templates/**'
      - 'tools/codegen/trees/rust-static-datamodel.toml'
      - 'scripts/check_noalloc_codec.sh'
      - 'Cargo.lock'
      - '.github/workflows/sce-forge-codec-no-alloc.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      - 'tools/ci-images/host/**'
      - '.github/actions/gate-image/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backends/*/forge-runtime/**'
      - 'backends/rust/portable-bytes/**'
      - 'Cargo.toml'
      - '.cargo/**'
      - 'tools/codegen/templates/forge/rust/codec.rs.jinja2'
      - 'tools/codegen/templates/_macros/forge_rust_flag_accessors.jinja2'
      - 'tools/codegen/templates/_macros/forge_rust_codec_decode_body.jinja2'
      - 'tools/codegen/templates/_macros/forge_rust_storage.jinja2'
      - 'sce-build/src/forge/generator.rs'
      - 'sce-build/src/forge/generator/**'
      - 'tests/forge/expected/codec_*.rs'
      - 'tests/forge/expected/views/*.rs'
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'stdlib/**'
      - 'tools/codegen/templates/**'
      - 'tools/codegen/trees/rust-static-datamodel.toml'
      - 'scripts/check_noalloc_codec.sh'
      - 'Cargo.lock'
      - '.github/workflows/sce-forge-codec-no-alloc.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      - 'tools/ci-images/host/**'
      - '.github/actions/gate-image/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codec-no-alloc:
    name: Compile scalar + list codecs --no-default-features
    runs-on: ubuntu-24.04
    # The text algorithms are materialized by sce-codegen, which the gate
    # builds first.
    timeout-minutes: 30
    # `packages: write` for the image a run on main builds and pushes
    # (.github/actions/gate-image says why the permission cannot follow the
    # event); `contents: read` is what checkout needs.
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # sce-codegen's default `xsd` feature binds libxml2 through pkg-config,
    # which the host image the gate runs in carries (tools/ci-images/host).
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache

    # The registry's credentials, so the runner pulls the gate's image by the
    # digest of its build context and a run on main pushes one it built
    # (.github/actions/gate-image).
    - name: Pull the gate's image
      uses: ./.github/actions/gate-image

    - name: Compile generated scalar + list codecs no_std without alloc
      run: scripts/gate codec-no-alloc

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats
