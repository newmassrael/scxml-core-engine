name: ECMA-262 through a Lua-lowered C++ artifact

# The lane `docs/SCE_LUA_TRANSLATION_SEAM.md` ended without.
#
# The seam landed, the C++ templates crossed it, and `--script-engine lua -l cpp`
# generated — but nothing COMPILED a lowered artifact and ran it, so the
# ECMA-262 divergences the axis exists to close were never measured through it.
# `tests/CMakeLists.txt` carried the same sentence from the other side in three
# places: "no gate configures -DSCE_SCRIPT_ENGINE=lua".
#
# What the job measures is BUILD-TIME lowering, and it is that path's CONTRACT
# rather than a measurement of it. `tests/ecmascript/lua_engine_divergences.json`
# says per entry which routes into the Lua engine still answer a case
# differently (`diverges_on`), and this job holds the `build-time-lowering` one
# in BOTH directions: a case the lowered artifact gets wrong without being
# declared is red, AND a case declared and answered correctly is red. The second
# direction is what lets that list empty — before it, an entry could only leave
# when the runtime rewriter was repaired, and the plan of record is to RETIRE
# that rewriter for generated code rather than repair it.
#
# The population is the SHARED TABLE in full (`ecma262_semantics.json`), not the
# divergence list. It used to be the list, which meant the table's other cases
# were never asked through a lowered artifact at all: a path's divergences
# cannot be enumerated by a list built from a different path's failures.
#
# The binary carries one generated document twice: with `--script-engine lua`,
# where the rewriter is bypassed; and without, where it runs. The second is the
# control, and it is what makes the first one's green mean something.
#
# `SCE_SCRIPT_ENGINE` is a compile-time cache option whose definition is PUBLIC
# on `sce_scripting`, so this cannot ride in another job's tree — it configures
# its own.
#
# The `paths:` filter is narrow on purpose, and it is what
# `tools/git-hooks/gate_registry.py` reads to decide whether a push runs this
# gate. It names the seam's two halves — what generates the artifact and what
# runs it — plus the table the fixture expands and the list the harness reads.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sce/include/scripting/**'
      - 'sce/src/scripting/**'
      - 'sce/include/common/**'
      - 'sce/CMakeLists.txt'
      - 'sce-build/src/**'
      - 'tools/codegen/templates/**'
      - 'tools/generate_lowered_ecma262_fixture.py'
      - 'tests/ecmascript/ecma262_semantics.json'
      - 'tests/ecmascript/lua_engine_divergences.json'
      - 'tests/engine/LoweredEcma262Test.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/SCECodegen.cmake'
      - 'scripts/gates/ecma262-lowered-cpp.sh'
      - '.github/workflows/ecma262-lowered-cpp.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# This lane is not superseded by the push that follows it.
#
# Its verdict is about the one list this axis exists to empty, and it needs
# twenty-odd minutes to reach it. Measured 2026-09-02: a 23.7 min median
# success against a 17.6 min median gap between pushes to `main`, so it cannot
# finish between two of them and `cancel-in-progress: true` made it report only
# when the person stopped pushing.
#
# ⚠ Its cancellation RATIO does not show this — 2 against 16 successes in its
# last 25 runs, which
# reads like a short lane's rate. The narrow `paths:` filter above is why: it
# narrows WHICH pushes reach this lane, and does nothing about two that do.
# Both cancellations were exactly that, mid-session pushes 17 and 14 minutes
# behind the run they took down (`9192789c88`, `1a1f1169f8`). The duration is
# the rule here and the ratio is not. What holds this setting is
# `sce-build/tests/ci_supersession_policy.rs`, which classifies EVERY workflow
# in this directory and reds one nobody classified; the derivation, the
# measurement and the command that re-takes it live there.
#
# `false` rather than a per-commit key, deliberately: a newly queued run still
# cancels a PENDING one, so `false` saves the run IN FLIGHT and the LATEST
# commit and defers the ones between. That is the right trade for a lane whose
# answer is about a BRANCH — this one re-asks the whole shared table against
# whatever the tree now holds. `mutation-rounds.yml` keys on `github.sha`
# because its answer is about a COMMIT: selection is by change set, and nothing
# re-selects it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ecma262-lowered-cpp:
    name: A Lua-lowered C++ artifact, compiled and run
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          g++ \
          ninja-build \
          lld \
          ccache \
          pkg-config \
          libxml2-dev \
          libspdlog-dev \
          libfmt-dev \
          libboost-dev \
          libboost-system-dev \
          libboost-thread-dev

    - name: Setup Problem Matchers
      run: |
        echo "::add-matcher::.github/problem-matchers/gcc.json"
        echo "::add-matcher::.github/problem-matchers/cmake.json"

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('sce-build/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-codegen-

    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only builds
        # the debug profile, so a release binary the cache still holds is not a
        # product of this commit.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    - name: Setup ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-ecma262-lowered-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-ecma262-lowered-

    # Configure, build and run are one gate, so the check has one spelling here
    # and in the pre-push hook. The gate reads the selection back out of
    # CMakeCache.txt and counts the `ScriptSource::lua(...)` pairs in the
    # emitted artifact, so a tree that quietly configured another engine, or a
    # target that quietly stopped lowering, fails with the cause named rather
    # than as a wrong answer.
    - name: Run the lowered-artifact gate
      run: scripts/gate ecma262-lowered-cpp
