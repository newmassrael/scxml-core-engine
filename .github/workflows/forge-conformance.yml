name: SCE Forge Numerical Conformance

# Cross-language numerical conformance harness (15 fixtures x 6 languages).
#
# Architecture: every arm is one job that runs its gate in the host image
# (`tools/ci-images/host/Containerfile`, ADR 0145), which `scripts/gate`
# pulls by its Containerfile's digest: no step installs a package or a
# toolchain. Each arm builds the generator in the image, through its gate's
# `codegen-build` dependency and the shared compile cache. Until 2026-11-26 a
# job of its own built it once on the runner and handed the binary to five
# arms as an artifact; a binary linked against the runner's libc is not one
# to run in the image, and the image's build directory is its own, so the
# hand-over is gone. See SCE_FORGE.md for the design of the harness.
#
# ⚠ The C11 arm joined on 2026-09-17 and was the last to. Its suite —
# harness template, ten per-kind fragments and a standalone CMake project —
# had existed under backends/c/forge-runtime/tests/conformance the whole
# time with NOTHING invoking it, and the five sibling arms made the set look
# complete. A suite nobody runs cannot be told from one that passes.

on:
  push:
    branches: [ main ]
    paths:
      - 'tests/forge/**'
      # The standard library, whose algorithms the manifest names as fixtures
      # (`sce:std/...`): an edit of one alone changes what every arm runs.
      - 'stdlib/**'
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      # The grammar the generator validates every document against at run
      # time, read from disk and not compiled in (sce-build/src/forge/
      # xsd_validator.rs), with the extension schema it imports.
      - 'schemas/sce-forge.xsd'
      - 'schemas/sce-forge-ext.xsd'
      - 'backends/*/forge-runtime/**'
      - 'tools/codegen/templates/forge/**'
      - 'tools/codegen/templates/_macros/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/forge-conformance.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      # The arms' own `extra` triggers, which the globs above do not express:
      # a forge arm is built against the engine and its backend, so a change
      # to either can break it without touching forge-runtime. That widening
      # lived only in the gate table while the gates ran at push time, and
      # became a hole the moment they moved here —
      # `ci-only-coverage` in tools/git-hooks/gate_registry.py refuses the
      # two lists disagreeing.
      - 'sce/**'
      - 'backends/rust/**'
      - 'backends/go/**'
      - 'backends/python/**'
      - 'backends/c/**'
      - 'backends/kotlin/**'
      # The modules the C++ and C11 arms' projects declare every generation
      # through (`sce_codegen_generation`), resolve the generator through, and
      # format generated C++ by.
      - 'cmake/SCECodegenPlan.cmake'
      - 'cmake/SCEFindCodegen.cmake'
      - 'cmake/SCEClangFormat.cmake'
      # The warning classes the C++ arm's test programs turn off, from the one
      # definition the C++ test tree reads too.
      - 'cmake/SCETestWarnings.cmake'
      # The JSON library the C++ arm's test programs include, vendored.
      - 'third_party/nlohmann_json/include/**'
      # The Kotlin arm's build, which lives at the root rather than under
      # backends/kotlin/: the version catalog, the wrapper and the settings.
      # Without these a dependency bump classified to no gate at all.
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      # The image every arm runs in, and the action that signs the job in to
      # the registry it is pulled from.
      - 'tools/ci-images/host/**'
      - '.github/actions/gate-image/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'tests/forge/**'
      # The standard library, whose algorithms the manifest names as fixtures
      # (`sce:std/...`): an edit of one alone changes what every arm runs.
      - 'stdlib/**'
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      # The grammar the generator validates every document against at run
      # time, read from disk and not compiled in (sce-build/src/forge/
      # xsd_validator.rs), with the extension schema it imports.
      - 'schemas/sce-forge.xsd'
      - 'schemas/sce-forge-ext.xsd'
      - 'backends/*/forge-runtime/**'
      - 'tools/codegen/templates/forge/**'
      - 'tools/codegen/templates/_macros/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/forge-conformance.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      # The arms' own `extra` triggers, which the globs above do not express:
      # a forge arm is built against the engine and its backend, so a change
      # to either can break it without touching forge-runtime. That widening
      # lived only in the gate table while the gates ran at push time, and
      # became a hole the moment they moved here —
      # `ci-only-coverage` in tools/git-hooks/gate_registry.py refuses the
      # two lists disagreeing.
      - 'sce/**'
      - 'backends/rust/**'
      - 'backends/go/**'
      - 'backends/python/**'
      - 'backends/c/**'
      - 'backends/kotlin/**'
      # The modules the C++ and C11 arms' projects declare every generation
      # through (`sce_codegen_generation`), resolve the generator through, and
      # format generated C++ by.
      - 'cmake/SCECodegenPlan.cmake'
      - 'cmake/SCEFindCodegen.cmake'
      - 'cmake/SCEClangFormat.cmake'
      # The warning classes the C++ arm's test programs turn off, from the one
      # definition the C++ test tree reads too.
      - 'cmake/SCETestWarnings.cmake'
      # The JSON library the C++ arm's test programs include, vendored.
      - 'third_party/nlohmann_json/include/**'
      # The Kotlin arm's build, which lives at the root rather than under
      # backends/kotlin/: the version catalog, the wrapper and the settings.
      # Without these a dependency bump classified to no gate at all.
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      # The image every arm runs in, and the action that signs the job in to
      # the registry it is pulled from.
      - 'tools/ci-images/host/**'
      - '.github/actions/gate-image/**'
  workflow_dispatch:

# Re-measured 2026-09-02 over this lane's own last 25 runs: a 25.5 min median
# success against a 17.6 min median gap between pushes to `main`, over 19
# successes and 4 cancellations. It read 8.9 that morning and 22.2 an hour
# later over the SAME population, so what moved was the durations, not the
# sample.
#
# `true` discarded work rather than a queue slot, and this lane fans out to
# five languages so one supersession throws away all of them at once: `Rust
# Forge Conformance` was 44.9 min in when the push at 2026-08-30T15:29Z took
# it, and `Build sce-codegen` 20.9 min in at 15:50Z.
#
# `false` rather than a per-commit key, for the reason `w3c-tests.yml` gives:
# a newly queued run still cancels a PENDING one, so `false` saves the run IN
# FLIGHT and the LATEST commit and defers the ones between. That is the right
# trade for a lane whose answer is about a BRANCH -- this one re-asks a fixed
# numerical corpus against whatever the tree now holds.
#
# The verdict does not rest on which push-gap reading is right, and there have
# been four: 18.9 from a `git log` recipe that counted COMMIT gaps, then 21.0,
# 12.5 and 17.6 from pushed SHAs over windows of three different widths. This
# lane sits above every one of them, so it is long under all of them --
# `ci_supersession_policy` holds the reading that is current.
#
# ⚠ A calmer day does NOT bring this row back under the line. All six
# successes over 34 min do fall on 2026-08-30/31, so the heavy tail is real
# and dated -- but those twelve runs median 25.8 while 2026-09-02's six median
# 22.15, the same figure as that window. The tail moved; the middle did not.
# Moving this row needs a faster lane, not a quieter day.
#
# ⚠ BACK TO `false` BY OWNER DECISION, 2026-10-01, reversing the flip to `true`
# of 2026-09-15: the run in flight is kept and one waiting run holds the newest
# commit. See `cpp-suite.yml` for the reasoning and the cost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Every language's harness pipes its test run into `tee` to keep a log for
# the summary step. The runner's default shell is `bash -e {0}` — `-e` but
# not `-o pipefail` — so the step's exit status was tee's, and a conformance
# failure in any of the six languages reported green. `pipefail` here makes
# the pipeline report the test's status instead; the shell string carries
# `-e` because naming `defaults.run.shell` replaces the runner's default
# rather than adding to it. Pinned by
# `test_result_gating::every_pipeline_in_a_run_script_reports_its_own_failure`,
# which counts the shape across every workflow rather than this file alone.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  # ============================================================
  # Rust — in-process codegen via build.rs
  # ============================================================
  conformance-rust:
    name: Rust Forge Conformance
    runs-on: ubuntu-24.04
    # 20, from 10: the arm now also runs the queue runtime under Miri and
    # ThreadSanitizer (scripts/gate forge-rust), which build a sysroot and an
    # instrumented standard library on a cold cache. Measured on a warm
    # machine, 2026-10-09, those steps take about three minutes.
    #
    # 30, from 20: the next day the LSCQ link race got its own loom model
    # (`loom_queue_lscq_race`, c72a3f4c5b), an exhaustive search that alone
    # took 437 s on run 39929067376, 537 s on 40054201670 and 711 s on
    # 40144477639, and nothing re-measured the ceiling. The two jobs that
    # finished took 15 and 19.7 minutes; six of the eight runs from
    # 2026-10-23 to 2026-10-24 were cancelled at 20 with the queue models
    # still running, a verdict lost rather than a red. The slowest race
    # measured puts a job near 23 minutes, and 30 keeps that inside 85% of
    # the ceiling, the share the mutation lane schedules into for the same
    # reason (`scripts/lib/mutation_rounds_cost.sh`).
    timeout-minutes: 30
    # `packages: write` lets the image action push an image this push built
    # (.github/actions/gate-image); `contents: read` is what checkout needs.
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # The pinned release, mounted read-only into the image (`gate_in_container`
    # in scripts/gate): the image carries no Rust of its own.
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # The image's cargo keeps a home of its own, whose registry download the
    # step after restores.
    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache
      with:
        registry: false

    - name: Cache the image's cargo registry download
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/sce-gate-containers/forge-rust/cargo/registry/index
          ~/.cache/sce-gate-containers/forge-rust/cargo/registry/cache
          ~/.cache/sce-gate-containers/forge-rust/cargo/git/db
        key: host-image-cargo-registry-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

    - name: Sign in to the registry the gate images are pulled from
      uses: ./.github/actions/gate-image

    # `--features alloc` is REQUIRED: the numerical_conformance target is
    # gated `required-features = ["alloc"]` (its fixtures use encode_to_vec
    # / the owned projection), so without the flag cargo skips or errors on
    # the target and the harness never executes. The gate passes it, and with
    # it the harness runs the full cross-language oracle, and the codec
    # round-trip targets beside it run too.
    - name: Run Rust Conformance Harness
      run: |
        scripts/gate forge-rust 2>&1 | tee rust_conformance.log

    - name: Summarize
      if: always()
      run: |
        echo "## Rust Forge Conformance" >> $GITHUB_STEP_SUMMARY
        if [ -f rust_conformance.log ]; then
          grep -E "^test result:" rust_conformance.log | tail -1 >> $GITHUB_STEP_SUMMARY || true
        fi

    - name: Upload Test Log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: forge-conformance-rust
        path: rust_conformance.log
        retention-days: 14

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # ============================================================
  # Python — conftest.py bootstrap uses the generator built in the image
  # ============================================================
  conformance-python:
    name: Python Forge Conformance
    runs-on: ubuntu-24.04
    # 20, from 10: the arm builds the generator in the image now, which the
    # build job's 10 minutes used to pay for it.
    timeout-minutes: 20
    # `packages: write` lets the image action push an image this push built
    # (.github/actions/gate-image); `contents: read` is what checkout needs.
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # The pinned release, mounted read-only into the image (`gate_in_container`
    # in scripts/gate): the image carries no Rust of its own.
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # The image's cargo keeps a home of its own, whose registry download the
    # step after restores.
    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache
      with:
        registry: false

    - name: Cache the image's cargo registry download
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/sce-gate-containers/forge-python/cargo/registry/index
          ~/.cache/sce-gate-containers/forge-python/cargo/registry/cache
          ~/.cache/sce-gate-containers/forge-python/cargo/git/db
        key: host-image-cargo-registry-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

    - name: Sign in to the registry the gate images are pulled from
      uses: ./.github/actions/gate-image

    - name: Run Python Conformance Harness
      run: |
        scripts/gate forge-python 2>&1 | tee python_conformance.log

    - name: Summarize
      if: always()
      run: |
        echo "## Python Forge Conformance" >> $GITHUB_STEP_SUMMARY
        if [ -f python_conformance.log ]; then
          grep -E "^Ran [0-9]+ tests|^OK|^FAILED" python_conformance.log >> $GITHUB_STEP_SUMMARY || true
        fi

    - name: Upload Test Log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: forge-conformance-python
        path: python_conformance.log
        retention-days: 14

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # ============================================================
  # Go — go generate + go test, with gitignore drift guard
  # ============================================================
  conformance-go:
    name: Go Forge Conformance
    runs-on: ubuntu-24.04
    # 25, from 15: the arm builds the generator in the image now, which the
    # build job's 10 minutes used to pay for it.
    timeout-minutes: 25
    # `packages: write` lets the image action push an image this push built
    # (.github/actions/gate-image); `contents: read` is what checkout needs.
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # The pinned release, mounted read-only into the image (`gate_in_container`
    # in scripts/gate): the image carries no Rust of its own.
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # The image's cargo keeps a home of its own, whose registry download the
    # step after restores.
    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache
      with:
        registry: false

    - name: Cache the image's cargo registry download
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/sce-gate-containers/forge-go/cargo/registry/index
          ~/.cache/sce-gate-containers/forge-go/cargo/registry/cache
          ~/.cache/sce-gate-containers/forge-go/cargo/git/db
        key: host-image-cargo-registry-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

    - name: Drift Guard — generated Go files must stay gitignored
      # The conformance harness and fixture modules are regenerated on every
      # `go generate` run and must never be committed. `git check-ignore`
      # tests path strings against .gitignore rules without requiring the
      # path to exist, so we probe one representative path under each rule.
      run: |
        cd backends/go/forge-runtime/conformance
        git check-ignore -q numerical_conformance_test.go \
          || { echo "Drift: numerical_conformance_test.go is no longer gitignored"; exit 1; }
        git check-ignore -q generated/any.go \
          || { echo "Drift: generated/ directory is no longer gitignored"; exit 1; }

    - name: Sign in to the registry the gate images are pulled from
      uses: ./.github/actions/gate-image

    # Both Go suites in one call, on the Go release the image pins. `go
    # generate ./conformance/...` runs `./generate.sh` (the `//go:generate`
    # directive in conformance/doc.go), which is what the gate invokes
    # directly, so the delegation regenerates the same artifacts before the
    # same two `go test` runs.
    #
    # The round-trip half covers a different tree from the conformance
    # half: `./round_trip/generated/` is committed and guarded by §6.2.6
    # drift detection (`b9_drift_detection::verify_passes_on_real_
    # committed_forge_default_round_trip_go_tree`), which checks
    # header-hash parity while this checks functional pass — orthogonal,
    # per `[[committed-generated-tree-sweep-landed]]`.
    - name: Run Go Conformance + Round-Trip
      run: scripts/gate forge-go 2>&1 | tee go_conformance.log

    - name: Summarize
      if: always()
      run: |
        echo "## Go Forge Conformance" >> $GITHUB_STEP_SUMMARY
        if [ -f go_conformance.log ]; then
          passed=$(grep -c "^--- PASS:" go_conformance.log || true)
          failed=$(grep -c "^--- FAIL:" go_conformance.log || true)
          echo "Passed: ${passed:-0}, Failed: ${failed:-0}" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Test Log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: forge-conformance-go
        path: go_conformance.log
        retention-days: 14

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # ============================================================
  # Kotlin — Gradle GenerateForgeFixtures task + jvmTest
  # ============================================================
  conformance-kotlin:
    name: Kotlin Forge Conformance
    runs-on: ubuntu-24.04
    # 25, from 15: the arm builds the generator in the image now, which the
    # build job's 10 minutes used to pay for it.
    timeout-minutes: 25
    # `packages: write` lets the image action push an image this push built
    # (.github/actions/gate-image); `contents: read` is what checkout needs.
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # The pinned release, mounted read-only into the image (`gate_in_container`
    # in scripts/gate): the image carries no Rust of its own.
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # The image's cargo keeps a home of its own, whose registry download the
    # step after restores.
    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache
      with:
        registry: false

    - name: Cache the image's cargo registry download
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/sce-gate-containers/forge-kotlin/cargo/registry/index
          ~/.cache/sce-gate-containers/forge-kotlin/cargo/registry/cache
          ~/.cache/sce-gate-containers/forge-kotlin/cargo/git/db
        key: host-image-cargo-registry-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

    # The image's Gradle home, which the gate's Gradle run fills.
    - name: Cache Gradle
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/sce-gate-containers/forge-kotlin/home/.gradle/caches
          ~/.cache/sce-gate-containers/forge-kotlin/home/.gradle/wrapper
        key: ${{ runner.os }}-gradle-forge-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-forge-
          ${{ runner.os }}-gradle-

    - name: Sign in to the registry the gate images are pulled from
      uses: ./.github/actions/gate-image

    # Through the gate, like the other five arms, on the JDK the image pins.
    # Calling `./gradlew` here directly is what let the local mirror go
    # missing for this arm alone and nobody notice: two spellings of the same
    # lane cannot be checked against each other, and `delegation` in
    # tools/git-hooks/gate_registry.py now refuses the pair drifting apart.
    - name: Run Kotlin Conformance Harness
      run: scripts/gate forge-kotlin 2>&1 | tee kotlin_conformance.log

    - name: Summarize
      if: always()
      run: |
        echo "## Kotlin Forge Conformance" >> $GITHUB_STEP_SUMMARY
        REPORT_DIR="backends/kotlin/forge-runtime/build/test-results"
        if [ -d "$REPORT_DIR" ]; then
          total=$(grep -rohE 'tests="[0-9]+"' "$REPORT_DIR" | grep -oE '[0-9]+' | paste -sd+ | bc)
          failed=$(grep -rohE 'failures="[0-9]+"' "$REPORT_DIR" | grep -oE '[0-9]+' | paste -sd+ | bc)
          echo "Total: ${total:-?}, Failed: ${failed:-?}" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Test Log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: forge-conformance-kotlin
        path: kotlin_conformance.log
        retention-days: 14

    - name: Upload Gradle Test Reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: forge-conformance-kotlin-reports
        path: backends/kotlin/forge-runtime/build/reports/tests/
        retention-days: 14

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # ============================================================
  # C++ — standalone CMake project under backends/cpp/forge-runtime/tests
  # ============================================================
  conformance-cpp:
    name: C++ Forge Conformance
    runs-on: ubuntu-24.04
    # 25, from 15: the arm builds the generator in the image now, which the
    # build job's 10 minutes used to pay for it.
    timeout-minutes: 25
    # `packages: write` lets the image action push an image this push built
    # (.github/actions/gate-image); `contents: read` is what checkout needs.
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    # The pinned release, mounted read-only into the image (`gate_in_container`
    # in scripts/gate): the image carries no Rust of its own.
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # The image's cargo keeps a home of its own, whose registry download the
    # step after restores.
    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache
      with:
        registry: false

    - name: Cache the image's cargo registry download
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/sce-gate-containers/forge-cpp/cargo/registry/index
          ~/.cache/sce-gate-containers/forge-cpp/cargo/registry/cache
          ~/.cache/sce-gate-containers/forge-cpp/cargo/git/db
        key: host-image-cargo-registry-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

    - name: Sign in to the registry the gate images are pulled from
      uses: ./.github/actions/gate-image

    # Delegates to the gate runner rather than restating configure, build
    # and ctest. The gate carries this job's build type (RelWithDebInfo)
    # and uses Ninja, which the image holds, as it holds the clang-format of
    # major 19 the generator formats the C++ it writes with
    # (docs/SCE_CODEGEN_DETERMINISM.md §9). The reason this lane kept its own
    # copy was that the gate built something else, so a local pass said
    # nothing about this job.
    #
    # `tee` keeps the log the summary and the artifact upload below read.
    - name: Run C++ Conformance Harness
      run: |
        set -o pipefail
        scripts/gate forge-cpp 2>&1 | tee cpp_conformance.log

    - name: Summarize
      if: always()
      run: |
        echo "## C++ Forge Conformance" >> $GITHUB_STEP_SUMMARY
        if [ -f cpp_conformance.log ]; then
          grep -E "tests passed|tests failed|Total Test time" cpp_conformance.log >> $GITHUB_STEP_SUMMARY || true
        fi

    - name: Upload Test Log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: forge-conformance-cpp
        path: cpp_conformance.log
        retention-days: 14

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  conformance-c:
    name: C11 Forge Conformance
    runs-on: ubuntu-24.04
    # 25, from 15: the arm builds the generator in the image now, which the
    # build job's 10 minutes used to pay for it.
    timeout-minutes: 25
    # `packages: write` lets the image action push an image this push built
    # (.github/actions/gate-image); `contents: read` is what checkout needs.
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    # The pinned release, mounted read-only into the image (`gate_in_container`
    # in scripts/gate): the image carries no Rust of its own.
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # The image's cargo keeps a home of its own, whose registry download the
    # step after restores.
    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache
      with:
        registry: false

    - name: Cache the image's cargo registry download
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/sce-gate-containers/forge-c11/cargo/registry/index
          ~/.cache/sce-gate-containers/forge-c11/cargo/registry/cache
          ~/.cache/sce-gate-containers/forge-c11/cargo/git/db
        key: host-image-cargo-registry-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

    - name: Sign in to the registry the gate images are pulled from
      uses: ./.github/actions/gate-image

    # Delegates to the same gate the push runs, for the reason the C++ lane
    # states: a job that builds something other than the gate makes a local
    # pass say nothing about this job.
    #
    # ⚠ This arm bakes its oracle from `fixtures.json` at CODEGEN time — C
    # has no zero-deps JSON parser under this backend's dependency rule —
    # while the other five read `numerical_reference.json` at RUN time. A
    # change that edits only the reference cannot reach this job; the
    # fragments in the other five assert the two against each other.
    - name: Run C11 Conformance Harness
      run: |
        set -o pipefail
        scripts/gate forge-c11 2>&1 | tee c_conformance.log

    - name: Summarize
      if: always()
      run: |
        echo "## C11 Forge Conformance" >> $GITHUB_STEP_SUMMARY
        if [ -f c_conformance.log ]; then
          grep -E "tests passed|tests failed|Total Test time" c_conformance.log >> $GITHUB_STEP_SUMMARY || true
        fi

    - name: Upload Test Log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: forge-conformance-c
        path: c_conformance.log
        retention-days: 14

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats
