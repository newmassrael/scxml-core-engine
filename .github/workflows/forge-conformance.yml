name: SCE Forge Numerical Conformance

# Cross-language numerical conformance harness (15 fixtures x 5 languages).
#
# Architecture: build-codegen compiles sce-codegen once and publishes it as
# an artifact; the 4 subprocess-language jobs (Python/Go/Kotlin/C++) depend
# on it and download the binary instead of recompiling. Rust stays
# independent because cargo resolves `sce-build` as a build-dependency of
# sce-forge-runtime and cannot consume a pre-built binary. See SCE_FORGE.md
# and memory conformance_harness_architecture.md for the design.

on:
  push:
    branches: [ main ]
    paths:
      - 'tests/forge/**'
      - 'sce-build/**'
      - 'backends/*/forge-runtime/**'
      - 'tools/codegen/templates/forge/**'
      - 'tools/codegen/templates/_macros/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/forge-conformance.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tests/forge/**'
      - 'sce-build/**'
      - 'backends/*/forge-runtime/**'
      - 'tools/codegen/templates/forge/**'
      - 'tools/codegen/templates/_macros/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/forge-conformance.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every language's harness pipes its test run into `tee` to keep a log for
# the summary step. The runner's default shell is `bash -e {0}` — `-e` but
# not `-o pipefail` — so the step's exit status was tee's, and a conformance
# failure in any of the six languages reported green. `pipefail` here makes
# the pipeline report the test's status instead; the shell string carries
# `-e` because naming `defaults.run.shell` replaces the runner's default
# rather than adding to it. Pinned by
# `test_result_gating::every_pipeline_in_a_run_script_reports_its_own_failure`,
# which counts the shape across every workflow rather than this file alone.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  # ============================================================
  # Build sce-codegen once, publish as artifact for fan-out
  # ============================================================
  build-codegen:
    name: Build sce-codegen
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install Dependencies
      # libxml2-dev is a build-time requirement for the `libxml` crate used
      # by sce-build's forge::xsd_validator (wraps libxml2 for XSD schema
      # checks). The runtime library itself is pre-installed on
      # ubuntu-latest, but the dev headers must be added for `pkg-config
      # --libs libxml-2.0` to succeed during the cargo build below.
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-dev pkg-config

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        # Invalidate when the lockfile OR any sce-build source changes so a
        # pure dependency bump doesn't get a stale binary from cache.
        key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('Cargo.lock', 'sce-build/**/*.rs', 'sce-build/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-codegen-

    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only
        # builds the debug profile, so a release binary the cache still
        # holds is not a product of this commit. The locator knows which
        # path that is; naming it here would put a build-layout detail
        # back into every workflow.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    - name: Upload sce-codegen Binary
      uses: actions/upload-artifact@v7
      with:
        name: sce-codegen-binary
        path: target/debug/sce-codegen
        retention-days: 1
        if-no-files-found: error

  # ============================================================
  # Rust — in-process codegen via build.rs (independent of artifact)
  # ============================================================
  conformance-rust:
    name: Rust Forge Conformance
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install Dependencies
      # libxml2-dev needed because sce-forge-runtime's build.rs pulls in
      # sce-build as a build-dependency, which transitively requires the
      # `libxml` crate for XSD validation in forge::xsd_validator.
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-dev pkg-config

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-forge-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-forge-
          ${{ runner.os }}-cargo-codegen-

    - name: Run Rust Conformance Harness
      run: |
        # `--features alloc` is REQUIRED: the numerical_conformance target is
        # gated `required-features = ["alloc"]` (its fixtures use encode_to_vec
        # / the owned projection), so without the flag cargo skips or errors on
        # the target and the harness never executes. With it the harness runs
        # the full cross-language oracle (145 Rust cases).
        scripts/gate forge-rust 2>&1 | tee rust_conformance.log

    - name: Summarize
      if: always()
      run: |
        echo "## Rust Forge Conformance" >> $GITHUB_STEP_SUMMARY
        if [ -f rust_conformance.log ]; then
          grep -E "^test result:" rust_conformance.log | tail -1 >> $GITHUB_STEP_SUMMARY || true
        fi

    - name: Upload Test Log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: forge-conformance-rust
        path: rust_conformance.log
        retention-days: 14

  # ============================================================
  # Python — conftest.py bootstrap uses downloaded sce-codegen
  # ============================================================
  conformance-python:
    name: Python Forge Conformance
    runs-on: ubuntu-latest
    needs: build-codegen

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install libxml2 runtime
      # The downloaded sce-codegen binary dynamically links libxml2 for
      # XSD validation. ubuntu-latest pre-installs it, but list it
      # explicitly so a base-image drift surfaces as a clear install
      # failure rather than a mysterious "symbol not found" at runtime.
      run: sudo apt-get install -y libxml2

    - name: Download sce-codegen Binary
      uses: actions/download-artifact@v8
      with:
        name: sce-codegen-binary
        # The build job produced it under target/debug; the harness
        # resolves it from there via _sce_codegen.py.
        path: target/debug

    - name: Make sce-codegen Executable
      run: chmod +x target/debug/sce-codegen

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Run Python Conformance Harness
      run: |
        scripts/gate forge-python 2>&1 | tee python_conformance.log

    - name: Summarize
      if: always()
      run: |
        echo "## Python Forge Conformance" >> $GITHUB_STEP_SUMMARY
        if [ -f python_conformance.log ]; then
          grep -E "^Ran [0-9]+ tests|^OK|^FAILED" python_conformance.log >> $GITHUB_STEP_SUMMARY || true
        fi

    - name: Upload Test Log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: forge-conformance-python
        path: python_conformance.log
        retention-days: 14

  # ============================================================
  # Go — go generate + go test, with gitignore drift guard
  # ============================================================
  conformance-go:
    name: Go Forge Conformance
    runs-on: ubuntu-latest
    needs: build-codegen

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install libxml2 runtime
      # See conformance-python for rationale.
      run: sudo apt-get install -y libxml2

    - name: Download sce-codegen Binary
      uses: actions/download-artifact@v8
      with:
        name: sce-codegen-binary
        # The build job produced it under target/debug; generate.sh
        # resolves it from there via scripts/lib/sce_codegen.sh.
        path: target/debug

    - name: Make sce-codegen Executable
      run: chmod +x target/debug/sce-codegen

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.22'
        cache-dependency-path: |
          backends/go/forge-runtime/go.sum

    - name: Drift Guard — generated Go files must stay gitignored
      # The conformance harness and fixture modules are regenerated on every
      # `go generate` run and must never be committed. `git check-ignore`
      # tests path strings against .gitignore rules without requiring the
      # path to exist, so we probe one representative path under each rule.
      run: |
        cd backends/go/forge-runtime/conformance
        git check-ignore -q numerical_conformance_test.go \
          || { echo "Drift: numerical_conformance_test.go is no longer gitignored"; exit 1; }
        git check-ignore -q generated/any.go \
          || { echo "Drift: generated/ directory is no longer gitignored"; exit 1; }

    # Both Go suites in one call. `go generate ./conformance/...` runs
    # `./generate.sh` (the `//go:generate` directive in
    # conformance/doc.go), which is what the gate invokes directly, so
    # the delegation regenerates the same artifacts before the same two
    # `go test` runs.
    #
    # The round-trip half covers a different tree from the conformance
    # half: `./round_trip/generated/` is committed and guarded by §6.2.6
    # drift detection (`b9_drift_detection::verify_passes_on_real_
    # committed_forge_default_round_trip_go_tree`), which checks
    # header-hash parity while this checks functional pass — orthogonal,
    # per `[[committed-generated-tree-sweep-landed]]`.
    - name: Run Go Conformance + Round-Trip
      run: scripts/gate forge-go 2>&1 | tee go_conformance.log

    - name: Summarize
      if: always()
      run: |
        echo "## Go Forge Conformance" >> $GITHUB_STEP_SUMMARY
        if [ -f go_conformance.log ]; then
          passed=$(grep -c "^--- PASS:" go_conformance.log || true)
          failed=$(grep -c "^--- FAIL:" go_conformance.log || true)
          echo "Passed: ${passed:-0}, Failed: ${failed:-0}" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Test Log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: forge-conformance-go
        path: go_conformance.log
        retention-days: 14

  # ============================================================
  # Kotlin — Gradle GenerateForgeFixtures task + jvmTest
  # ============================================================
  conformance-kotlin:
    name: Kotlin Forge Conformance
    runs-on: ubuntu-latest
    needs: build-codegen

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install libxml2 runtime
      # See conformance-python for rationale.
      run: sudo apt-get install -y libxml2

    - name: Download sce-codegen Binary
      uses: actions/download-artifact@v8
      with:
        name: sce-codegen-binary
        # The build job produced it under target/debug; the Gradle build
        # resolves it from there via gradle/sce-codegen.gradle.kts.
        path: target/debug

    - name: Make sce-codegen Executable
      run: chmod +x target/debug/sce-codegen

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Gradle
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-forge-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-forge-
          ${{ runner.os }}-gradle-

    - name: Run Kotlin Conformance Harness
      run: ./gradlew :sce-forge-runtime-kotlin:jvmTest 2>&1 | tee kotlin_conformance.log

    - name: Summarize
      if: always()
      run: |
        echo "## Kotlin Forge Conformance" >> $GITHUB_STEP_SUMMARY
        REPORT_DIR="backends/kotlin/forge-runtime/build/test-results"
        if [ -d "$REPORT_DIR" ]; then
          total=$(grep -rohE 'tests="[0-9]+"' "$REPORT_DIR" | grep -oE '[0-9]+' | paste -sd+ | bc)
          failed=$(grep -rohE 'failures="[0-9]+"' "$REPORT_DIR" | grep -oE '[0-9]+' | paste -sd+ | bc)
          echo "Total: ${total:-?}, Failed: ${failed:-?}" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Test Log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: forge-conformance-kotlin
        path: kotlin_conformance.log
        retention-days: 14

    - name: Upload Gradle Test Reports
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: forge-conformance-kotlin-reports
        path: backends/kotlin/forge-runtime/build/reports/tests/
        retention-days: 14

  # ============================================================
  # C++ — standalone CMake project under backends/cpp/forge-runtime/tests
  # ============================================================
  conformance-cpp:
    name: C++ Forge Conformance
    runs-on: ubuntu-latest
    needs: build-codegen

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Dependencies
      # libxml2 (runtime) is required because the downloaded sce-codegen
      # binary dynamically links libxml2 for XSD validation via the
      # `libxml` crate. Ubuntu runners pre-install it, but listing it
      # explicitly guards against drift if the base image changes.
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build pkg-config libxml2

    - name: Download sce-codegen Binary
      uses: actions/download-artifact@v8
      with:
        name: sce-codegen-binary
        # The build job produced it under target/debug; the harness
        # resolves it from there via cmake/SCEFindCodegen.cmake.
        path: target/debug

    - name: Make sce-codegen Executable
      run: chmod +x target/debug/sce-codegen

    # Delegates to the gate runner rather than restating configure, build
    # and ctest. The gate carries this job's build type (RelWithDebInfo)
    # and uses Ninja when it is installed, which it is here — the reason
    # this lane kept its own copy was that the gate built something else,
    # so a local pass said nothing about this job.
    #
    # `tee` keeps the log the summary and the artifact upload below read.
    - name: Run C++ Conformance Harness
      run: |
        set -o pipefail
        scripts/gate forge-cpp 2>&1 | tee cpp_conformance.log

    - name: Summarize
      if: always()
      run: |
        echo "## C++ Forge Conformance" >> $GITHUB_STEP_SUMMARY
        if [ -f cpp_conformance.log ]; then
          grep -E "tests passed|tests failed|Total Test time" cpp_conformance.log >> $GITHUB_STEP_SUMMARY || true
        fi

    - name: Upload Test Log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: forge-conformance-cpp
        path: cpp_conformance.log
        retention-days: 14
