name: Rust clippy check

# CI gate enforcing `cargo clippy --workspace --all-targets --features cli
# -- -D warnings` on every push and PR. Mirrors the fmt-check.yml pattern: a fast
# pre-merge guard so the tree stays clippy-clean, complementing the
# workspace's `[workspace.lints.rust] warnings = "deny"` policy which
# only gates rustc warnings (clippy style/complexity/suspicious
# categories require explicit `cargo clippy` invocation).
#
# Motivation: prior to this gate, 6 clippy regressions slipped through
# review on the Item 4 quantity (`0803c08ff`) and C1 Path A Atomic 3
# (`c46b1dbff`) commits because `cargo check` / `cargo test` /
# `cargo fmt --check` all pass on code that fails `cargo clippy`.
# Source-tree lint drift is the parallel of the §6.2.6 generated-tree
# drift that drift-verify.yml already gates.
#
# The corresponding pre-commit hook (scripts/hooks/pre-commit) gives
# developers a local fast-fail, but the CI gate is the authoritative
# enforcement point — hooks are opt-in install per developer, the
# workflow is mandatory per merge.

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - '.clippy.toml'
      - 'scripts/gates/rust-version.sh'
      - '.github/workflows/clippy-check.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - '.clippy.toml'
      - 'scripts/gates/rust-version.sh'
      - '.github/workflows/clippy-check.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clippy-check:
    name: cargo clippy --workspace --all-targets --features cli
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    # The release rust-toolchain.toml pins, which lists clippy: the lint
    # set moves with the release, so it moves only when that file does.
    - name: Install Rust Toolchain (with clippy)
      uses: ./.github/actions/install-rust

    - name: Cache cargo registry + target
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ hashFiles('rust-toolchain.toml') }}

    # Delegates to the gate runner rather than restating the command,
    # so the lint set has one spelling for both callers.
    - name: cargo clippy --workspace --all-targets --features cli
      run: scripts/gate clippy

  # The lint set above is measured against each package's declared
  # rust-version; this job is what keeps those declarations true. It
  # installs every toolchain a package declares and builds the package
  # with it (scripts/gates/rust-version.sh says what that covers).
  rust-version:
    name: Every package builds with the Rust it declares
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    # The release rust-toolchain.toml pins runs `cargo metadata`; each
    # package is built by the toolchain it declares, which the gate installs
    # and puts first on PATH, out of reach of that file.
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    - name: Cache cargo registry + target
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ hashFiles('rust-toolchain.toml') }}

    - name: Build each package with its declared rust-version
      run: scripts/gate rust-version
