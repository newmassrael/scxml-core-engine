name: Formal Proofs

# The proofs of the host core under Verus (docs/adr/0115, D13), as
# docs/formal/proofs.json declares them, judged by `sce-codegen formal proofs`
# (docs/adr/0146).
#
# ## Why a lane of its own
#
# It needs the pinned Verus and the Rust release Verus runs on, which is not the one
# this repository builds with (rust-toolchain.toml) and which no other lane needs. Both
# are pinned by sce-build/src/formal/toolchain.json, so the cache is under a key made of
# that file.
#
# ## Why `ci_only` in the registry
#
# A developer's machine need not carry either tool, and the push set runs there.
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/formal/proofs.json'
      - 'sce-build/src/formal/**'
      - 'backends/rust/mesh/src/https/**'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/formal-proofs.sh'
      - '.github/workflows/formal-proofs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/formal/proofs.json'
      - 'sce-build/src/formal/**'
      - 'backends/rust/mesh/src/https/**'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/formal-proofs.sh'
      - '.github/workflows/formal-proofs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formal-proofs:
    name: Formal Proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # libxml2 backs the default `xsd` feature the generator builds with.
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxml2-dev

      - name: Install Rust Toolchain
        uses: ./.github/actions/install-rust

      - name: Compile through the shared compile cache
        id: compile-cache
        uses: ./.github/actions/compile-cache

      - name: Restore Verus and its Rust release
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.local/verus
            ~/.local/rust
          key: verus-${{ hashFiles('sce-build/src/formal/toolchain.json', 'sce-build/src/formal/toolchain.rs', 'scripts/install_rust.sh') }}

      # The judge never fetches (docs/adr/0146, D1): Verus is fetched and admitted by
      # the digest the judge pins, and the Rust release it runs on is the one that
      # `sce-codegen formal toolchain` names.
      - name: Install Verus and the Rust release it runs on
        run: |
          cargo run --quiet --bin sce-codegen --features cli -p sce-build -- formal install --tool verus
          release="$(cargo run --quiet --bin sce-codegen --features cli -p sce-build -- formal toolchain | python3 -c 'import json, sys; print(json.load(sys.stdin)["verus"]["toolchain"])')"
          bash scripts/install_rust.sh --declared "$release"

      - name: Formal proofs gate
        run: scripts/gate formal-proofs

      # What the compile cache answered of this job, and what it could not
      # (.github/actions/compile-cache).
      - name: Report what the compile cache answered
        if: always() && steps.compile-cache.outcome == 'success'
        run: sccache --show-stats
