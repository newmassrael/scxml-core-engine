name: Regen Reproduces Committed Trees

# The regeneration procedure reproduces what is committed.
#
# `scripts/regen_all_committed_trees.sh` has always stated this in its own
# header — that is why it pins SOURCE_DATE_EPOCH — and nothing checked it.
# Measured before this lane existed: the Rust W3C tree carried three
# `__sce_synth_invoke__*.scxml` documents that no run produces, left behind
# when the parser moved to synthesising an invoke child in memory.
#
# It also closes what the drift hashes cannot see. `source-hash` and
# `template-hash` both cover INPUTS — the documents and the templates — so a
# change to the emit code under `sce-build/src` that alters the output moves
# neither hash, and the committed trees drift with every gate green.
# Regenerating and comparing is the only reader of that axis.

on:
  # No `paths:` filter, deliberately.
  #
  # This lane regenerates EVERY committed tree and compares. Its input set is
  # therefore the union of the generator under `sce-build/`, the whole template
  # tree, every regeneration script, every authored document any of them reads,
  # and every committed artefact they write — very nearly the repository. A
  # glob list over that is the shape `workflow_trigger_coverage` was written
  # about: it enumerates the trees that exist today and by construction cannot
  # name the one whose arrival it exists to catch.
  #
  # Measured 2026-08-30, which is why the filter is gone rather than merely
  # wider: of the 1303 tracked artefacts carrying a §synth-6.2.6 drift header,
  # 538 sat OUTSIDE the filter this block used to hold. It named
  # `backends/rust/tests/src/generated/**` and
  # `backends/kotlin/tests/src/main/kotlin/com/sce/generated/**` and stopped
  # there, so every Kotlin `com/sce/integration/**` and `src/test/**` tree,
  # every Rust `src/integration/**` tree and `tests/test_*.rs`, and the Go
  # forge round-trip codecs were invisible to it. The consequence is not
  # hypothetical: the round that made lowered Lua the Kotlin backend's default
  # artefact left 40 Kotlin integration files stale and this lane red, and the
  # commit that REGENERATES those 40 would not have started this lane at all —
  # the red could not have been cleared by the change that fixes it.
  #
  # `the_regen_lane_is_started_by_every_artefact_it_reproduces` holds this
  # open. A filter may come back, but only one that covers every committed
  # artefact.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen:
    name: regeneration reproduces the committed trees
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      # Full history: the gate checks out a worktree of HEAD, which a
      # depth-1 clone cannot provide.
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    # libxml2 backs the default `xsd` feature the generator builds with.
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libxml2-dev

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-regen-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-regen-

    # Delegates to the gate runner, which also builds the generator through
    # the `codegen-build` dependency the registry records.
    - name: scripts/gate regen-reproduces
      run: scripts/gate regen-reproduces
