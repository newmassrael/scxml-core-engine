name: Regen Reproduces Committed Trees

# The regeneration procedure reproduces what is committed.
#
# `scripts/regen_all_committed_trees.sh` has always stated this in its own
# header, and nothing checked it. Measured before this lane existed: the Rust
# W3C tree carried three `__sce_synth_invoke__*.scxml` documents that no run
# produces, left behind when the parser moved to synthesising an invoke child
# in memory.
#
# It also closes what the header cannot see. `source-hash` covers the INPUT
# documents, so a change to the templates or to the emit code under
# `sce-build/src` that alters the output does not move it, and the committed
# trees drift with every other gate green. Regenerating and comparing is the
# only reader of that axis — the header used to carry a `template-hash` that
# claimed part of it, and was retired because it both re-stamped every tree
# for edits that changed nothing and missed edits to the emit code.

on:
  # No `paths:` filter, deliberately.
  #
  # This lane regenerates EVERY committed tree and compares. Its input set is
  # therefore the union of the generator under `sce-build/`, the whole template
  # tree, every regeneration script, every authored document any of them reads,
  # and every committed artefact they write — very nearly the repository. A
  # glob list over that is the shape `workflow_trigger_coverage` was written
  # about: it enumerates the trees that exist today and by construction cannot
  # name the one whose arrival it exists to catch.
  #
  # Measured 2026-08-30, which is why the filter is gone rather than merely
  # wider: of the 1303 tracked artefacts carrying a §synth-6.2.6 drift header,
  # 538 sat OUTSIDE the filter this block used to hold. It named
  # `backends/rust/tests/src/generated/**` and
  # `backends/kotlin/tests/src/main/kotlin/com/sce/generated/**` and stopped
  # there, so every Kotlin `com/sce/integration/**` and `src/test/**` tree,
  # every Rust `src/integration/**` tree and `tests/test_*.rs`, and the Go
  # forge round-trip codecs were invisible to it. The consequence is not
  # hypothetical: the round that made lowered Lua the Kotlin backend's default
  # artefact left 40 Kotlin integration files stale and this lane red, and the
  # commit that REGENERATES those 40 would not have started this lane at all —
  # the red could not have been cleared by the change that fixes it.
  #
  # `the_regen_lane_is_started_by_every_artefact_it_reproduces` holds this
  # open. A filter may come back, but only one that covers every committed
  # artefact.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The regeneration in three shards, one job each, and a last job, `regen`,
  # that holds them together, as cpp-suite.yml does for its ctest suite. Run
  # whole, the job took 1666 s (job 138988228323, 1499ef6b36): 3m26s building
  # the generator and 21m55s regenerating, one step after another. A step owns
  # its trees and reads nothing another step writes
  # (scripts/regen_all_committed_trees.sh), so each job runs the gate with
  # `SCE_REGEN_SHARD`, which regenerates the trees of its part of the steps
  # (scripts/lib/workspace_shards.py) and compares them, and `regen` holds the
  # parts to one plan and to every step. Three, because every job pays about
  # six minutes whatever its share (the checkout, the tools and the
  # generator's build), and the largest step, the forge goldens, is one
  # indivisible part of about a third of the steps' time: a fourth job would
  # shorten the others and not the one that holds it. The ceiling is the whole
  # lane's until a sharded run is measured.
  regen-shard:
    name: regeneration reproduces the committed trees (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # `packages: write` for the image a run on main builds and pushes
    # (.github/actions/gate-image says why the permission cannot follow the
    # event); `contents: read` is what checkout needs.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # The account's 20 hosted jobs are shared; one job per shard at once.
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout Repository
      # Full history: the gate checks out a worktree of HEAD, which a
      # depth-1 clone cannot provide.
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0
        submodules: recursive

    # The gate runs in the host image (tools/ci-images/host), which carries
    # what the procedure needs beside Rust. libxml2 backs the default `xsd`
    # feature the generator builds with.
    #
    # clang-format-19: the procedure regenerates the Mesh C++ envelope tree
    # (`sce/src/mesh/generate_envelope.sh`) through `sce-codegen`, which
    # formats C++ with clang-format pinned to major 19 and refuses without it
    # (docs/SCE_CODEGEN_DETERMINISM.md §9). Without it the procedure stops at
    # that stage, and a lane that cannot finish the procedure says nothing
    # about whether any tree reproduces.
    #
    # clang-19: the procedure emits embed/MANIFEST.json, clang's reading of
    # the public headers, and its stamp (scripts/emit_embed_manifest.sh), and
    # the emitter refuses without it for the same reason. Go: the steps that
    # build Go run the release the Go modules declare.
    # The release rust-toolchain.toml pins, which lists rustfmt: the
    # generator's Rust output is formatted with it, so what reproduces
    # moves only when that file does.
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache

    # The registry's credentials, so the runner pulls the gate's image by the
    # digest of its build context and a run on main pushes one it built
    # (.github/actions/gate-image).
    - name: Pull the gate's image
      uses: ./.github/actions/gate-image

    # Delegates to the gate runner, which also builds the generator through
    # the `codegen-build` dependency the registry records.
    - name: scripts/gate regen-reproduces
      env:
        SCE_REGEN_SHARD: ${{ matrix.shard }}/3
      run: scripts/gate regen-reproduces

    # The plan and what this shard ran (`regen` reads them). The gate writes
    # them under `target/`, which in the image is the image's own build
    # directory in its cache (`gate_in_container` in scripts/gate).
    - name: Upload this shard's plan
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: regen-shard-${{ matrix.shard }}
        path: ~/.cache/sce-gate-containers/regen-reproduces/target/regen-shard/
        retention-days: 30
        if-no-files-found: warn

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # The verdict of the lane: every shard planned the steps alike and ran every
  # step of its part, so the trees the three jobs compared are every tree the
  # gate compares. A job of its own because a matrix answers per shard, and a
  # step that fell between two plans would leave every shard green. It keeps
  # the job's id and name, where the lane's readers find the unsharded job.
  regen:
    name: regeneration reproduces the committed trees
    needs: regen-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Download the shards' plans
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: regen-shard-*
        path: shards

    - name: Hold the shards to one plan and every step
      env:
        SHARDS_RESULT: ${{ needs.regen-shard.result }}
      run: |
        status=0
        python3 scripts/lib/ctest_shards.py verify shards || status=1
        if [[ "$SHARDS_RESULT" != success ]]; then
          echo "::error title=regen-reproduces::a shard job ended $SHARDS_RESULT"
          status=1
        fi
        exit "$status"
