name: Deploy Visualizer

on:
  push:
    branches: [main]
    paths:
      - 'web/visualizer/**'
      - 'rsm/**'
      - 'tools/codegen/**'
      # The codegen WASM is built from these, so a change here changes
      # what the site ships. They were absent while the artifact was
      # committed, which meant a generator fix could not reach the page
      # even after someone rebuilt the binary by hand.
      - 'sce-build/**'
      - 'sce-build-wasm/**'
      - 'tests/w3c/InteractiveTestRunner.cpp'
      - 'examples/doom_wasm/**'
      - 'web/site/**'
      # The emsdk release the build machines install for this lane's gates
      # (`[platform.linux.tools.emsdk]` in bx.toml); the step below names the
      # same release, and the gate registry's self-test holds the two to one.
      - 'scripts/install_emsdk.sh'
      # What the page's engine and the codegen WASM are built from beside
      # the lines above: the main CMake tree, and what cargo reads to build
      # the generator crate (`builds` of `visualizer-wasm` in
      # tools/git-hooks/gate_registry.py, "What a build reads"; its
      # self-test holds this list to that one).
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'sce/**'
      - 'third_party/**'
      - 'backends/cpp/forge-runtime/**'
      - 'backends/c/**'
      - 'tools/txml_converter/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'backends/rust/portable-bytes/**'
      - 'backends/rust/runtime/**'
      - 'backends/rust/tests/src/harness.rs'
      - 'backends/go/tests/go.sum'
      - 'backends/go/tests/harness/harness.go'
      - 'backends/kotlin/runtime/src/commonMain/kotlin/com/sce/runtime/StateMachineEngine.kt'
      - 'backends/kotlin/test-harness/src/main/kotlin/com/sce/http/W3CHttpTestServer.kt'
      - 'backends/kotlin/test-harness/src/main/kotlin/com/sce/w3c/*.kt'
      - 'backends/rust/forge-runtime/**'
      - 'backends/kotlin/forge-runtime/src/commonMain/kotlin/com/sce/forge/runtime/Codec.kt'
      - 'backends/go/forge-runtime/codec/codec.go'
      - 'backends/go/forge-runtime/codec/cbor.go'
      - 'backends/go/forge-runtime/codec/content_line.go'
      - 'backends/python/forge-runtime/sce_forge_runtime/codec.py'
      - 'backends/python/forge-runtime/sce_forge_runtime/cbor.py'
      - 'backends/python/forge-runtime/sce_forge_runtime/content_line.py'
      - 'backends/swift/forge-runtime/Sources/SceForgeRuntime/Codec.swift'
      - 'backends/python/runtime/sce_runtime/policy.py'
      - 'backends/python/tests/conftest.py'
      - 'stdlib/**'
      - 'schemas/**'
      - 'apis/**'
      - 'SCE_ERROR_CONTRACT.md'
      - 'SCE_MESH.md'
      - 'docs/SCE_ACCEPTED_SUBSET.md'
      - 'tests/forge/resources/codec_zenoh_ext_entry.scxml'
      - 'tests/mesh/mesh_target_cases.json'
      - '.github/workflows/deploy-visualizer.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
  workflow_dispatch:

# This lane crossed the line, and it crossed it while carrying the note that
# said to watch for exactly that.
#
# Measured 2026-09-02 over this lane's own last 25 runs: a 17.9 min median
# success against a 17.6 min median gap between pushes to `main`. It read 15.9
# a few hours earlier, and `ci_supersession_policy` named it "the one to
# re-measure first"; re-measured on that instruction it was past the
# threshold, so the rule now requires `false` here.
#
# ⚠ Nothing about this lane's OUTCOME had deteriorated: 22 successes in that
# window, and a longest run of consecutive pushes leaving it unanswered of
# ONE. The `paths:` filter above is why — most pushes never reach it, so the
# gap it actually faces is wider than the branch-wide one it is compared
# against. That comparison is kept deliberately, because its direction is
# safe: the pushes reaching a filtered lane are a SUBSET, and gaps between a
# subset are never smaller, so the branch-wide figure can only ask for `false`
# where it was not needed. Queueing a deploy nothing needed queued is the
# cheap side of that error, and a lost deploy verdict is the dear one.
#
# ⚠ BACK TO `false` BY OWNER DECISION, 2026-10-01, reversing the flip to `true`
# of 2026-09-15: the run in flight is kept and one waiting run holds the newest
# commit. See `cpp-suite.yml` for the reasoning and the cost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Visualizer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          g++ \
          ninja-build \
          pkg-config \
          libxml2-dev \
          libspdlog-dev \
          libfmt-dev \
          libboost-dev \
          clang-format-19
    # clang-format-19: the WASM build generates its state machines through
    # `sce-codegen`, which formats C++ with clang-format pinned to major 19
    # and refuses without it (docs/SCE_CODEGEN_DETERMINISM.md §9).

    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    - name: Cache Cargo (codegen)
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('sce-build/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-codegen-${{ hashFiles('rust-toolchain.toml') }}-

    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only
        # builds the debug profile, so a release binary the cache still
        # holds is not a product of this commit. The locator knows which
        # path that is; naming it here would put a build-layout detail
        # back into every workflow.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    # The codegen WASM used to be a committed binary under
    # web/visualizer/wasm/ that nothing in the repository could rebuild:
    # `sce-build` had no cdylib crate-type, so wasm-pack refused it and
    # the artifact could only be produced by hand-editing Cargo.toml.
    # It therefore drifted from the templates it embeds — the shipped
    # copy rendered `_macros/` imports that its own template list did not
    # contain, so every browser generation failed while every native
    # build passed. Building it here makes the deployed generator a
    # function of the commit being deployed.
    #
    # ⚠ PINNED, not `latest`, and the reason is a silent fallback measured
    # 2026-09-15. The action resolves `latest` with an unauthenticated call
    # to the GitHub releases API and falls back without a warning when the
    # reply has no tag:
    #
    #     return Promise.resolve(JSON.parse(body).tag_name || 'v0.9.1')
    #
    # A rate-limited reply has no tag, so a shared runner can be handed a
    # wasm-pack from 2019. That is what turned this lane red at c8f2355055:
    # the previous green installed v0.15.0, the red one v0.9.1, and v0.9.1
    # cannot parse `license.workspace = true` in `sce-build-wasm/Cargo.toml`
    # ("invalid type: map, expected a string for key `package.license`"),
    # which had been there since 2026-08-03 without incident. Nothing in the
    # tree changed; the tool did. A pinned tag skips the lookup, so there is
    # no reply to go missing. v0.15.0 is the version the last green run
    # actually installed, so the pin changes nothing but the nondeterminism.
    - name: Install wasm-pack
      uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
      with:
        version: 'v0.15.0'

    - name: Setup Emscripten (emsdk)
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        # The release this lane was last green on; `latest` moved to 7.0.0.
        ./emsdk install 6.0.13
        ./emsdk activate 6.0.13

    # All three WASM builds are one gate — the same one the pre-push hook
    # runs. SCE_REQUIRE_TOOLS turns the gate's "emscripten not installed,
    # skipping" into a failure here: a lane that claims to build the
    # visualizer must not report green because emsdk went missing.
    - name: Build WASM Artifacts
      env:
        SCE_REQUIRE_TOOLS: 1
      run: |
        source emsdk/emsdk_env.sh
        chmod +x examples/doom_wasm/build.sh
        scripts/gate visualizer-wasm

    - name: Verify diagram layout
      # After the WASM build, because the measurement turns a document into
      # a structure through `gui_structure()` in the codegen WASM — the same
      # call the page makes — and compares it with the engine's through
      # `visualizer.js`. Before the deploy, because a drawing whose edges
      # reach nothing should not be published.
      run: scripts/gate visualizer-layout

    - name: Prepare Deployment Directory
      run: |
        mkdir -p gh-pages/visualizer

        # Copy root site files (landing pages, sitemap, robots.txt)
        echo "Copying root site files..."
        cp web/site/*.html gh-pages/
        cp web/site/sitemap.xml gh-pages/
        cp web/site/robots.txt gh-pages/

        # Copy visualizer source files
        echo "Copying visualizer source files..."
        cp -r web/visualizer/* gh-pages/visualizer/

        # Copy WASM build outputs (overwrite placeholder files if present).
        # The browser module is built in the tree without threads
        # (scripts/gates/lib.sh, the two emscripten trees).
        echo "Copying WASM build outputs..."
        cp build_wasm_web/tests/visualizer.wasm gh-pages/visualizer/
        cp build_wasm_web/tests/visualizer.js gh-pages/visualizer/

        # Copy SCXML resources for visualizer
        echo "Copying SCXML test resources..."
        cp -r resources gh-pages/visualizer/

        # Copy DOOM WASM example
        echo "Copying DOOM WASM example..."
        mkdir -p gh-pages/visualizer/doom
        cp examples/doom_wasm/build/index.html gh-pages/visualizer/doom/
        cp examples/doom_wasm/build/doom_sce.js gh-pages/visualizer/doom/
        cp examples/doom_wasm/build/doom_sce.wasm gh-pages/visualizer/doom/
        cp examples/doom_wasm/build/doom_sce.data gh-pages/visualizer/doom/
        # Copy visualizer for DOOM (visualizer.html at root, JS files in web/visualizer/ (source))
        cp -r web/visualizer gh-pages/visualizer/doom/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
        keep_files: true
