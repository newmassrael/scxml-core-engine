name: Deploy Visualizer

on:
  push:
    branches: [main]
    paths:
      - 'web/visualizer/**'
      - 'rsm/**'
      - 'tools/codegen/**'
      # The codegen WASM is built from these, so a change here changes
      # what the site ships. They were absent while the artifact was
      # committed, which meant a generator fix could not reach the page
      # even after someone rebuilt the binary by hand.
      - 'sce-build/**'
      - 'sce-build-wasm/**'
      - 'tests/w3c/InteractiveTestRunner.cpp'
      - 'examples/doom_wasm/**'
      - 'web/site/**'
      - '.github/workflows/deploy-visualizer.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy Visualizer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          g++ \
          ninja-build \
          pkg-config \
          libxml2-dev \
          libspdlog-dev \
          libfmt-dev \
          libboost-dev

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo (codegen)
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('sce-build/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-codegen-

    - name: Build sce-codegen
      run: cargo build --bin sce-codegen --features cli --release -p sce-build

    # The codegen WASM used to be a committed binary under
    # web/visualizer/wasm/ that nothing in the repository could rebuild:
    # `sce-build` had no cdylib crate-type, so wasm-pack refused it and
    # the artifact could only be produced by hand-editing Cargo.toml.
    # It therefore drifted from the templates it embeds — the shipped
    # copy rendered `_macros/` imports that its own template list did not
    # contain, so every browser generation failed while every native
    # build passed. Building it here makes the deployed generator a
    # function of the commit being deployed.
    - name: Install wasm-pack
      uses: jetli/wasm-pack-action@v0.4.0
      with:
        version: 'latest'

    - name: Build Codegen WASM
      run: |
        wasm-pack build sce-build-wasm \
          --target web \
          --out-dir ../web/visualizer/wasm \
          --out-name sce_build

    - name: Setup Emscripten (emsdk)
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest

    - name: Build WASM Visualizer
      run: |
        source emsdk/emsdk_env.sh
        mkdir -p build_wasm && cd build_wasm
        emcmake cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja
        cmake --build . --target visualizer -j$(nproc)

    - name: Build DOOM WASM Example
      run: |
        source emsdk/emsdk_env.sh
        cd examples/doom_wasm
        chmod +x build.sh
        ./build.sh

    - name: Prepare Deployment Directory
      run: |
        mkdir -p gh-pages/visualizer

        # Copy root site files (landing pages, sitemap, robots.txt)
        echo "Copying root site files..."
        cp web/site/*.html gh-pages/
        cp web/site/sitemap.xml gh-pages/
        cp web/site/robots.txt gh-pages/

        # Copy visualizer source files
        echo "Copying visualizer source files..."
        cp -r web/visualizer/* gh-pages/visualizer/

        # Copy WASM build outputs (overwrite placeholder files if present)
        echo "Copying WASM build outputs..."
        cp build_wasm/tests/visualizer.wasm gh-pages/visualizer/
        cp build_wasm/tests/visualizer.js gh-pages/visualizer/

        # Copy SCXML resources for visualizer
        echo "Copying SCXML test resources..."
        cp -r resources gh-pages/visualizer/

        # Copy DOOM WASM example
        echo "Copying DOOM WASM example..."
        mkdir -p gh-pages/visualizer/doom
        cp examples/doom_wasm/build/index.html gh-pages/visualizer/doom/
        cp examples/doom_wasm/build/doom_sce.js gh-pages/visualizer/doom/
        cp examples/doom_wasm/build/doom_sce.wasm gh-pages/visualizer/doom/
        cp examples/doom_wasm/build/doom_sce.data gh-pages/visualizer/doom/
        # Copy visualizer for DOOM (visualizer.html at root, JS files in web/visualizer/ (source))
        cp -r web/visualizer gh-pages/visualizer/doom/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
        keep_files: true
