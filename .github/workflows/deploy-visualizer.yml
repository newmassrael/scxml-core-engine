name: Deploy Visualizer

on:
  push:
    branches: [main]
    paths:
      - 'web/visualizer/**'
      - 'rsm/**'
      - 'tools/codegen/**'
      # The codegen WASM is built from these, so a change here changes
      # what the site ships. They were absent while the artifact was
      # committed, which meant a generator fix could not reach the page
      # even after someone rebuilt the binary by hand.
      - 'sce-build/src/**'
      - 'sce-build/build.rs'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'sce-build-wasm/**'
      - 'tests/w3c/InteractiveTestRunner.cpp'
      - 'examples/doom_wasm/**'
      - 'web/site/**'
      # The emsdk release the build machines install for this lane's gates
      # (`[platform.linux.tools.emsdk]` in bx.toml); the step below names the
      # same release, and the gate registry's self-test holds the two to one.
      - 'scripts/install_emsdk.sh'
      # What the page's engine and the codegen WASM are built from beside
      # the lines above: the main CMake tree, and what cargo reads to build
      # the generator crate (`builds` of `visualizer-wasm` in
      # tools/git-hooks/gate_registry.py, "What a build reads"; its
      # self-test holds this list to that one).
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'sce/**'
      - 'third_party/**'
      - 'backends/cpp/forge-runtime/**'
      - 'backends/c/**'
      - 'tools/txml_converter/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/**'
      - 'backends/rust/portable-bytes/**'
      - 'backends/rust/runtime/**'
      - 'backends/rust/tests/src/harness.rs'
      - 'backends/go/tests/go.sum'
      - 'backends/go/tests/harness/harness.go'
      - 'backends/kotlin/runtime/src/commonMain/kotlin/com/sce/runtime/StateMachineEngine.kt'
      - 'backends/kotlin/test-harness/src/main/kotlin/com/sce/http/W3CHttpTestServer.kt'
      - 'backends/kotlin/test-harness/src/main/kotlin/com/sce/w3c/*.kt'
      - 'backends/rust/forge-runtime/**'
      - 'backends/kotlin/forge-runtime/src/commonMain/kotlin/com/sce/forge/runtime/Codec.kt'
      - 'backends/go/forge-runtime/codec/codec.go'
      - 'backends/go/forge-runtime/codec/cbor.go'
      - 'backends/go/forge-runtime/codec/content_line.go'
      - 'backends/python/forge-runtime/sce_forge_runtime/codec.py'
      - 'backends/python/forge-runtime/sce_forge_runtime/cbor.py'
      - 'backends/python/forge-runtime/sce_forge_runtime/content_line.py'
      - 'backends/swift/forge-runtime/Sources/SceForgeRuntime/Codec.swift'
      - 'backends/python/runtime/sce_runtime/policy.py'
      - 'backends/python/tests/conftest.py'
      - 'stdlib/**'
      - 'schemas/**'
      - 'apis/**'
      - 'SCE_ERROR_CONTRACT.md'
      - 'SCE_MESH.md'
      - 'docs/SCE_ACCEPTED_SUBSET.md'
      - 'tests/forge/resources/codec_zenoh_ext_entry.scxml'
      - 'tests/mesh/mesh_target_cases.json'
      - '.github/workflows/deploy-visualizer.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
  workflow_dispatch:

# This lane crossed the line, and it crossed it while carrying the note that
# said to watch for exactly that.
#
# Measured 2026-09-02 over this lane's own last 25 runs: a 17.9 min median
# success against a 17.6 min median gap between pushes to `main`. It read 15.9
# a few hours earlier, and `ci_supersession_policy` named it "the one to
# re-measure first"; re-measured on that instruction it was past the
# threshold, so the rule now requires `false` here.
#
# ⚠ Nothing about this lane's OUTCOME had deteriorated: 22 successes in that
# window, and a longest run of consecutive pushes leaving it unanswered of
# ONE. The `paths:` filter above is why — most pushes never reach it, so the
# gap it actually faces is wider than the branch-wide one it is compared
# against. That comparison is kept deliberately, because its direction is
# safe: the pushes reaching a filtered lane are a SUBSET, and gaps between a
# subset are never smaller, so the branch-wide figure can only ask for `false`
# where it was not needed. Queueing a deploy nothing needed queued is the
# cheap side of that error, and a lost deploy verdict is the dear one.
#
# ⚠ BACK TO `false` BY OWNER DECISION, 2026-10-01, reversing the flip to `true`
# of 2026-09-15: the run in flight is kept and one waiting run holds the newest
# commit. See `cpp-suite.yml` for the reasoning and the cost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The site's three WebAssembly builds, one job each: the codegen WASM
  # (wasm-pack), the visualizer's engine and the DOOM example (both
  # emscripten). Each job runs the visualizer-wasm gate with
  # `SCE_VISUALIZER_WASM_SHARD`, which runs one line of the gate's
  # VISUALIZER_WASM_PARTS (the order of the lines is the order of the shards
  # below); `hook_ci_parity` holds the matrix to the number of lines.
  #
  # Run one after another in one job they took 15.2 min of a 25.1 min run (job
  # 139033453523): the codegen WASM 8.9 (the release compile of sce-build 5.4,
  # wasm-opt 3.2), the engine 3.3 and DOOM 3.1, behind a generator build of 3.5
  # that only the emscripten builds read. The layout step then ran
  # visualizer-wasm again as its dependency, and wasm-pack's wasm-opt again
  # with it (3.6 min, "Done in 3m 34s"). Apart, the codegen WASM is the longest
  # part, about 10 min on its own, and the others build the generator beside it.
  #
  # Rust compiles through the shared compile cache
  # (.github/actions/compile-cache): the codegen WASM's time is a release
  # compile of sce-build and wasm-opt over its output, and the cache answers the
  # dependencies of the first on every commit and sce-build itself on one that
  # left it as it was; nothing here caches the second. What emcc compiles is not
  # handed to it: the emscripten parts (about 9 min each, the generator's 3.5
  # with them) end before the codegen WASM does, so their objects would take
  # room in the repository's caches and shorten no run.
  build:
    name: Visualizer WebAssembly (part ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    # clang-format-19: the emscripten builds generate their state machines
    # through `sce-codegen`, which formats C++ with clang-format pinned to major
    # 19 and refuses without it (docs/SCE_CODEGEN_DETERMINISM.md §9). The codegen
    # WASM (part 1) builds `sce-build` without libxml2 and runs no generator.
    - name: Install Dependencies
      if: matrix.shard != 1
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          g++ \
          ninja-build \
          pkg-config \
          libxml2-dev \
          libspdlog-dev \
          libfmt-dev \
          libboost-dev \
          clang-format-19

    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache

    - name: Build sce-codegen
      if: matrix.shard != 1
      run: |
        # This step builds the debug profile alone, so a release binary
        # another build left in `target` is not a product of this
        # commit. The locator knows which path that is; naming it here
        # would put a build-layout detail back into every workflow.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    # The codegen WASM used to be a committed binary under
    # web/visualizer/wasm/ that nothing in the repository could rebuild:
    # `sce-build` had no cdylib crate-type, so wasm-pack refused it and
    # the artifact could only be produced by hand-editing Cargo.toml.
    # It therefore drifted from the templates it embeds — the shipped
    # copy rendered `_macros/` imports that its own template list did not
    # contain, so every browser generation failed while every native
    # build passed. Building it here makes the deployed generator a
    # function of the commit being deployed.
    #
    # ⚠ PINNED, not `latest`, and the reason is a silent fallback measured
    # 2026-09-15. The action resolves `latest` with an unauthenticated call
    # to the GitHub releases API and falls back without a warning when the
    # reply has no tag:
    #
    #     return Promise.resolve(JSON.parse(body).tag_name || 'v0.9.1')
    #
    # A rate-limited reply has no tag, so a shared runner can be handed a
    # wasm-pack from 2019. That is what turned this lane red at c8f2355055:
    # the previous green installed v0.15.0, the red one v0.9.1, and v0.9.1
    # cannot parse `license.workspace = true` in `sce-build-wasm/Cargo.toml`
    # ("invalid type: map, expected a string for key `package.license`"),
    # which had been there since 2026-08-03 without incident. Nothing in the
    # tree changed; the tool did. A pinned tag skips the lookup, so there is
    # no reply to go missing. v0.15.0 is the version the last green run
    # actually installed, so the pin changes nothing but the nondeterminism.
    - name: Install wasm-pack
      if: matrix.shard == 1
      uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
      with:
        version: 'v0.15.0'

    # The installed SDK, cached under the release scripts/install_emsdk.sh pins
    # (the registry holds the release below to it): a lane that downloaded it on
    # every run failed when the download did (run 45496827881, a name lookup), and
    # the jobs that build with it share the one entry.
    - name: Cache Emscripten (emsdk)
      id: emsdk-cache
      if: matrix.shard != 1
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: emsdk
        key: emsdk-${{ runner.os }}-${{ hashFiles('scripts/install_emsdk.sh') }}

    - name: Setup Emscripten (emsdk)
      if: matrix.shard != 1 && steps.emsdk-cache.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        # The release this lane was last green on; `latest` moved to 7.0.0.
        ./emsdk install 6.0.13
        ./emsdk activate 6.0.13

    # One part of the gate the pre-push hook runs whole. SCE_REQUIRE_TOOLS
    # turns the gate's "emscripten not installed, skipping" into a failure
    # here: a lane that claims to build the visualizer must not report green
    # because emsdk went missing. The codegen WASM job has no SDK and needs
    # none; its part never asks for one.
    - name: Build this part's WebAssembly
      env:
        SCE_REQUIRE_TOOLS: 1
        SCE_VISUALIZER_WASM_SHARD: ${{ matrix.shard }}/3
      run: |
        if [[ -f emsdk/emsdk_env.sh ]]; then
          source emsdk/emsdk_env.sh
        fi
        scripts/gate visualizer-wasm

    # Each part's output, for the layout measurement and the publish below.
    # The browser module is built in the tree without threads, and its build
    # copies it beside the page (scripts/gates/lib.sh, the two emscripten
    # trees; `visualizer` in tests/CMakeLists.txt).
    - name: Upload the codegen WASM
      if: matrix.shard == 1
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: visualizer-codegen-wasm
        path: web/visualizer/wasm/
        retention-days: 1
        if-no-files-found: error

    - name: Upload the visualizer's engine
      if: matrix.shard == 2
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: visualizer-engine
        path: |
          web/visualizer/visualizer.js
          web/visualizer/visualizer.wasm
        retention-days: 1
        if-no-files-found: error

    - name: Upload the DOOM example
      if: matrix.shard == 3
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: visualizer-doom
        path: |
          examples/doom_wasm/build/index.html
          examples/doom_wasm/build/doom_sce.js
          examples/doom_wasm/build/doom_sce.wasm
          examples/doom_wasm/build/doom_sce.data
        retention-days: 1
        if-no-files-found: error

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # The diagram's layout, measured on the two modules the page loads: the
  # codegen WASM turns a document into a structure through `gui_structure()`,
  # the call the page makes, and the engine is compared with it through
  # `visualizer.js`. Before the publish, because a drawing whose edges reach
  # nothing should not be published. It runs `visualizer.js` on the node the
  # SDK ships (`em-config NODE_JS`), so the job restores the SDK the build
  # saved; the gate refuses to run without one.
  #
  # The gate's script, not `scripts/gate visualizer-layout`: the runner would
  # build its dependency, visualizer-wasm, whole first, all three parts again
  # (the 3.6 min the single job spent on a second wasm-opt, and the rest of
  # the 15.2 with it here, where no part was built), and the parts this
  # measures are the ones the jobs above built from this commit
  # (tools/git-hooks/gates/visualizer-layout.py, "Not delegated").
  layout:
    name: Verify diagram layout
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    - name: Restore Emscripten (emsdk)
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: emsdk
        key: emsdk-${{ runner.os }}-${{ hashFiles('scripts/install_emsdk.sh') }}
        fail-on-cache-miss: true

    - name: Download the codegen WASM
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: visualizer-codegen-wasm
        path: web/visualizer/wasm

    - name: Download the visualizer's engine
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: visualizer-engine
        path: web/visualizer

    - name: Verify diagram layout
      run: |
        source emsdk/emsdk_env.sh
        bash scripts/gates/visualizer-layout.sh

  # The site, assembled from what the jobs above built and published once the
  # layout passed. The one job that writes to the repository (gh-pages).
  publish:
    name: Deploy Visualizer
    needs: [build, layout]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    - name: Download the codegen WASM
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: visualizer-codegen-wasm
        path: web/visualizer/wasm

    - name: Download the visualizer's engine
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: visualizer-engine
        path: web/visualizer

    - name: Download the DOOM example
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: visualizer-doom
        path: examples/doom_wasm/build

    - name: Prepare Deployment Directory
      run: |
        mkdir -p gh-pages/visualizer

        # Copy root site files (landing pages, sitemap, robots.txt)
        echo "Copying root site files..."
        cp web/site/*.html gh-pages/
        cp web/site/sitemap.xml gh-pages/
        cp web/site/robots.txt gh-pages/

        # Copy visualizer source files, with the codegen WASM (wasm/) and the
        # engine (visualizer.js, visualizer.wasm) the build jobs put beside
        # them
        echo "Copying visualizer source files and WASM build outputs..."
        cp -r web/visualizer/* gh-pages/visualizer/

        # Copy SCXML resources for visualizer
        echo "Copying SCXML test resources..."
        cp -r resources gh-pages/visualizer/

        # Copy DOOM WASM example
        echo "Copying DOOM WASM example..."
        mkdir -p gh-pages/visualizer/doom
        cp examples/doom_wasm/build/index.html gh-pages/visualizer/doom/
        cp examples/doom_wasm/build/doom_sce.js gh-pages/visualizer/doom/
        cp examples/doom_wasm/build/doom_sce.wasm gh-pages/visualizer/doom/
        cp examples/doom_wasm/build/doom_sce.data gh-pages/visualizer/doom/
        # Copy visualizer for DOOM (visualizer.html at root, JS files in web/visualizer/ (source))
        cp -r web/visualizer gh-pages/visualizer/doom/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
        keep_files: true
