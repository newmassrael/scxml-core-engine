name: Deploy Visualizer

on:
  push:
    branches: [main]
    paths:
      - 'visualizer/**'
      - 'rsm/**'
      - 'tools/codegen/**'
      - 'tests/w3c/InteractiveTestRunner.cpp'
      - 'examples/doom_wasm/**'
      - '.github/workflows/deploy-visualizer.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy Visualizer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          g++ \
          ninja-build \
          pkg-config \
          libxml2-dev \
          libspdlog-dev \
          libfmt-dev \
          libboost-dev

    - name: Setup Emscripten (emsdk)
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest

    - name: Build WASM Visualizer
      run: |
        source emsdk/emsdk_env.sh
        mkdir -p build_wasm && cd build_wasm
        emcmake cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja
        cmake --build . --target visualizer -j$(nproc)

    - name: Install Python Dependencies for Code Generator
      run: |
        pip install lxml jinja2

    - name: Build DOOM WASM Example
      run: |
        source emsdk/emsdk_env.sh
        cd examples/doom_wasm
        chmod +x build.sh
        ./build.sh

    - name: Prepare Deployment Directory
      run: |
        mkdir -p gh-pages

        # Copy visualizer source files
        echo "Copying visualizer source files..."
        cp -r visualizer/* gh-pages/

        # Copy WASM build outputs (overwrite placeholder files if present)
        echo "Copying WASM build outputs..."
        cp build_wasm/tests/visualizer.wasm gh-pages/
        cp build_wasm/tests/visualizer.js gh-pages/

        # Copy SCXML resources for visualizer
        echo "Copying SCXML test resources..."
        cp -r resources gh-pages/

        # Copy Python codegen files for Pyodide
        echo "Copying Python codegen files for Pyodide..."
        mkdir -p gh-pages/tools/codegen
        cp -r tools/codegen/* gh-pages/tools/codegen/

        # Copy DOOM WASM example
        echo "Copying DOOM WASM example..."
        mkdir -p gh-pages/doom
        cp examples/doom_wasm/build/index.html gh-pages/doom/
        cp examples/doom_wasm/build/doom_sce.js gh-pages/doom/
        cp examples/doom_wasm/build/doom_sce.wasm gh-pages/doom/
        cp examples/doom_wasm/build/doom_sce.data gh-pages/doom/
        # Copy visualizer for DOOM (visualizer.html at root, JS files in visualizer/)
        cp -r visualizer gh-pages/doom/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
        destination_dir: visualizer
        keep_files: true
