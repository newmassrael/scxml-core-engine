name: Install-tree consumer

# An installed SCE builds what its own generator writes.
#
# The install exports `sce-codegen`, its templates and `SCECodegen.cmake`, so a
# consumer of an installed tree generates C++ with it, and that C++ includes the
# Forge C++ runtime. `scripts/gates/install-consumer.sh` builds a scratch tree,
# installs it to a scratch prefix and builds four probe projects against the
# prefix (tests/install_tree_consumer): three include each tier's headers, and
# the fourth generates a statechart with the installed generator, links
# SCE::sce_base alone, compiles at C++17 with warnings as errors, and runs. That
# test was opt-in and run by no lane while the install could not compile the
# generated C++ at all; this file is the lane.
#
# ## Duration
#
# STAND-IN: the lane has no run of its own yet. `LANES` in
# `sce-build/tests/ci_supersession_policy.rs` borrows `ecma262-lowered-cpp.yml`'s
# 23.7 min median, the nearest lane: a cold scratch configure and build of the
# SCE libraries with a cached generator build ahead of it. This lane builds no
# test and adds an install and four small probe builds, so the real figure may
# sit on either side. That is above a 17.6 min median gap between pushes to
# `main`, so `cancel-in-progress: false` keeps the run in flight, as on every
# lane. Replace the borrowed figure after 25 runs of its own.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'sce/**'
      - 'backends/cpp/forge-runtime/**'
      - 'tools/codegen/**'
      # The rest of what the main tree is built from, and what cargo reads
      # to build the generator crate the ECMAScript frontend is (`builds` of
      # `install-consumer` in tools/git-hooks/gate_registry.py, "What a
      # build reads"; its self-test holds this list to that one).
      - 'third_party/**'
      - 'backends/c/**'
      - 'tools/txml_converter/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/**'
      - 'sce-build/src/**'
      - 'sce-build/build.rs'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'backends/rust/portable-bytes/**'
      - 'backends/rust/runtime/**'
      - 'backends/rust/tests/src/harness.rs'
      - 'backends/go/tests/go.sum'
      - 'backends/go/tests/harness/harness.go'
      - 'backends/kotlin/runtime/src/commonMain/kotlin/com/sce/runtime/StateMachineEngine.kt'
      - 'backends/kotlin/test-harness/src/main/kotlin/com/sce/http/W3CHttpTestServer.kt'
      - 'backends/kotlin/test-harness/src/main/kotlin/com/sce/w3c/*.kt'
      - 'backends/rust/forge-runtime/**'
      - 'backends/kotlin/forge-runtime/src/commonMain/kotlin/com/sce/forge/runtime/Codec.kt'
      - 'backends/go/forge-runtime/codec/codec.go'
      - 'backends/go/forge-runtime/codec/cbor.go'
      - 'backends/go/forge-runtime/codec/content_line.go'
      - 'backends/python/forge-runtime/sce_forge_runtime/codec.py'
      - 'backends/python/forge-runtime/sce_forge_runtime/cbor.py'
      - 'backends/python/forge-runtime/sce_forge_runtime/content_line.py'
      - 'backends/swift/forge-runtime/Sources/SceForgeRuntime/Codec.swift'
      - 'backends/python/runtime/sce_runtime/policy.py'
      - 'backends/python/tests/conftest.py'
      - 'stdlib/**'
      - 'schemas/**'
      - 'apis/**'
      - 'SCE_ERROR_CONTRACT.md'
      - 'SCE_MESH.md'
      - 'docs/SCE_ACCEPTED_SUBSET.md'
      - 'tests/forge/resources/codec_zenoh_ext_entry.scxml'
      - 'tests/mesh/mesh_target_cases.json'
      - 'tests/install_tree_consumer/**'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/install-consumer.sh'
      - '.github/workflows/install-consumer.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'sce/**'
      - 'backends/cpp/forge-runtime/**'
      - 'tools/codegen/**'
      # The rest of what the main tree is built from, and what cargo reads
      # to build the generator crate the ECMAScript frontend is (`builds` of
      # `install-consumer` in tools/git-hooks/gate_registry.py, "What a
      # build reads"; its self-test holds this list to that one).
      - 'third_party/**'
      - 'backends/c/**'
      - 'tools/txml_converter/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/**'
      - 'sce-build/src/**'
      - 'sce-build/build.rs'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'backends/rust/portable-bytes/**'
      - 'backends/rust/runtime/**'
      - 'backends/rust/tests/src/harness.rs'
      - 'backends/go/tests/go.sum'
      - 'backends/go/tests/harness/harness.go'
      - 'backends/kotlin/runtime/src/commonMain/kotlin/com/sce/runtime/StateMachineEngine.kt'
      - 'backends/kotlin/test-harness/src/main/kotlin/com/sce/http/W3CHttpTestServer.kt'
      - 'backends/kotlin/test-harness/src/main/kotlin/com/sce/w3c/*.kt'
      - 'backends/rust/forge-runtime/**'
      - 'backends/kotlin/forge-runtime/src/commonMain/kotlin/com/sce/forge/runtime/Codec.kt'
      - 'backends/go/forge-runtime/codec/codec.go'
      - 'backends/go/forge-runtime/codec/cbor.go'
      - 'backends/go/forge-runtime/codec/content_line.go'
      - 'backends/python/forge-runtime/sce_forge_runtime/codec.py'
      - 'backends/python/forge-runtime/sce_forge_runtime/cbor.py'
      - 'backends/python/forge-runtime/sce_forge_runtime/content_line.py'
      - 'backends/swift/forge-runtime/Sources/SceForgeRuntime/Codec.swift'
      - 'backends/python/runtime/sce_runtime/policy.py'
      - 'backends/python/tests/conftest.py'
      - 'stdlib/**'
      - 'schemas/**'
      - 'apis/**'
      - 'SCE_ERROR_CONTRACT.md'
      - 'SCE_MESH.md'
      - 'docs/SCE_ACCEPTED_SUBSET.md'
      - 'tests/forge/resources/codec_zenoh_ext_entry.scxml'
      - 'tests/mesh/mesh_target_cases.json'
      - 'tests/install_tree_consumer/**'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/install-consumer.sh'
      - '.github/workflows/install-consumer.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
  workflow_dispatch:

# The run in flight is kept and one waiting run holds the newest commit, as on
# every lane; see `cpp-suite.yml` for the reasoning and the cost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-consumer:
    name: Generated C++ builds against an installed SCE
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 80

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      # What the configure and the install's package config need: CMake and
      # Ninja, pkg-config, the development packages cpp-httplib links when it
      # finds them (TLS, zlib, brotli), which the installed package config then
      # asks for again, and libxml2 for the generator's XSD validator.
      # clang-format-19: `sce-codegen` formats the C++ it writes with
      # clang-format pinned to major 19 and refuses without it
      # (docs/SCE_CODEGEN_DETERMINISM.md section 9), the installed one included.
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            g++ \
            ninja-build \
            pkg-config \
            libxml2-dev \
            libssl-dev \
            zlib1g-dev \
            libbrotli-dev \
            clang-format-19

      - name: Install Rust Toolchain
        uses: ./.github/actions/install-rust

      # Rust, and the C and C++ of every CMake tree the job configures, compile
      # through the shared compile cache (.github/actions/compile-cache): a unit
      # another shard or lane compiled alike is answered from it.
      - name: Compile through the shared compile cache
        id: compile-cache
        uses: ./.github/actions/compile-cache
        with:
          cmake: true

      # Configure, build, install and the four probes are one gate, so the check
      # has one spelling here and for a developer. The runner builds
      # `sce-codegen` first, through its `codegen-build` gate.
      - name: Build generated C++ against an installed SCE
        run: scripts/gate install-consumer

      # What the compile cache answered of this job, and what it could not
      # (.github/actions/compile-cache).
      - name: Report what the compile cache answered
        if: always() && steps.compile-cache.outcome == 'success'
        run: sccache --show-stats
