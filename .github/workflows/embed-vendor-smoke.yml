name: Embed Vendor Smoke

# Guards the embed/ vendor distribution path. The job regenerates a
# fresh embed payload from the sce_codegen_assets.cmake SSOT and builds
# a minimal consumer against it (end-to-end: include SCECodegen.cmake,
# sce_add_state_machine, compile, link sce_base). Missing files that
# bypassed the SSOT (historical drift: SCEClangFormat.cmake,
# tools/codegen/templates/, default.clang-format) fail here rather
# than downstream in consumer projects like tc8-harness.
#
# Also re-emits the public-header manifest and diffs against the
# checked-in embed/MANIFEST.json — catches header-surface drift that
# package_embed.sh would otherwise ship silently.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sce/**'
      - 'cmake/**'
      - 'tools/codegen/**'
      - 'backends/cpp/forge-runtime/include/**'
      - 'scripts/package_embed.sh'
      - 'scripts/smoke_embed_consumer.sh'
      - 'scripts/smoke_bazel_consumer.sh'
      - 'scripts/sce_repo.bzl'
      - 'scripts/lib/bazel_pins.sh'
      - 'tests/bazel_consumer/**'
      - 'scripts/verify_embed_manifest.sh'
      - 'scripts/verify_embed_payload.sh'
      - 'scripts/embed_CMakeLists.txt'
      - 'embed/MANIFEST.json'
      - 'scripts/emit_embed_manifest.sh'
      - 'scripts/test_emit_manifest_fail_fast.sh'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/embed-manifest-failfast.sh'
      - 'scripts/gates/embed-manifest-stamp.sh'
      - 'scripts/embed_manifest.py'
      - 'scripts/_embed_manifest_filter.py'
      - 'embed/MANIFEST.inputs'
      - 'third_party/quickjs'
      - 'third_party/cpp-httplib'
      - 'third_party/pugixml'
      - 'third_party/nlohmann_json/**'
      - '.github/workflows/embed-vendor-smoke.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      # The image the gate runs in, and the step that signs in to the registry
      # it is pulled from (ADR 0145).
      - 'tools/ci-images/host/**'
      - '.github/actions/gate-image/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'sce/**'
      - 'cmake/**'
      - 'tools/codegen/**'
      - 'backends/cpp/forge-runtime/include/**'
      - 'scripts/package_embed.sh'
      - 'scripts/smoke_embed_consumer.sh'
      - 'scripts/smoke_bazel_consumer.sh'
      - 'scripts/sce_repo.bzl'
      - 'scripts/lib/bazel_pins.sh'
      - 'tests/bazel_consumer/**'
      - 'scripts/verify_embed_manifest.sh'
      - 'scripts/verify_embed_payload.sh'
      - 'scripts/embed_CMakeLists.txt'
      - 'embed/MANIFEST.json'
      - 'scripts/emit_embed_manifest.sh'
      - 'scripts/test_emit_manifest_fail_fast.sh'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/embed-manifest-failfast.sh'
      - 'scripts/gates/embed-manifest-stamp.sh'
      - 'scripts/embed_manifest.py'
      - 'scripts/_embed_manifest_filter.py'
      - 'embed/MANIFEST.inputs'
      - 'third_party/quickjs'
      - 'third_party/cpp-httplib'
      - 'third_party/pugixml'
      - 'third_party/nlohmann_json/**'
      - '.github/workflows/embed-vendor-smoke.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      # The image the gate runs in, and the step that signs in to the registry
      # it is pulled from (ADR 0145).
      - 'tools/ci-images/host/**'
      - '.github/actions/gate-image/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The gate in three parts, one job each: the drift check, the lag check and
  # the consumers, each a packaging of its own in a scratch directory. Whole,
  # the gate ran 1142 s of a 1496 s job (job 138811665797, 2026-11-24), six,
  # six and seven minutes. Each job runs the embed-vendor gate with
  # `SCE_EMBED_VENDOR_SHARD`, which runs one line of the gate's
  # EMBED_VENDOR_PARTS; `hook_ci_parity` holds the matrix to the number of
  # lines. The parts are fixed, so there is no plan to hold the shards to after
  # they run. Each job is its part and the generator build every job pays.
  embed-smoke:
    name: Embed vendor smoke build (part ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    # packages: write pulls the gate's image, and pushes it when this run built
    # it (.github/actions/gate-image).
    permissions:
      contents: read
      packages: write
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    # The pinned release, which the runner hands the image read-only: the
    # image carries no Rust of its own (`gate_in_container` in scripts/gate).
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    - name: Compile through the shared compile cache
      id: compile-cache
      uses: ./.github/actions/compile-cache

    # The gate runs in the host image (`container` of its registry entry),
    # which holds the compilers, CMake and Ninja, clang-19 for the manifest
    # emitter, clang-format 19, which `sce-codegen` formats the consumer's C++
    # with (docs/SCE_CODEGEN_DETERMINISM.md §9), and the pinned Bazel. The
    # consumer smoke builds the generator itself and hands its path to the
    # consumer's configure (`sce_codegen_require` in
    # scripts/smoke_embed_consumer.sh), so nothing is put on a PATH here.
    - name: Sign in to the gate images' registry
      uses: ./.github/actions/gate-image

    # Delegates to the gate runner rather than restating the three
    # verification scripts, which the gate already runs in this order:
    #
    #   verify_embed_manifest.sh  — diffs the checked-in MANIFEST.json
    #     against a fresh emit. Runs first because the smoke step below
    #     regenerates embed/.
    #   verify_embed_payload.sh   — re-runs package_embed.sh end to end
    #     against the current sce/ and compares the emitted manifest
    #     (minus the label-only embed_version + clang_version) to the
    #     committed copy, catching a sce/ change that moved the public
    #     header surface without a regeneration commit.
    #   smoke_embed_consumer.sh   — regenerates embed/ in a scratch dir,
    #     checks the SSOT-listed assets landed, then configures and
    #     builds a minimal consumer.
    #   smoke_bazel_consumer.sh   — builds and runs a Bazel consumer
    #     through both Bazel channels (the packaged module and the
    #     checkout's sce_repo.bzl) with the pinned Bazel, the gate
    #     image's.
    #
    # This job kept its own copy on the grounds that it also called a
    # sibling gate; it does not — `embed-manifest-failfast` runs in the
    # separate job below, and this one was a plain restatement.
    - name: Verify embed manifest, payload and consumer smoke
      env:
        SCE_EMBED_VENDOR_SHARD: ${{ matrix.shard }}/3
      run: scripts/gate embed-vendor

    # What the compile cache answered of this job, and what it could not
    # (.github/actions/compile-cache).
    - name: Report what the compile cache answered
      if: always() && steps.compile-cache.outcome == 'success'
      run: sccache --show-stats

  # The emitter's fail-fast behaviour, on a synthetic header rather than
  # the real tree. The smoke job above runs the emitter for real, so it
  # only exercises the degraded-AST path when the runner's clang happens
  # to be unable to resolve an include — which is how the May 2026 failure
  # reached CI in the first place. This job plants that condition instead
  # of waiting for it.
  #
  # Its own lane, not a step in the smoke job: it needs clang and nothing
  # else, finishes in under a second, and would otherwise sit behind a
  # seven-minute build to report a one-second answer.
  #
  # `emit_embed_manifest.sh` was outside this workflow's trigger set until
  # the gate registry's self-test compared each gate's sweep and trigger —
  # editing the emitter started no CI job at all, and the push-time gate
  # that did cover it is skipped by `--no-verify`.
  emit-fail-fast:
    name: emit_embed_manifest fail-fast case
    runs-on: ubuntu-24.04
    # packages: write pulls the gate's image, and pushes it when this run built
    # it (.github/actions/gate-image).
    permissions:
      contents: read
      packages: write
    timeout-minutes: 65

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # The runner hands the image the Rust it selected and refuses to start the
    # image without one (`gate_in_container` in scripts/gate), so the job
    # installs the pinned release though the case compiles no Rust.
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # clang-19 specifically: the case under test asserts a parse failure
    # is reported rather than silently degraded, and the script skips
    # itself when clang is absent — an uninstalled toolchain would turn
    # this job green without running the assertion it exists for. The
    # gate runs in the host image (`container` of its registry entry),
    # which installs clang-19.
    - name: Sign in to the gate images' registry
      uses: ./.github/actions/gate-image

    # `SCE_REQUIRE_TOOLS` is what turns the paragraph above into a
    # checked claim: with it set, a missing clang fails the job instead
    # of skipping past it. `lane_running_a_skip_capable_gate_requires_its_tools`
    # asserts this pairing, so removing either the variable or the
    # image's install reds the suite rather than quietly restoring the
    # silent skip.
    - name: Run embed-manifest-failfast gate
      env:
        SCE_REQUIRE_TOOLS: '1'
      run: scripts/gate embed-manifest-failfast

  # Whether the committed manifest was emitted from the inputs it is
  # committed with: its stamp, embed/MANIFEST.inputs, against the git object
  # ids of HEAD's inputs (scripts/embed_manifest.py). No toolchain and no
  # submodule checkout: a submodule is an input as the commit HEAD pins.
  # Its own lane for the reason the fail-fast case has one: a one-second
  # answer should not wait behind the seven-minute smoke build.
  manifest-stamp:
    name: embed manifest stamp
    runs-on: ubuntu-24.04
    # packages: write pulls the gate's image, and pushes it when this run built
    # it (.github/actions/gate-image).
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # The runner hands the image the Rust it selected and refuses to start the
    # image without one (`gate_in_container` in scripts/gate), so the job
    # installs the pinned release though the check compiles nothing.
    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    # The gate runs in the host image (`container` of its registry entry), as
    # every gate on Linux does (ADR 0145): its git and Python are the image's.
    - name: Sign in to the gate images' registry
      uses: ./.github/actions/gate-image

    - name: Run embed-manifest-stamp gate
      run: scripts/gate embed-manifest-stamp
