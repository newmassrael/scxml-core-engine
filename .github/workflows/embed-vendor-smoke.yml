name: Embed Vendor Smoke

# Guards the embed/ vendor distribution path. The job regenerates a
# fresh embed payload from the sce_codegen_assets.cmake SSOT and builds
# a minimal consumer against it (end-to-end: include SCECodegen.cmake,
# sce_add_state_machine, compile, link sce_base). Missing files that
# bypassed the SSOT (historical drift: SCEClangFormat.cmake,
# tools/codegen/templates/, default.clang-format) fail here rather
# than downstream in consumer projects like tc8-harness.
#
# Also re-emits the public-header manifest and diffs against the
# checked-in embed/MANIFEST.json — catches header-surface drift that
# package_embed.sh would otherwise ship silently.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sce/**'
      - 'cmake/**'
      - 'tools/codegen/**'
      - 'scripts/package_embed.sh'
      - 'scripts/smoke_embed_consumer.sh'
      - 'scripts/verify_embed_manifest.sh'
      - 'scripts/verify_embed_payload.sh'
      - 'scripts/embed_CMakeLists.txt'
      - 'embed/MANIFEST.json'
      - 'scripts/emit_embed_manifest.sh'
      - 'scripts/test_emit_manifest_fail_fast.sh'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/embed-manifest-failfast.sh'
      - '.github/workflows/embed-vendor-smoke.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sce/**'
      - 'cmake/**'
      - 'tools/codegen/**'
      - 'scripts/package_embed.sh'
      - 'scripts/smoke_embed_consumer.sh'
      - 'scripts/verify_embed_manifest.sh'
      - 'scripts/verify_embed_payload.sh'
      - 'scripts/embed_CMakeLists.txt'
      - 'embed/MANIFEST.json'
      - 'scripts/emit_embed_manifest.sh'
      - 'scripts/test_emit_manifest_fail_fast.sh'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/embed-manifest-failfast.sh'
      - '.github/workflows/embed-vendor-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embed-smoke:
    name: Embed vendor smoke build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          g++ \
          ninja-build \
          pkg-config \
          clang-19

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo (codegen)
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('sce-build/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-codegen-

    - name: Build sce-codegen
      run: |
        # The Cargo cache restores all of `target`, but this step only
        # builds the debug profile, so a release binary the cache still
        # holds is not a product of this commit. The locator knows which
        # path that is; naming it here would put a build-layout detail
        # back into every workflow.
        source scripts/lib/sce_codegen.sh
        sce_codegen_drop_stale_release
        cargo build --bin sce-codegen --features cli -p sce-build

    - name: Put sce-codegen on PATH
      # SCECodegen.cmake's find_program resolves sce-codegen from PATH
      # in the embed vendoring scenario (no system SCE install).
      run: |
        echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"

    # Delegates to the gate runner rather than restating the three
    # verification scripts, which the gate already runs in this order:
    #
    #   verify_embed_manifest.sh  — diffs the checked-in MANIFEST.json
    #     against a fresh emit. Runs first because the smoke step below
    #     regenerates embed/.
    #   verify_embed_payload.sh   — re-runs package_embed.sh end to end
    #     against the current sce/ and compares the emitted manifest
    #     (minus the label-only embed_version + clang_version) to the
    #     committed copy, catching a sce/ change that moved the public
    #     header surface without a regeneration commit.
    #   smoke_embed_consumer.sh   — regenerates embed/ in a scratch dir,
    #     checks the SSOT-listed assets landed, then configures and
    #     builds a minimal consumer.
    #
    # This job kept its own copy on the grounds that it also called a
    # sibling gate; it does not — `embed-manifest-failfast` runs in the
    # separate job below, and this one was a plain restatement.
    - name: Verify embed manifest, payload and consumer smoke
      run: scripts/gate embed-vendor

  # The emitter's fail-fast behaviour, on a synthetic header rather than
  # the real tree. The smoke job above runs the emitter for real, so it
  # only exercises the degraded-AST path when the runner's clang happens
  # to be unable to resolve an include — which is how the May 2026 failure
  # reached CI in the first place. This job plants that condition instead
  # of waiting for it.
  #
  # Its own lane, not a step in the smoke job: it needs clang and nothing
  # else, finishes in under a second, and would otherwise sit behind a
  # seven-minute build to report a one-second answer.
  #
  # `emit_embed_manifest.sh` was outside this workflow's trigger set until
  # the gate registry's self-test compared each gate's sweep and trigger —
  # editing the emitter started no CI job at all, and the push-time gate
  # that did cover it is skipped by `--no-verify`.
  emit-fail-fast:
    name: emit_embed_manifest fail-fast case
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    # clang-19 specifically: the case under test asserts a parse failure
    # is reported rather than silently degraded, and the script skips
    # itself when clang is absent — an uninstalled toolchain would turn
    # this job green without running the assertion it exists for.
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-19

    # `SCE_REQUIRE_TOOLS` is what turns the paragraph above into a
    # checked claim: with it set, a missing clang fails the job instead
    # of skipping past it. `lane_running_a_skip_capable_gate_requires_its_tools`
    # asserts this pairing, so removing either the variable or the
    # install reds the suite rather than quietly restoring the silent
    # skip.
    - name: Run embed-manifest-failfast gate
      env:
        SCE_REQUIRE_TOOLS: '1'
      run: scripts/gate embed-manifest-failfast
