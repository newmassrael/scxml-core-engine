name: Formal Traces

# The recorded runs of the code under TLC (docs/adr/0115, D4 and D8), judged by
# `sce-codegen formal traces` (docs/adr/0146), the command a consumer runs on
# its own manifest: every run in docs/formal/traces.json a behaviour of the
# model it names, and every altered run refused where it was altered.
#
# ## Why a lane of its own
#
# It needs Java, the pinned TLC and the pinned Apalache's standard module
# (docs/adr/0115, D3), which only the formal lanes carry. The gate runs in the
# host image (tools/ci-images/host, docs/adr/0145), which carries the JDK and
# what the generator builds with; the gate fetches the pinned tools there with
# `sce-codegen formal install` and admits them by the digests
# sce-build/src/formal/toolchain.json pins, into the image's home, which is
# cached under a key made of that file.
#
# ## Why `ci_only` in the registry
#
# The push set's machine need not carry Java or the pinned TLC.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/formal/**'
      - 'sce-build/src/formal/**'
      - 'sce-build/src/run_trace.rs'
      - 'tools/ci-images/host/**'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/formal-traces.sh'
      - '.github/workflows/formal-traces.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/formal/**'
      - 'sce-build/src/formal/**'
      - 'sce-build/src/run_trace.rs'
      - 'tools/ci-images/host/**'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/formal-traces.sh'
      - '.github/workflows/formal-traces.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formal-traces:
    name: Formal Traces
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # `packages: write` for the image a run on main builds and pushes
    # (.github/actions/gate-image says why the permission cannot follow the
    # event); `contents: read` is what checkout needs.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust Toolchain
        uses: ./.github/actions/install-rust

      - name: Compile through the shared compile cache
        id: compile-cache
        uses: ./.github/actions/compile-cache

      # The registry's credentials, so the runner pulls the gate's image by the
      # digest of its build context and a run on main pushes one it built
      # (.github/actions/gate-image).
      - name: Pull the gate's image
        uses: ./.github/actions/gate-image

      # The image's home (`gate_in_container` in scripts/gate), where the gate's
      # `sce-codegen formal install` keeps the TLC and the Apalache it admitted.
      - name: Restore TLC and Apalache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/sce-gate-containers/formal-traces/home/.cache/sce-formal
            ~/.cache/sce-gate-containers/formal-traces/home/.local/apalache
          key: tlc-apalache-${{ hashFiles('sce-build/src/formal/toolchain.json') }}

      - name: Formal traces gate
        run: scripts/gate formal-traces

      # What the compile cache answered of this job, and what it could not
      # (.github/actions/compile-cache).
      - name: Report what the compile cache answered
        if: always() && steps.compile-cache.outcome == 'success'
        run: sccache --show-stats
