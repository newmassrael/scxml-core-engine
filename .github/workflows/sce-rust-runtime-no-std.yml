name: sce-rust-runtime no_std MCU target build

# SCE Protocol-Synthesis RFC §5.J.2 — proves the `sce-rust-runtime` crate's no_std
# variant compiles for an actual Cortex-M4F MCU target (`thumbv7em-none-eabihf`),
# not just the host toolchain. Catches accidental `std::*` reintroduction in
# the runtime crate or any of its helpers as a hard CI failure.
#
# Trigger: source changes under `backends/rust/runtime/` or `sce-build/`'s templates
# (which emit code that compiles against the no_std runtime). The Cargo lockfile
# and the cargo target registration also gate the workflow so toolchain or
# linker drift is caught.
#
# The thumbv7em-none-eabihf target's linker and rustflags are declared in
# `.cargo/config.toml` (C3 Atomic B-γ1 `dfad80b4`); this workflow only adds the
# rustup target and runs the build.
#
# It also builds a generated machine that holds a composed payload (`backends/rust/probes/nostd-composed`,
# docs/adr/0086 section 7.4), so a change to the lowering or to `sce-portable-bytes` that brings an
# allocator into such a machine fails here; those sources trigger it too.
#
# It also builds `sce-forge-runtime` without default features for `thumbv6m-none-eabi`, whose atomics
# are loads and stores alone: a queue module that needs a compare-and-swap must be absent there
# (`backends/rust/forge-runtime/src/queue/mod.rs`), which thumbv7em cannot show, and a consumer that
# builds the runtime for ARMv6-M found a module that was not.
#
# It also reads the stack frame of four codecs' lent `decode_into`, and of a
# reply's encode, on thumbv7em (`backends/rust/probes/nostd-codec-frame`,
# `scripts/codec_frame_probe.sh`): the committed goldens it reads, the runtime
# and the probe trigger it.

on:
  push:
    branches: [ main ]
    paths:
      - 'backends/rust/runtime/**'
      - 'backends/rust/forge-runtime/**'
      - 'tools/codegen/templates/rust/**'
      - 'tools/mcu_stack/**'
      - 'scripts/gates/nostd-mcu.sh'
      - 'scripts/codec_frame_probe.sh'
      - 'backends/rust/probes/nostd-build/**'
      - 'backends/rust/probes/portable-emit/**'
      - 'backends/rust/probes/feature-unification/**'
      - 'backends/rust/probes/nostd-queue-size/**'
      - 'backends/rust/probes/nostd-footprint/**'
      - 'backends/rust/probes/nostd-composed/**'
      - 'backends/rust/probes/nostd-codec-frame/**'
      - 'tests/forge/expected/codec_chain_has_envelope.rs'
      - 'tests/forge/expected/codec_chain_has_marker.rs'
      - 'tests/forge/expected/codec_chain_has_marker_slice.rs'
      - 'tests/forge/expected/codec_chain_has_slice.rs'
      - 'tests/forge/expected/codec_repeat_elem.rs'
      - 'tests/forge/expected/codec_repeat_unconditional_count.rs'
      - 'tests/forge/expected/codec_zenoh_del.rs'
      - 'tests/forge/expected/codec_zenoh_encoding.rs'
      - 'tests/forge/expected/codec_zenoh_err.rs'
      - 'tests/forge/expected/codec_zenoh_ext_entry.rs'
      - 'tests/forge/expected/codec_zenoh_ext_unit.rs'
      - 'tests/forge/expected/codec_zenoh_ext_zbuf.rs'
      - 'tests/forge/expected/codec_zenoh_ext_zint.rs'
      - 'tests/forge/expected/codec_zenoh_push_body.rs'
      - 'tests/forge/expected/codec_zenoh_put.rs'
      - 'tests/forge/expected/codec_zenoh_reply.rs'
      - 'tests/forge/expected/codec_zenoh_response.rs'
      - 'backends/rust/portable-bytes/**'
      - 'sce-build/src/forge/composed_lowering.rs'
      - 'sce-build/src/forge/composed_lowering/rust.rs'
      - 'sce-build/src/forge/static_lowering.rs'
      - 'sce-build/tests/fixtures/static_datamodel/static_composed_payload.scxml'
      - 'sce-build/tests/fixtures/static_datamodel/event_batch.scxml'
      - 'sce-build/tests/fixtures/static_datamodel/event_batch_item.scxml'
      - 'sce-build/tests/fixtures/static_datamodel/enum_signal_level.scxml'
      - 'sce-build/tests/fixtures/no_std/**'
      - 'sce-build/tests/fixtures/event_schema/statechart_native_action.scxml'
      - 'sce-build/tests/fixtures/event_schema/schema_fragment.scxml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.cargo/config.toml'
      - '.github/workflows/sce-rust-runtime-no-std.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backends/rust/runtime/**'
      - 'backends/rust/forge-runtime/**'
      - 'tools/codegen/templates/rust/**'
      - 'tools/mcu_stack/**'
      - 'scripts/gates/nostd-mcu.sh'
      - 'scripts/codec_frame_probe.sh'
      - 'backends/rust/probes/nostd-build/**'
      - 'backends/rust/probes/portable-emit/**'
      - 'backends/rust/probes/feature-unification/**'
      - 'backends/rust/probes/nostd-queue-size/**'
      - 'backends/rust/probes/nostd-footprint/**'
      - 'backends/rust/probes/nostd-composed/**'
      - 'backends/rust/probes/nostd-codec-frame/**'
      - 'tests/forge/expected/codec_chain_has_envelope.rs'
      - 'tests/forge/expected/codec_chain_has_marker.rs'
      - 'tests/forge/expected/codec_chain_has_marker_slice.rs'
      - 'tests/forge/expected/codec_chain_has_slice.rs'
      - 'tests/forge/expected/codec_repeat_elem.rs'
      - 'tests/forge/expected/codec_repeat_unconditional_count.rs'
      - 'tests/forge/expected/codec_zenoh_del.rs'
      - 'tests/forge/expected/codec_zenoh_encoding.rs'
      - 'tests/forge/expected/codec_zenoh_err.rs'
      - 'tests/forge/expected/codec_zenoh_ext_entry.rs'
      - 'tests/forge/expected/codec_zenoh_ext_unit.rs'
      - 'tests/forge/expected/codec_zenoh_ext_zbuf.rs'
      - 'tests/forge/expected/codec_zenoh_ext_zint.rs'
      - 'tests/forge/expected/codec_zenoh_push_body.rs'
      - 'tests/forge/expected/codec_zenoh_put.rs'
      - 'tests/forge/expected/codec_zenoh_reply.rs'
      - 'tests/forge/expected/codec_zenoh_response.rs'
      - 'backends/rust/portable-bytes/**'
      - 'sce-build/src/forge/composed_lowering.rs'
      - 'sce-build/src/forge/composed_lowering/rust.rs'
      - 'sce-build/src/forge/static_lowering.rs'
      - 'sce-build/tests/fixtures/static_datamodel/static_composed_payload.scxml'
      - 'sce-build/tests/fixtures/static_datamodel/event_batch.scxml'
      - 'sce-build/tests/fixtures/static_datamodel/event_batch_item.scxml'
      - 'sce-build/tests/fixtures/static_datamodel/enum_signal_level.scxml'
      - 'sce-build/tests/fixtures/no_std/**'
      - 'sce-build/tests/fixtures/event_schema/statechart_native_action.scxml'
      - 'sce-build/tests/fixtures/event_schema/schema_fragment.scxml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.cargo/config.toml'
      - '.github/workflows/sce-rust-runtime-no-std.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  no-std-thumbv7em:
    name: Build sce-rust-runtime --no-default-features --target=thumbv7em-none-eabihf
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install Rust Toolchain with MCU target
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: thumbv7em-none-eabihf
        components: clippy

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-no-std-${{ hashFiles('Cargo.lock', 'backends/rust/runtime/**/*.rs', 'backends/rust/runtime/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-no-std-

    # Proves the no_std runtime variant has no path into `std::*` — any
    # accidental `use std::...` or `std::vec::Vec` reintroduction in the
    # runtime crate or its helpers will fail this build with a hard error
    # (the thumbv7em-none-eabihf target has no `std` crate to resolve to).
    # Every probe in one call, delegated to the gate runner. The lane
    # used to spell out nine steps and the gate spelled out eight: the
    # native-action probe was in CI alone, so the push-time gate was the
    # weaker of the two and nothing compared them — both sides write
    # `cargo build --manifest-path ...`, and which machine was generated
    # into that crate is not something the parity extractor can see.
    - name: no_std runtime, probes and MCU-target builds
      run: scripts/gate nostd-mcu

