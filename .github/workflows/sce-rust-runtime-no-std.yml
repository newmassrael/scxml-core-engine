name: sce-rust-runtime no_std MCU target build

# SCE Protocol-Synthesis RFC §5.J.2 — proves the `sce-rust-runtime` crate's no_std
# variant compiles for an actual Cortex-M4F MCU target (`thumbv7em-none-eabihf`),
# not just the host toolchain. Catches accidental `std::*` reintroduction in
# the runtime crate or any of its helpers as a hard CI failure.
#
# Trigger: source changes under `backends/rust/runtime/` or `sce-build/`'s templates
# (which emit code that compiles against the no_std runtime). The Cargo lockfile
# and the cargo target registration also gate the workflow so toolchain or
# linker drift is caught.
#
# The thumbv7em-none-eabihf target's linker and rustflags are declared in
# `.cargo/config.toml` (C3 Atomic B-γ1 `dfad80b4`); this workflow only adds the
# rustup target and runs the build.

on:
  push:
    branches: [ main ]
    paths:
      - 'backends/rust/runtime/**'
      - 'tools/codegen/templates/rust/**'
      - 'backends/rust/probes/nostd-build/**'
      - 'backends/rust/probes/portable-emit/**'
      - 'backends/rust/probes/nostd-queue-size/**'
      - 'sce-build/tests/fixtures/no_std/**'
      - 'sce-build/tests/fixtures/event_schema/statechart_native_action.scxml'
      - 'sce-build/tests/fixtures/event_schema/schema_fragment.scxml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.cargo/config.toml'
      - '.github/workflows/sce-rust-runtime-no-std.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backends/rust/runtime/**'
      - 'tools/codegen/templates/rust/**'
      - 'backends/rust/probes/nostd-build/**'
      - 'backends/rust/probes/portable-emit/**'
      - 'backends/rust/probes/nostd-queue-size/**'
      - 'sce-build/tests/fixtures/no_std/**'
      - 'sce-build/tests/fixtures/event_schema/statechart_native_action.scxml'
      - 'sce-build/tests/fixtures/event_schema/schema_fragment.scxml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.cargo/config.toml'
      - '.github/workflows/sce-rust-runtime-no-std.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-std-thumbv7em:
    name: Build sce-rust-runtime --features=no_std --target=thumbv7em-none-eabihf
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install Rust Toolchain with MCU target
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: thumbv7em-none-eabihf
        components: clippy

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-no-std-${{ hashFiles('Cargo.lock', 'backends/rust/runtime/**/*.rs', 'backends/rust/runtime/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-no-std-

    # Proves the no_std runtime variant has no path into `std::*` — any
    # accidental `use std::...` or `std::vec::Vec` reintroduction in the
    # runtime crate or its helpers will fail this build with a hard error
    # (the thumbv7em-none-eabihf target has no `std` crate to resolve to).
    - name: Build sce-rust-runtime (no_std, MCU target)
      run: |
        cargo build \
          -p sce-rust-runtime \
          --no-default-features \
          --features=no_std \
          --target=thumbv7em-none-eabihf

    # Lints the no_std runtime variant under the same target. The host-target
    # clippy runs (default-features) never see the `heapless::String`-sized
    # error/collection types the `no_std` cfg selects, so a lint that only
    # fires under no_std — e.g. `clippy::result_large_err` from returning a
    # 256-byte `SceString` by value — slips past every other gate. Running
    # clippy here, with `-D warnings`, makes such a regression a hard failure.
    - name: Clippy sce-rust-runtime (no_std, MCU target)
      run: |
        cargo clippy \
          -p sce-rust-runtime \
          --no-default-features \
          --features=no_std \
          --target=thumbv7em-none-eabihf \
          -- -D warnings

    # Proves *generated* machines (not just the runtime) are allocator-free.
    # The runtime build above cannot catch a `tools/codegen/templates/rust/`
    # regression that reintroduces `alloc` into emitted code (raw `Vec`,
    # `[T]::sort_by`, `String`, `StdHal`, a direct `heapless` reference, ...).
    # The probe crate compiles a generated `--no-std` machine exercising the
    # historically std-coupled constructs (nested parallel + conflict
    # resolution, shallow/deep history, many transitions) for the bare-metal
    # target with no `#[global_allocator]`; any reachable `alloc` symbol is a
    # hard compile error. See backends/rust/probes/nostd-build/README.md.
    - name: Build sce-codegen
      run: cargo build --bin sce-codegen --features cli -p sce-build

    - name: Generate the no_std probe machine
      run: |
        target/debug/sce-codegen --workspace-root . generate -l rust --no-std \
          --output-dir backends/rust/probes/nostd-build/src \
          sce-build/tests/fixtures/no_std/parallel_history_probe.scxml

    - name: Compile the generated no_std machine (MCU target, no allocator)
      run: |
        cargo build \
          --manifest-path backends/rust/probes/nostd-build/Cargo.toml \
          --target=thumbv7em-none-eabihf

    # W3C SCXML G.7 <sce:action>: prove native host-trait dispatch is
    # allocator-free. A statechart whose effects are `<sce:action>`s (instead
    # of an embedded script engine) must compile on a no-heap MCU — including
    # its typed `bytes` payload, which lowers to the runtime `SceBytes` alias
    # (`heapless::Vec<u8, N>` under no_std). Reuses the probe crate's
    # runtime-no_std dependency + bare-metal target by overwriting its lib
    # source with the generated native-action machine and compiling again.
    - name: Generate the no_std native-action probe
      run: |
        target/debug/sce-codegen --workspace-root . generate -l rust --no-std \
          --output-dir /tmp/na-probe \
          sce-build/tests/fixtures/event_schema/statechart_native_action.scxml
        cp /tmp/na-probe/statechart_native_action_sm.rs \
          backends/rust/probes/nostd-build/src/parallel_history_probe_sm.rs

    - name: Compile the generated no_std native-action machine (MCU target, no allocator)
      run: |
        cargo build \
          --manifest-path backends/rust/probes/nostd-build/Cargo.toml \
          --target=thumbv7em-none-eabihf

    # SCE Protocol-Synthesis RFC §5.J.2 single-emit portability: prove ONE `--no-std`
    # emission compiles against BOTH runtime profiles. The emission names only
    # the runtime's profile-resolving collection aliases (SceBytes / SceString /
    # SceTransitionBuf / SceIndexBuf / SceDedupSet / StateChain), so the std
    # runtime resolves them to Vec / String / HashSet and the no_std runtime to
    # their heapless equivalents. Before the alias layer, the `--no-std` emit's
    # bytes field, transition buffers, and dedup set referenced the no_std-only
    # `sce_rust_runtime::heapless::*` re-export and failed `E0433: cannot find
    # heapless in sce_rust_runtime` against the std runtime. The fixture combines
    # a typed bytes/string payload with nested parallel regions so one machine
    # exercises every alias. See backends/rust/probes/portable-emit/README.md.
    - name: Generate the portability probe machine
      run: |
        target/debug/sce-codegen --workspace-root . generate -l rust --no-std \
          --output-dir backends/rust/probes/portable-emit/src \
          sce-build/tests/fixtures/no_std/portable_probe.scxml

    # AP profile — the no_std emission compiled against the STD runtime (host).
    # This is the regression gate for the bytes-field E0433.
    - name: Compile the portability probe against the std runtime (host)
      run: |
        cargo build --manifest-path backends/rust/probes/portable-emit/Cargo.toml

    # MCU profile — the SAME emission compiled against the no_std runtime (thumb,
    # no allocator). Proves the typed bytes/string payload stays allocator-free.
    - name: Compile the portability probe against the no_std runtime (MCU target)
      run: |
        cargo build \
          --manifest-path backends/rust/probes/portable-emit/Cargo.toml \
          --target=thumbv7em-none-eabihf \
          --features mcu

    # Per-machine event-queue sizing: prove a `<scxml sce:capacity="2">` machine
    # sizes its no_std queues to depth 2, not the crate-global depth-64 default.
    # A plain compile gate cannot catch a regression that reverts the per-machine
    # `StatePolicy::EventQueue` to the bare (depth-64) form — the depth-64 form
    # still compiles. This crate const-asserts `size_of::<Engine<P>>()`, so the
    # reversion (the downstream MCU SRAM blocker) fails the build here.
    # See backends/rust/probes/nostd-queue-size/README.md.
    - name: Generate the queue-size probe machine (sce:capacity=2)
      run: |
        target/debug/sce-codegen --workspace-root . generate -l rust --no-std \
          --output-dir backends/rust/probes/nostd-queue-size/machine/src \
          sce-build/tests/fixtures/no_std/event_queue_capacity_probe.scxml

    - name: Compile the queue-size gate (MCU target — const size assertion)
      run: |
        cargo build \
          --manifest-path backends/rust/probes/nostd-queue-size/Cargo.toml \
          --target=thumbv7em-none-eabihf
