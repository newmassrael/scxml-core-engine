name: Rust doc check

# CI gate enforcing `cargo doc -p sce-rust-runtime --no-deps` with rustdoc
# broken-intra-doc-links denied. The runtime crate opts into the workspace
# `[lints]` policy (broken_intra_doc_links = "deny"), but that policy only bites
# when something actually RUNS `cargo doc` — nothing did, so broken intra-doc
# links rotted in undetected. This gate is that missing enforcement point: a
# clean `cargo doc` keeps the public-API docs link-correct, the doc analog of
# clippy-check.yml / fmt-check.yml.
#
# Scope: sce-rust-runtime only — the crate whose docs were repaired. Both
# feature profiles are validated: DEFAULT features (the docs.rs / superset
# config that includes every `!no_std` module + http-send + invoke + scripting)
# AND the no_std subset (--no-default-features --features no_std). A doc link
# that crosses a `#[cfg]` boundary resolves in the superset docs yet breaks in
# the subset docs, so a default-only run cannot see that breakage class; all
# runtime doc links are kept profile-stable (cfg-gated targets are plain code
# spans).

on:
  push:
    branches: [ main ]
    paths:
      - 'backends/rust/runtime/**'
      - '.github/workflows/doc-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backends/rust/runtime/**'
      - '.github/workflows/doc-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTDOCFLAGS: -D warnings

jobs:
  doc-check:
    name: cargo doc -p sce-rust-runtime
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry + target
      uses: Swatinem/rust-cache@v2

    # Both profiles, delegated to the gate runner. The gate sets
    # `RUSTDOCFLAGS=-D warnings` per command; this workflow set it as a
    # job-level `env:` instead, so the two spellings agreed only as long
    # as nobody moved the `env:` block.
    - name: Broken intra-doc links (std + no_std profiles)
      run: scripts/gate rustdoc-links
