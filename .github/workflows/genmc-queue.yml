name: GenMC Queue

# The C11 and C++ queues under GenMC: layer 3 of the queue kind's verification
# (SCE Protocol-Synthesis RFC §synth-5-P). GenMC explores every execution the C11
# memory model allows, where a stress run samples the few a machine happens to
# give. `scripts/gates/genmc-queue.sh` states the two claims (each harness
# passes; each required mutant, the runtime's atomics with one ordering weakened,
# is caught) and what its first version got wrong.
#
# ## Why a lane of its own
#
# GenMC is not a package: it is built from source against LLVM 19 and a C++20
# compiler at the revision `scripts/install_genmc.sh` pins, and the host image
# holds that build (ADR 0145), so the gate runs in the image and this runner
# installs nothing. The registry's self-test holds the image's copy of the
# revision to the script's, so a pin bump moves the image with it.
#
# ## Why `ci_only` in the registry
#
# A build machine starts the image only under a rootless Docker, which not every
# one is verified to carry, and the gate fails loudly where GenMC is absent
# rather than skipping, so it is not in the push set; this job is where it runs
# on every change that can move what it judges.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backends/c/forge-runtime/include/**'
      - 'backends/c/runtime/include/sce/text.h'
      # The memory functions sce/text.h declares, in a header of their own.
      - 'backends/c/runtime/include/sce/mem.h'
      # The C11 inbox and what it includes, and the token check, which the inbox
      # harnesses read (ADR 0147, D5).
      - 'backends/c/runtime/include/sce/inbox.h'
      - 'backends/c/runtime/include/sce/types.h'
      - 'backends/c/runtime/include/sce/portability.h'
      - 'backends/c/runtime/include/sce/host_processor.h'
      - 'backends/c/forge-runtime/tests/genmc/**'
      - 'backends/c/forge-runtime/tests/conformance/sce_atomic_host.c'
      - 'backends/cpp/forge-runtime/include/sce/forge/queue.h'
      - 'backends/cpp/forge-runtime/include/sce/forge/queue_segmented.h'
      - 'backends/cpp/forge-runtime/include/sce/forge/broadcast_log.h'
      - 'backends/cpp/forge-runtime/tests/genmc/**'
      - 'scripts/install_genmc.sh'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/genmc-queue.sh'
      - '.github/workflows/genmc-queue.yml'
      # The image the gate runs in, and the step that signs in to the registry
      # it is pulled from (ADR 0145).
      - 'tools/ci-images/host/**'
      - '.github/actions/gate-image/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backends/c/forge-runtime/include/**'
      - 'backends/c/runtime/include/sce/text.h'
      # The memory functions sce/text.h declares, in a header of their own.
      - 'backends/c/runtime/include/sce/mem.h'
      # The C11 inbox and what it includes, and the token check, which the inbox
      # harnesses read (ADR 0147, D5).
      - 'backends/c/runtime/include/sce/inbox.h'
      - 'backends/c/runtime/include/sce/types.h'
      - 'backends/c/runtime/include/sce/portability.h'
      - 'backends/c/runtime/include/sce/host_processor.h'
      - 'backends/c/forge-runtime/tests/genmc/**'
      - 'backends/c/forge-runtime/tests/conformance/sce_atomic_host.c'
      - 'backends/cpp/forge-runtime/include/sce/forge/queue.h'
      - 'backends/cpp/forge-runtime/include/sce/forge/queue_segmented.h'
      - 'backends/cpp/forge-runtime/include/sce/forge/broadcast_log.h'
      - 'backends/cpp/forge-runtime/tests/genmc/**'
      - 'scripts/install_genmc.sh'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/genmc-queue.sh'
      - '.github/workflows/genmc-queue.yml'
      # The image the gate runs in, and the step that signs in to the registry
      # it is pulled from (ADR 0145).
      - 'tools/ci-images/host/**'
      - '.github/actions/gate-image/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The runs in three parts, one job each: every harness and mutant is read in
  # each part, and a part starts every third run of the order the gate names
  # them in ("IN PARTS" in scripts/gates/genmc-queue.sh). Whole, the 189 runs
  # took 1006 s of a 1236 s job, two or three at a time (job 138783228903,
  # 2026-11-24), so a part is about six minutes beside the image every job
  # pulls, which holds GenMC.
  genmc-queue:
    name: GenMC Queue (part ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    # packages: write pulls the gate's image, and pushes it when this run built
    # it (.github/actions/gate-image).
    permissions:
      contents: read
      packages: write
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The runner hands the image the Rust it selected and refuses to start the
      # image without one (`gate_in_container` in scripts/gate), so the job
      # installs the pinned release though the gate compiles no Rust.
      - name: Install Rust Toolchain
        uses: ./.github/actions/install-rust

      # The gate runs in the host image (`container` of its registry entry),
      # which holds GenMC at the pinned revision and the clang it compiles the
      # harnesses with.
      - name: Sign in to the gate images' registry
        uses: ./.github/actions/gate-image

      - name: GenMC queue gate
        env:
          SCE_GENMC_QUEUE_SHARD: ${{ matrix.shard }}/3
        run: scripts/gate genmc-queue
