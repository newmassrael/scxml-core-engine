name: Compiled-In Content Assertions

# The lane that runs when an input the sce-build suite `include_str!`s
# changes, rather than when its Rust changes.
#
# ## Why it exists
#
# `sce-build`'s sources compile documents, schemas, headers and Lua into
# the test binary. Editing one of those files changes what the suite
# asserts without touching a single `.rs`, so the lane that judges it has
# to start on the document's path. Measured 2026-08-27: nineteen such
# inputs reached neither `rust-workspace-tests.yml`'s `paths:` nor the
# `workspace-tests` gate's own `extra` — `SCE_ERROR_CONTRACT.md` and
# `SCE_MESH.md` among them. A commit editing only those two documents ran
# `contract_docs_cite_only_real_codes`, the test whose whole job is to
# catch a phantom diagnostic slug in exactly those files, in no lane at
# all. `ci-only-coverage` could not see it: that case compares the gate's
# list against the workflow's, and both were missing the same nineteen.
#
# ## Why a second lane rather than a wider filter
#
# `rust-workspace-tests.yml` is 151s — half the push budget for one gate,
# which is why it is `ci_only` in the first place. Adding
# `sce/include/**`, `backends/**` and `tools/codegen/**` to ITS filter
# would start that lane on nearly every push and re-open the cost problem
# `ci_only` was introduced to close. So the wide filter goes on a cheap
# lane instead, and the expensive one keeps the filter it has.
#
# ## Why `--lib` is the right scope, and not a list of test names
#
# Every one of the nineteen is `include_str!`-ed from `sce-build/src/`,
# so the library suite is exactly the set of assertions that read them —
# `acceptance_doc_covers_every_code` and `contract_docs_cite_only_real_codes`
# included. Naming individual tests here would be a hand-kept list of the
# same shape as the one this lane exists to retire; `--lib` is the scope
# the tree defines. The integration targets stay with the heavy lane,
# which still runs everything.
#
# `include-str-coverage` in `tools/git-hooks/gate_registry.py` is what
# keeps this filter honest: it derives every `include_str!` target under
# the declared root from the tree and fails if no lane running that suite
# starts for it. A new compiled-in input is covered the day it is written.

on:
  push:
    branches: [ main ]
    paths:
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      # The library suite compiles the module its tests include by path.
      - 'sce-build/tests/common/**'
      - 'SCE_ERROR_CONTRACT.md'
      - 'SCE_MESH.md'
      - 'docs/SCE_ACCEPTED_SUBSET.md'
      - 'schemas/**'
      - 'apis/**'
      - 'sce/include/**'
      - 'backends/**'
      - 'tools/codegen/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/doc-content-gate.yml'
      # What says which part runs which tests, and what holds the parts.
      - 'scripts/lib/workspace_shards.py'
      - 'scripts/lib/ctest_shards.py'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
  pull_request:
    branches: [ main ]
    paths:
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      # The library suite compiles the module its tests include by path.
      - 'sce-build/tests/common/**'
      - 'SCE_ERROR_CONTRACT.md'
      - 'SCE_MESH.md'
      - 'docs/SCE_ACCEPTED_SUBSET.md'
      - 'schemas/**'
      - 'apis/**'
      - 'sce/include/**'
      - 'backends/**'
      - 'tools/codegen/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/doc-content-gate.yml'
      # What says which part runs which tests, and what holds the parts.
      - 'scripts/lib/workspace_shards.py'
      - 'scripts/lib/ctest_shards.py'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The library's tests in three parts, one job each, and a last job,
  # `doc-content`, that holds them together. Whole, the job took 14 minutes
  # (job 139036333453, 2026-11-25): a 283 s build of the test binary and 463 s
  # of tests, whose length two tests set, one in `forge` (ended at 463 s) and
  # one in `conformance` (ended at 421 s), while every other module had finished
  # by 240 s. Each part runs the doc-content gate with `SCE_DOC_CONTENT_SHARD`,
  # which builds the binary, lists its tests and runs its part of them by top
  # module (scripts/lib/workspace_shards.py `--lib-list`). Three, one for each
  # of the two modules that hold a long test and one for the rest: a fourth
  # would split the rest, which is not what sets a part's length, for another
  # build of the binary.
  doc-content-shard:
    name: cargo test -p sce-build --features cli --lib (part ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The account's 20 hosted jobs are shared; one job per shard at once.
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Install Rust Toolchain
      uses: ./.github/actions/install-rust

    - name: Cache Cargo
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-doc-content-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-doc-content-${{ hashFiles('rust-toolchain.toml') }}-
          ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-

    # Delegates to the gate runner rather than restating the command, so
    # the scope has one spelling for both callers.
    - name: cargo test -p sce-build --features cli --lib
      env:
        SCE_DOC_CONTENT_SHARD: ${{ matrix.shard }}/3
      run: scripts/gate doc-content

    # The plan and what this part ran (`doc-content` reads them).
    - name: Upload this part's plan
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: doc-content-shard-${{ matrix.shard }}
        path: target/doc-content-shard/
        retention-days: 30
        if-no-files-found: warn

  # The verdict of the library's tests: every part planned the modules alike
  # and ran every module of its part (`ctest_shards.py verify`). It keeps the
  # job's id and name, so the lane's readers find it where the unsplit job was.
  doc-content:
    name: cargo test -p sce-build --features cli --lib
    needs: doc-content-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Download the parts' plans
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: doc-content-shard-*
        path: shards

    - name: Hold the parts to one plan and the whole suite
      env:
        SHARDS_RESULT: ${{ needs.doc-content-shard.result }}
      run: |
        status=0
        python3 scripts/lib/ctest_shards.py verify shards || status=1
        if [[ "$SHARDS_RESULT" != success ]]; then
          echo "::error title=doc-content::a part's job ended $SHARDS_RESULT"
          status=1
        fi
        exit "$status"
