name: C++ Interface Standard

# ADR 0059, section 7: SCE's C++ interface compiles at C++17 and at C++20.
#
# The interface is what a consumer compiles -- every public header under
# `sce/include/` and `backends/cpp/forge-runtime/include/`, and every C++ file
# a generator writes. SCE's own targets compile it all at C++20, so the C++17
# they declare is a claim until something compiles it at C++17. This lane is
# that something. `scripts/gates/cpp-interface-standard.sh` says what it
# compiles and why each header is compiled alone; this file says where.
#
# ## Why a pinned GCC 15 image
#
# The image is `tools/interface-standard/Containerfile`, built and entered by
# `scripts/gate` itself, so every machine that runs the gate runs this one.
#
# The defect that started this was a transitive include: a public header named
# `uint64_t` without `<cstdint>`, and GCC 15's libstdc++ stopped providing
# `<cstdint>` through `<string>` at C++17 while still doing so at C++20. The
# newest libstdc++ is the one that drops such includes first, so the lane runs
# the newest GCC, pinned so that a new release moves the measurement only when
# someone moves the pin. The hosted image's compiler is whatever the image
# carries that month.
#
# ## What a runner without the mesh SDKs reports
#
# zenoh, vsomeip and CycloneDDS are not installed here. Their targets are then
# not configured, and a header that needs one of them is reported by name as
# NOT MEASURED, which is neither a pass nor a failure. The floors the gate
# holds are set below what such a runner measures.
#
# ## Duration
#
# STAND-IN: `LANES` in `sce-build/tests/ci_supersession_policy.rs` borrows
# `ecma262-lowered-cpp.yml`'s 23.7 min median, the nearest lane: a cold scratch
# configure of the main CMake project with a cached generator build ahead of
# it. Run whole, the lane's own runs took 47 to 82 minutes (jobs 138978378267
# and 138916754356), which is why it now runs as six shards (the job below
# says how). That is above a 17.6 min median gap between pushes to `main`, so
# `cancel-in-progress: false` keeps the run in flight, as on every lane.
# Replace the borrowed figure after 25 sharded runs of its own.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'sce/**'
      - 'backends/cpp/**'
      - 'backends/c/**'
      - 'tools/codegen/templates/**'
      - 'sce-build/src/**'
      - 'tests/forge/expected/**'
      - 'tests/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'tools/interface-standard/**'
      # The tool spreads its shards and reads ninja's graph through it.
      - 'scripts/lib/ctest_shards.py'
      # The rest of what its configure of the main tree reads, and what cargo
      # reads to build the generator it runs (`builds` of
      # `cpp-interface-standard` in tools/git-hooks/gate_registry.py, "What a
      # build reads"; its self-test holds this list to that one).
      - 'third_party/**'
      - 'tools/txml_converter/**'
      - 'tools/codegen/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/**'
      - 'sce-build/src/**'
      - 'sce-build/build.rs'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'backends/rust/portable-bytes/**'
      - 'backends/rust/runtime/**'
      - 'backends/rust/tests/src/harness.rs'
      - 'backends/go/tests/go.sum'
      - 'backends/go/tests/harness/harness.go'
      - 'backends/kotlin/runtime/src/commonMain/kotlin/com/sce/runtime/StateMachineEngine.kt'
      - 'backends/kotlin/test-harness/src/main/kotlin/com/sce/http/W3CHttpTestServer.kt'
      - 'backends/kotlin/test-harness/src/main/kotlin/com/sce/w3c/*.kt'
      - 'backends/rust/forge-runtime/**'
      - 'backends/kotlin/forge-runtime/src/commonMain/kotlin/com/sce/forge/runtime/Codec.kt'
      - 'backends/go/forge-runtime/codec/codec.go'
      - 'backends/go/forge-runtime/codec/cbor.go'
      - 'backends/go/forge-runtime/codec/content_line.go'
      - 'backends/python/forge-runtime/sce_forge_runtime/codec.py'
      - 'backends/python/forge-runtime/sce_forge_runtime/cbor.py'
      - 'backends/python/forge-runtime/sce_forge_runtime/content_line.py'
      - 'backends/swift/forge-runtime/Sources/SceForgeRuntime/Codec.swift'
      - 'backends/python/runtime/sce_runtime/policy.py'
      - 'backends/python/tests/conftest.py'
      - 'stdlib/**'
      - 'schemas/**'
      - 'apis/**'
      - 'SCE_ERROR_CONTRACT.md'
      - 'SCE_MESH.md'
      - 'docs/SCE_ACCEPTED_SUBSET.md'
      - 'tests/forge/resources/codec_zenoh_ext_entry.scxml'
      - 'tests/mesh/mesh_target_cases.json'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/cpp-interface-standard.sh'
      - '.github/workflows/cpp-interface-standard.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      - '.github/actions/gate-image/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'sce/**'
      - 'backends/cpp/**'
      - 'backends/c/**'
      - 'tools/codegen/templates/**'
      - 'sce-build/src/**'
      - 'tests/forge/expected/**'
      - 'tests/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'tools/interface-standard/**'
      # The tool spreads its shards and reads ninja's graph through it.
      - 'scripts/lib/ctest_shards.py'
      # The rest of what its configure of the main tree reads, and what cargo
      # reads to build the generator it runs (`builds` of
      # `cpp-interface-standard` in tools/git-hooks/gate_registry.py, "What a
      # build reads"; its self-test holds this list to that one).
      - 'third_party/**'
      - 'tools/txml_converter/**'
      - 'tools/codegen/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/**'
      - 'sce-build/src/**'
      - 'sce-build/build.rs'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'backends/rust/portable-bytes/**'
      - 'backends/rust/runtime/**'
      - 'backends/rust/tests/src/harness.rs'
      - 'backends/go/tests/go.sum'
      - 'backends/go/tests/harness/harness.go'
      - 'backends/kotlin/runtime/src/commonMain/kotlin/com/sce/runtime/StateMachineEngine.kt'
      - 'backends/kotlin/test-harness/src/main/kotlin/com/sce/http/W3CHttpTestServer.kt'
      - 'backends/kotlin/test-harness/src/main/kotlin/com/sce/w3c/*.kt'
      - 'backends/rust/forge-runtime/**'
      - 'backends/kotlin/forge-runtime/src/commonMain/kotlin/com/sce/forge/runtime/Codec.kt'
      - 'backends/go/forge-runtime/codec/codec.go'
      - 'backends/go/forge-runtime/codec/cbor.go'
      - 'backends/go/forge-runtime/codec/content_line.go'
      - 'backends/python/forge-runtime/sce_forge_runtime/codec.py'
      - 'backends/python/forge-runtime/sce_forge_runtime/cbor.py'
      - 'backends/python/forge-runtime/sce_forge_runtime/content_line.py'
      - 'backends/swift/forge-runtime/Sources/SceForgeRuntime/Codec.swift'
      - 'backends/python/runtime/sce_runtime/policy.py'
      - 'backends/python/tests/conftest.py'
      - 'stdlib/**'
      - 'schemas/**'
      - 'apis/**'
      - 'SCE_ERROR_CONTRACT.md'
      - 'SCE_MESH.md'
      - 'docs/SCE_ACCEPTED_SUBSET.md'
      - 'tests/forge/resources/codec_zenoh_ext_entry.scxml'
      - 'tests/mesh/mesh_target_cases.json'
      - 'scripts/gate'
      - 'scripts/gates/lib.sh'
      - 'scripts/gates/cpp-interface-standard.sh'
      - '.github/workflows/cpp-interface-standard.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      - '.github/actions/gate-image/**'
  workflow_dispatch:

# The run in flight is kept and one waiting run holds the newest commit, as on
# every lane; see `cpp-suite.yml` for the reasoning and the cost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The measurement in six shards, one job each, and a last job that holds
  # them together. Run whole, the job took 2811 s (job 138978378267,
  # 57602a3bb8, 2026-11-25) and 4924 s on a slower runner (job 138916754356):
  # a generator build (3 min), a cold configure (5 min), the generation rules
  # (984 s) and 3158 compiles (1252 s), three at a time. Each job plans the
  # whole measurement from the configured tree, generates only the families
  # its own part compiles and compiles that part (`shard-plan` in
  # tools/interface-standard/interface_standard.py); the generator build and
  # the configure, about 8.5 minutes, every job pays alike. Six, because the
  # generation and the compiles are about 37 minutes run whole, so a job is
  # about 8.5 + 37/6, some 15 minutes, before the spread is measured; more
  # shards would buy less than the fixed part they each repeat. Re-size from
  # the plans the first sharded run prints. `cpp-interface-standard-verdict`
  # holds the shards of a run to one plan, every subject to its shard's
  # account and the floors to the whole. The gate's registry entry declares
  # the variable (`shard_env`), so a landing runs the same parts as units.
  cpp-interface-standard:
    name: C++ interface at C++17 and C++20 (GCC 15, shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-24.04
    # The whole measurement's allowance until a sharded run is measured.
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # `packages: write` for the image a run on main builds and pushes
    # (.github/actions/gate-image says why the permission cannot follow the
    # event); `contents: read` is what checkout needs.
    permissions:
      contents: read
      packages: write
    # No `container:` here. The image the gate runs in is
    # `tools/interface-standard/Containerfile` (gcc:15.3.0 and what the
    # configure and the generator need), and the runner pulls it by the digest
    # of its build context, or builds it, and runs the gate inside it wherever
    # the gate runs: this lane, a build machine judging
    # an update to main, a workstation. Until 2026-11-08 the image was this
    # job's `container:` and its install steps, which only this lane had, so a
    # build machine would have judged the gate with its own GCC.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      # The pinned release, installed on this runner. The runner hands its
      # toolchain directory to the image, read-only, and the gate inside runs
      # on it (`gate_in_container` in scripts/gate): the image carries no Rust
      # of its own, so the release the gate builds with is the pin here as on
      # a build machine.
      - name: Install Rust Toolchain
        uses: ./.github/actions/install-rust

      # Rust compiles through the shared compile cache
      # (.github/actions/compile-cache), inside the image too: the gate hands
      # the image sccache and the cache's address and token, and mounts the
      # registry download it restores into the image's cargo home
      # (`gate_in_container` in scripts/gate).
      - name: Compile through the shared compile cache
        id: compile-cache
        uses: ./.github/actions/compile-cache

      # The registry's credentials, so the runner pulls the image by the digest
      # of its build context and a run on main pushes one it built
      # (.github/actions/gate-image).
      - name: Pull the gate's image
        uses: ./.github/actions/gate-image

      # Guards, configure, the plan, this shard's generation, then its
      # compiles at both standards are one gate, so the check has one spelling
      # here and for a developer. The runner hands the variable to the gate
      # inside the image (`gate_in_container` in scripts/gate), and the runner
      # inside builds `sce-codegen` first, through its `codegen-build` gate.
      - name: Compile this shard of the interface at C++17 and C++20
        env:
          SCE_INTERFACE_STANDARD_SHARD: ${{ matrix.shard }}/6
        run: scripts/gate cpp-interface-standard

      # The plan, this shard's account of its subjects and its outcomes
      # (`cpp-interface-standard-verdict` reads them).
      - name: Upload this shard's plan, account and outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpp-interface-standard-shard-${{ matrix.shard }}
          path: build/interface-standard-shard/
          retention-days: 30
          if-no-files-found: warn

      # What the compile cache answered of this job, and what it could not
      # (.github/actions/compile-cache).
      - name: Report what the compile cache answered
        if: always() && steps.compile-cache.outcome == 'success'
        run: sccache --show-stats

  # The verdict of the lane: every shard planned the measurement alike,
  # accounted for every subject it was given, and the outcomes the whole run
  # would count hold the floors with no failure. A job of its own because a
  # matrix answers per shard, and "the interface holds" is a claim about the
  # six together.
  cpp-interface-standard-verdict:
    name: C++ interface at C++17 and C++20 (GCC 15)
    needs: cpp-interface-standard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download the shards' plans, accounts and outcomes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cpp-interface-standard-shard-*
          path: shards

      - name: Hold the shards to one plan, every subject and the whole floors
        env:
          SHARDS_RESULT: ${{ needs.cpp-interface-standard.result }}
        run: |
          status=0
          python3 tools/interface-standard/interface_standard.py verify-shards shards || status=1
          if [[ "$SHARDS_RESULT" != success ]]; then
            echo "::error title=cpp-interface-standard::a shard job ended $SHARDS_RESULT"
            status=1
          fi
          exit "$status"
