name: Authoring Core (domain-free)

# The authoring core is the half of prose-to-SCXML that must spec for every
# subject matter. Everything a subject matter knows arrives as data, in a pack;
# nothing about a subject matter may live in the package itself.
#
# That boundary erodes in one predictable way: a special case added for the
# subject in front of whoever is working. So it is measured on every push
# rather than maintained by care, and this lane is where the measurement runs.
#
# `verify` is Python only. The engine toolchain is not needed and is
# deliberately not installed, so that job stays fast and cannot be made to
# depend on a build.
#
# `verify-with-codegen` is the other half, and exists because the first one
# cannot see it. 86 of the suite's 413 cases drive a document through the
# product (`verify` spawns `target/debug/sce-codegen`) and are
# `skipUnless(codegen_is_built())`: in a job that builds nothing they were
# skipped, so the lane passed without judging them. Measured 2026-09-24, those
# 86 ran nowhere on a generator change — the push selected this gate only for
# `tools/authoring/**` — so the paths below include what they run through.
#
# The specs tools (`specs_list`, `specs_read`, `specs_save_model`,
# `specs_save_requirements`) run a second
# product binary, the specs folder's `sce-spec` (`sce-specs`), and the
# cases that drive them skip the same way where it is not built. So that job
# builds it too and refuses to run without it, and `sce-specs/**` is among the
# paths: a change to the command layer reaches the one caller that is not Rust.
# `scripts/package_sce_author.sh` is too, since the bundle cases run it.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'tools/authoring/**'
      - '.github/workflows/authoring-core.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      - 'scripts/gates/authoring-core.sh'
      # What says which part runs which modules, and what holds the parts.
      - 'scripts/lib/workspace_shards.py'
      - 'scripts/lib/ctest_shards.py'
      - 'scripts/package_sce_author.sh'
      - 'sce-specs/**'
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'tools/codegen/templates/**'
      - 'backends/python/runtime/**'
      - 'schemas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/authoring/**'
      - '.github/workflows/authoring-core.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      - 'scripts/gates/authoring-core.sh'
      # What says which part runs which modules, and what holds the parts.
      - 'scripts/lib/workspace_shards.py'
      - 'scripts/lib/ctest_shards.py'
      - 'scripts/package_sce_author.sh'
      - 'sce-specs/**'
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'tools/codegen/templates/**'
      - 'backends/python/runtime/**'
      - 'schemas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Domain-free boundary + refusal suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install the two libraries a pack is parsed and validated with
        run: python3 -m pip install --upgrade pyyaml jsonschema
      - name: Install the PDF text pack
        # The extractor of a PDF with a text layer needs it (docs/adr/0035). The cases that read a
        # real PDF are skipped where it is absent, and a skip reads as a pass, so this lane says it
        # requires the pack and fails when it is missing.
        run: python3 -m pip install pypdfium2
      - name: Authoring core gate
        env:
          SCE_REQUIRE_PDF_PACK: '1'
        run: scripts/gate authoring-core

  # The suite with the generator built, in three parts, one job each, and a
  # last job, `verify-with-codegen`, that holds them together. Whole, the job
  # took 16 minutes (job 139000500233, 2026-11-25): 3.8 building the generator,
  # 2.2 building the Lua binding's wheel (no wheel is published for the newest
  # Python the runner takes), and 526 s of tests, the run-driven cases most of
  # them. Each part runs the authoring-core gate with
  # `SCE_AUTHORING_CORE_SHARD`, which runs its part of the suite's test modules
  # (scripts/lib/workspace_shards.py `--unittest-modules`) after holding the plan
  # to what discovery loads; `hook_ci_parity` holds the matrix and the variable
  # to one count and the parts to every module. Three, because the build and the
  # wheel are six minutes every part pays: three parts are about three minutes
  # of tests each beside them, and a fourth would save under a minute of tests
  # for another six of setup.
  verify-with-codegen-shard:
    name: Suite with the product's generator built (part ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Dependencies
        # libxml2-dev: the `libxml` crate behind sce-build's XSD validator
        # needs the dev headers at build time (see forge-conformance.yml).
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev pkg-config
      - uses: ./.github/actions/install-rust
      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'sce-build/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-codegen-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Build sce-codegen
        run: |
          source scripts/lib/sce_codegen.sh
          sce_codegen_drop_stale_release
          cargo build --bin sce-codegen --features cli -p sce-build
      - name: Build sce-spec
        # The specs folder's command layer, which the specs tools run to read a
        # spec and save its model. Its own step, as the generator's is.
        run: cargo build -p sce-specs --features cli --bin sce-spec
      - name: Refuse to run the suite without the generator and sce-spec
        # The 86 run-driven cases skip when the generator is absent, and the
        # specs cases when sce-spec is, and a skip reads as a pass. Built one
        # step up, so absence is a broken build step, not a reason to judge less.
        run: test -x target/debug/sce-codegen && test -x target/debug/sce-spec
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install the two libraries a pack is parsed and validated with
        run: python3 -m pip install --upgrade pyyaml jsonschema
      - name: Install the Python runtime's Lua binding
        # The run-driven cases import the Python the generator writes, and a
        # statechart with a datamodel runs through `lupa`, which
        # backends/python/runtime/pyproject.toml declares a hard dependency.
        # Without it every such case failed on its import (the first run of
        # this job, 2026-09-24) — the way w3c-tests.yml installs it too.
        run: python3 -m pip install lupa
      - name: Install the PDF text pack
        run: python3 -m pip install pypdfium2
      - name: Authoring core gate, run-driven cases included
        env:
          SCE_REQUIRE_PDF_PACK: '1'
          SCE_AUTHORING_CORE_SHARD: ${{ matrix.shard }}/3
        run: scripts/gate authoring-core
      # The plan and what this part ran (`verify-with-codegen` reads them).
      - name: Upload this part's plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: authoring-core-shard-${{ matrix.shard }}
          path: target/authoring-core-shard/
          retention-days: 30
          if-no-files-found: warn

  # The verdict of the suite with the generator built: every part planned the
  # modules alike and ran every module of its part (`ctest_shards.py verify`).
  # It keeps the job's id and name, so the lane's readers find it where the
  # unsplit job was.
  verify-with-codegen:
    name: Suite with the product's generator built
    needs: verify-with-codegen-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Download the parts' plans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: authoring-core-shard-*
          path: shards
      - name: Hold the parts to one plan and the whole suite
        env:
          SHARDS_RESULT: ${{ needs.verify-with-codegen-shard.result }}
        run: |
          status=0
          python3 scripts/lib/ctest_shards.py verify shards || status=1
          if [[ "$SHARDS_RESULT" != success ]]; then
            echo "::error title=authoring-core::a part's job ended $SHARDS_RESULT"
            status=1
          fi
          exit "$status"
