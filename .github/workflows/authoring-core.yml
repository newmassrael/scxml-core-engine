name: Authoring Core (domain-free)

# The authoring core is the half of prose-to-SCXML that must spec for every
# subject matter. Everything a subject matter knows arrives as data, in a pack;
# nothing about a subject matter may live in the package itself.
#
# That boundary erodes in one predictable way: a special case added for the
# subject in front of whoever is working. So it is measured on every push
# rather than maintained by care, and this lane is where the measurement runs.
#
# One suite, judged with everything it drives built. 86 of the suite's 413
# cases drive a document through the product (`verify` spawns
# `target/debug/sce-codegen`) and are `skipUnless(codegen_is_built())`: in a
# job that built nothing they were skipped, so the lane passed without judging
# them. Measured 2026-09-24, those 86 ran nowhere on a generator change — the
# push selected this gate only for `tools/authoring/**` — so the paths below
# include what they run through.
#
# The specs tools (`specs_list`, `specs_read`, `specs_save_model`,
# `specs_save_requirements`) run a second
# product binary, the specs folder's `sce-spec` (`sce-specs`), and the
# cases that drive them skip the same way where it is not built. So the gate
# builds it too, and `sce-specs/**` is among the
# paths: a change to the command layer reaches the one caller that is not Rust.
# `scripts/package_sce_author.sh` is too, since the bundle cases run it.
#
# The gate runs in the host image (tools/ci-images/host, docs/adr/0145), which
# holds the Python environment the suite runs on (PyYAML, jsonschema, `lupa`,
# the PDF text pack) and what the generator's build links; the gate builds the
# generator there first (`codegen-build`) and then `sce-spec`, so the suite
# never meets a binary built against another machine's libc. Until 2026-11-26
# a Python-only job ran the suite beside this one with nothing built, which in
# the image is the same run twice: the gate builds what it drives wherever it
# runs.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'tools/authoring/**'
      - '.github/workflows/authoring-core.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      - 'tools/ci-images/host/**'
      - '.github/actions/gate-image/**'
      - 'scripts/gates/authoring-core.sh'
      # What says which part runs which modules, and what holds the parts.
      - 'scripts/lib/workspace_shards.py'
      - 'scripts/lib/ctest_shards.py'
      - 'scripts/package_sce_author.sh'
      - 'sce-specs/**'
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'tools/codegen/templates/**'
      - 'backends/python/runtime/**'
      - 'schemas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/authoring/**'
      - '.github/workflows/authoring-core.yml'
      - 'rust-toolchain.toml'
      - '.github/actions/install-rust/**'
      - 'tools/ci-images/host/**'
      - '.github/actions/gate-image/**'
      - 'scripts/gates/authoring-core.sh'
      # What says which part runs which modules, and what holds the parts.
      - 'scripts/lib/workspace_shards.py'
      - 'scripts/lib/ctest_shards.py'
      - 'scripts/package_sce_author.sh'
      - 'sce-specs/**'
      # What cargo reads of the generator crate to build it, and the fixtures
      # it is run on (tools/git-hooks/gate_registry.py, "What a build reads";
      # its self-test holds a narrowed list to the build's).
      - 'sce-build/Cargo.toml'
      - 'sce-build/build.rs'
      - 'sce-build/src/**'
      - 'sce-build/kind-examples/**'
      - 'sce-build/tests/fixtures/**'
      - 'tools/codegen/templates/**'
      - 'backends/python/runtime/**'
      - 'schemas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The suite in three parts, one job each, and a last job,
  # `verify-with-codegen`, that holds them together. Whole, the job took 16
  # minutes (job 139000500233, 2026-11-25): 3.8 building the generator, 2.2
  # building the Lua binding's wheel (no wheel was published for the newest
  # Python the runner took; the image pins one that has a wheel), and 526 s of
  # tests, the run-driven cases most of them. Each part runs the
  # authoring-core gate with `SCE_AUTHORING_CORE_SHARD`, which runs its part
  # of the suite's test modules (scripts/lib/workspace_shards.py
  # `--unittest-modules`) after holding the plan to what discovery loads;
  # `hook_ci_parity` holds the matrix and the variable to one count and the
  # parts to every module. Three, because the build is minutes every part
  # pays: three parts are about three minutes of tests each beside it, and a
  # fourth would save under a minute of tests for more minutes of setup.
  verify-with-codegen-shard:
    name: Suite with the product's generator built (part ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # `packages: write` for the image a run on main builds and pushes
    # (.github/actions/gate-image says why the permission cannot follow the
    # event); `contents: read` is what checkout needs.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # The account's 20 hosted jobs are shared; one job per shard at once.
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/install-rust
      - name: Compile through the shared compile cache
        id: compile-cache
        uses: ./.github/actions/compile-cache
      # The registry's credentials, so the runner pulls the gate's image by the
      # digest of its build context and a run on main pushes one it built
      # (.github/actions/gate-image).
      - name: Pull the gate's image
        uses: ./.github/actions/gate-image
      # The PDF text pack is in the image: the extractor of a PDF with a text
      # layer needs it (docs/adr/0035), the cases that read a real PDF are
      # skipped where it is absent, and a skip reads as a pass, so this lane
      # says it requires the pack and fails when it is missing.
      - name: Authoring core gate, run-driven cases included
        env:
          SCE_REQUIRE_PDF_PACK: '1'
          SCE_AUTHORING_CORE_SHARD: ${{ matrix.shard }}/3
        run: scripts/gate authoring-core
      # The plan and what this part ran (`verify-with-codegen` reads them). The
      # gate writes them under `target/`, which in the image is the image's own
      # build directory in its cache (`gate_in_container` in scripts/gate).
      - name: Upload this part's plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: authoring-core-shard-${{ matrix.shard }}
          path: ~/.cache/sce-gate-containers/authoring-core/target/authoring-core-shard/
          retention-days: 30
          if-no-files-found: warn

      # What the compile cache answered of this job, and what it could not
      # (.github/actions/compile-cache).
      - name: Report what the compile cache answered
        if: always() && steps.compile-cache.outcome == 'success'
        run: sccache --show-stats

  # The verdict of the suite with the generator built: every part planned the
  # modules alike and ran every module of its part (`ctest_shards.py verify`).
  # It keeps the job's id and name, so the lane's readers find it where the
  # unsplit job was.
  verify-with-codegen:
    name: Suite with the product's generator built
    needs: verify-with-codegen-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Download the parts' plans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: authoring-core-shard-*
          path: shards
      - name: Hold the parts to one plan and the whole suite
        env:
          SHARDS_RESULT: ${{ needs.verify-with-codegen-shard.result }}
        run: |
          status=0
          python3 scripts/lib/ctest_shards.py verify shards || status=1
          if [[ "$SHARDS_RESULT" != success ]]; then
            echo "::error title=authoring-core::a part's job ended $SHARDS_RESULT"
            status=1
          fi
          exit "$status"
