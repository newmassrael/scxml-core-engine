name: Authoring Core (domain-free)

# The authoring core is the half of prose-to-SCXML that must spec for every
# subject matter. Everything a subject matter knows arrives as data, in a pack;
# nothing about a subject matter may live in the package itself.
#
# That boundary erodes in one predictable way: a special case added for the
# subject in front of whoever is working. So it is measured on every push
# rather than maintained by care, and this lane is where the measurement runs.
#
# `verify` is Python only. The engine toolchain is not needed and is
# deliberately not installed, so that job stays fast and cannot be made to
# depend on a build.
#
# `verify-with-codegen` is the other half, and exists because the first one
# cannot see it. 86 of the suite's 413 cases drive a document through the
# product (`verify` spawns `target/debug/sce-codegen`) and are
# `skipUnless(codegen_is_built())`: in a job that builds nothing they were
# skipped, so the lane passed without judging them. Measured 2026-09-24, those
# 86 ran nowhere on a generator change — the push selected this gate only for
# `tools/authoring/**` — so the paths below include what they run through.
#
# The specs tools (`specs_list`, `specs_read`, `specs_save_model`,
# `specs_save_requirements`) run a second
# product binary, the specs folder's `sce-spec` (`sce-specs`), and the
# cases that drive them skip the same way where it is not built. So that job
# builds it too and refuses to run without it, and `sce-specs/**` is among the
# paths: a change to the command layer reaches the one caller that is not Rust.
# `scripts/package_sce_author.sh` is too, since the bundle cases run it.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'tools/authoring/**'
      - '.github/workflows/authoring-core.yml'
      - 'scripts/gates/authoring-core.sh'
      - 'scripts/package_sce_author.sh'
      - 'sce-specs/**'
      - 'sce-build/**'
      - 'tools/codegen/templates/**'
      - 'backends/python/runtime/**'
      - 'schemas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/authoring/**'
      - '.github/workflows/authoring-core.yml'
      - 'scripts/gates/authoring-core.sh'
      - 'scripts/package_sce_author.sh'
      - 'sce-specs/**'
      - 'sce-build/**'
      - 'tools/codegen/templates/**'
      - 'backends/python/runtime/**'
      - 'schemas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Domain-free boundary + refusal suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install the two libraries a pack is parsed and validated with
        run: python3 -m pip install --upgrade pyyaml jsonschema
      - name: Install the PDF text pack
        # The extractor of a PDF with a text layer needs it (docs/adr/0035). The cases that read a
        # real PDF are skipped where it is absent, and a skip reads as a pass, so this lane says it
        # requires the pack and fails when it is missing.
        run: python3 -m pip install pypdfium2
      - name: Authoring core gate
        env:
          SCE_REQUIRE_PDF_PACK: '1'
        run: scripts/gate authoring-core

  verify-with-codegen:
    name: Suite with the product's generator built
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        # libxml2-dev: the `libxml` crate behind sce-build's XSD validator
        # needs the dev headers at build time (see forge-conformance.yml).
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-codegen-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'sce-build/**/*.rs', 'sce-build/Cargo.toml', 'sce-specs/**/*.rs', 'sce-specs/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-codegen-
      - name: Build sce-codegen
        run: |
          source scripts/lib/sce_codegen.sh
          sce_codegen_drop_stale_release
          cargo build --bin sce-codegen --features cli -p sce-build
      - name: Build sce-spec
        # The specs folder's command layer, which the specs tools run to read a
        # spec and save its model. Its own step, as the generator's is.
        run: cargo build -p sce-specs --features cli --bin sce-spec
      - name: Refuse to run the suite without the generator and sce-spec
        # The 86 run-driven cases skip when the generator is absent, and the
        # specs cases when sce-spec is, and a skip reads as a pass. Built one
        # step up, so absence is a broken build step, not a reason to judge less.
        run: test -x target/debug/sce-codegen && test -x target/debug/sce-spec
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install the two libraries a pack is parsed and validated with
        run: python3 -m pip install --upgrade pyyaml jsonschema
      - name: Install the Python runtime's Lua binding
        # The run-driven cases import the Python the generator writes, and a
        # statechart with a datamodel runs through `lupa`, which
        # backends/python/runtime/pyproject.toml declares a hard dependency.
        # Without it every such case failed on its import (the first run of
        # this job, 2026-09-24) — the way w3c-tests.yml installs it too.
        run: python3 -m pip install lupa
      - name: Install the PDF text pack
        run: python3 -m pip install pypdfium2
      - name: Authoring core gate, run-driven cases included
        env:
          SCE_REQUIRE_PDF_PACK: '1'
        run: scripts/gate authoring-core
