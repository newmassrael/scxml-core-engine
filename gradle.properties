# Gradle daemon — JVM warm-up 재사용으로 빌드 속도 향상
org.gradle.daemon=true

# 병렬 빌드 — sce-kotlin-runtime과 sce-kotlin-tests 동시 구성
org.gradle.parallel=true

# 빌드 캐시 — 변경 없는 태스크 결과 재사용
org.gradle.caching=true

# JVM 메모리 — 큰 generated 소스 컴파일용
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC

# Kotlin 증분 컴파일
kotlin.incremental=true

# Configuration cache — 설정 단계 캐싱 (Gradle 8.5+)
org.gradle.configuration-cache=true

# AndroidX — Jetpack 라이브러리 사용
android.useAndroidX=true
