# Gradle daemon — reuse the warmed-up JVM between builds
org.gradle.daemon=true

# Parallel build — sce-kotlin-runtime and sce-kotlin-tests configure together
org.gradle.parallel=true

# Build cache — reuse the results of tasks whose inputs have not changed
org.gradle.caching=true

# JVM memory — two JVMs, two budgets.
#
# The Gradle daemon configures the build and runs the tests; the Kotlin compile
# daemon compiles. Without `kotlin.daemon.jvmargs` the compile daemon inherits
# `org.gradle.jvmargs`, and from 2026-11-05 to 2026-11-07 that inherited 2 GB
# was the one budget of both and the one the W3C Kotlin lane ran out of.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC

# The Kotlin compile daemon's budget, sized from a measurement.
#
# The largest compile is `:sce-kotlin-tests`: 13.1 MB of generated Kotlin in
# one compilation unit, 4.7 MB of W3C machines and 8.4 MB of integration
# machines. On 2026-11-07 its compile on the committed (Lua) tree was run on a
# build host in a fresh daemon at one -Xmx after another
# (`--no-build-cache --rerun`, OpenJDK 17, ParallelGC):
#
#   1,792 MB and below   OutOfMemoryError (GC overhead limit exceeded)
#   1,920 MB             compiled
#   2,048 MB             compiled
#
# So the compile needs about 1.85 GB, and the inherited 2 GB left it under 13%.
# This line is that minimum times 1.5, rounded up to a whole GB.
#
# ⚠ Do not size this line from the live set the gate's heap report prints. Under
# ParallelGC that reading stays near 78% of the heap whether the JVM is about
# to fail or not (`scripts/gates/jvm_heap_report.py` explains why). The margin
# is held by the gate instead: `scripts/gates/w3c-kotlin.sh` compiles the
# committed tree again in a fresh daemon given two thirds of this budget, and
# fails the lane when that compile fails. When it fails, the choice is between
# a larger budget, measured again the same way, and a smaller compilation unit.
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC

# Kotlin incremental compilation
kotlin.incremental=true

# Configuration cache — caches the configuration phase (Gradle 8.5+)
org.gradle.configuration-cache=true

# AndroidX — use the Jetpack libraries
android.useAndroidX=true
