#
# Watching-zenoh RFC §5.J.2: no_std MCU-target compile gate for *generated*
# state machines (not just the runtime crate).
#
# This crate's `[lib] path` points at a generated `--no-std` machine. Building
# it for `thumbv7em-none-eabihf` proves the emitted code is allocator-free: the
# bare-metal target has no `std` and this probe declares no `#[global_allocator]`,
# so any reachable `alloc` symbol (String / Vec / Box / sort_by's merge buffer)
# is a hard compile error. The runtime-only no_std workflow cannot catch a
# template regression that reintroduces `alloc` into emitted code — this crate
# does.
#
# The generated `src/*_sm.rs` is git-ignored and produced fresh by the CI step
# (and reproducible locally — see README.md), so it can never drift stale.
#
# Detached from the parent workspace (own empty `[workspace]` table) so cargo's
# feature unification cannot turn on `sce-rust-runtime/no_std` for the std
# `sce-rust-tests` build in the same invocation.

[package]
name = "sce-nostd-build-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "no_std MCU-target compile gate for generated SCE state machines (watching-zenoh RFC §5.J.2)"
license = "LGPL-2.1-or-later WITH LicenseRef-SCE-Linking-Exception OR LicenseRef-SCE-Commercial"

[lib]
name = "sce_nostd_build_probe"
path = "src/parallel_history_probe_sm.rs"

[dependencies]
sce-rust-runtime = { path = "../sce-rust-runtime", default-features = false, features = ["no_std"] }

[workspace]
