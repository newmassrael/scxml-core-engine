[workspace]
resolver = "2"
members = [
    "backends/rust/portable-bytes",
    "backends/rust/runtime",
    "backends/rust/lua",
    "backends/rust/tests",
    "sce-build",
    "backends/rust/forge-runtime",
    "backends/rust/link-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "LGPL-2.1-or-later WITH LicenseRef-SCE-Linking-Exception OR LicenseRef-SCE-Commercial"
repository = "https://github.com/newmassrael/scxml-core-engine"
authors = ["newmassrael <newmassrael@gmail.com>"]

# Workspace-wide rustc lint policy: any warning fails the build. Each
# member crate opts in via `[lints] workspace = true`. Clippy categories
# (style/complexity/pedantic) stay opt-in so generated-code crates do not
# need blanket suppressions; rustc warnings are the strict guard.
[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
# Logging facade — matches C++ spdlog conditional logging pattern
log = "0.4"
# Error types — matches C++ exception semantics with ergonomics
thiserror = "2.0"
# Lua 5.4 bindings — bundled vendored build, matches C++ SCE_SCRIPT_ENGINE=lua default
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
# Compile-time test registration — C++ AotTestRegistrar equivalent
linkme = "0.3"
# Fixed-capacity collections without `alloc` — used by `sce-rust-runtime`'s
# `no_std` feature variant per watching-zenoh RFC §5.J.2 line 1989
# ("zero `alloc` dependency"). MCU consumers source capacities from
# deploy.yaml + `<sce:capacity>` per §5.L. Stays optional everywhere
# (std builds do not pull it in).
heapless = "0.8"
# SHA-256 for spec §6.2.6 generated-source drift detection. Used by
# `sce-build/src/forge/drift.rs` to compute `source-hash` over the
# input SCXML + deploy.yaml set and `template-hash` over the codegen
# template tree + Cargo.lock. Build-time only; not pulled into runtime.
sha2 = "0.10"

# Release profile optimized for W3C test throughput
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# Test profile: opt-level 1 gives reasonable debug symbols + faster runtime
# (202 W3C tests are compute-heavy enough that debug=0 slows them badly)
[profile.test]
opt-level = 1
