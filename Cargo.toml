[workspace]
resolver = "2"
members = [
    "backends/rust/portable-bytes",
    # The regular expressions of docs/adr/0149: the reader of I-Regexp, the construction and the
    # simulation, shared by the build and the machines.
    "backends/rust/regexp",
    "backends/rust/runtime",
    "backends/rust/lua",
    "backends/rust/tests",
    "sce-build",
    "sce-build-wasm",
    "backends/rust/forge-runtime",
    "backends/rust/forge-conformance",
    "backends/rust/deploy-conformance",
    "backends/rust/feature-conformance",
    "backends/rust/link-runtime",
    "backends/rust/mesh",
    # The browser node's module (docs/adr/0117): the HTTPS binding's client core for wasm32.
    "backends/rust/browser-node",
    "backends/rust/scenarios",
    "backends/rust/host-features",
    # The network transport of the host features' HTTP operation, with its destination policy
    # (docs/adr/0109, decision D4).
    "backends/rust/host-http",
    "backends/rust/crypto",
    # The metrics port a server reports through, with its reference OpenMetrics adapter
    # (docs/adr/0109, decision D16).
    "backends/rust/metrics",
    "backends/rust/world",
    "backends/rust/trust",
    "backends/rust/relay",
    "backends/rust/relay-transport",
    "backends/rust/relay-server",
    "backends/rust/session-store",
    "backends/rust/mls",
    "backends/rust/mls-capi",
    "backends/rust/peer",
    "backends/rust/peer-capi",
    "backends/rust/assurance",
    # The suite that holds a server's durability and scale (docs/adr/0107, decision D10).
    "tests/server",
    "sce-revision",
    "sce-specs",
    "sce-ttcn3-validator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The floor the runtimes hold. A package that needs a newer Rust declares its
# own number; `scripts/gates/rust-version.sh` builds every package with the one
# it declares.
rust-version = "1.75"
license = "AGPL-3.0-only WITH AdditionRef-SCE-Linking-Exception OR LicenseRef-SCE-Commercial"
repository = "https://github.com/newmassrael/scxml-core-engine"
authors = ["newmassrael <newmassrael@gmail.com>"]

# Workspace-wide rustc lint policy: any warning fails the build. Each
# member crate opts in via `[lints] workspace = true`. Clippy categories
# (style/complexity/pedantic) stay opt-in so generated-code crates do not
# need blanket suppressions; rustc warnings are the strict guard.
[workspace.lints.rust]
warnings = "deny"
# `cfg(loom)` is set only by the forge runtime's loom models (SCE
# Protocol-Synthesis RFC §synth-5-P, verification layer 3); declaring it keeps
# every other build from reading the cfg as a typo.
# `cfg(verus_only)` is set only by Verus, which reads the contracts of the host
# core's proved files (docs/adr/0115, D13).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(verus_only)'] }

[workspace.dependencies]
# Logging facade — matches C++ spdlog conditional logging pattern
log = "0.4"
# Error types — matches C++ exception semantics with ergonomics
thiserror = "2.0"
# Lua 5.4 bindings — bundled vendored build, matches C++ SCE_SCRIPT_ENGINE=lua default
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
# Compile-time test registration — C++ AotTestRegistrar equivalent
linkme = "0.3"
# Fixed-capacity collections without `alloc` — used by `sce-rust-runtime`'s
# `no_std` feature variant per SCE Protocol-Synthesis RFC §5.J.2 line 1989
# ("zero `alloc` dependency"). MCU consumers source capacities from
# deploy.yaml + `<sce:capacity>` per §5.L. Stays optional everywhere
# (std builds do not pull it in).
heapless = "0.8"
# SHA-256 for spec §6.2.6 generated-source drift detection. Used by
# `sce-build/src/forge/drift.rs` to compute `source-hash` over the
# input SCXML + deploy.yaml set. Build-time only; not pulled into runtime.
sha2 = "0.10"
# ICU4X's Unicode data, at the one version `unicode/pin.toml` names (docs/adr/0158, D6). Required
# exactly, so a refresh of the lock cannot move the Unicode a build reads; a move of the pin moves
# this line, the pin file and the lock together.
icu_properties = { version = "=2.2.0", default-features = false, features = ["compiled_data"] }

# Release profile optimized for W3C test throughput
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# Test profile: opt-level 1 gives reasonable debug symbols + faster runtime
# (202 W3C tests are compute-heavy enough that debug=0 slows them badly)
[profile.test]
opt-level = 1

# `sce-build` in a plain `cargo build` gets the level the test profile gives
# it. `target/debug/sce-codegen` is one path written by both, and the tools
# that spawn it (the authoring core, forge conformance, example-codegen) ran
# at whichever build wrote it last: measured 2026-09-24 on one commit and one
# feature set, a tiny statechart generated in 1.3-2.0s from `cargo build`
# (opt 0) and 0.2-0.3s from a `cargo test` build (opt 1). 94% of the opt-0
# time is the per-process template rewrite (`generator::rewritten_template`,
# callgrind), which walks every template character by character. The
# authoring suite went 155s -> 70s on the same tree.
[profile.dev.package.sce-build]
opt-level = 1
