schema = 1

# What this repository needs from a build machine, and what "verified"
# means for it. Machine names live in bx's registry (`bx-paths.sh registry`),
# never here — see the remote-build skill, rule 11.
#
# The verify set is a decision, not something to detect: this tree carries
# cargo, cmake and gradle side by side, so any auto-detection picks one of
# three and calls it the answer. Named here: the Rust workspace and the C++
# ctest suite, which are the two heaviest lanes.
#
# ⚠ THIS COMMENT USED TO CLAIM `go` WAS ABSENT FROM THE BUILD MACHINE, and
# that the Go, Python and Kotlin lanes therefore had to stay local. Measured
# 2026-08-24, the claim had been false for long enough that nobody knew when it
# stopped being true — which is the trouble with a comment that states a fact
# about ANOTHER machine. A statement like that goes stale in silence, reads
# exactly like a true one, and kept every Go/Python/Kotlin gate local for no
# reason.
#
# So the rule this file follows now: state what THIS repository needs, in
# `needs`, where bx checks it against the machine and excludes a host that
# cannot answer. Do not describe the machines in prose.

# `.git` and the four submodule worktrees travel too. Sending only
# `git ls-files` output would deliver empty submodule directories, and the
# C++ configure dies on `third_party/quickjs does not contain a
# CMakeLists.txt` — a transfer failure that reads as a build failure.
send    = "tracked+submodules"

# What crosses is what git tracks. `target` (a symlink into ~/.buildcache) and
# `build` are untracked and stay home for that reason alone. `embed/` is
# TRACKED (`embed/MANIFEST.json` is the gate's snapshot of the public API) and
# is sent on every transfer. An `exclude = ["/target", "/build", "/embed"]`
# line sat here until 2026-10-17 claiming otherwise: bx never read it, and
# bx.toml refuses a key bx does not define.

# THE ONE PLATFORM, WRITTEN AS A TABLE (2026-11-04). This file used bx's shorthand until then:
# requirements at the top level, which bx reads as one `linux` platform of ANY architecture. The
# shorthand has no way to say an architecture, and the set of checks below keeps the verdicts it
# passes (bx RFC 0020, section 4.3): a kept verdict is one architecture's, so bx refuses `cache` on a
# platform that names none. Everything below this header up to the next table is what the shorthand
# said at the top level, unchanged; the tools, the commands and the set of checks follow as tables.
#
# What the table costs, stated: a run of this repository now goes only to an `x86_64` machine. Every
# machine that built it when this was written was one, and a machine of another architecture would
# have needed the C++ toolchain, GenMC and the Swift tarball for it, none of which is pinned here.
#
# The table is read by bx-fleet (`bx-fleet decl plan`) and not by bx's line readers, so the
# one-line rules the shorthand had (`needs` below) are history rather than a constraint;
# `bx-fleet decl validate bx.toml` is what checks this file.
[platform.linux]
os   = "linux"
arch = "x86_64"

# `node` is not optional: every BasicHTTP fixture in the Rust workspace
# posts to localhost:8080, and without the echo server they route to their
# `<transition event="*"/>` fail branch — 25 failures that say nothing about
# the backend. The gates start it for the same reason.
#
# `mnemosyne-cli` is NOT here although the citation gate cannot run without
# it: the gate runs the rev-pinned build, never the one on PATH, so a name in
# `needs` passed every host whose `~/.cargo/bin` held some other revision.
# Measured 2026-10-20: all five build hosts passed it, none had the pinned
# build, and `gate_registry_contract`'s two citation cases exited 3 on each.
# It is declared below as a pinned tool, which bx checks at its revision.
#
# `git` is listed because `bx` runs it on the far side to PROVE the two trees
# are equal (`git rev-parse HEAD` + `git status --porcelain`) before it starts
# any work. Without it that probe returns nothing and the run dies with "the
# remote tree is at <nothing>" — a sentence about tree state, on a machine
# whose real problem is a missing binary. The same misattribution this
# repository's own gates were fixed for: a tool that cannot run must say so
# instead of blaming what it was pointed at. Invisible on a machine that
# happens to have git, which is why it went undeclared.
# `go`, `java`, `python3` and `wasm-pack` joined on 2026-08-24, when the
# gates stopped being a local-only set. `scripts/gate w3c-go`,
# `w3c-python`, `w3c-kotlin`, `forge-go`, `forge-python` and
# `visualizer-wasm` each name their toolchain and fail loudly without it, so
# a host that lacks one produces a red that reads like a code defect: a tool
# that cannot run, blamed on the tree it was pointed at. Listing them keeps
# such a host out of the candidate set instead.
#
# `kotlinc` joined on 2026-09-11, and it is the one that did NOT fail loudly:
# the forge Kotlin gates degrade to skip-with-warn, so a host without it
# reported green over seven checks that never ran. It is listed so that such a
# host is refused instead. It was installed on the build machines before it was
# declared, which is the order these two moves belong in: a tool no host has
# refuses every host for every job, Kotlin or not; installing first makes the
# declaration free, and the declaration is what keeps the NEXT host from
# re-entering that silence.
#
# `gradle` is deliberately NOT here: the Kotlin lanes run `./gradlew`, which
# fetches its own distribution, so the machine needs a JDK and nothing more.
#
# `clang-format-19` joined on 2026-09-24, in the same order `kotlinc` did:
# installed first (the Ubuntu archive's 19.1.1, the package CI installs), then
# declared. `sce-codegen` formats the C++ it generates with clang-format pinned
# to major 19 and refuses without it (docs/SCE_CODEGEN_DETERMINISM.md §9), and a
# host's unsuffixed `clang-format` can be another major — so the suffixed name
# is the tool a host must be able to run.
#
# One line, for a reason that held while this file was the shorthand: bx read
# this key with a single `sed` that anchored on `[` and `]` in the same line,
# so a wrapped list parsed as EMPTY and every host became eligible for
# everything (measured 2026-08-24, thirty seconds after wrapping it:
# `--explain-declaration` printed `decl needs` with nothing after it). The
# platform table is read as TOML by bx-fleet, which has no such limit; the
# line stays whole so that the record above still describes it.
needs =["cargo", "cmake", "ninja", "g++", "node", "git", "go", "java", "python3", "wasm-pack", "kotlinc", "clang-format-19"]

# System packages a host must carry that no executable in `needs` can name: a development header
# is not a command. bx asks `dpkg-query` for each and reports every missing one in a single
# answer, by name, with the install command — instead of a compile error about something else.
#
# `libssl-dev`: cpp-httplib compiles TLS in only when CMake finds OpenSSL, and CMake does not
# complain when it does not. Without the headers the tree CONFIGURES cleanly and dies later:
# `CppHttplibClient.cpp` calls `enable_server_certificate_verification` unconditionally, and
# cpp-httplib defines that member only under CPPHTTPLIB_OPENSSL_SUPPORT. MEASURED 2026-09-30 on
# a build machine that had never built this repository: the compile line carried
# `-DCPPHTTPLIB_BROTLI_SUPPORT -DCPPHTTPLIB_ZLIB_SUPPORT` and no `-DCPPHTTPLIB_OPENSSL_SUPPORT`,
# and the error was `class httplib::Client has no member named enable_server_certificate_verification`
# — a sentence about httplib, not about a package.
#
# `openjdk-17-jdk-headless`: the Kotlin modules ask Gradle for a Java 17 toolchain and no
# toolchain download repository is configured, so a host whose only JDK is another version fails
# in `compileJvmMainJava` with `Cannot find a Java installation ... languageVersion=17`. `java`
# in `needs` cannot say WHICH. (`gradle` is still not here: `./gradlew` brings its own.)
#
# Declared only after the build machines were checked to satisfy both names: a name a host
# cannot satisfy would refuse that host for every job, which is the failure `kotlinc`'s comment
# above describes.
#
# The rest are what swift.org lists for the Swift toolchain on Ubuntu 22.04 and 24.04 (the
# `[platform.linux.tools.swift]` table below), less three: `git` is in `needs`, `libgcc-N-dev` and
# `libstdc++-N-dev` come with the `g++` in `needs` (13 on 24.04, 11 on 22.04, which is the N each
# release's list names), and `gnupg2` is there to check the tarball's signature, which the pinned
# SHA-256 does instead. Without them the tarball unpacks and `swift --version` answers, and a
# compile or a link dies later (`libcurl4-openssl-dev` for FoundationNetworking, `libz3-dev`,
# `libxml2-dev` for FoundationXML): the same shape as `libssl-dev` above.
#
# `curl` is what the Swift tool's install downloads with. It is a package and not a `need`
# because nothing a job runs calls it; provision installs packages before it builds a tool.
# Measured 2026-10-20: one build machine had no curl, and the install exited 127 there.
packages = ["libssl-dev", "openjdk-17-jdk-headless", "curl", "binutils", "libc6-dev", "libcurl4-openssl-dev", "libedit2", "libncurses-dev", "libpython3-dev", "libsqlite3-0", "libxml2-dev", "libz3-dev", "pkg-config", "tzdata", "unzip", "zlib1g-dev"]

# The C++ tree is the constraint on disk: a debug build of this repository has
# measured 4.2 GB of debug info in its executables alone.
#
# No `min_ram_gb`. Until 2026-11-08 it was 16, which kept every run of this
# repository off every machine of less memory, though most units peak at 1 to
# 4 GB. bx places by memory per unit already: a fanout
# unit goes only where the ceiling holds its learned peak, and a run is
# admitted only where its reservation fits; one killed at a learned
# reservation is run again at twice it (bx 6a7ac6a). So the C++ debug units
# still go only to the large machines, and the small ones may use the rest.
min_free_gb = 60

# A hint for the run-time parallelism calculation, not a limit. Rust test
# processes here are small; the C++ link steps are what peak.
#
# ⚠ It sat at the end of the file, INSIDE [commands], until 2026-10-17. By
# TOML's rules that made it a command named `peak_gb_per_task`; bx's old
# line-by-line reader found it anyway, which is the only reason it ever had
# effect. bx.toml is read by TOML's tables, so it belongs in the platform's.
peak_gb_per_task = 4

# The citation gate's binary, at the revision CI installs. The revision is read
# from the workflow, the one place that declares it, with the shape
# `scripts/lib/mnemosyne_pin.sh` reads, and `path` and `check` are that file's
# root and `--version` test. bx builds the install once per platform into a
# store it manages and links `path` to it. The install fills the store entry
# with both binaries in one `cargo install`, as the pin's own install line does,
# but only the CLI is a requirement here: it is the one a run executes, while
# `mnemosyne-mcp` serves the MCP servers of a workstation.
#
# Each tool is a table of the platform (`[platform.linux.tools.<name>]`): a tool
# is what a machine of one platform must carry. Until 2026-11-04 these were
# `[tools.<name>]` tables of the shorthand, which meant the same platform.
[platform.linux.tools.mnemosyne-cli]
version_file = ".github/workflows/spec-citations.yml"
version_pattern = 'MNEMOSYNE_REV: *([0-9a-f]{40})'
path = "~/.local/share/mnemosyne-rev/{version:8}/bin/mnemosyne-cli"
check = "{version:8}"
install = "CARGO_HOME={scratch}/cargo cargo install --git https://github.com/newmassrael/mnemosyne --rev {version} --locked --root {prefix} mnemosyne-cli mnemosyne-mcp"
prefix_file = "bin/mnemosyne-cli"

# THE RUST TOOLCHAINS, one table for each one a gate runs (2026-11-10). Until then the gates installed
# them themselves, in the run account: `scripts/gate` synced "stable" with `rustup toolchain install`
# and added components to it, `rust-version` installed each declared release, `forge-rust` and
# `mutation-rounds` the nightly, `nostd-mcu` its targets and llvm-tools. A build machine runs the
# units of a set side by side in that one account, and rustup is not safe against that: on 2026-10-20
# a machine's `stable` was left with rustc and rust-std and no cargo, and a landing was refused over a
# target one unit had and another had not added yet. Declared here, each is installed once per machine
# by provision, checked there, and a unit is placed only where the ones it needs are.
#
# Every table is pinned to a release or a dated nightly, never to a channel that moves. The install
# is `scripts/install_rust.sh`, the one place the steps are written: a rustup pinned by its digest,
# living in the install's scratch (RUSTUP_HOME and CARGO_HOME) and nowhere else, installs the one
# toolchain with the components (`-c`) and targets (`-t`) on the line, and the toolchain's directory
# is copied to the store entry. They are on the line so that they are part of the store's key: a
# target added here is a new entry, never an old one taken for it. `prefix_link` makes the whole
# toolchain the entry, because rustc finds its standard library and cargo its subcommands beside
# themselves; `scripts/lib/rust_toolchains.sh` finds it there, and the gates put its `bin/` first on
# PATH, so no rustup proxy is in the way. `check` is what `cargo --version` prints.
#
# Anywhere else the same install line puts a toolchain at the same place:
# `scripts/install_rust.sh --declared <toolchain>` reads it from the table below and runs it. The
# hosted lanes keep their own `dtolnay/rust-toolchain@stable`; a gate there installs a missing
# toolchain this way (`sce_gate_require_rust` in scripts/gates/lib.sh). The registry's self-test holds
# these tables to the pins, to the `rust-version` of every workspace package, and to the units their
# `needed_by` names.
#
# THE RELEASE every gate unit runs on. The plan writes it into each unit (`bash scripts/gate --rust
# <release> <gate>`) from `SCE_RUST_RELEASE` in scripts/lib/rust_toolchains.sh, which is where it is
# moved. `needed_by` is that command, so every unit of the push's set asks for it and nothing else
# does. Its components: clippy and rustfmt for the lint and format gates, llvm-tools for the size
# reader and disassembler of `nostd-mcu` where binutils for ARM is absent. Its targets are every one a
# gate builds for: thumbv7em-none-eabihf and thumbv6m-none-eabi (`nostd-mcu` and the codec frame
# probe it runs), wasm32-unknown-unknown (`wasm32-scenarios`, and the visualizer's wasm-pack build) and
# wasm32-unknown-emscripten (the ECMAScript frontend of both emscripten trees).
[platform.linux.tools.rust]
version_file = "scripts/lib/rust_toolchains.sh"
version_pattern = '^SCE_RUST_RELEASE="([0-9.]+)"'
path = "~/.local/rust/{version}/bin/cargo"
check = "cargo {version}"
prefix_link = "~/.local/rust/{version}"
install = "RUSTUP_HOME={scratch}/rh CARGO_HOME={scratch}/ch bash scripts/install_rust.sh {version} {prefix} -c clippy -c rustfmt -c llvm-tools -t thumbv7em-none-eabihf -t thumbv6m-none-eabi -t wasm32-unknown-unknown -t wasm32-unknown-emscripten"
install_inputs = ["scripts/install_rust.sh"]
needed_by = ["scripts/gate --rust"]

# THE NIGHTLY, `SCE_RUST_NIGHTLY` in scripts/lib/rust_toolchains.sh: Miri and ThreadSanitizer over
# the queue runtime (`forge-rust`, and the mutation casefiles that declare it, which `mutation-rounds`
# runs), and the standard library rebuilt from rust-src with atomics for the threaded emscripten tree
# (`w3c-wasm`, `cpp-suite-wasm`). A nightly's cargo prints its own version and the date of its commit,
# not the date of the channel, so `check` asks only that it is a nightly; the version is held by the
# store's key.
[platform.linux.tools.rust-nightly]
version_file = "scripts/lib/rust_toolchains.sh"
version_pattern = '^SCE_RUST_NIGHTLY="(nightly-[0-9-]+)"'
path = "~/.local/rust/{version}/bin/cargo"
check = "nightly"
prefix_link = "~/.local/rust/{version}"
install = "RUSTUP_HOME={scratch}/rh CARGO_HOME={scratch}/ch bash scripts/install_rust.sh {version} {prefix} -c miri -c rust-src -t wasm32-unknown-emscripten"
install_inputs = ["scripts/install_rust.sh"]
needed_by = ["forge-rust", "mutation-rounds", "w3c-wasm", "cpp-suite-wasm"]

# THE RELEASE EACH PACKAGE DECLARES: `rust-version` builds every workspace package with exactly the
# release its `rust-version` names, the oldest one it admits (`1.87` is 1.87.0). The versions are
# written here and not read: they are the `rust-version` lines of the packages' manifests, which no
# single line states, and the registry's self-test holds this set of tables to that set of lines in
# both directions. The gate only checks the packages (`cargo check`), so the profile is minimal and
# no component is added.
[platform.linux.tools.rust-msrv-1-75]
version = "1.75.0"
path = "~/.local/rust/{version}/bin/cargo"
check = "cargo {version}"
prefix_link = "~/.local/rust/{version}"
install = "RUSTUP_HOME={scratch}/rh CARGO_HOME={scratch}/ch bash scripts/install_rust.sh {version} {prefix}"
install_inputs = ["scripts/install_rust.sh"]
needed_by = ["rust-version"]

[platform.linux.tools.rust-msrv-1-79]
version = "1.79.0"
path = "~/.local/rust/{version}/bin/cargo"
check = "cargo {version}"
prefix_link = "~/.local/rust/{version}"
install = "RUSTUP_HOME={scratch}/rh CARGO_HOME={scratch}/ch bash scripts/install_rust.sh {version} {prefix}"
install_inputs = ["scripts/install_rust.sh"]
needed_by = ["rust-version"]

[platform.linux.tools.rust-msrv-1-85]
version = "1.85.0"
path = "~/.local/rust/{version}/bin/cargo"
check = "cargo {version}"
prefix_link = "~/.local/rust/{version}"
install = "RUSTUP_HOME={scratch}/rh CARGO_HOME={scratch}/ch bash scripts/install_rust.sh {version} {prefix}"
install_inputs = ["scripts/install_rust.sh"]
needed_by = ["rust-version"]

[platform.linux.tools.rust-msrv-1-87]
version = "1.87.0"
path = "~/.local/rust/{version}/bin/cargo"
check = "cargo {version}"
prefix_link = "~/.local/rust/{version}"
install = "RUSTUP_HOME={scratch}/rh CARGO_HOME={scratch}/ch bash scripts/install_rust.sh {version} {prefix}"
install_inputs = ["scripts/install_rust.sh"]
needed_by = ["rust-version"]

[platform.linux.tools.rust-msrv-1-89]
version = "1.89.0"
path = "~/.local/rust/{version}/bin/cargo"
check = "cargo {version}"
prefix_link = "~/.local/rust/{version}"
install = "RUSTUP_HOME={scratch}/rh CARGO_HOME={scratch}/ch bash scripts/install_rust.sh {version} {prefix}"
install_inputs = ["scripts/install_rust.sh"]
needed_by = ["rust-version"]

[platform.linux.tools.rust-msrv-1-91]
version = "1.91.0"
path = "~/.local/rust/{version}/bin/cargo"
check = "cargo {version}"
prefix_link = "~/.local/rust/{version}"
install = "RUSTUP_HOME={scratch}/rh CARGO_HOME={scratch}/ch bash scripts/install_rust.sh {version} {prefix}"
install_inputs = ["scripts/install_rust.sh"]
needed_by = ["rust-version"]

# THE SWIFT TOOLCHAIN, for the Swift backend of the shared-calendar extensions E1 and E5 (the owner
# had it installed on 2026-10-20). swift.org's release tarball, pinned by version and by the SHA-256
# of each Ubuntu release's tarball: the two digests were taken on 2026-10-20 from tarballs whose
# detached signatures verified against swift.org's published keys ("Swift 6.x Release Signing Key",
# EF80A866B47A981F), so the digest carries that check to every machine without gpg on any of them.
# 6.4.0 (2026-09-14) is the newest release more than two weeks old that day; 6.4.1 was eight days old.
#
# A release this pin has no digest for (a machine on 26.04, or another distribution) fails the
# install by name instead of downloading something unchecked. Adding one is a digest taken the same
# way, in the same commit as the version it belongs to.
#
# `check` is what `swift --version` prints in parentheses, and it is written out rather than
# derived from `version` because the two spell a release differently: the download tag of 6.4.0 is
# `swift-6.4.0-RELEASE`, and the binary prints `Swift version 6.4 (swift-6.4-RELEASE)` (measured
# 2026-10-20). A patch release prints its patch (`swift-6.4.1-RELEASE`), so a version bump changes
# `check` in the same edit.
#
# Only `swift` gets a link. `swiftc` and the rest of the toolchain are beside the file the link
# points to, so a lane reaches them through `dirname "$(readlink -f ~/.local/share/swift/<version>/bin/swift)"`.
#
# `scripts/lib/swift_pin.sh` reads the version and the digests out of this table, for the hosted
# lanes and the gates; it finds the table by this header.
[platform.linux.tools.swift]
version = "6.4.0"
path = "~/.local/share/swift/{version}/bin/swift"
check = "swift-6.4-RELEASE"
install = '. /etc/os-release && case "$ID$VERSION_ID" in ubuntu24.04) sum=69f7b2b4dbce6090b6c92194b71149a057e16269093b5a9dded38afc4a05094e ;; ubuntu22.04) sum=bce85ea80f1471b85f39993f9285dbc798ec8e1eac5f677e24b2ac693856f9f8 ;; *) echo "no Swift {version} tarball is pinned for $ID $VERSION_ID" >&2; exit 1 ;; esac && d="ubuntu$VERSION_ID" && f="swift-{version}-RELEASE-$d.tar.gz" && curl -fsSL --retry 3 --retry-all-errors -o "$f" "https://download.swift.org/swift-{version}-release/${d//./}/swift-{version}-RELEASE/$f" && echo "$sum  $f" > "$f.sha256" && sha256sum -c --quiet "$f.sha256" && tar -xzf "$f" -C {prefix} --strip-components=1'
prefix_file = "usr/bin/swift"

# GenMC, the C11 memory-model checker `scripts/gates/genmc-queue.sh` runs, at the
# revision `scripts/install_genmc.sh` pins. That script stays the one place the
# build is written: provision copies it to the machine as `install_inputs` and
# runs it with GENMC_ROOT set to the store entry, so a change to the script
# rebuilds even at the same revision. `prefix_link` makes the whole install
# directory the store entry, because the gate reads `bin/genmc` and
# `include/genmc/runtime` under the same root. `check` is left to its default,
# the version itself: `genmc --version` prints `GenMC v0.19.0` (measured
# 2026-10-20 on the developer account's build). `needed_by` keeps it a
# requirement of the runs that name `genmc-queue` only, so a host without LLVM
# 19 still takes every other job of this repository. Until 2026-10-20 bx ran as
# an account that could not reach the only GenMC on a build machine, and a run
# through bx exited 127.
[platform.linux.tools.genmc]
version_file = "scripts/install_genmc.sh"
version_pattern = '^GENMC_REV="(v[0-9.]+)"'
path = "~/.local/genmc/{version}/bin/genmc"
prefix_link = "~/.local/genmc/{version}"
install = "GENMC_ROOT={prefix} bash scripts/install_genmc.sh"
install_inputs = ["scripts/install_genmc.sh"]
packages = ["g++-14", "clang-19", "llvm-19-dev", "cmake", "ninja-build", "libffi-dev", "zlib1g-dev", "libedit-dev"]
needed_by = ["genmc-queue"]

# THE EMSCRIPTEN SDK, at the release the hosted lanes install (`emsdk install 6.0.13` in
# w3c-tests.yml, cpp-suite.yml and deploy-visualizer.yml; the registry's self-test holds them to
# the script's pin). An update to main is judged here with every gate it reaches, `ci_only`
# included, and the four emscripten gates skip and pass on a machine without emsdk, so a landing
# judged there would count as passed what ran nothing. As a tool, bx installs it and runs those
# units only where it is (2026-11-08).
#
# `scripts/install_emsdk.sh` is the one place the install is written, as `install_genmc.sh` is
# GenMC's: provision copies it to the machine (`install_inputs`) and runs it with EMSDK_ROOT set to
# the store entry. `prefix_link` makes the whole SDK the store entry, because `emsdk_env.sh`, which
# the gates source (`sce_gate_activate_emsdk` in scripts/gates/lib.sh), finds the compiler, the
# LLVM it drives and the Node it runs on by their places beside it. `check` is left to its
# default, the release itself: `emcc --version` prints it after the compiler's name. `needed_by`
# names the four gates, so a host without the SDK still takes every other job of this repository;
# `visualizer-layout` is there because its unit runs `visualizer-wasm` first.
[platform.linux.tools.emsdk]
version_file = "scripts/install_emsdk.sh"
version_pattern = '^EMSDK_REV="([0-9.]+)"'
path = "~/.local/share/emsdk/{version}/upstream/emscripten/emcc"
prefix_link = "~/.local/share/emsdk/{version}"
install = "EMSDK_ROOT={prefix} bash scripts/install_emsdk.sh"
install_inputs = ["scripts/install_emsdk.sh"]
needed_by = ["w3c-wasm", "cpp-suite-wasm", "visualizer-wasm", "visualizer-layout"]

# THE MESH TRANSPORT SDKS (vsomeip3, zenohcxx and CycloneDDS with their C++ bindings), at the tags
# `scripts/install_mesh_transports.sh` pins, the script the hosted cpp-suite lane installs them
# with. `tests/CMakeLists.txt` registers the transport suites only where `find_package` finds the
# three, and `cpp-suite` refuses (exit 3, could not run) a tree that registered fewer: measured
# 2026-08-14 on a build machine, 49 mesh cases absent. An update to main is judged here with every
# gate it reaches, `ci_only` included, so a machine without the SDKs would send every item that
# reaches the engine back unmeasured (2026-11-08).
#
# The script installs into the prefix it is given and writes a stamp, `bin/sce-mesh-transports`,
# that prints its revision: none of the SDKs ships an executable that names the set, and bx tells
# a machine has a tool by running `path`. The version is the script's `MESH_TRANSPORTS_REV`, raised
# with any tag. `prefix_link` makes the whole prefix the store entry, because `find_package` reads
# the CMake package files under its `lib/cmake/`; `scripts/gates/lib.sh` puts the prefix on
# CMAKE_PREFIX_PATH and LD_LIBRARY_PATH where it finds it. zenoh-c is a cargo build, so the
# install's cargo cache is kept out of the home (`CARGO_HOME`), as the mnemosyne-cli install keeps
# its own. `packages` are Boost's development files, which vsomeip3 builds against (the hosted
# lane installs the same). `needed_by` names the gates that need the suites registered:
# `cpp-suite` (and with it `cpp-suite-wasm`, whose name contains it) and `mutation-rounds`, whose
# ctest casefiles run in the same tree.
[platform.linux.tools.mesh-transports]
version_file = "scripts/install_mesh_transports.sh"
version_pattern = '^MESH_TRANSPORTS_REV="([0-9]+)"'
path = "~/.local/share/sce-mesh-transports/{version}/bin/sce-mesh-transports"
check = "sce-mesh-transports {version}"
prefix_link = "~/.local/share/sce-mesh-transports/{version}"
install = "CARGO_HOME={scratch}/cargo bash scripts/install_mesh_transports.sh {prefix}"
install_inputs = ["scripts/install_mesh_transports.sh"]
packages = ["libboost-dev", "libboost-system-dev", "libboost-thread-dev", "libboost-filesystem-dev"]
needed_by = ["cpp-suite", "mutation-rounds"]

# THE TWO TOOLS `wasm32-scenarios` NEEDS BESIDE ITS RUST (2026-11-08). The gate builds the engine
# for wasm32, writes the module's JavaScript glue with wasm-bindgen, and replays every scenario in
# Node and in headless Chrome. An update to main is judged here with every gate it reaches, and no
# build machine carried either tool, so the gate could not have been measured. The wasm32 standard
# library is not a tool of its own: it is a target of the Rust release the plan names, declared with
# that release in `[platform.linux.tools.rust]` above, so a machine that has the release has it. The
# gate checks it and adds nothing, as no gate installs any part of a toolchain.
#
# wasm-bindgen at the version Cargo.lock holds: the tool refuses a module another version of the
# crate built. `scripts/install_wasm_bindgen.sh` carries the version in one line bx can read (it is
# not one line of Cargo.lock), and the registry's self-test holds it to Cargo.lock's. A cargo
# install, so its cache is kept out of the home (`CARGO_HOME`) and `prefix_file` names the binary,
# as mnemosyne-cli's install does. `check` is the default, the version: the tool prints
# `wasm-bindgen 0.2.117`.
[platform.linux.tools.wasm-bindgen]
version_file = "scripts/install_wasm_bindgen.sh"
version_pattern = '^WASM_BINDGEN_REV="([0-9.]+)"'
path = "~/.local/share/wasm-bindgen/{version}/bin/wasm-bindgen"
install = "CARGO_HOME={scratch}/cargo WASM_BINDGEN_ROOT={prefix} bash scripts/install_wasm_bindgen.sh"
install_inputs = ["scripts/install_wasm_bindgen.sh"]
prefix_file = "bin/wasm-bindgen"
needed_by = ["wasm32-scenarios"]

# Headless Chrome, pinned as a Chrome for Testing release (`scripts/install_chrome.sh`, which says
# why and how it is checked). `prefix_link` makes the unpacked archive the store entry, because the
# binary loads the files beside it. `check` is the default, the version: the binary prints
# `Google Chrome for Testing <version>`. Its shared libraries are system packages whose names
# differ between Ubuntu 22.04 and 24.04, so they are not this tool's `packages`: a machine without
# them fails the install's postcondition, gets no tool, and takes no unit of the gate. The script's
# header lists them for each release.
[platform.linux.tools.chrome]
version_file = "scripts/install_chrome.sh"
version_pattern = '^CHROME_REV="([0-9.]+)"'
path = "~/.local/share/chrome-for-testing/{version}/chrome-linux64/chrome"
prefix_link = "~/.local/share/chrome-for-testing/{version}"
install = "CHROME_ROOT={prefix} bash scripts/install_chrome.sh"
install_inputs = ["scripts/install_chrome.sh"]
needed_by = ["wasm32-scenarios"]

# THE PYTHON THE PYTHON SUITES RUN IN: a virtual environment holding the Python runtime's
# dependencies as `backends/python/runtime/pyproject.toml` pins them (`lupa>=2.0`), and pytest and
# the packages tools/authoring and tools/targets import. The runtime imports `lupa.lua54`, which
# lupa ships from 2.0 on, and the build machines' only lupa was the distribution's python3-lupa
# 1.14.1 (measured 2026-11-08 on one of them): under the system python3 every test that imports
# the runtime failed at collection, after a gate's precondition that asked only for `import lupa`
# had passed. A red that blamed the code for a property of the machine.
#
# `scripts/install_sce_python.sh` is the one place the build is written, as `install_genmc.sh`
# is GenMC's: provision copies it to the machine with pyproject.toml (`install_inputs`), so the
# pin is read from the runtime's own declaration and a changed pin is a new store entry. The
# version is the script's `SCE_PYTHON_REV`, and `path` carries it, because bx tells a machine
# has the tool by running `path`, not by comparing what built it: a change to what the
# environment holds raises the revision, or no machine that has the old one builds it again.
# `prefix_link` makes the whole venv the store entry, because a venv's python finds its packages
# through the `pyvenv.cfg` beside its `bin/`, which a link to the one file would not reach.
#
# `check` is all that `python --version` has to say: the venv's python is the machine's own
# python3, 3.10 on Ubuntu 22.04 and 3.12 on 24.04. What the environment holds is the gates'
# precondition to check (`sce_gate_python_requires_lupa` in scripts/gates/lib.sh), against the
# floor pyproject.toml pins. `python3-venv` is the package Debian and Ubuntu put `venv` in.
#
# `needed_by` names the three gates that run Python against the runtime: `w3c-python` (and with
# it `w3c-python-bindings`, whose name contains it), `authoring-core` and `targets`, whose
# statecharts run through the generated Python. ` targets` keeps its leading space so that
# `--all-targets` on a cargo line does not match it. `workspace-tests` joined on 2026-11-08: its
# suites start the Python runtime, the hosted lane installs lupa for them, and the gate puts this
# environment first on PATH where it is. `forge-python` is not here: the forge runtime's suites
# import nothing of the AOT runtime, and run on any python3.
[platform.linux.tools.sce-python]
version_file = "scripts/install_sce_python.sh"
version_pattern = '^SCE_PYTHON_REV="([0-9]+)"'
path = "~/.local/share/sce-python/{version}/bin/python"
check = "Python 3."
prefix_link = "~/.local/share/sce-python/{version}"
install = "SCE_PYTHON_ROOT={prefix} bash scripts/install_sce_python.sh"
install_inputs = ["scripts/install_sce_python.sh", "backends/python/runtime/pyproject.toml"]
packages = ["python3-venv"]
needed_by = ["w3c-python", "authoring-core", " targets", "workspace-tests"]

# The two named commands, each a table of its own: in platform tables a command
# is `[commands.<name>]` with `run`, and with one platform it runs there. Until
# 2026-11-04 they were `build = "..."` and `verify = "..."` lines of one
# `[commands]` table of the shorthand, with the same strings.
#
# `--features cli` is not optional here: `cargo test --workspace` silently
# skips every cli-gated target, so a workspace run without it reports green
# on the CLI surface it never compiled.
#
# `-DCMAKE_BUILD_TYPE=RelWithDebInfo` is not a preference either: three gates
# read the cache and refuse a tree configured any other way, because a
# differently configured binary is not the one CI judges. A remote tree
# configured without it produces a build the local gates then reject.
#
# The generator is built first because CMake *configure* looks for it —
# `cmake/SCEFindCodegen.cmake` fails the configure outright when it is
# absent, so the obvious order (configure, then build everything) does not
# reach a single compile on a cold tree.
#
# The Kotlin forge-runtime jar is built last and for the same class of reason
# as `kotlinc` in `needs`: every forge Kotlin gate puts it on `kotlinc -cp`
# and skips-with-warn without it, so a provisioned host that lacks it reports
# green over checks that never ran. It is gitignored, so `send` never carries
# it — a remote tree has one only if something built it there. Measured
# 2026-09-11: a build machine had a jar at all only because an earlier run
# in that session happened to route a `jvmJar` to it, which is a property of
# that history and not of the host.
#
# Gradle is called through `scripts/gradlew-on-ci-jdk.sh`, not directly: a bare
# `./gradlew` runs on the machine's default JDK, and Gradle 8.11.1 with this
# repository's Kotlin plugin dies on JDK 25 (`* What went wrong: 25.0.4`,
# measured 2026-09-30 on a build machine whose default `java` was 25.0.4). The script
# picks the JDK the Kotlin gates pick, from the version CI installs.
[commands.build]
run = "cargo build --bin sce-codegen --features cli -p sce-build && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build && cargo test --workspace --features cli --no-run && scripts/gradlew-on-ci-jdk.sh :sce-forge-runtime-kotlin:jvmJar --console=plain"

# The echo server is started here rather than assumed: a bare workspace run
# reports failures that look like backend defects and are not.
#
# The order is not cosmetic. The C++ suite brings up its OWN listener on
# 8080, so a server started before ctest makes that bind fail; the Rust
# workspace has no such fixture and needs one already listening. So: ctest
# with the port free, then the server, then cargo. Both statuses are OR'd so
# a red ctest cannot be hidden by a green cargo run.
[commands.verify]
run = "ctest --test-dir build --output-on-failure; c=$?; node tests/w3c/standalone_http_server.js 8080 /test & srv=$!; sleep 1; cargo test --workspace --features cli --no-fail-fast; r=$?; kill $srv 2>/dev/null; exit $(( c | r ))"

# THE REGENERATION OF THE COMMITTED GENERATED TREES, AS ONE ACTION PER STEP (2026-11-07). A step
# writes into the tree; declared as an action it runs on a build machine and only the files it
# rewrote come back. `scripts/regen_all_committed_trees.sh` is made of steps, listed once in
# scripts/lib/sce_generated_tree.sh (`sce_regen_steps`), and each step is an action below,
# `regen-<step>`, whose `run` is the script given that step. The script given no step runs them
# all in order on one machine, which is how a person runs it and how `regen-reproduces` judges it.
#
# REGENERATE EVERYTHING: `bx --actions`. It runs every action this file declares as the units of
# one set, spread over the build machines, and writes their results only when every one of them is
# good (bx RFC 0004, section 12). Every action here is a step of the regeneration, which is what
# lets the bare `bx --actions` mean "regenerate everything"; a declared action that is not one would
# have to come with the list instead (`bx --actions -- regen-rust-tests regen-kotlin-tests ...`).
# One step alone: `bx --action regen-<step>`, e.g. `bx --action regen-embed-manifest` after a public
# header edit. Measured for the single action this replaced: 341 s on a build machine with nothing
# left to change, 956-1971 s with changes, against 40-60 min on this machine under load.
#
# NO `regen` ACTION GROUPS THE OTHERS, although bx has the form (`deps` and no `run`, RFC 0029
# section 4.8). bx runs a group as ONE chain: every part after the one before, in one copy on one
# machine, and the result of a chain is never kept (crates/bx-fleet/src/action.rs `spec`,
# fanout_actions.rs `plan`). Declared, it would also make `bx --actions` run the group alone, since
# every part is in its chain. A group would give back the one serial, uncached run this split ends.
#
# Until 2026-11-07 this was one action, the whole script, because bx refused an action reading what
# another writes and had no way to order actions (RFC 0003 section 6). It has one now: an action
# whose `inputs` can meet another's `outputs` runs after it, in the same chain (RFC 0029 section 4.8).
# The steps below are kept apart instead, so that no action is in another's chain, since a chain
# runs on one machine and is not cached. `a_regeneration_removes_what_it_no_longer_writes` holds the
# inputs of each action to the outputs of every other.
#
# WHAT IS ONE STEP, AND WHY. A step owns trees, and its parts are one step where a real
# read-after-write or a shared tree joins them:
#   - regen-rust-tests: the W3C, integration and nine per-document Rust trees all write into
#     backends/rust/tests, and its last stage, `cargo fmt -p sce-rust-tests`, reads and rewrites
#     every file the others write. The integration stems are a directory each under src/integration,
#     found at run time, so no output can be declared for each.
#   - regen-kotlin-tests: the static datamodel writes its algorithms as packages under
#     com/sce/generated, the W3C tree, and its machines under com/sce/integration, the integration one.
#   - regen-go-integration, regen-python-integration, regen-swift-tests: the integration fan-out and
#     the per-document scripts write a directory each into one tree. The W3C Go and Python trees are
#     directories of their own, and steps of their own.
#   - The native-action and host-processor scripts each wrote the Rust, Go and Kotlin trees of one
#     document, and belonged to no step. They are split by language (scripts/regen_native_action_go.sh,
#     regen_native_action_kotlin.sh, regen_host_processor_go.sh), each run by its language's step.
#   Every other step owns one tree alone: the Kotlin method-size module, the forge round-trip Go tree,
#   each Mesh tree, the specs machines, the forge goldens and the embed manifest.
#
# WHAT LOOKS LIKE A READ-AFTER-WRITE AND IS NOT ONE:
#   - The forge goldens (`UPDATE_GOLDEN=1 cargo test --test forge_conformance`) compile against the
#     hand-written runtimes. Of the Go forge runtime they import packages, never round_trip/generated,
#     which regen-go-round-trip writes; their inputs name the runtime's Go files (`*/*.go`), which no
#     output of that step can be.
#   - sce-codegen compiles in hand-written files that sit inside the language test trees
#     (sce-build/src/w3c_suite.rs: the Rust harness, the Go harness and go.sum, the Python conftest,
#     three Kotlin W3C base classes). Every action that builds the generator reads them, so a language
#     step declares as outputs only the generated parts of its trees (src/generated, src/integration,
#     `test_*.rs`, `Test*.kt`, ...), never the files beside them: one output over a whole tree would
#     put every other action in that step's chain.
#   - The embed manifest reads sce/src, beside sce/src/mesh/generated (regen-mesh-cpp). Its inputs
#     name the source directories one by one, the mesh one left out, for that reason alone.
#   - integration_resources was an output of the single action and is none now: the generator writes
#     nothing beside a document it reads, and `regen-reproduces` fails on any untracked file a run leaves.
#
# INPUTS are directories wherever that is honest, so that a new fixture in a directory a step reads
# is never outside them. The first block of each action that runs the generator is the generator:
# the workspace manifests cargo reads, sce-build, and every file it compiles in or reads at run time
# (the templates, the standard library, the schemas, the files named above). Files are named one by
# one only where their directory also holds another step's outputs. A traced run of each action
# (`bx-fleet action learn regen-<step>`) has not yet checked them.
#
# A REMOVAL is a change like a write. Each step sets aside the generated files of its own trees and
# settles them when it ends (scripts/lib/sce_generated_tree.sh); the far side's git reports a file
# the step no longer writes as deleted, and the bundle carries it with no content: applied here, the
# file is deleted when it still holds what HEAD held. So every generated file of a step's trees has
# to be inside that step's outputs, or the removal refuses the whole result;
# `a_regeneration_removes_what_it_no_longer_writes` holds the two lists together.
#
# NO `cache = true` YET, on any of them. A cached action runs isolated, twice and traced (RFC 0003
# section 9), and a traced run of regen-forge-goldens, which builds and runs C11 drivers under
# AddressSanitizer, fails until bx's trace turns leak detection off (the `trace-sanitizers` branch,
# RFC 0003 section 9a): measured 2026-11-07, five of 1299 such runs failed only for being traced.
# Turn it on per action once that bx is installed and `bx-fleet action learn` agrees with the inputs
# below. Two actions need more first, because a cached action may not read what it writes and its
# outputs are replaced whole: regen-rust-tests reads the crate it writes into (the format pass), and
# a directory output that also holds hand-written files (src/integration/mod.rs, the Go `*_test.go`
# beside the machines) has to name the generated files instead.
[actions.regen-rust-tests]
run = 'scripts/regen_all_committed_trees.sh rust-tests'
inputs = [
    ".cargo/**",
    "Cargo.toml",
    "Cargo.lock",
    "backends/rust/*/Cargo.toml",
    "sce-build-wasm/Cargo.toml",
    "sce-revision/Cargo.toml",
    "sce-specs/Cargo.toml",
    "sce-ttcn3-validator/Cargo.toml",
    "sce-build/**",
    "tools/codegen/**",
    "stdlib/**",
    "schemas/**",
    "apis/**",
    "kind-examples/**",
    "docs/SCE_ACCEPTED_SUBSET.md",
    "SCE_ERROR_CONTRACT.md",
    "SCE_MESH.md",
    "sce/include/**",
    "backends/c/forge-runtime/include/**",
    "backends/rust/runtime/**",
    "backends/python/runtime/**",
    "backends/rust/tests/src/harness.rs",
    "backends/go/tests/harness/**",
    "backends/go/tests/go.sum",
    "backends/python/tests/conftest.py",
    "backends/kotlin/tests/src/test/kotlin/com/sce/w3c/VirtualDrive.kt",
    "backends/kotlin/tests/src/test/kotlin/com/sce/w3c/W3CHttpTestBase.kt",
    "backends/kotlin/tests/src/test/kotlin/com/sce/w3c/W3CTestBase.kt",
