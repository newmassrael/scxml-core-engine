#
# The footprint probe's machine of a document with neither a `<history>` nor a
# `<parallel>` (sce-build/tests/fixtures/no_std/plain_footprint_probe.scxml),
# linked with the probe's `plain-documents` feature (docs/adr/0066). Its source
# is generated by `scripts/gates/nostd-mcu.sh` and never committed, as the
# queue-size probe's machine is.

[package]
name = "sce-nostd-plain-machine"
version = "0.0.0"
edition = "2021"
publish = false
description = "Generated no_std machine without history or parallel, weighed by the footprint probe"
license = "AGPL-3.0-only WITH LicenseRef-SCE-Linking-Exception OR LicenseRef-SCE-Commercial"

[lib]
name = "sce_nostd_plain_machine"
path = "src/plain_footprint_probe_sm.rs"

[dependencies]
sce-rust-runtime = { path = "../../../runtime", default-features = false }
