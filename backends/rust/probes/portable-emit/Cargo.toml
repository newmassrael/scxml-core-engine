#
# SCE Protocol-Synthesis RFC §5.J.2: single-emit portability. ONE `--no-std`
# generated machine that must compile against BOTH runtime profiles:
#
#   - the std runtime (the AP profile, host target), and
#   - the bare-metal runtime, without its `std` feature (the MCU profile,
#     thumb target).
#
# Both builds are made through `../feature-unification`, whose bare-metal crate
# depends on this one: its host `cargo check --workspace` compiles this machine
# inside the `std` profile the application crate beside it turns on, and its
# thumb build compiles it alone (docs/adr/0053). This crate asks the runtime
# for no features, as a bare-metal crate does.
#
# The runtime owns the std-vs-heapless collection choice through profile-
# resolving aliases (`SceBytes` / `SceString` / `StateChain`), so the emission
# names only those aliases and never a profile-gated type directly. Before that alias
# layer existed, a `--no-std` emit's `bytes` field / transition buffers / dedup
# set referenced `sce_rust_runtime::heapless::*` (a no_std-only re-export) and
# failed `E0433: cannot find heapless in sce_rust_runtime` against the std
# runtime. The host build is the regression gate for that bug; the thumb build
# proves the same emission stays allocator-free.
#
# The `[lib] path` points at a generated `--no-std` machine combining a typed
# bytes/string payload (SceBytes / SceString) with nested parallel regions
# (a StateChain active set), so one crate exercises every profile-resolving
# alias an emission names. The generated `src/*_sm.rs` is
# git-ignored and produced fresh by the gate (CI + local — see README.md), so
# it can never drift stale against the templates.
#
# Detached from the parent workspace (own empty `[workspace]` table): its `src`
# exists only after the gate's generation step, so as a member it would fail
# every workspace build.

[package]
name = "sce-portable-emit-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "single-emit portability gate: one --no-std machine on both runtime profiles (SCE Protocol-Synthesis RFC §5.J.2)"
license = "AGPL-3.0-only WITH LicenseRef-SCE-Linking-Exception OR LicenseRef-SCE-Commercial"

[lib]
name = "sce_portable_emit_probe"
path = "src/portable_probe_sm.rs"

[dependencies]
# No features: the bare-metal profile. Which profile a build compiles is decided
# by the build that holds this crate, as it is for a downstream bare-metal crate.
sce-rust-runtime = { path = "../../runtime", default-features = false }

[workspace]
