#
# One workspace that holds a bare-metal crate and an application crate, as a
# downstream workspace does (docs/adr/0053).
#
# Cargo builds ONE copy of `sce-rust-runtime` for every package of one build,
# with the union of the features they ask for. `mcu` asks for none (the
# bare-metal profile); `ap` asks for the defaults (`std`, `http-send`). Before
# the runtime's features were additive, the runtime refused `no_std` beside
# `http-send` with `compile_error!`, so a `cargo check --workspace` here
# stopped at the runtime although each crate built alone.
#
# The gate (`scripts/gates/nostd-mcu.sh`) asks two things of it:
#
#   1. `cargo check --workspace` on the host: the union is the `std` profile,
#      and the bare-metal crate, written against the names its profile
#      declares, still compiles inside it. `ap` holds an item that compiles
#      only where `SceString` is `String` and the HTTP processor exists, so a
#      union that fell to the bare-metal profile fails here too.
#   2. `cargo build -p sce-feature-unification-mcu --target
#      thumbv7em-none-eabihf`: one command that selects the bare-metal crate
#      alone gets the bare-metal profile, because Cargo unifies features only
#      across the packages one command builds. The thumb target has no `std`,
#      so a feature of `ap` that leaked into this build is a hard error.
#
# Detached from the parent workspace (its own `[workspace]` table) because it
# IS a workspace, and because the generated machine `mcu` holds exists only
# after the gate's generation step.

[workspace]
resolver = "2"
members = ["mcu", "ap"]
