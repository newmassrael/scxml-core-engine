#
# The application crate of the feature-unification probe, with the manifest a
# downstream application crate writes. See ../Cargo.toml.

[package]
name = "sce-feature-unification-ap"
version = "0.0.0"
edition = "2021"
publish = false
description = "Application half of the feature-unification probe: the runtime's default std profile beside a bare-metal crate"
license = "AGPL-3.0-only WITH LicenseRef-SCE-Linking-Exception OR LicenseRef-SCE-Commercial"

[lib]
path = "src/lib.rs"

[dependencies]
# What an application crate asks of the runtime: its defaults, `std` and
# `http-send`.
sce-rust-runtime = { path = "../../../runtime" }
