[package]
name = "sce-rust-trust"
version.workspace = true
edition.workspace = true
rust-version = "1.87"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "What a host of a shared list keeps that its machines cannot: who may write it, by signatures it checks on what arrives and writes on what leaves"
publish = false

# A machine of the statically typed data model reads the payload of an event and no other
# member of `_event`, so it cannot tell who sent an event or check a signature; and a copy of
# a shared list that is run by someone other than the people who use it must not be able to
# put a write in a member's name. The host of each copy is where that is kept: this crate is
# the rule a host puts in front of its machine (`sce_rust_mesh::endpoint::Admission`) and
# behind it (`Sealer`), with the signing of a write, the certificate by which an administrator
# makes a person a member, and the table of what each member's key may do.
#
# The documents do not change: the signature is written into an event as it leaves a host and
# taken out of it as it arrives at the next, so no machine holds one.

[dependencies]
sce-rust-mesh = { path = "../mesh" }
# A person's key zeroes its seed when it is dropped (`zeroize`), as the keys of the epochs are.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
# What keeps the content of a write from the hub: an authenticated cipher with a nonce long
# enough to be derived from the write's stamp, a key agreement that a member's signing key
# takes part in (so that a person has one key, not two), and the hash that turns the shared
# secret into a key.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
sha2 = { version = "0.10", default-features = false }
# A key of a new epoch is drawn here from the operating system's source of randomness, and not
# handed in by a host: the one place a key can be made weak is the one place this crate owns.
getrandom = "0.2"
# A key the list had destroyed is zeroed in memory, not only forgotten.
zeroize = "1"
# What a passphrase is made into a key by, in a copy of a device's secrets: memory-hard, so that a
# guess costs memory as well as time.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
# What a device's whole state is sealed with under a key its host's platform key store wraps
# (`backup::seal_state`): the cipher's key and the key the nonce is made with are two keys drawn from
# the one the host wraps (HKDF-Expand), and the nonce is a keyed hash (HMAC-SHA-256) of what is
# sealed, so that a key used twice by a host gives away nothing but that two states were the same.
hkdf = "0.12"
hmac = "0.12"
serde_json = "1"
