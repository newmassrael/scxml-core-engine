[package]
name = "sce-link-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SCE Link trait surface for byte-stream link endpoints (watching-zenoh RFC §5.C). SCE owns the trait + StubLink test impl; per-OS impls (lwIP / tokio / QNX) live downstream in watching-zenoh as separate crates."

[lib]
name = "sce_link_runtime"
path = "src/lib.rs"

[features]
# Default to `std` so consumers (and the SCE-side ctest of generated
# code) get `StubLink` for free. `no_std` impls (lwIP, bare-metal QNX)
# disable the default feature.
default = ["std"]
# When enabled, compiles the heap-backed `StubLink` test impl.
std = []

[lints]
workspace = true
