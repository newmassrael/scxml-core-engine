[package]
name = "sce-forge-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Header-only-equivalent algorithm and HAL library for SCE Forge generated code (filter, interpolation, timer, observer kinds). See SCE_FORGE.md Section 2.1."
# No build script, deliberately: one runs for every consumer of the crate, and
# the conformance fixtures this crate's tests used to generate at build time
# are generated by `sce-forge-conformance`, the crate those tests moved to.

[lib]
name = "sce_forge_runtime"
path = "src/lib.rs"

[features]
# The crate's baseline contract is pure `no_std + no alloc`: only the
# allocator-free algorithm modules (filter, interpolation, lookup, observer,
# timer) are compiled by default. This keeps the default target audience —
# embedded ECUs without a heap — honest.
default = []
# Compile the procedure module (ProcedurePolicy, ProcedureServiceRequest,
# ProcedureRunResult, run_procedure). Requires a heap allocator because
# procedures carry owned strings, byte payloads, and a BTreeMap of donedata.
# Consumers running on std or no_std+alloc targets opt in explicitly. Also
# selects the unbounded `Vec<u8>` form of the shared `SceBytes` (the codec
# `{Codec}Owned` byte fields); without it `SceBytes` is the fixed
# `heapless::Vec<u8, N>`.
alloc = ["sce-portable-bytes/alloc"]

[dependencies]
# Bounded inline list storage for codec repeat / tlv-chain fields
# (RFC §5.B B2/B3). `heapless::Vec<T, N>` is `#![no_std]` and needs no
# heap, so generated codecs reach the pure no_std no-alloc MCU tier; the
# Rust mirror of the C11 backend's `T elems[MAX]; size_t elems_len;`
# fixed-buffer representation. Re-exported (`pub use heapless;`) so codec
# output references `sce_forge_runtime::heapless::Vec` and consumers keep
# a single dependency edge with one pinned heapless version.
heapless.workspace = true
# Single definition of the portable owned `bytes` storage (`SceBytes<N>`),
# shared with the statechart-emit runtime so the construction logic never
# drifts. Re-exported as `sce_forge_runtime::codec::SceBytes`.
sce-portable-bytes = { path = "../portable-bytes", default-features = false }

# The `queue` module's memory-model checker (SCE Protocol-Synthesis RFC
# §synth-5-P, verification layer 3). Present only when the crate is compiled
# with `--cfg loom`, which swaps the module's atomics and cells for loom's
# instrumented ones; no ordinary build, and no consumer, ever links it.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

# The loom models. `test = false` keeps them out of `cargo test`,
# `--all-targets` and every lane that does not ask for them by name, because
# outside `--cfg loom` they are a compile error rather than an empty pass:
#
#   cargo test --release -p sce-forge-runtime --target-dir target/loom \
#       --config 'build.rustflags=["--cfg","loom"]' --test loom_queue_spsc
#
# `scripts/gates/forge-rust.sh` runs exactly that, once per model file.
[[test]]
name = "loom_queue_spsc"
path = "tests/loom_queue_spsc.rs"
test = false

[[test]]
name = "loom_queue_scq"
path = "tests/loom_queue_scq.rs"
test = false

[lints]
workspace = true
