[package]
name = "sce-rust-mesh"
version.workspace = true
edition.workspace = true
# With its default features. The `wss` feature's dependencies need 1.88
# (measured 2026-10-20 with every feature on).
rust-version = "1.87"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SCE Mesh for Rust hosts: the standard envelope and delivery rules generated from sce:std/mesh, and the router core that applies them."
publish = false

[lib]
path = "src/lib.rs"

# A server machine on the WebSocket binding for another language's client to
# talk to (backends/kotlin/mesh's cross-language loopback test runs it).
[[example]]
name = "wss_peer"
required-features = ["wss"]

# What the core does under the load of a shared-list server (many devices that come and go, a
# write that must reach the others, a machine that holds them all): `cargo run --release
# --features wss --example mesh_probe -- bench`.
[[example]]
name = "mesh_probe"
required-features = ["wss"]

# What a Mesh envelope costs to cross a Zenoh network, through whatever routers lie between a device
# and the server: `cargo run --release --features zenoh --example zenoh_probe -- server|client ...`.
[[example]]
name = "zenoh_probe"
required-features = ["zenoh"]

[features]
# The generated modules gate their heap-backed facades (`encode_to_vec`, the
# growable sink) on the feature of the crate that holds them, spelled
# `alloc`. This crate cannot work without them — the router core keeps a
# map of held envelopes — so the feature is on by default, and turning it
# off is refused in src/lib.rs rather than left to fail inside a module.
default = ["alloc"]
alloc = ["sce-forge-runtime/alloc", "sce-portable-bytes/alloc"]
# The WebSocket binding (SCE_MESH.md §mesh-18): a server that accepts and a
# client that dials, moving bytes and readiness between a socket and the
# core. Off by default: the core is transport-free, and a host that brings
# its own transport should not link an async runtime for it.
wss = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "tls"]
# The TLS the WebSocket bindings run on (`tls`): rustls with `ring`'s cryptography, passed to it
# explicitly, and the public certificate authorities or a deployment's own. The relay's binding
# takes it from here too, so that both decide it in one place.
tls = ["dep:rustls", "dep:webpki-roots"]
# The Zenoh binding (SCE_MESH.md §mesh-20): a client session on a Zenoh network, moving bytes and
# readiness between it and the core. Off by default for the reason `wss` is. The session is
# upstream's `zenoh` crate, so this binding talks to any router of that protocol version
# (§mesh-20.4): upstream's zenohd, or another router a deployment chooses.
zenoh = ["dep:zenoh"]
# The behaviour tests every client of the Zenoh binding is held to (SCE_MESH.md section 20.4): the
# binding takes its client through the `ZenohClient` trait, and `conformance` is the kit a client
# is run through, as functions over a `Harness` that connects one client per machine. Off by
# default and dependency-free: it is compiled for a client's own test target, in this repository
# or in the one that implements another client, and not for a host.
conformance = []

[dependencies]
sce-forge-runtime = { path = "../forge-runtime", default-features = false }
sce-portable-bytes = { path = "../portable-bytes", default-features = false }
# The engine's host-processor surface: a `<send target="#peer">` reaches the
# router as the runtime's `HostSendRequest`, so the router reads the one
# shape every generated send site fills rather than a second copy of it.
# `std`, where that surface lives, and without `http-send`, which is the
# runtime's own transport and not Mesh's.
sce-rust-runtime = { path = "../runtime", default-features = false, features = ["std"] }
# The `wss` feature's socket plumbing (SCE_MESH.md §mesh-18.4): the client
# and server the owner chose for this binding on 2026-09-25. rustls with
# webpki roots, so a `wss://` client needs no system TLS library.
tokio = { version = "1", optional = true, default-features = false, features = ["net", "rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }
# The `tls` feature: rustls with `ring` and no other provider (owner decision 2026-11-02), so no
# `aws-lc-rs` is built, and Mozilla's certificate authorities for a client that dials a public host.
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = { version = "1", optional = true }
# The `zenoh` feature's session. Pinned to the protocol version the binding names (§mesh-20.4), so
# a client of this binding and a router of that version speak one protocol. TCP only: the binding's links are a client's dial to a router, and QUIC, TLS and
# compression are a deployment's choice to add.
zenoh = { version = "=1.10.1", optional = true, default-features = false, features = ["transport_tcp"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros"] }
# A certificate made at test time, and a TLS server that presents it, for the `wss://` tests.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26", default-features = false }
