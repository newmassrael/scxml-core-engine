[package]
name = "sce-rust-relay-server"
version.workspace = true
edition.workspace = true
# The relay it runs (`sce-rust-relay`, through `sce-rust-trust`) declares 1.87.
rust-version = "1.87"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The relay of a shared list as a server process: one configuration file, a durable store, TLS or a proxy in front, a key made and kept on disk, and a stop that finishes what it began"
publish = false

# The program a relay is deployed as (`docs/SCE_RELAY_DEPLOY.md`). It is a crate of its own rather
# than a binary of `sce-rust-relay`, so that what a process needs and a library does not (a
# configuration parser, the command line, signals, PEM files, the service manager's readiness
# message) is not in the graph of the library a phone links through the peer core's C ABI.

[[bin]]
name = "sce-relay"
path = "src/main.rs"

[dependencies]
# The relay, its server with TLS (`serve`), and its file store.
sce-rust-relay = { path = "../relay", features = ["serve"] }
tokio = { version = "1", default-features = false, features = ["net", "rt", "rt-multi-thread", "signal", "sync", "time", "macros"] }
# The sink of the relay library's records (`logline::Log::install`), which writes each as a line.
log = { workspace = true, features = ["kv"] }
# The configuration file, read as a document so that a key nobody reads is refused by name.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
# A certificate chain and a private key from the PEM files a certificate authority hands out.
rustls-pki-types = "1"
clap = { version = "4", features = ["derive"] }
# The probe (`sce-relay probe`): a device's dial taken one stage at a time (the connection, TLS on
# the configuration `sce_rust_relay::tls` makes, the upgrade), so that a failure says which stage
# failed. The versions the relay's own binding runs on.
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The probe list's first entry, which the probe gives a relay and reads back; the tests give a
# running relay a list's first entry too.
sce-rust-trust = { path = "../trust" }

[dev-dependencies]
# A certificate made at test time, which a relay the probe tests reach over `wss://` presents.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }

[lints]
workspace = true
