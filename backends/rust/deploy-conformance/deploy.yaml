version: "1.0"
topology:
  host:
    machines:
      own_thread_node:
        source: own_thread_node.scxml
        scheduler:
          kind: tokio
          session_runtime:
            drive: own-thread
      pool_node:
        source: pool_node.scxml
        scheduler:
          kind: tokio
          session_runtime:
            drive: worker-pool
            worker_threads: 3
            rx_busy_poll_us: 10
