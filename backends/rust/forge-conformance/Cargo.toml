[package]
name = "sce-forge-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust half of the SCE Forge conformance suite: generated forge fixtures compiled and run against sce-forge-runtime. Holds tests only."
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[features]
# The runtime's heap tier, which every test here needs: the generated
# fixtures reach `encode_to_vec` and the owned mirrors, and the numerical
# catalog holds procedure fixtures that need the runtime's procedure module.
# Off by default so a workspace build compiles these targets the way it did
# while they lived in the runtime — `cargo test -p sce-forge-conformance
# --features alloc` runs them, and so does the forge-rust gate.
alloc = ["sce-forge-runtime/alloc", "sce-portable-bytes/alloc"]

[dependencies]
sce-forge-runtime = { path = "../forge-runtime", default-features = false }
# A generated `bytes`-returning algorithm imports `SceBytes` from the shared
# leaf crate by its own name, so the crate compiling it must name it too.
sce-portable-bytes = { path = "../portable-bytes", default-features = false }

# The generator runs here at build time, in-process, to write the fixtures and
# the harness into OUT_DIR. See build.rs.
[build-dependencies]
sce-build = { path = "../../../sce-build" }

[dev-dependencies]
# `float_roundtrip` makes a JSON real parse to the nearest double. serde_json's
# default parser is faster but can land one unit in the last place away, which
# turns the multiplier 0.9999999999999999 of a `retry_next_backoff` case into
# 1.0 — a case that must fail `precondition` then yields a value, on this
# harness alone (measured 2026-09-30: Python, Go, Kotlin and C++ parse it
# correctly). The reference file holds reals written with 16 and 17 digits.
serde_json = { version = "1", features = ["float_roundtrip"] }

[[test]]
name = "numerical_conformance"
path = "tests/numerical_conformance.rs"
# The catalog includes procedure fixtures, which need the runtime's procedure
# module and therefore `alloc`; without it they cannot compile, so the target
# is left out rather than built broken.
required-features = ["alloc"]

[lints]
workspace = true
