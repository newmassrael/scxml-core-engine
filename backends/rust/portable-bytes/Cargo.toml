[package]
name = "sce-portable-bytes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Profile-portable owned bytes and scalar-list storage (SceBytes<N>, SceOwnedList<T, N>) shared by the codec, statechart-emit and algorithm runtimes: unbounded Vec<T> under the `alloc` feature, fixed heapless::Vec<T, N> without it. One definition so the construction logic never drifts between the consumers."

[lib]
name = "sce_portable_bytes"
path = "src/lib.rs"

[features]
# Baseline is pure `no_std` + no allocator (the MCU tier): SceBytes is the
# fixed-capacity `heapless::Vec<u8, N>`. Consumers on std / no_std+alloc opt
# into `alloc` to get the unbounded `Vec<u8>` form.
default = []
alloc = []

[dependencies]
# Fixed-capacity inline storage for the no-alloc form. Workspace-pinned so
# every SCE crate links one heapless version.
heapless.workspace = true

[lints]
workspace = true
