[package]
name = "sce-rust-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SCXML Core Engine — Rust runtime (policy trait, Engine<P>, helpers, IScriptEngine)"

[features]
# Engine DI Parity RFC (Path B+): the pre-cleanup `script-engine-lua` /
# `script-engine-quickjs` Cargo feature pair selected a process-global
# `ScriptEngineProvider` singleton at compile time. With per-instance
# engine injection that mechanism is gone — consumers pick an engine
# crate (`sce-rust-lua`, future `sce-rust-quickjs`) by depending on it
# and constructing an instance.
#
# A feature here ADDS (docs/adr/0053). Cargo builds one copy of this crate for
# every package of one build that depends on it, with the union of the
# features they ask for, so a feature that took something away, or refused
# another one, broke the build of a workspace that holds a bare-metal crate
# beside an application crate: each built alone, and `cargo check --workspace`
# stopped at this crate. No feature here removes a name or refuses another
# feature, and `default` is what a consumer who writes nothing gets.
default = ["std", "http-send", "macrostep-diagnostics", "log"]

# The application profile: the crate links `std`, holds its owned strings and
# lists in `String` and `Vec`, and carries what needs an allocator or an
# operating system (the script engine seam, invoke, host processors, saved
# state, the session id drawn from the system's randomness; the BasicHTTP
# processor is `http-send` below, which asks for this). Without it the crate is
# `#![no_std]` with no allocator, the
# bare-metal MCU profile (SCE Protocol-Synthesis RFC §5.J.2): the same names
# resolve to `heapless` storage of fixed capacity, and what needs `std` is
# absent. Asking for `std` never removes a name the bare-metal profile has, so
# code written against that profile compiles in a build where another crate
# turned `std` on (`backends/rust/probes/feature-unification` holds both).
#
# A bare-metal crate asks for nothing: `default-features = false`. Its image is
# built for its own target by a command that selects it alone, and Cargo
# unifies features only across the packages one command builds.
std = ["sce-portable-bytes/alloc", "bounded-inbox"]

# The bare-metal profile's inbox (docs/adr/0084): `BoundedInbox`, which a
# deployment declares in a `static`, and `Engine::attach_inbox`, which hands
# it to an engine. With it, an engine keeps a field for the attached inbox and
# drains it at each macrostep boundary and before each external enqueue.
# Without it and without `std`, there is no inbox, so the engine keeps no such
# field and makes no drain: a program of machines that no other thread or
# interrupt handler posts to carries none of that code, in each machine's
# enqueue and in the main loop every machine shares (a downstream consumer
# measured the runtime's share of its release library, 2026-11).
#
# It only adds (docs/adr/0053), and `std` asks for it, so the `std` profile
# has the inbox as it always had, and a bare-metal crate that attaches one
# names this feature and still compiles in a build that unifies `std` in.
bounded-inbox = []

# The point a test preempts a post to a `BoundedInbox` at
# (`preempt_next_post`): between the write of its input into the slot it
# holds and the step that publishes it, where an interrupt handler, or the
# owner on the poster's core, may stop a post (docs/adr/0147, D5). The tests
# that hold the owner's take to never waiting for such a post, and the history
# of such a run to the promise, run what the preemption runs there on the
# poster's own thread.
#
# Never on a release path: no default asks for it, and a test crate names it.
# It only adds (docs/adr/0053): without it a post has no such point, and with it
# and nothing set each post reads one thread-local slot. It runs a boxed
# closure on a thread, so it asks for `std`.
inbox-preemption = ["std", "bounded-inbox"]

# The BasicHTTP event processor (W3C SCXML C.2): the `http` module
# (`HttpSendRequest`, `HttpSendResponse`) and `Engine::set_http_send_callback`.
# It needs the `std` profile, so asking for it asks for `std`. A `std` build
# without it has no HTTP processor: `helpers::send::is_supported_send_type`
# does not count the BasicHTTP type, and a BasicHTTP `<send>` is refused with
# `error.execution` where any type the platform does not support is (W3C SCXML
# 6.2), before its payload is read and with nothing posted
# (docs/adr/0053, amendment of 2026-10-21). A crate that sends over HTTP names
# this feature, or takes the defaults.
http-send = ["std"]

# Deterministic fake-clock scheduler for tests (swaps PullScheduler impl)
test-clock = []

# The runtime's own diagnostics through the `log` facade: the `sce_log_debug!`
# family writes each record under the target `sce`, and the crate re-exports
# `log` as `sce_rust_runtime::log`, the path those macros expand to.
#
# Without it the crate does not depend on `log` at all, and each `sce_log_*!`
# expands to code that type-checks its arguments and never runs, so an image
# that is to carry no diagnostic output links none of the facade's globals (the
# logger, its state and the level filter). A downstream bare-metal consumer
# found nine of those symbols in its release library, linked from a runtime it
# installs no logger for (2026-11).
#
# It is in `default`, so a consumer who writes nothing keeps every record it
# had. A crate that writes `default-features = false` and installs a logger
# names it: in this repository `sce-rust-tests` (its tests' `env_logger`),
# `sce-rust-peer-capi` and `sce-rust-relay-server` (the sinks they install).
# It only adds (docs/adr/0053, amendment of 2026-11-25): a crate that names
# `sce_rust_runtime::log` asks for it, and still compiles in a build where
# another crate asked for nothing.
log = ["dep:log"]

# §scxml-3.13: the macrostep ceiling REPORTS itself, and this feature is the
# report — never the ceiling.
#
# The two are not the same thing and the distinction is the whole design. A
# macrostep that cannot end is a document the specification permits, so this
# engine's refusal to walk one forever is a departure it must not make
# silently: `truncated_macrosteps`, `last_truncated_macrostep_state`,
# `truncated_event_chains`, `last_truncated_event` and the error log are how a
# host learns the configuration it is reading is not a stable one. The BOUND —
# the budget, and the flag that stops the same chain being handed a second
# one — is not behind this feature and is in every build. A policy that could
# opt out of terminating is not a policy this engine offers.
#
# It is in `default`, so a consumer who writes nothing keeps the report, as
# the owner decided on 2026-08-21: losing it silently is the failure the report
# exists to prevent. A bare-metal crate writes `default-features = false` and
# so does not carry it, which is the RAM it was offered to save: the counters
# are per ENGINE, and an image holding five machines carries five copies
# whether or not anything reads them. A bare-metal crate that reads them asks
# for `macrostep-diagnostics`; an application crate that writes
# `default-features = false` to leave out `http-send` names it beside `std`.
#
# It only adds (docs/adr/0053, amendment of 2026-10-21). It replaced the
# opt-out `no_macrostep_diagnostics`, which removed the accessors, so a build
# that unified a crate naming it with a crate that read them stopped compiling
# in the reader. Now the union of such a build has the accessors, and a
# bare-metal crate built alone for its target does not. The opt-out is gone
# with no alias, so Cargo refuses a manifest that still names it and says
# which feature it does not have.
#
# Measured on `thumbv7em-none-eabihf` both ways — see
# `backends/rust/probes/nostd-footprint`, whose budget file carries both
# figures. A downstream bare-metal consumer asked for the way out after proving
# the residue is not logging (2026-08-21): with `lto = true` and no logger
# installed, link-time optimisation had already discarded every `log::` call,
# so `release_max_level_off` bought them exactly zero bytes.
macrostep-diagnostics = []

# A read-only observer of each transition the engine takes, told the transition
# by the pair the emitted transition table names its rows by: its source state
# and its position among that state's own transitions in document order
# (docs/adr/0089). A run's set of rows is then the table's coverage, measured
# rather than predicted.
#
# It only adds (docs/adr/0053). Without it the engine has no field and no call
# for an observer, so its code is what it was before the feature existed; with
# it and no observer set, each microstep checks one `Option`. The observer is any
# `FnMut + Send` closure in the `std` profile and a `fn` pointer in the
# bare-metal one, and `set_transition_observer` takes both forms where `std` is
# on, so a bare-metal crate that names it still compiles in a build that unifies
# `std` in.
transition-observer = []

# The trace port (docs/adr/0115, D4 and D8): `EngineState::set_trace_port`,
# which tells a test each step Appendix D takes (the start, each microstep,
# each event taken, the exit of the interpreter) with the transitions it took
# by their rows, the states it exited and entered in order and the
# configuration it left; and `trace_port::RunTrace`, which writes those steps
# in the run trace format `sce-codegen formal traces` judges against the
# document's model.
#
# Never on a release path: no default asks for it, and a test crate names it.
# It only adds (docs/adr/0053): without it the engine has no field, no call and
# no code for a port, and with it and no port set each step checks one
# `Option`. It writes the format's JSON, so it asks for `std`.
trace-port = ["std"]

# The take step of a test component (docs/SCE_TEST_PROFILE.md §4.4, P4 step 1):
# `Behaviour::take_transition`, `StatePolicy::TAKES_TRANSITIONS` and
# `StatePolicy::take_transition`, and the loop the shared microstep runs over
# the selected transitions before it exits anything. Appendix D has no such
# step, and without this feature the microstep is exactly its exit, content and
# entry: a program of statecharts carries no indirect call per microstep for
# it, no loop and no frame (a downstream bare-metal consumer measured the step
# in every build at 152 bytes of `.text` and 16 bytes of the static stack
# bound on its Cortex-M4 images, 2026-11).
# A run-time flag could not take those away, which is why the step is a feature.
#
# It only adds (docs/adr/0053): a policy that names neither item compiles with
# it on, so a build that unifies it in for a crate holding a test component
# leaves a statechart crate beside it compiling, and such a statechart's policy
# answers `TAKES_TRANSITIONS` false, so the engine does not ask it. A generated
# test component's policy names both items, so its crate names this feature;
# the component is driven by the `test` module, which needs `std`.
test-component = ["std"]

# The record codec (`record_cbor`): a record a COSE operation signs or seals by
# name crosses as its deterministic CBOR, and one it verified or opened is read
# back from it, both under the description of the record's type the build
# writes (docs/adr/0109, D9; docs/adr/0101, section 2). It writes and reads
# CBOR with the forge runtime's items (`sce_forge_runtime::cbor`), the one
# writer and reader of each item, so asking for it asks for that crate, which
# declares a newer Rust than this one: the feature is not a default, and a
# crate that generates a machine whose invoke names `sce:payload` names it.
record-cbor = ["std", "dep:sce-forge-runtime"]

[dependencies]
# The facade of the `log` feature above; optional, so a build without the
# feature does not compile it and its image carries none of its globals.
log = { workspace = true, optional = true }
# `thiserror` is consumed only inside `pub mod scripting` (gated to
# `cfg(feature = "std")`). `default-features = false` drops the
# crate's `std` feature so a `--no-default-features --target=thumbv7em-none-eabihf`
# build does not pull `thiserror`'s `extern crate std` into the dependency
# tree — bare-metal MCU targets have no `std` to resolve. Declared directly
# (not via `workspace.dependencies`) because the workspace dep declares
# the crate without an inline `default-features` toggle and a local
# `default-features = false` override on a workspace dep is silently
# ignored by Cargo (`workspace = true` requires the workspace declaration
# to opt out of defaults). The version string mirrors workspace policy.
thiserror = { version = "2.0", default-features = false }
# Fixed-capacity collections for the profile without `std`. Not optional:
# Cargo can turn a dependency on with a feature but not with the absence of
# one, and the bare-metal profile is that absence. `sce-portable-bytes` below
# depends on it unconditionally, so every build already compiles it; a `std`
# build names none of its items.
heapless = { workspace = true }
# Single definition of the portable owned `bytes` storage (`SceBytes<N>`),
# shared with the codec runtime so the construction logic never drifts.
# Re-exported as `sce_rust_runtime::SceBytes`. The `alloc` form (unbounded
# `Vec<u8>`) is selected through this crate's `std` feature; the
# `--no-default-features` MCU build leaves it off, which leaves the
# heap-free `heapless::Vec<u8, N>` form.
sce-portable-bytes = { path = "../portable-bytes", default-features = false }
# Portable 64-bit atomics for MCU targets without native u64 atomic
# instructions (Cortex-M4 `thumbv7em-none-eabihf`). On host targets this
# crate re-exports the native `core::sync::atomic` types (zero overhead);
# on MCU targets it falls back to lock-based emulation. Standard
# embedded-Rust pattern — used by `embassy`, `defmt`, etc.
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }
# The CBOR items the record codec writes and reads (`record-cbor` above);
# optional, so a build that does not ask for the codec does not compile it.
sce-forge-runtime = { path = "../forge-runtime", default-features = false, features = ["alloc"], optional = true }

# The id of a root session its host gives none for is drawn from the operating
# system's randomness, a UUID version 4 (`helpers::session_id`; docs/adr/0045,
# "Questions the owner answered" 2). A target with no such source (bare metal,
# `wasm32-unknown-unknown`) draws nothing, so it does not link the crate: its
# host gives the id.
[target.'cfg(not(any(target_os = "none", all(target_arch = "wasm32", target_os = "unknown"))))'.dependencies]
getrandom = "0.2"

[dev-dependencies]
# Env-based log output during tests
env_logger = "0.11"

[lints]
workspace = true
