[package]
name = "sce-rust-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SCXML Core Engine — Rust runtime (policy trait, Engine<P>, helpers, IScriptEngine)"

[features]
# Engine DI Parity RFC (Path B+): the pre-cleanup `script-engine-lua` /
# `script-engine-quickjs` Cargo feature pair selected a process-global
# `ScriptEngineProvider` singleton at compile time. With per-instance
# engine injection that mechanism is gone — consumers pick an engine
# crate (`sce-rust-lua`, future `sce-rust-quickjs`) by depending on it
# and constructing an instance.
default = ["http-send", "sce-portable-bytes/alloc"]

# HTTP send callback wiring (W3C SCXML C.2 BasicHTTPEventProcessor)
http-send = []

# Deterministic fake-clock scheduler for tests (swaps PullScheduler impl)
test-clock = []

# SCE Protocol-Synthesis RFC §5.J.2: bare-metal MCU profile of the runtime.
# Selecting `no_std` declares `#![no_std]` at the crate root and
# pulls in `heapless` for fixed-capacity collections (§5.J.2 line
# 1989: zero `alloc` dependency). Mutually exclusive with
# `script-engine-lua`, `script-engine-quickjs`, and `http-send` —
# Lua/QuickJS and tokio/reqwest are all std-coupled, so the
# combinations would never link. The exclusivity is enforced at
# compile time via `compile_error!` in `lib.rs` so a misconfigured
# Cargo.toml fails loudly before consumers debug linker output.
#
# C3 Atomic B-β lands the feature flag, cfg-gates http/scripting,
# and the codegen-side rejection diagnostics. Atomic B-γ ports
# `engine.rs` and `helpers/` to `core::` + `heapless`; until B-γ
# lands `cargo build --no-default-features --features=no_std` is
# expected to fail with std-import errors in those modules. The
# Cargo feature ladder is in place so downstream consumers can pin
# the wire shape today and migrate incrementally.
no_std = ["dep:heapless"]

# §scxml-3.13: the macrostep ceiling REPORTS itself, and this turns the report
# off — never the ceiling.
#
# The two are not the same thing and the distinction is the whole design. A
# macrostep that cannot end is a document the specification permits, so this
# engine's refusal to walk one forever is a departure it must not make
# silently: `truncated_macrosteps`, `last_truncated_macrostep_state` and the
# error log are how a host learns the configuration it is reading is not a
# stable one. The BOUND — the budget, and the flag that stops the same chain
# being handed a second one — is not behind this feature and cannot be turned
# off. A policy that could opt out of terminating is not a policy this engine
# offers.
#
# It is opt-OUT, which is deliberate and unusual. Additive opt-in is the Cargo
# convention, and the convention is wrong here: a consumer who does nothing
# must keep the report, because losing it silently is exactly the failure the
# report exists to prevent. Naming `no_macrostep_diagnostics` is a consumer
# stating that nothing in their image reads those counters.
#
# Measured on `thumbv7em-none-eabihf` before it was offered — see
# `backends/rust/probes/nostd-footprint`, whose budget file carries both
# figures. A downstream bare-metal consumer asked for this after proving the
# residue is not logging (2026-08-21): with `lto = true` and no logger
# installed, link-time optimisation had already discarded every `log::` call,
# so `release_max_level_off` bought them exactly zero bytes.
no_macrostep_diagnostics = []

[dependencies]
log = { workspace = true }
# `thiserror` is consumed only inside `pub mod scripting` (gated to
# `cfg(not(feature = "no_std"))`). `default-features = false` drops the
# crate's `std` feature so a `--features=no_std --target=thumbv7em-none-eabihf`
# build does not pull `thiserror`'s `extern crate std` into the dependency
# tree — bare-metal MCU targets have no `std` to resolve. Declared directly
# (not via `workspace.dependencies`) because the workspace dep declares
# the crate without an inline `default-features` toggle and a local
# `default-features = false` override on a workspace dep is silently
# ignored by Cargo (`workspace = true` requires the workspace declaration
# to opt out of defaults). The version string mirrors workspace policy.
thiserror = { version = "2.0", default-features = false }
# Fixed-capacity collections for the `no_std` feature variant.
# Optional + gated by `no_std` so std builds never link it.
heapless = { workspace = true, optional = true }
# Single definition of the portable owned `bytes` storage (`SceBytes<N>`),
# shared with the codec runtime so the construction logic never drifts.
# Re-exported as `sce_rust_runtime::SceBytes`. The `alloc` form (unbounded
# `Vec<u8>`) is selected through this crate's `default` features; the
# `--no-default-features --features=no_std` MCU build drops it, leaving the
# heap-free `heapless::Vec<u8, N>` form.
sce-portable-bytes = { path = "../portable-bytes", default-features = false }
# Portable 64-bit atomics for MCU targets without native u64 atomic
# instructions (Cortex-M4 `thumbv7em-none-eabihf`). On host targets this
# crate re-exports the native `core::sync::atomic` types (zero overhead);
# on MCU targets it falls back to lock-based emulation. Standard
# embedded-Rust pattern — used by `embassy`, `defmt`, etc.
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }

[dev-dependencies]
# Env-based log output during tests
env_logger = "0.11"

[lints]
workspace = true
