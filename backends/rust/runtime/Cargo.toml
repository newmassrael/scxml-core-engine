[package]
name = "sce-rust-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SCXML Core Engine — Rust runtime (policy trait, Engine<P>, helpers, IScriptEngine)"

[features]
# Engine DI Parity RFC (Path B+): the pre-cleanup `script-engine-lua` /
# `script-engine-quickjs` Cargo feature pair selected a process-global
# `ScriptEngineProvider` singleton at compile time. With per-instance
# engine injection that mechanism is gone — consumers pick an engine
# crate (`sce-rust-lua`, future `sce-rust-quickjs`) by depending on it
# and constructing an instance.
#
# A feature here ADDS (docs/adr/0053). Cargo builds one copy of this crate for
# every package of one build that depends on it, with the union of the
# features they ask for, so a feature that took something away, or refused
# another one, broke the build of a workspace that holds a bare-metal crate
# beside an application crate: each built alone, and `cargo check --workspace`
# stopped at this crate. No feature here removes a name or refuses another
# feature, and `default` is what a consumer who writes nothing gets.
default = ["std", "http-send", "macrostep-diagnostics"]

# The application profile: the crate links `std`, holds its owned strings and
# lists in `String` and `Vec`, and carries what needs an allocator or an
# operating system (the script engine seam, invoke, host processors, the
# BasicHTTP processor, saved state, the session id drawn from the system's
# randomness). Without it the crate is `#![no_std]` with no allocator, the
# bare-metal MCU profile (SCE Protocol-Synthesis RFC §5.J.2): the same names
# resolve to `heapless` storage of fixed capacity, and what needs `std` is
# absent. Asking for `std` never removes a name the bare-metal profile has, so
# code written against that profile compiles in a build where another crate
# turned `std` on (`backends/rust/probes/feature-unification` holds both).
#
# A bare-metal crate asks for nothing: `default-features = false`. Its image is
# built for its own target by a command that selects it alone, and Cargo
# unifies features only across the packages one command builds.
std = ["sce-portable-bytes/alloc"]

# The BasicHTTP event processor (W3C SCXML C.2): `http::HttpSendRequest` and
# `Engine::set_http_send_callback`. It lives in the `std` profile, so asking
# for it asks for `std`; a crate that sends over HTTP names this feature rather
# than relying on `std` carrying the processor.
http-send = ["std"]

# Deterministic fake-clock scheduler for tests (swaps PullScheduler impl)
test-clock = []

# §scxml-3.13: the macrostep ceiling REPORTS itself, and this feature is the
# report — never the ceiling.
#
# The two are not the same thing and the distinction is the whole design. A
# macrostep that cannot end is a document the specification permits, so this
# engine's refusal to walk one forever is a departure it must not make
# silently: `truncated_macrosteps`, `last_truncated_macrostep_state`,
# `truncated_event_chains`, `last_truncated_event` and the error log are how a
# host learns the configuration it is reading is not a stable one. The BOUND —
# the budget, and the flag that stops the same chain being handed a second
# one — is not behind this feature and is in every build. A policy that could
# opt out of terminating is not a policy this engine offers.
#
# It is in `default`, so a consumer who writes nothing keeps the report, as
# the owner decided on 2026-08-21: losing it silently is the failure the report
# exists to prevent. A bare-metal crate writes `default-features = false` and
# so does not carry it, which is the RAM it was offered to save: the counters
# are per ENGINE, and an image holding five machines carries five copies
# whether or not anything reads them. A bare-metal crate that reads them asks
# for `macrostep-diagnostics`; an application crate that writes
# `default-features = false` to leave out `http-send` names it beside `std`.
#
# It only adds (docs/adr/0053, amendment of 2026-10-21). It replaced the
# opt-out `no_macrostep_diagnostics`, which removed the accessors, so a build
# that unified a crate naming it with a crate that read them stopped compiling
# in the reader. Now the union of such a build has the accessors, and a
# bare-metal crate built alone for its target does not. The opt-out is gone
# with no alias, so Cargo refuses a manifest that still names it and says
# which feature it does not have.
#
# Measured on `thumbv7em-none-eabihf` both ways — see
# `backends/rust/probes/nostd-footprint`, whose budget file carries both
# figures. A downstream bare-metal consumer asked for the way out after proving
# the residue is not logging (2026-08-21): with `lto = true` and no logger
# installed, link-time optimisation had already discarded every `log::` call,
# so `release_max_level_off` bought them exactly zero bytes.
macrostep-diagnostics = []

[dependencies]
log = { workspace = true }
# `thiserror` is consumed only inside `pub mod scripting` (gated to
# `cfg(feature = "std")`). `default-features = false` drops the
# crate's `std` feature so a `--no-default-features --target=thumbv7em-none-eabihf`
# build does not pull `thiserror`'s `extern crate std` into the dependency
# tree — bare-metal MCU targets have no `std` to resolve. Declared directly
# (not via `workspace.dependencies`) because the workspace dep declares
# the crate without an inline `default-features` toggle and a local
# `default-features = false` override on a workspace dep is silently
# ignored by Cargo (`workspace = true` requires the workspace declaration
# to opt out of defaults). The version string mirrors workspace policy.
thiserror = { version = "2.0", default-features = false }
# Fixed-capacity collections for the profile without `std`. Not optional:
# Cargo can turn a dependency on with a feature but not with the absence of
# one, and the bare-metal profile is that absence. `sce-portable-bytes` below
# depends on it unconditionally, so every build already compiles it; a `std`
# build names none of its items.
heapless = { workspace = true }
# Single definition of the portable owned `bytes` storage (`SceBytes<N>`),
# shared with the codec runtime so the construction logic never drifts.
# Re-exported as `sce_rust_runtime::SceBytes`. The `alloc` form (unbounded
# `Vec<u8>`) is selected through this crate's `std` feature; the
# `--no-default-features` MCU build leaves it off, which leaves the
# heap-free `heapless::Vec<u8, N>` form.
sce-portable-bytes = { path = "../portable-bytes", default-features = false }
# Portable 64-bit atomics for MCU targets without native u64 atomic
# instructions (Cortex-M4 `thumbv7em-none-eabihf`). On host targets this
# crate re-exports the native `core::sync::atomic` types (zero overhead);
# on MCU targets it falls back to lock-based emulation. Standard
# embedded-Rust pattern — used by `embassy`, `defmt`, etc.
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }

# The id of a root session its host gives none for is drawn from the operating
# system's randomness, a UUID version 4 (`helpers::session_id`; docs/adr/0045,
# "Questions the owner answered" 2). A target with no such source (bare metal,
# `wasm32-unknown-unknown`) draws nothing, so it does not link the crate: its
# host gives the id.
[target.'cfg(not(any(target_os = "none", all(target_arch = "wasm32", target_os = "unknown"))))'.dependencies]
getrandom = "0.2"

[dev-dependencies]
# Env-based log output during tests
env_logger = "0.11"

[lints]
workspace = true
