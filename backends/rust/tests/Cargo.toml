[package]
name = "sce-rust-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SCE W3C SCXML 1.0 conformance test harness (202 tests)"

[dependencies]
sce-rust-runtime = { path = "../runtime", default-features = false, features = ["http-send"] }
# Engine DI Parity RFC (Path B+): test wrappers construct `LuaEngine` and
# pass it to `Policy::new(engine)`, so the Lua crate is a hard dependency
# rather than an optional feature.
sce-rust-lua = { path = "../lua" }
linkme = { workspace = true }
log = { workspace = true }
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1"

[dev-dependencies]
env_logger = "0.11"

[lints]
workspace = true
