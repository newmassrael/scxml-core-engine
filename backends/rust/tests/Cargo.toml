[package]
name = "sce-rust-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SCE W3C SCXML 1.0 conformance test harness (202 tests)"

[dependencies]
sce-rust-runtime = { path = "../runtime", default-features = false, features = ["http-send"] }
# Engine DI Parity RFC (Path B+): test wrappers construct `LuaEngine` and
# pass it to `Policy::new(engine)`, so the Lua crate is a hard dependency
# rather than an optional feature.
sce-rust-lua = { path = "../lua" }
linkme = { workspace = true }
# No `log` entry, deliberately. Nothing hand-written here calls it — the
# line existed only because generated machines emitted a bare `log::error!`
# on every datamodel error path, and carrying it made this crate the one
# consumer of SCE codegen that could not see the undeclared dependency
# (PINION-PR86). Generated code now reaches the facade through
# `sce_rust_runtime`, so this crate compiles the same 200+ machines a
# consumer does, under the same manifest a consumer would write.
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1"

[dev-dependencies]
env_logger = "0.11"

[lints]
workspace = true
