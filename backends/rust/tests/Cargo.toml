[package]
name = "sce-rust-tests"
version.workspace = true
edition.workspace = true
rust-version = "1.87"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SCE W3C SCXML 1.0 conformance test harness (202 tests)"

[dependencies]
# `macrostep-diagnostics`: the bounded-chain tests read the macrostep report
# (`truncated_macrosteps` and its siblings), which is a feature of its own
# (docs/adr/0053) and not part of `http-send`'s `std`. `transition-observer`: the
# tests that hold the rows a run takes to the machine's emitted transition table
# (docs/adr/0089). `test-component`: the tree `rust-static-datamodel` holds the
# test components of the test profile, whose policies implement the take step
# (docs/SCE_TEST_PROFILE.md §4.4), which only that feature declares.
sce-rust-runtime = { path = "../runtime", default-features = false, features = ["http-send", "macrostep-diagnostics", "transition-observer", "test-component"] }
# A `datamodel="sce-static"` machine checks its integer operations with the
# forge runtime's helpers, and the algorithms it calls answer through the
# same crate's error type (SCE Accepted Subset §2.15, SCE_FORGE.md §3.4.1).
sce-forge-runtime = { path = "../forge-runtime" }
# An algorithm that returns a list answers in the owned list this leaf crate
# holds, which the static machines that assign one name by path.
sce-portable-bytes = { path = "../portable-bytes" }
linkme = { workspace = true }
# No `log` entry, deliberately. Nothing hand-written here calls it — the
# line existed only because generated machines emitted a bare `log::error!`
# on every datamodel error path, and carrying it made this crate the one
# consumer of SCE codegen that could not see the undeclared dependency
# (reported from the field by a downstream consumer). Generated code now
# reaches the facade through
# `sce_rust_runtime`, so this crate compiles the same 200+ machines a
# consumer does, under the same manifest a consumer would write.
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1"

# The generator, with its commands (`cli`): the build script is the generator
# of every action of the three trees this crate compiles (`rust-w3c`,
# `rust-integration`, `rust-static-datamodel`), which it writes into OUT_DIR
# (docs/adr/0097, section 4 and items 9 to 11 of its 2026-11-16 amendment).
[build-dependencies]
sce-build = { path = "../../../sce-build", features = ["cli"] }

[dev-dependencies]
env_logger = "0.11"
# Engine DI Parity RFC (Path B+): the test wrappers under `tests/` construct
# `LuaEngine` and pass it to `Policy::new(engine)`, so the Lua crate is a
# dependency of theirs rather than an optional feature; nothing the library
# or a bin compiles names it.
sce-rust-lua = { path = "../lua" }
# The Mesh host core, for the tests that run a generated machine's
# `<invoke type="sce:mesh-rpc">` through the router a host actually
# registers rather than a stand-in (SCE_MESH.md §mesh-9.5, §mesh-19).
sce-rust-mesh = { path = "../mesh" }
# The scenario replay of the Rust arm, shared with the wasm32 build of it.
sce-rust-scenarios = { path = "../scenarios" }

[lints]
workspace = true
