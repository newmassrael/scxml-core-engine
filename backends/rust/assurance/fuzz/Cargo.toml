[package]
name = "sce-rust-assurance-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "The coverage-guided fuzzer (libFuzzer) of what the trust, relay and group key code read; its targets are those of sce-rust-assurance"

[package.metadata]
cargo-fuzz = true

# Needs a nightly toolchain and `cargo install cargo-fuzz`; run with `scripts/fuzz/run.sh`. It is not
# a member of the workspace: a sanitizer build is not what `cargo test --workspace` should do.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
sce-rust-assurance = { path = ".." }

[profile.release]
debug = 1

# One binary per target of `sce_rust_assurance::targets::NAMES` (a `-` of the name is a `_` here); the
# seeded tests of the crate check that the two lists are the same.

[[bin]]
name = "entries"
path = "fuzz_targets/entries.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checkpoints"
path = "fuzz_targets/checkpoints.rs"
test = false
doc = false
bench = false

