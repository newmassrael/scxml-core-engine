[package]
name = "sce-rust-host-http"
version.workspace = true
edition.workspace = true
# The reference host it carries exchanges for (`sce-rust-host-features`) declares 1.87, and every
# other dependency below declares 1.71 or less.
rust-version = "1.87"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The network transport of the standard host features' HTTP operation (docs/SCE_HOST_FEATURES.md, section 5) for a server: hyper over rustls, behind a destination policy (docs/adr/0109, D4)"
publish = false

# A crate of its own, not a feature of the reference host: a host that brings its own transport, or
# runs on a scripted one, links no async runtime and no TLS, and the workspace's test run builds and
# runs this transport's tests without a feature that nothing enables.

[lib]
path = "src/lib.rs"

[dependencies]
# The `Transport` port, the request and response it carries, and the destination policy every
# exchange is judged by.
sce-rust-host-features = { path = "../host-features" }
# The stack the Mesh `https` binding's adapter is built on (sce-rust-mesh, feature `https`), so one
# build of each serves both: hyper 1's HTTP/1.1 client connection on a tokio runtime the transport
# owns, and rustls with `ring`'s cryptography and the operating system's certificate verifier.
tokio = { version = "1", default-features = false, features = ["net", "rt", "time", "io-util"] }
# `server` for `hyper::Error::is_parse_too_large` alone, which hyper compiles only beside its server
# though the kind it reads (a message head past `max_buf_size`) is the client connection's too: the
# head's bound is told from every other parse error by it. No server is built here.
hyper = { version = "1", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-platform-verifier = "0.6"

[lints]
workspace = true
