[package]
name = "sce-rust-host-features"
version.workspace = true
edition.workspace = true
# Above the workspace's floor for the cryptography of signing and sealing:
# `sce-rust-crypto`, and the key store contract its key ring keeps keys in
# (`sce-rust-session-store`), declare 1.87.
rust-version = "1.87"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reference host for the standard host features (docs/SCE_HOST_FEATURES.md): clock, key-value store, notifications, HTTP, generated text, COSE signing and sealing, random bytes, keyed digests and keys, as the operations a generated machine's host-run invokes ask for."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# `std`: the host-processor types this host answers are part of the runtime's
# `std` profile; the BasicHTTP processor (`http-send`) is not wanted.
sce-rust-runtime = { path = "../runtime", default-features = false, features = ["std"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Signing, sealing, keyed digests, random bytes and the key ring
# (docs/SCE_HOST_FEATURES.md, sections 10 to 13): the one implementation of
# them every Rust host of SCE calls (docs/adr/0109, D5 to D7).
sce-rust-crypto = { path = "../crypto" }
# The credential store the host keeps the tokens it issues in, and revokes
# tokens and pins from (docs/SCE_HOST_FEATURES.md, section 14; docs/adr/0109,
# D3): the contract and its memory implementation, without the SQLite store,
# which the program that hosts the machine chooses and links.
sce-rust-session-store = { path = "../session-store", default-features = false }
# The keys the embedding configures are held in memory that is wiped when they
# are replaced or dropped.
zeroize = "1"
# The port the host reports how long its operations take, their failure codes
# and its audit appends through (docs/adr/0109, D16): a crate of no dependency,
# so the host links no metrics library.
sce-rust-metrics = { path = "../metrics" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The SQLite store, which the audit log is held to across a reopened file
# (docs/adr/0109, D14).
sce-rust-session-store = { path = "../session-store" }
# The record codec, which `tests/payload_record_cross_language.rs` holds to the
# deterministic CBOR of the record the vector signs (docs/adr/0109, D9).
sce-rust-runtime = { path = "../runtime", default-features = false, features = ["std", "record-cbor"] }

[lints]
workspace = true
