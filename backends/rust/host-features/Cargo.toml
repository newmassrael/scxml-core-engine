[package]
name = "sce-rust-host-features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reference host for the standard host features (docs/SCE_HOST_FEATURES.md): clock, key-value store, notifications and HTTP, as the operations a generated machine's host-run invokes ask for."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
sce-rust-runtime = { path = "../runtime", default-features = false }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
