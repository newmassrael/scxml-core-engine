# The third artefact, for a subject matter that shares nothing with the first.
version: 1
document: controller.scxml

inputs:
  approaching:
    address: plant/in/train-approach
    equals: APPROACHING
  occupied:
    address: plant/in/train-approach
    equals: OCCUPIED
  clear:
    address: plant/in/train-approach
    equals: CLEAR
  obstacleNone:
    address: plant/in/obstacle
    equals: NONE
  barrierDown:
    address: plant/in/barrier-position
    equals: DOWN
  manualOverride:
    address: plant/in/local-override
    equals: "ON"

# Each output is an enumeration of the document's own, and `map: platform`
# lands every variant on the platform's symbol of the same name.
outputs:
  roadSignal:
    address: plant/out/road-signal
    field: value
    map: platform
  bell:
    address: plant/out/bell
    field: value
    map: platform
  barrier:
    address: plant/out/barrier
    field: value
    map: platform
  trainSignal:
    address: plant/out/train-signal
    field: value
    map: platform
