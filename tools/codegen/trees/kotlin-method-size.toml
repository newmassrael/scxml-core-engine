#
# The JVM method-size document's Kotlin machine (ADR 0097): a document whose
# transition content, written as one method, passes the 65,535 bytes of code
# one JVM method holds, generated into the module of its own that compiles it.

[tree]
name = "kotlin-method-size"
roots = ["backends/kotlin/method-size/src/main/kotlin/com/sce/methodsize"]

[[generation]]
arguments = [
    "generate", "backends/kotlin/method-size/fixtures/jvm_method_size_static.scxml",
    "-l", "kotlin", "-o", "{out}",
    "--input-root", "backends/kotlin/method-size/fixtures",
    "--kotlin-package-prefix", "com.sce.methodsize",
]
place = "backends/kotlin/method-size/src/main/kotlin/com/sce/methodsize/jvm_method_size_static"
keep = ["*Sm.kt"]
