#
# The Rust Mesh library's generated part (ADR 0097): every standard Mesh
# document (`sce:std/mesh`) generated for Rust into src/generated, the index
# that names them (src/generated.rs), and the loopback server's peer table the
# examples build against.

[tree]
name = "mesh-rust"
roots = ["backends/rust/mesh/src", "backends/rust/mesh/examples/generated"]

[[generation]]
each = { files = "stdlib/mesh/*.scxml", as = "document" }
arguments = ["generate", "stdlib/mesh/{document}.scxml", "--language", "rust", "--output-dir", "{out}"]
place = "backends/rust/mesh/src/generated"
keep = ["*.rs"]

[[generation]]
arguments = [
    "generate", "tests/mesh/wss_loopback/server.scxml",
    "--deploy", "tests/mesh/wss_loopback/deploy.yaml",
    "--language", "rust", "--transport-only",
    "--input-root", "tests/mesh/wss_loopback",
    "--output-dir", "{out}",
]
place = "backends/rust/mesh/examples/generated"
keep = ["*.rs"]

[[index]]
directories = "backends/rust/mesh/src/generated"
file = "{dir}.rs"
header = """// SPDX-License-Identifier: AGPL-3.0-only WITH LicenseRef-SCE-Linking-Exception OR LicenseRef-SCE-Commercial
// SPDX-FileCopyrightText: Copyright (c) 2026 newmassrael

//! The standard Mesh documents (`sce:std/mesh`), generated.
//!
//! GENERATED -- DO NOT EDIT (backends/rust/mesh/generate.sh).
//! Each module is one document; they name one another as siblings
//! (`super::envelope_id`), which is why they share this parent.

"""
entries = [{ files = "*.rs", line = "pub mod {module};\n" }]

[[format]]
tool = "rustfmt"
directories = ["backends/rust/mesh/src/generated", "backends/rust/mesh/examples/generated"]
