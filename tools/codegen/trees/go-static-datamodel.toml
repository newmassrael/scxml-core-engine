#
# The Go machines of datamodel="sce-static" (ADR 0097; SCE Accepted Subset
# §2.15), compiled by `go test ./...` in backends/go/tests, so their variables
# really are fields of the policy and every lowered expression really
# type-checks; static_scenarios_test.go replays the shared scenarios against
# them with no script engine. A Go package is a directory, so each machine,
# with the children it starts, and each unit it imports is a package of its
# own below the module path every import line names. The tests beside the
# packages are written by hand.
#
# Each generation is `generate --with-imports`: the document named, every
# document it imports, to any depth, the standard library's among them, and
# every child it starts, which joins the package of the machine that starts
# it. What a machine calls is the import closure the generator walks, not a
# list here.
#
# Regenerate with `scripts/materialize.sh go-static-datamodel`.

[tree]
name = "go-static-datamodel"
roots = ["backends/go/tests/integration/static_datamodel"]

# Every statechart declared under datamodel="sce-static" that the Go backend
# lowers, of the fixture directory and of the documents a test keeps beside
# itself under tests/integration, which only that test reads. A refusal by
# name (exit status 7) leaves the document out; any other fails the tree. The
# documents a hybrid `<invoke>` declares in `sce:candidates` are generated as
# children of the machine that starts them, into its package, and are no
# member of their own.
[[generation]]
each = { files = "sce-build/tests/fixtures/static_datamodel/*.scxml", containing = 'datamodel="sce-static"', except = [
    "static_hosted_first",
    "static_hosted_second",
    "static_hybrid_first",
    "static_hybrid_holder",
    "static_hybrid_second",
    "static_hybrid_watcher",
    "static_mesh_relay",
], as = "machine" }
arguments = [
    "generate", "sce-build/tests/fixtures/static_datamodel/{machine}.scxml", "--with-imports",
    "-l", "go", "-o", "{out}",
    "--go-module-prefix", "github.com/newmassrael/sce-go-tests/integration/static_datamodel",
]
place = "backends/go/tests/integration/static_datamodel"
keep = ["*/*.go"]
skip_unsupported = true

[[generation]]
each = { files = "tests/integration/*.scxml", containing = 'datamodel="sce-static"', as = "machine" }
arguments = [
    "generate", "tests/integration/{machine}.scxml", "--with-imports",
    "-l", "go", "-o", "{out}",
    "--go-module-prefix", "github.com/newmassrael/sce-go-tests/integration/static_datamodel",
]
place = "backends/go/tests/integration/static_datamodel"
keep = ["*/*.go"]
skip_unsupported = true

# The statechart of the standard library a scenario names by its library name
# (`"machine": "sce:std/shared/record_list"`), a package of its stem.
[[generation]]
arguments = [
    "generate", "sce:std/shared/record_list.scxml", "--with-imports",
    "-l", "go", "-o", "{out}",
    "--go-module-prefix", "github.com/newmassrael/sce-go-tests/integration/static_datamodel",
]
place = "backends/go/tests/integration/static_datamodel"
keep = ["*/*.go"]

# The test profile (docs/SCE_TEST_PROFILE.md): the templates
# a_test_template_matches_its_values_test.go matches against values (§11.4,
# §11.9), with the records, enums and unions they name; the components
# a_test_component_runs_through_its_doors_test.go runs (§12.3); and the suites
# a_test_suite_runs_through_its_runner_test.go,
# a_record_reads_back_the_form_it_writes_test.go and
# a_corpus_suite_replays_to_its_expected_logs_test.go run (§11.6 to §11.8,
# §12.2; docs/SCE_TTCN3_LANE.md §10, §12.1), with every test case,
# configuration, component and record each reaches. A package each.
[[generation]]
arguments = [
    "generate", "--with-imports",
    "sce-build/tests/fixtures/test_profile/elapsed_at_most.scxml",
    "sce-build/tests/fixtures/test_profile/every_matcher.scxml",
    "sce-build/tests/fixtures/test_profile/job_report.scxml",
    "sce-build/tests/fixtures/test_profile/job_report_of.scxml",
    "sce-build/tests/fixtures/test_profile/report_within.scxml",
    "sce-build/tests/fixtures/test_profile/shape_is_circle.scxml",
    "sce-build/tests/fixtures/test_profile/imports/card_within.scxml",
    "sce-build/tests/fixtures/test_profile/imports/order_line_bounded.scxml",
    "sce-build/tests/fixtures/test_profile/imports/order_line_exact.scxml",
    "sce-build/tests/fixtures/test_profile/imports/order_placed_match.scxml",
    "sce-build/tests/fixtures/test_profile/imports/quantity_at_most.scxml",
    "sce-build/tests/fixtures/test_profile/imports/quantity_two.scxml",
    "sce-build/tests/fixtures/test_profile/imports/voucher_is.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/answerer.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/asker.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/coordinator.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/idler.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/param_asker.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/ptc_keeper.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/runtime_suite.scxml",
    "sce-build/tests/fixtures/test_profile/trace_forms/replays_every_form.scxml",
    "sce-build/tests/fixtures/test_profile/boundary/boundary_suite.scxml",
    "sce-build/tests/fixtures/test_profile/job_suite.scxml",
    "sce-build/tests/fixtures/ttcn3_export/orders_suite.scxml",
    "sce-build/tests/fixtures/ttcn3_export/nested_suite.scxml",
    "-l", "go", "-o", "{out}",
    "--go-module-prefix", "github.com/newmassrael/sce-go-tests/integration/static_datamodel",
]
place = "backends/go/tests/integration/static_datamodel"
keep = ["*/*.go"]
