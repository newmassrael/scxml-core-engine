#
# The Rust machines of datamodel="sce-static" (ADR 0097; SCE Accepted Subset
# §2.15), compiled with `cargo test -p sce-rust-tests`, so their variables
# really are fields of the policy and every lowered expression really
# type-checks; tests/static_datamodel.rs and the scenario replay drive them
# with no script engine. One flat module directory: a machine names what it
# imports as `super::<name>`, so every unit is generated beside the others,
# and the module index names each file the actions placed.
#
# Each generation is `generate --with-imports`: the document named, every
# document it imports, to any depth, the standard library's among them, and
# every child it starts (`sce:candidates`, `<invoke src>`), each generated as
# `generate` generates it alone. The list of algorithms, records and enums a
# machine calls is the import closure the generator walks, not a list here.
#
# Not committed: a build output of sce-rust-tests and sce-rust-scenarios,
# whose build scripts write it into their OUT_DIR and declare the module
# `static_datamodel` over the index placed here (docs/adr/0097, landing 1).
# Its bytes are the generator's own, so no formatter runs over it.

[tree]
name = "rust-static-datamodel"
roots = ["backends/rust/tests/src/integration/static_datamodel"]
committed = false

# Every statechart of the fixture directory declared under
# datamodel="sce-static" that the Rust backend lowers. A construct Rust gains
# the lowering of joins the tree by itself; one it refuses by name (exit
# status 7) is left out, and any other refusal fails the tree. The documents
# a hybrid `<invoke>` declares in `sce:candidates` are left out as members:
# each is generated as the child of the machine that starts it, in that
# machine's generation.
[[generation]]
each = { files = "sce-build/tests/fixtures/static_datamodel/*.scxml", containing = 'datamodel="sce-static"', except = [
    "static_hosted_first",
    "static_hosted_second",
    "static_hybrid_first",
    "static_hybrid_holder",
    "static_hybrid_second",
    "static_hybrid_watcher",
    "static_mesh_relay",
], as = "machine" }
arguments = ["generate", "sce-build/tests/fixtures/static_datamodel/{machine}.scxml", "--with-imports", "-l", "rust", "-o", "{out}"]
place = "backends/rust/tests/src/integration/static_datamodel"
keep = ["*.rs"]
skip_unsupported = true

# The statechart of the standard library a scenario names by its library name
# (`"machine": "sce:std/shared/record_list"`), generated by that name as a
# module of its stem. `every_scenario_is_replayed_on_every_backend_that_lowers_its_machine`
# holds every such scenario machine to a generation here.
[[generation]]
arguments = ["generate", "sce:std/shared/record_list.scxml", "--with-imports", "-l", "rust", "-o", "{out}"]
place = "backends/rust/tests/src/integration/static_datamodel"
keep = ["*.rs"]

# The standard rules no machine above imports and every backend generates:
# the digest of a set of changes, which no shared list keeps since its layer
# below repairs it (docs/adr/0085), and the observed-set reader of the OR-set.
# Generated so that the Rust compiler holds them.
[[generation]]
arguments = [
    "generate", "--with-imports",
    "sce:std/merge/merkle_node.scxml",
    "sce:std/merge/merkle_insert.scxml",
    "sce:std/merge/merkle_change_hash.scxml",
    "sce:std/merge/orset_observed.scxml",
    "-l", "rust", "-o", "{out}",
]
place = "backends/rust/tests/src/integration/static_datamodel"
keep = ["*.rs"]

# The test profile (docs/SCE_TEST_PROFILE.md): the templates
# tests/a_test_template_matches_its_values.rs matches against values (§11.4,
# §11.9), with the records, enums and unions they name; the components
# tests/a_test_component_runs_through_its_doors.rs runs (§12.3); the suites
# tests/a_test_suite_runs_through_its_runner.rs,
# tests/a_record_reads_back_the_form_it_writes.rs and
# tests/the_corpus_replays_to_its_expected_logs.rs run (§11.6 to §11.8,
# §12.2; docs/SCE_TTCN3_LANE.md §10, §12.2, §12.4), with every test case,
# configuration, component, port type and record each reaches.
[[generation]]
arguments = [
    "generate", "--with-imports",
    "sce-build/tests/fixtures/test_profile/elapsed_at_most.scxml",
    "sce-build/tests/fixtures/test_profile/every_matcher.scxml",
    "sce-build/tests/fixtures/test_profile/job_report.scxml",
    "sce-build/tests/fixtures/test_profile/job_report_of.scxml",
    "sce-build/tests/fixtures/test_profile/report_within.scxml",
    "sce-build/tests/fixtures/test_profile/shape_is_circle.scxml",
    "sce-build/tests/fixtures/test_profile/imports/card_within.scxml",
    "sce-build/tests/fixtures/test_profile/imports/order_line_bounded.scxml",
    "sce-build/tests/fixtures/test_profile/imports/order_line_exact.scxml",
    "sce-build/tests/fixtures/test_profile/imports/order_placed_match.scxml",
    "sce-build/tests/fixtures/test_profile/imports/quantity_at_most.scxml",
    "sce-build/tests/fixtures/test_profile/imports/quantity_two.scxml",
    "sce-build/tests/fixtures/test_profile/imports/voucher_is.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/answerer.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/asker.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/coordinator.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/idler.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/param_asker.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/ptc_keeper.scxml",
    "sce-build/tests/fixtures/test_profile/runtime/runtime_suite.scxml",
    "sce-build/tests/fixtures/test_profile/trace_forms/replays_every_form.scxml",
    "sce-build/tests/fixtures/test_profile/boundary/boundary_suite.scxml",
    "sce-build/tests/fixtures/test_profile/job_suite.scxml",
    "sce-build/tests/fixtures/ttcn3_export/orders_suite.scxml",
    "sce-build/tests/fixtures/ttcn3_export/nested_suite.scxml",
    "-l", "rust", "-o", "{out}",
]
place = "backends/rust/tests/src/integration/static_datamodel"
keep = ["*.rs"]

# The module index: every file the actions placed, a public module each.
[[index]]
directories = "backends/rust/tests/src/integration/static_datamodel"
file = "mod.rs"
header = "// GENERATED -- DO NOT EDIT (sce-codegen materialize rust-static-datamodel)\n\n"
entries = [{ files = "*.rs", line = "pub mod {module};\n" }]
