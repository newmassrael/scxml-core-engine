#
# The W3C conformance suite in Rust (ADR 0097): every fixture of the W3C
# registry generated by one run of `generate-w3c`, written at the paths the
# suite has under the root, its machines with their children, sourcemaps and
# module indexes under src/generated, and a test file each under tests.
#
# Written into an output root of its own, the run also writes the files that
# make a suite a package on its own (a manifest, the harness); the
# repository's are written by hand, so the tree keeps the suite's files alone.

[tree]
name = "rust-w3c"
roots = ["backends/rust/tests/src/generated", "backends/rust/tests/tests"]

[[generation]]
arguments = ["generate-w3c", "-l", "rust", "--output-dir", "{out}"]
place = ""
keep = [
    "backends/rust/tests/src/generated/mod.rs",
    "backends/rust/tests/src/generated/*/*",
    "backends/rust/tests/tests/test_*.rs",
]

[[format]]
tool = "rustfmt"
directories = ["backends/rust/tests/src/generated", "backends/rust/tests/tests"]
