#
# The W3C conformance suite in Kotlin (ADR 0097): every fixture of the W3C
# registry generated by one run of `generate-w3c`, a package `test<id>` each
# under com/sce/generated and a test class each under com/sce/w3c.
#
# com/sce/generated also holds the packages of the static datamodel's
# algorithms, which another tree writes, so this tree owns the `test*`
# packages alone. The suite's own package files (a build script, the W3C
# base classes) are written by hand in this repository, so the tree keeps
# the generated files alone.

[tree]
name = "kotlin-w3c"
roots = [
    "backends/kotlin/tests/src/main/kotlin/com/sce/generated/test*",
    "backends/kotlin/tests/src/test/kotlin/com/sce/w3c",
]

[[generation]]
arguments = ["generate-w3c", "-l", "kotlin", "--output-dir", "{out}"]
place = ""
keep = [
    "backends/kotlin/tests/src/main/kotlin/com/sce/generated/test*/*",
    "backends/kotlin/tests/src/test/kotlin/com/sce/w3c/Test*.kt",
]
