#
# The W3C conformance suite in Kotlin (ADR 0097): every fixture of the W3C
# registry generated by one run of `generate-w3c`, a package `test<id>` each
# under com/sce/generated and a test class each under com/sce/w3c.
#
# The suite is a module of its own, :sce-kotlin-w3c (backends/kotlin/w3c),
# which nothing else writes into: the static datamodel's algorithms and the
# integration machines are :sce-kotlin-tests's, and the base classes the test
# classes extend are :sce-kotlin-test-harness's, written by hand. The module's
# build script is written by hand too, so the tree is the two generated
# directories, whole.

[tree]
name = "kotlin-w3c"
roots = [
    "backends/kotlin/w3c/src/main/kotlin/com/sce/generated",
    "backends/kotlin/w3c/src/test/kotlin/com/sce/w3c",
]

[[generation]]
arguments = ["generate-w3c", "-l", "kotlin", "--output-dir", "{out}"]
place = ""
keep = [
    "backends/kotlin/w3c/src/main/kotlin/com/sce/generated/test*/*",
    "backends/kotlin/w3c/src/test/kotlin/com/sce/w3c/Test*.kt",
]
