#
# The request machines of the specs crate (ADR 0097): each document of
# sce-specs/machines generated for Rust into the crate. The crate keeps the
# machine and not its sourcemap.

[tree]
name = "specs"
roots = ["sce-specs/src/*/generated"]

[[generation]]
each = { list = ["request_life", "import_life"], as = "machine" }
arguments = ["generate", "sce-specs/machines/{machine}/{machine}.scxml", "--language", "rust", "--output-dir", "{out}"]
place = "sce-specs/src/{machine}/generated"
keep = ["*.rs"]

[[format]]
tool = "rustfmt"
directories = ["sce-specs/src/*/generated"]
