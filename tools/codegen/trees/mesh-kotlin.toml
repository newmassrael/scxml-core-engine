#
# The Kotlin Mesh module's generated part (ADR 0097): every standard Mesh
# document (`sce:std/mesh`) generated for Kotlin, and the loopback client's
# peer table the cross-language loopback test builds its router from,
# generated over the fixture directory (SCE_MESH.md §mesh-19).

[tree]
name = "mesh-kotlin"
roots = [
    "backends/kotlin/mesh/src/commonMain/kotlin/generated",
    "backends/kotlin/mesh/src/jvmTest/kotlin/com/sce/generated",
]

[[generation]]
each = { files = "stdlib/mesh/*.scxml", as = "document" }
arguments = ["generate", "stdlib/mesh/{document}.scxml", "--language", "kotlin", "--output-dir", "{out}"]
place = "backends/kotlin/mesh/src/commonMain/kotlin/generated"
keep = ["*.kt"]

[[generation]]
arguments = [
    "generate", "tests/mesh/wss_loopback/client.scxml",
    "--deploy", "tests/mesh/wss_loopback/deploy.yaml",
    "--language", "kotlin", "--transport-only",
    "--input-root", "tests/mesh/wss_loopback",
    "--output-dir", "{out}",
]
place = "backends/kotlin/mesh/src/jvmTest/kotlin/com/sce/generated/client"
keep = ["*.kt"]
