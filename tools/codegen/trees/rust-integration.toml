#
# The Rust integration machines (ADR 0097): a directory each under
# backends/rust/tests/src/integration, holding a document's machine, the
# machines of the children it writes (`--children`) and the module index that
# names them. The static datamodel's directory is a tree of its own; the
# index of the integration directory itself (`src/integration/mod.rs`) is
# written by hand.
#
# Two stems are generated for a host that serves the `x-sce-host` processor
# or invoker; their test drives that host, so the declaration is the
# build's and stands here, beside the stems it applies to.
#
# Regenerate with `scripts/materialize.sh rust-integration`.

[tree]
name = "rust-integration"
roots = ["backends/rust/tests/src/integration/*"]
except = ["backends/rust/tests/src/integration/static_datamodel"]

# Every fixture of integration_resources: a directory holding the document of
# its name.
[[generation]]
each = { directories = "integration_resources/*", as = "stem", except = [
    "a_host_names_its_origin_in_its_own_terms",
    "an_event_no_processor_delivered_has_no_origin",
] }
arguments = ["generate", "integration_resources/{stem}/{stem}.scxml", "-l", "rust", "-o", "{out}", "--children"]
place = "backends/rust/tests/src/integration/{stem}"
keep = ["*.rs"]

[[generation]]
arguments = [
    "generate", "integration_resources/a_host_names_its_origin_in_its_own_terms/a_host_names_its_origin_in_its_own_terms.scxml",
    "-l", "rust", "-o", "{out}", "--children", "--host-invoker", "x-sce-host",
]
place = "backends/rust/tests/src/integration/a_host_names_its_origin_in_its_own_terms"
keep = ["*.rs"]

[[generation]]
arguments = [
    "generate", "integration_resources/an_event_no_processor_delivered_has_no_origin/an_event_no_processor_delivered_has_no_origin.scxml",
    "-l", "rust", "-o", "{out}", "--children", "--host-processor", "x-sce-host",
]
place = "backends/rust/tests/src/integration/an_event_no_processor_delivered_has_no_origin"
keep = ["*.rs"]

# The documents outside integration_resources. A stem there is a contract of
# seven channels (C++ Interpreter, C++ AOT, Rust, Go, Python, Kotlin, C11)
# that `integration_stem_registration` enforces, and each of these asks a
# question of fewer engines:
# - a_child_timer_is_a_deadline_of_its_parent asks a host's question, when
#   the machine next needs a tick, which C11 and the C++ Interpreter do not
#   expose;
# - external_chain_is_bounded holds each engine to ARCHITECTURE.md
#   "External-Event Budget", a driver at a time;
# - parallel_region_root_external_domain, the external transition of a
#   region root, has a driver on six of the seven channels.
[[generation]]
each = { list = [
    "a_child_timer_is_a_deadline_of_its_parent",
    "external_chain_is_bounded",
    "parallel_region_root_external_domain",
], as = "document" }
arguments = ["generate", "tests/integration/{document}.scxml", "-l", "rust", "-o", "{out}", "--children"]
place = "backends/rust/tests/src/integration/{document}"
keep = ["*.rs"]

# The AI supervision loop example, for a host serving `x-sce-host`. It is an
# example, not a fixture: examples/ai_loop/ai_loop_example.cpp drives it
# through the C++ AOT engine and tests/ai_loop.rs through this one, so a
# topology change one engine alone honours fails on the other.
[[generation]]
arguments = ["generate", "examples/ai_loop/ai_loop.scxml", "-l", "rust", "-o", "{out}", "--children", "--host-processor", "x-sce-host"]
place = "backends/rust/tests/src/integration/ai_loop"
keep = ["*.rs"]

# The `<sce:action>` native host dispatch: the machine declares a
# `<Machine>Actions` host interface and runs no script engine, and
# tests/native_action.rs drives a host implementation of it.
[[generation]]
arguments = ["generate", "sce-build/tests/fixtures/event_schema/statechart_native_action.scxml", "-l", "rust", "-o", "{out}"]
place = "backends/rust/tests/src/integration/native_action"
keep = ["*_sm.rs"]

# The EventSchema native lowering, three documents in one directory: a typed
# `_event.data` guard lowered to a comparison with no script engine, compiled
# with the crate so the per-event inject trait is type-checked, and driven by
# tests/event_schema_native.rs.
[[generation]]
each = { list = ["statechart_minimal", "statechart_bytes", "statechart_lifted"], as = "document" }
arguments = ["generate", "sce-build/tests/fixtures/event_schema/{document}.scxml", "-l", "rust", "-o", "{out}"]
place = "backends/rust/tests/src/integration/event_schema_native"
keep = ["*.rs"]

# The host-served Event I/O Processor and its invoker, nine documents in one
# directory, each declared with the host surfaces its test serves. The
# declaration is the point: without `--host-processor` the same `<send>`
# compiles to error.execution, with it to a dispatch into the registry the
# host fills, and tests/host_processor.rs runs one binary with a handler
# registered and without one.
[[generation]]
each = { list = [
    "statechart_host_processor",
    "statechart_delayed_host_send",
    "statechart_static_delayed_host_send",
], as = "document" }
arguments = ["generate", "sce-build/tests/fixtures/host_processor/{document}.scxml", "-l", "rust", "-o", "{out}", "--host-processor", "x-sce-host"]
place = "backends/rust/tests/src/integration/host_processor"
keep = ["*_sm.rs"]

[[generation]]
each = { list = [
    "statechart_host_invoker",
    "statechart_static_host_invoke",
    "statechart_host_invoker_optional",
], as = "document" }
arguments = ["generate", "sce-build/tests/fixtures/host_processor/{document}.scxml", "-l", "rust", "-o", "{out}", "--host-invoker", "x-sce-host"]
place = "backends/rust/tests/src/integration/host_processor"
keep = ["*_sm.rs"]

[[generation]]
arguments = ["generate", "tests/integration/inbox_probe.scxml", "-l", "rust", "-o", "{out}", "--host-invoker", "x-sce-host"]
place = "backends/rust/tests/src/integration/host_processor"
keep = ["*_sm.rs"]

[[generation]]
arguments = [
    "generate", "sce-build/tests/fixtures/host_processor/statechart_static_host_params.scxml",
    "-l", "rust", "-o", "{out}", "--host-processor", "x-sce-host", "--host-invoker", "x-sce-host",
]
place = "backends/rust/tests/src/integration/host_processor"
keep = ["*_sm.rs"]

[[generation]]
arguments = ["generate", "sce-build/tests/fixtures/host_processor/statechart_static_mesh_request.scxml", "-l", "rust", "-o", "{out}"]
place = "backends/rust/tests/src/integration/host_processor"
keep = ["*_sm.rs"]

# Each directory's module index: a machine is a private module re-exported
# whole, a transition function a public module of its own.
[[index]]
directories = "backends/rust/tests/src/integration/*"
except = ["backends/rust/tests/src/integration/static_datamodel"]
file = "mod.rs"
header = "// GENERATED -- DO NOT EDIT (sce-codegen materialize rust-integration)\n\n"
entries = [
    { files = "*_sm.rs", line = "mod {module};\npub use {module}::*;\n" },
    { files = "*_transition_function.rs", line = "pub mod {module};\n" },
]

[[format]]
tool = "rustfmt"
directories = ["backends/rust/tests/src/integration/*"]
